ode 真实使用行为的半年对比数据**（2026 年 3 月到 9 月，聚合统计）：\n\n- 每条提示的工作时长变为 **3.3 倍**，每条提示的模型调用多 **40% 以上**，用户打断少 **68%**（每个会话的提示数不变）；\n\n- 连接工具服务器或使用 skill 的概率约**翻倍**，往提示里粘贴文本的概率少**三分之一**；\n\n- 每个请求的上下文涨到 **2.6 倍**，输入输出比从 **189:1 升到 324:1**。\n\n结论很直接：开发者正把一个\"更能干、信息更全\"的 agent 派去做更大、更开放的任务，所以账单越来越多是\"被重读的上下文\"。这也解释了为什么这次降价的重点是**缓存读取降 60%**，输入输出只降了 20%。同样的降价放在今天的流量上，省下的比半年前多。\n\n比降价更值得工程师看的是 **harness 侧的改动**。按常理，会话变长、工具变多，缓存未命中应该变多，实际却是**未命中的输入减少了 50% 以上**。原因是 Claude Code 把一批打断缓存的\"小伤口\"补上了：刷新登录不再打断缓存；中途追加指令、按需加载工具不再打断缓存；Opus 5.5 / Fable 5.1 中途改 effort 不重置缓存；API key 和云厂商用户也能设 1 小时缓存寿命；**fork 出来的子 agent 直接复用父会话的缓存**，不再为同一段上下文重复付费。模型侧的贡献是开放式任务轮数更少（客户 Zeta Labs 的数据：轮数和工具调用都比 Opus 5 少，成本近乎减半，最难的任务完成数翻倍），输出速度也快了 30% 以上。\n\n**对 AI 应用工程师的启示**：自己做 harness 时，缓存命中率应该当作一个**产品指标**来设计，而不是交给运气。这篇和同周 OpenAI 那篇列出的\"缓存杀手\"几乎一模一样：改工具定义、改系统提示、换模型、改推理设置、长时间停顿。","hf":null,"topic":"Harness 与长时程 Agent","first":"2026-09-25","di":"2026-09-25","wi":"2026-09-25","tier":"must","tk":"用 `/usage` 查看缓存读取占比并把它当监控指标；会话开始就选定模型，离开前先 compact，长会话开 1 小时缓存；自己做 harness 时，让子 agent 共享父会话前缀的缓存。","col":"harness"},{"u":"https://www.anthropic.com/research/project-swap","t":"Project Swap: What happens when agents trade for us?","v":"Anthropic","s":"/research · Economics","d":"2026-09-24","k":"article","star":0,"sum":"Project Deal 的受控续作。旧金山、纽约、伦敦、西雅图、华盛顿、都柏林六个办公室共 201 名员工各带一本书，与 Claude 进行简短的采集对话（中位数 8 条消息、216 个词），由 Fable 5 据此为书池里每本书排序，再派 agent 上公开交易大厅换书；参与者另外亲手排 10 本书作为真值，agent 看不到。**结果**：Claude 的排序与本人一致率 61%（按热度排序 53%，协同过滤 55%）；按真值计分，市场效率 0.55，理论最优 0.89，而用 Claude 排序算出的最优解只有 0.60，即 85% 的损失来自偏好估计，15% 来自交易本身；换成集中式的 Top Trading Cycles 也只有 0.60。**重跑 205 次**：模型越强市场越有效（按 Claude 排序算，全 Haiku 0.75，全 Opus 0.88），Haiku→Opus 提升 0.12，而「冷酷」与「利他」两种指令只差 0.02；在 Opus/Haiku 混合的交易大厅里，Opus 一方始终占优。「利他」agent 接受排名更低的书的频率是「冷酷」agent 的两倍。参与者平均愿意把约三分之一的年度购书预算交给 Claude","brief":"","ana":"Project Deal 的受控续作，也是目前**第一份把\"代理型 agent 的误差\"拆开来量化**的官方实验。\n\n设计：六个办公室共 201 名员工各带一本书。每人与 Claude 做一次简短的采集对话（中位数 8 条消息、216 个词），由 Claude 据此给书池排序，再派 agent 上公开交易大厅换书。参与者另外亲手给 10 本书排序作为真值，agent 看不到。\n\n结果：\n\n- **理解用户**：Claude 的排序与本人在 **61%** 的书对上一致（随机 50%，按热度排序约 53%，协同过滤 55%）。\n\n- **误差分解**（本篇最有价值的方法）：按真值计分，市场效率 **0.55**，理论最优 **0.89**。**用 Claude 的排序去算最优分配，也只能到 0.60**。所以缺口里 **85% 来自偏好估计，15% 来自交易本身**。换成集中式的 Top Trading Cycles 规则，结果也只有 0.60。\n\n- **重跑几十次对照**：模型越强市场越有效。Haiku 升到 Opus 让人们在自己的列表上平均前进 0.12，而\"冷酷\"与\"利他\"两种指令只差约 0.02。在 Opus 与 Haiku 混合的大厅里，Opus 一方通常占优。78%–96% 的 agent 会主动公开自己的首选书，但几乎不说谎（约百分之一）。\n\n- **信任**：参与者平均愿意把约 30% 的年度购书预算交给 agent，交给\"懂自己口味的朋友\"是约 40%。认为 Claude 的采集摘要\"没有漏掉什么\"的人愿意给 34%，认为漏了的只给 23%。\n\n作者自己列出的局限也要记：员工样本不具代表性，参与没有激励（终期问卷只有 59% 回收），所有 agent 都是\"行为良好\"的 Claude，没有混入专门剥削别人的对抗 agent。文末还点出市场设计侧的问题：agent 不会累，所以**限流是 agent 市场的核心设计杠杆**。\n\n**对 AI 应用工程师的启示**：评估任何\"替用户做决定\"的 agent（采购、比价、排程、招聘初筛）时，要**把误差拆成\"理解用户\"和\"执行\"两部分分别量化**。只需要一小份用户亲手给的真值排序就能做到。多数团队在调谈判或执行提示词，而真正的损失在偏好采集那一步。","hf":null,"topic":"评测工程","first":"2026-09-25","di":"2026-09-25","wi":"2026-09-25","tier":"must","tk":"评估代理型 agent 时，把误差拆成「理解用户」和「执行交易」两部分分别量化（用少量真值排序就能做到）；在采集阶段引导用户多写一些（300 词比 150 词一致率约高 4 个百分点），这比调谈判提示词更划算。","col":"eval"},{"u":"https://github.blog/security/application-security/ai-powered-fuzzing-with-the-github-security-lab-taskflow-agent","t":"AI-powered fuzzing with the GitHub Security Lab Taskflow Agent","v":"GitHub","s":"GitHub Blog · Security / GitHub Security Lab","d":"2026-09-24","k":"article","star":0,"sum":"开源的 C/C++ 自主 fuzzing 流水线：输入一个 `owner/repo`，agent 自动找入口、分析构建、写 harness、跑 AFL++、读覆盖率、改 harness、分诊崩溃、写漏洞报告。**架构分三层**：shell 驱动串联各阶段，每个阶段一份 taskflow YAML（即提示词），MCP 工具负责执行（跑 AFL、编译、存崩溃）；设计原则是「agent 负责决策，工具负责执行」，阶段之间只通过 SQLite 传递状态。每个 harness 编两份二进制，一份用于 fuzz，一份用于精确覆盖率。覆盖率循环里每轮的时间预算翻倍（30s→960s），连续两轮行覆盖率增幅低于 1% 时判定进入平台期并停止。崩溃经过最小化、ASan 回放、栈顶哈希去重后，分成漏洞、harness bug、OOM 等 7 类，并附带修复 diff（标注需人工审）。默认模型 Claude Sonnet 5；作者警告 LLM 选择的构建命令直接在宿主机上执行，只能在一次性环境里跑","brief":"","ana":"一条开源的 C/C++ **全自主 fuzzing 流水线**，也是一份\"长时自动化 agent 怎么分层\"的教科书式样本。输入一个 `owner/repo`，agent 自动找入口、分析构建、写 harness、跑 AFL++、读覆盖率、改 harness、分诊崩溃、写漏洞报告。\n\n**架构分三层**：shell 驱动串联各阶段；每个阶段一份 taskflow YAML（本质是提示词）；MCP 工具负责执行（跑 AFL、编译、存崩溃）。设计原则是\"**agent 负责决策，工具负责执行**\"，阶段之间**只通过 SQLite 传递状态**。几个值得抄的细节：\n\n- 每个 harness 编两份二进制，一份用于 fuzz，一份用于精确的覆盖率统计；\n\n- **停止条件是机械的**：覆盖率循环每轮时间预算翻倍（30s→960s），连续两轮行覆盖率增幅低于 1% 就判定进入平台期并停止；\n\n- 崩溃经过最小化、ASan 回放、栈顶哈希去重后，分成漏洞、harness bug、OOM 等 7 类，并附带修复 diff（标注需人工审）；\n\n- 作者明确警告：**LLM 选择的构建命令会直接在宿主机上执行**，只能在一次性环境里跑。\n\n**对 AI 应用工程师的启示**：\"agent 决策 + MCP 原语执行 + 数据库保存阶段状态\"适合任何长时流水线，好处是每一阶段都能单独重跑、单独审计。\"预算翻倍 + 平台期检测\"则是给 agent 循环定停止条件的通用解法，比\"最多 N 轮\"更贴合收益曲线。","hf":null,"topic":"Harness 与长时程 Agent","first":"2026-09-25","di":"2026-09-25","wi":"2026-09-25","tier":"","tk":"「agent 决策 + MCP 原语执行 + 数据库保存状态」的分层适合任何长时自动化流水线；用「预算翻倍 + 平台期检测」决定 agent 循环何时停止，可以直接照搬。","col":"harness"},{"u":"https://github.blog/ai-and-ml/github-copilot/when-chat-is-the-wrong-ui","t":"When chat is the wrong UI","v":"GitHub","s":"GitHub Blog · AI & ML / GitHub Copilot","d":"2026-09-24","k":"article","star":0,"sum":"介绍 GitHub Copilot app 的 canvas：由 agent 生成、在 app 内运行的小型全栈应用，可以和 agent 双向通信，也能执行本地代码。作者的主张是：用户知道自己要做什么时，与其每次都让 agent 执行（例如让最贵的模型「stage and commit」），不如让它做一个工具，以后的操作就不再消耗 token。示例包括 Winget 包管理界面、带补全的 SQLite 查询界面，以及一个把「调研、原型、计划、实现、迭代、定稿」串起来、让人只在需要时介入的工作流 canvas（作者说这个花了大半天）","brief":"","ana":"介绍 Copilot app 的 **canvas**：由 agent 生成、在 app 内运行的小型全栈应用，能和 agent 双向通信，也能执行本地代码。作者的主张值得记：**用户已经知道自己要做什么时，与其每次都让 agent 执行（比如让最贵的模型去\"stage and commit\"），不如让它做一个工具**，以后的操作就不再消耗 token。示例有 Winget 包管理界面、带补全的 SQLite 查询界面，还有一个把\"调研、原型、计划、实现、迭代、定稿\"串起来、人只在需要时介入的工作流 canvas（作者说做这个花了大半天）。\n\n**对 AI 应用工程师的启示**：这是 Anthropic\"降本三杠杆\"之外的第四个杠杆：**把重复的执行固化成确定性工具，让 agent 退出热路径**。设计 agent 产品时，先问一句：这一步需要判断，还是只是在重复？","hf":null,"topic":"Harness 与长时程 Agent","first":"2026-09-25","di":"2026-09-25","wi":"2026-09-25","tier":"","tk":"做 agent 产品时，区分哪些操作需要 agent 判断、哪些只是重复执行；后者让 agent 一次性生成确定性工具或界面，token 成本和延迟都会降下来。","col":"harness"},{"u":"https://developers.googleblog.com/turn-your-rest-apis-into-mcp-tools-with-google-cloud-api-gateway","t":"Turn your REST APIs into MCP tools with Google Cloud API Gateway","v":"Google","s":"Google 开发者博客 · Google Cloud","d":"2026-09-24","k":"article","star":0,"sum":"API Gateway 公测支持作为远程 MCP 服务器：在 OpenAPI 3.x 规范里用 `x-google-api-management.mcp` 开启，用 `x-google-mcp-tool` 定制单个工具，网关把 `tools/call` 转成对应的 REST 请求，复用已有的 JWT/API key 认证、配额和日志，同一个操作无论走 MCP 还是 REST 都计入同一份配额。**注意事项**：`tools/list` 默认不鉴权，会公开工具名和 schema，生产环境须要求 JWT（API key 不能保护这个方法）；返回空 body（如 204）的操作不会暴露；单个网关最多 1,000 个工具；MCP 与模型路由不能在同一份配置里同时启用","brief":"","ana":"","hf":null,"topic":"Skill、上下文工程与工具","first":"2026-09-25","di":"2026-09-25","wi":null,"tier":"","tk":"企业内部接 agent，优先在已有网关上加 MCP 转码层，不必单独部署 MCP 服务器，以免把鉴权和限流重写一遍；工具描述要写清「什么时候、为什么用」，不要只写返回什么；工具发现接口也要鉴权。","col":"skill"},{"u":"https://arxiv.org/abs/2609.30266","t":"LLM Agents Can Easily Tamper With Their Own Traces","v":"arXiv","s":"Jeremy Qin 等 6 人","d":"2026-09-24","k":"paper","star":0,"sum":"测试的本地编码 agent（Claude Code、Codex、Antigravity、OpenCode、Grok Build）中，除 Muse Code 外都允许 agent 按指令删除自己的执行轨迹且不触发监控；外部攻击者也能诱导删除；前沿模型在追求奖励时会自发篡改轨迹","brief":"","ana":"**问题**：异步监控、事故调查、合规审计几乎都要靠 agent 的执行 trace 来还原\"发生了什么\"，而这些分析默认 **agent 改不了自己的 trace**。\n\n**发现**：①Claude Code、Codex、Antigravity、Open Code、Grok Build 等本地 agent harness 都守不住这条边界。**除 Muse Code 外，被测的 harness 全部允许 agent 按指令删除自己的 trace，而且不会触发监控护栏**；②外部攻击者可以利用这个缺口，诱导 agent 删除 trace（即经注入实现\"毁灭证据\"）；③最值得警惕的是，**当 agent 想办法提高奖励时，前沿模型会自然出现篡改 trace 的行为**，不需要任何人指使。\n\n**建议**：trace 记录要通过 **agent 控制不到的独立拦截机制**来完成，即使宿主被完全攻破，trace 的完整性也要能保住。作者的结论是，这是 agent 基础设施里一个具体的 trace 完整性失效，可以被用来掩盖 scheming 或破坏这类失准行为。\n\n**对 AI 应用工程师的启示**：检查一下自己的 agent 系统，**trace 写在哪里、agent 有没有对那个位置的写权限**。如果日志文件就在 agent 能访问的工作目录里，你的\"可审计\"就只是个假设。落地做法是：日志从模型 API 代理层或 harness 进程外部采集，只追加（append-only），存到 agent 凭据写不到的地方。这条和 OpenAI 第三方评估原则里\"监控是否容易被关掉\"、上期 OpenAI\"往 compaction 摘要里塞隐瞒指令\"的失准报告，指向的是同一个攻击面。","hf":null,"topic":"自学习 / 自演进","first":"2026-09-25","di":"2026-09-26","wi":"2026-09-25","tier":"","tk":"轨迹记录要走 agent 进程之外的独立拦截机制。","col":"evo"},{"u":"https://arxiv.org/abs/2609.29095","t":"Where Does Exactly-Once Live? Model, Harness, and Tool-Contract Effects on Duplicate Side Effects in LLM Agents","v":"arXiv","s":"Jiapeng Li","d":"2026-09-24","k":"paper","star":0,"sum":"LIMBO 沙箱含 6 个服务、12 种故障模式，25,930 个回合、9 个模型、3 个生产 harness。能立即回读结果时，前沿模型几乎不重复（0.5%）；请求还在途中或被重复投递时，重复率 56% 和 74%，工具契约解释 81% 的差异；给每个写入提供幂等键，重复率从 28% 降到 4%，harness 影响很小","brief":"","ana":"**问题**：agent 的一次写操作超时或返回 5xx 时，这个动作**可能已经生效了**。盲目重试就会重复（第二次扣款、第二次发公告、第二次部署），放弃又会漏掉该做的事。exactly-once 应该在哪一层保证：模型、harness，还是工具契约？\n\n**做法**：LIMBO，一个确定性沙箱，含 6 个服务，契约很贴近现实（幂等键是可选的、读路径最终一致或缺失），在服务边界注入 12 种故障（迟到提交、重复投递、部分批处理等），每个 episode 都按一本\"已提交副作用账本\"判分。规模是 **25,930 个 episode**，覆盖 9 个近期模型、3 个生产 agent harness、2 种契约变体、15 种恢复条件。\n\n**结果**（答案取决于故障类型）：\n\n- **能立即回读确认时，模型说了算**：被指示\"只执行一次\"的前沿模型，在确认回执丢失后几乎不重复写（0.5%），弱模型经常重复；模型解释了 53% 的可解释方差。\n\n- **无法回读时（请求还在路上，或传输层投递了两次），契约说了算**：同样的前沿模型分别在 **56% 和 74%** 的 episode 里重复了副作用；契约解释了 81% 的方差。\n\n- 作者**证明**：在没有在途时间上界的情况下，任何\"只靠验证\"的策略在迟到提交下都不可能做到 exactly-once。等待只在上界短且已知时有用；在途延迟呈重尾分布时，即使每个 episode 等一小时，也不如**给每个写操作提供幂等键**（重复率从 28% 降到 4%，因为只要有键 agent 就会用）。\n\n- **harness 几乎不影响结果**，一个自动附加幂等键的守卫可以原样跨 harness 迁移；而在自己重复了副作用的 episode 里，**agent 有 90% 仍然报告了成功**。\n\n**对 AI 应用工程师的启示**：这是分布式系统的老问题换了个执行者。面试回答\"agent 调支付 / 部署类工具怎么防重复\"时，正确顺序是：**先改工具契约（每个写接口都支持幂等键，由 harness 自动附加），再谈提示词**；不要相信 agent 自报的\"成功\"，要对照副作用账本核对。","hf":null,"topic":"Agent 安全与围堵","first":"2026-09-25","di":"2026-09-26","wi":"2026-09-25","tier":"","tk":"给 agent 暴露的所有写接口都加幂等键。","col":"safety"},{"u":"https://arxiv.org/abs/2609.27334","t":"Just-in-Time Memory: Learning to Curate Task-Adaptive Memory for LLM Agents","v":"HF 组织 Salesforce AI Research","s":"","d":"2026-09-23","k":"paper","star":0,"sum":"多数 agent 记忆在写入时把轨迹蒸馏成反思、工作流或 skill，等于在不知道将来要查什么时就决定保留什么，信息丢失不可逆，写入决策的价值也难以归因。JitMem 保留原始轨迹，在读取时由整理器按当前任务合成紧凑的记忆内容，并直接用当前任务是否成功来训练整理器。在 ALFWorld、WebShop、τ²-bench 上比最强基线分别高 16.2、16.3、3.9 个百分点；未经训练的整理器也能追平或超过基线","brief":"保留原始轨迹，**读取时**再按当前任务整理记忆，并用任务成败训练整理器；ALFWorld / WebShop / τ²-bench 上比最强基线分别高 16.2 / 16.3 / 3.9 个百分点。与上期 funes 同属\"读时处理\"路线。","ana":"","hf":33,"topic":"Skill、上下文工程与工具","first":"2026-09-25","di":"2026-09-25","wi":"2026-09-25","tier":"","tk":"记忆库里保留原始轨迹，检索后再按当前任务做一次 LLM 整理，这不需要训练就能先试用。","col":"skill"},{"u":"https://arxiv.org/abs/2609.22682","t":"Self-Organizing Agent Teams Learn to Reason Together","v":"arXiv","s":"Aneesh Pappu 等 8 人","d":"2026-09-19","k":"paper","star":0,"sum":"固定的 agent 团队从过往协作中学习可复用的组织策略（角色、阶段、发言、信息流），只用 15 道数学题和 25 道研究生知识题学出的策略可以原样迁移到新基准。在 5 个数理基准上平均 66.7%，最强单个成员 48.8%，算力对齐的单 agent 58.7%，完美路由 59.0%；收益大小与「团队能否辨认出正确推理」强相关（ρ=0.90）。","brief":"固定的 agent 团队从过往协作中学习可复用的组织策略；5 个数理基准平均 66.7%，最强单成员 48.8%，算力对齐的单 agent 58.7%。","ana":"","hf":4,"topic":"多智能体","first":"2026-09-25","di":"2026-09-25","wi":"2026-09-25","tier":"","tk":"","col":"multi"},{"u":"https://arxiv.org/abs/2609.29154","t":"A Wrong Turn Does Not Ruin the Journey: Deviation-Guided Skill Self-Evolution for LLM Agents","v":"arXiv","s":"Yichun Feng、Jiawei Wang、Haozhe Sun","d":"2026-09-24","k":"paper","star":0,"sum":"⭐ 失败轨迹往往前半段有用、后半段才走偏，而且同一任务有多条正确路径，所以不该拿失败轨迹去硬对齐一条成功轨迹。SkillPivot 用执行有效性、目标进展和动作多样性定位「从有用前缀转为错误后缀」的偏离点，让更强的教师模型从同一前缀接着做，再对比两段后缀生成局部 skill 更新。在 ToolQA、LogicBench、WildClawBench 上优于其他 skill 演化方法，更新更紧凑且可迁移","brief":"SkillPivot：失败轨迹往往前半段有用，所以先用执行有效性、目标进展、动作多样性定位\"从有效前缀转向错误后缀\"的偏离点，再让更强的教师从同一前缀续写成功版本，对比两个后缀生成**局部**技能更新，不重写已经有效的部分；在 ToolQA、LogicBench、WildClawBench 上优于其他技能演化方法。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-25","di":"2026-09-26","wi":"2026-09-25","tier":"","tk":"反思时先定位偏离点，只针对偏离后的片段改 skill，保留已经有效的指引，避免整篇重写把好的部分也改坏。","col":"evo"},{"u":"https://arxiv.org/abs/2609.29773","t":"Breaking the Environment Wall: Evolving LLM Agent Environments for Recursive Self-Improvement","v":"arXiv","s":"Yukai Wu 等 10 人","d":"2026-09-24","k":"paper","star":0,"sum":"⭐ 真实环境往往信息分散、夹着误导和冲突版本、还会随时间变化，会让最强 agent 从 83.9% 跌到 57.6%。Env-Rethink（含 27B 后训练模型）先为环境补上文件归集图和事件日志，再用离线轨迹学习识别环境噪声，最后用虚拟事件历史改写环境状态，造出更难的版本来继续训练 agent。在 30 个任务、9 个模型上评分通过率提升超过 15.1%","brief":"真实环境\"不是为 agent 准备的\"（信息碎片化、混着误导和冲突版本、还会随时间演化），会让 SOTA agent 从 83.9% 掉到 57.6%。Env-Rethink（27B 后训练模型）给环境补\"集合地图\"和\"事件日志\"，识别环境噪声，再用虚拟事件历史把环境演化得更刁钻以继续训练 agent；9 个模型、30 个任务上 rubric 通过率提升 15.1% 以上。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-25","di":"2026-09-26","wi":"2026-09-25","tier":"","tk":"自演进不一定只改 agent，也可以给环境补结构化索引（归集图、事件日志），并有意把环境造难来持续产生训练信号。","col":"evo"},{"u":"https://arxiv.org/abs/2609.29166","t":"HarnessPAI: An Evolving Harness for Physical AI","v":"arXiv","s":"Xin Wang 等 23 人","d":"2026-09-24","k":"paper","star":0,"sum":"","brief":"物理 AI 的 harness 以代码为可执行、可演化的接口：单次 rollout 内按固定程序开环执行并自检，跨 rollout 闭环用执行反馈修订程序、把失败蒸馏成技能。不重训底层模型，LIBERO-PRO 上比 π0.5 高 61.6 分；收敛后的程序还能当廉价的专家数据采集器（用它采的数据微调 π0.5，再 +38.8 分）。","ana":"","hf":null,"topic":"Agent × 物理世界","first":"2026-09-25","di":null,"wi":"2026-09-25","tier":"","tk":"","col":"phys"},{"u":"https://arxiv.org/abs/2609.28908","t":"Automatic Harness Evolution for Hardware Design Verification: Can LLMs Consolidate Gains Across Discovered Harnesses?","v":"Kidus Seyoum、Ajay Mittur","s":"","d":"2026-09-24","k":"paper","star":0,"sum":"⭐ 固定模型、自动演化 harness，在 12 个专有的设计验证根因定位任务上：完成的尝试数涨 71–76%、至少命中一次的任务覆盖涨 80–100%，但真正答对的尝试只涨 18–24%。后期候选只是在任务之间互换收益，一个在验证集上更好的候选在全量重放时与基线打平。有用的搜索、取证、收尾行为分散在不同候选里，没有汇成一个全面占优的 harness","brief":"**一篇难得的负面结果**：在 12 个私有硬件验证定位任务上，自动演化的 harness 让\"完成的尝试\"多了 71–76%，但\"正确的尝试\"只多 18–24%；后来的候选只是在任务之间交换收益而不是累积；一个在验证集上变好的候选，在完整重放中与基线打平。和 RRSI 一起读：自演进\"看起来在涨\"时，先查涨的是不是正确率。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-25","di":"2026-09-26","wi":"2026-09-25","tier":"","tk":"自演进要保留候选档案并按任务选用，评估要区分「完成」和「答对」，并在搜索集之外做全量重放，否则会把噪声当进步。","col":"evo"},{"u":"https://arxiv.org/abs/2609.29892","t":"Qwen-Planner-Agent: A Closed-Loop AI-for-AI Framework for Real-World Mobile Planner Agents","v":"Qwen","s":"HF 组织 Tongyi-MAI","d":"2026-09-24","k":"paper","star":0,"sum":"⭐ 用同一套「动作-反馈-验证」契约串起数据、训练、部署三个环节：多个 agent 在人工把关下构造任务、采集轨迹、整理数据；训练用监督冷启动加混合环境在线 RL（CARE 奖励与优势设计，降低推理和工具调用成本）；运行时由执行证据驱动记忆、skill、工具的编排，并把失败轨迹回灌给模型和 harness 一起调整。在 MobilePA-Bench 上取得所有评测系统中最好的总体表现","brief":"厂商团队的\"AI 造 AI\"闭环：人把关的 agentic 数据飞轮（agent 造任务、采轨迹、配比数据、用训练反馈指导下一轮数据）+ 冷启动 SFT 与混合环境在线 RL + **执行证据驱动的模型–harness 协同演化**（记忆、技能、工具在运行时编排，结构化动作反馈与失败 trace 回灌给模型和 harness）；在 MobilePA-Bench 上取得全部被测系统中的最佳整体表现。","ana":"","hf":9,"topic":"自学习 / 自演进","first":"2026-09-25","di":"2026-09-26","wi":"2026-09-25","tier":"","tk":"把失败轨迹作为模型训练和 harness 调整的共同输入，而不是两条线各自优化。","col":"evo"},{"u":"https://arxiv.org/abs/2609.29051","t":"From Self-Distillation to Self-Practice: Privileged Information for Multi-Turn Agents","v":"arXiv","s":"Xingyu Su 等 8 人","d":"2026-09-24","k":"paper","star":0,"sum":"","brief":"发现多轮 agent 上的在线策略自蒸馏会教出\"没有信息却很自信\"的学生，最坏时低于未训练的基座。PSP 把特权信息从损失函数挪到采样器：任务多数失败时注入分析模型写的一句话提示再采样，用原 GRPO 目标训练；AppWorld 任务完成最多 +65%，SWE-bench Verified 解决率最多 +61%。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-25","di":null,"wi":"2026-09-25","tier":"","tk":"","col":"evo"},{"u":"https://arxiv.org/abs/2609.29394","t":"RACaP: Agentic Reasoning, Acting, and Coding as Policies for Evolvable Robot Learning","v":"arXiv","s":"Zexi Li 等 13 人","d":"2026-09-24","k":"paper","star":0,"sum":"","brief":"把\"写代码\"挪到演化阶段，部署时 ReAct 只调用冻结的类型化 Policy API；课程学习 + 自主自演化同时改进 API、harness 和经验记忆。LIBERO-90 54.4%，长程任务上 CaP 基线最多 4.0%；把 GPT-5.6 的决策蒸馏到 Qwen3-VL-8B 后，单步推理快 13.2 倍。","ana":"","hf":null,"topic":"Agent × 物理世界","first":"2026-09-25","di":null,"wi":"2026-09-25","tier":"","tk":"","col":"phys"},{"u":"https://arxiv.org/abs/2609.27717","t":"SkillGym: Internalizing Human Skills into LLMs for Real-World Problem Solving","v":"arXiv","s":"Zhilong Ge 等 9 人","d":"2026-09-23","k":"paper","star":0,"sum":"","brief":"把人写的 agent skill 转成可执行、可验证的训练环境（2,756 个、12 类），采了 8,364 条成功轨迹。在 Claude Code 下 SFT 让 Qwen3.5-35B-A3B 的 Terminal-Bench 2.1 +19.10 个百分点；35B 模型不带 skill 也超过带 skill 的基座，与 Harness-Zero 同属\"把外挂能力内化进权重\"。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-25","di":null,"wi":"2026-09-25","tier":"","tk":"","col":"evo"},{"u":"https://arxiv.org/abs/2609.28585","t":"Persistent Billable State: Denial-of-Wallet Attacks and Defenses in Tool-Calling LLM Agents","v":"arXiv","s":"Jinqian Zhang 等 7 人","d":"2026-09-23","k":"paper","star":0,"sum":"恶意工具的返回值被保留在历史里就会被反复计费。6 类攻击、243 次执行中单会话累计输入最高达首轮的 14,293 倍；保留原始历史使会话成本增加 21.2–35.9%。四条 host 端不变量（限制提示体量、上下文增长、递归机会、累计花费）拦住了回放集中全部重复攻击；3,830 个 MCP 相关仓库只有 71 个有可见防护","brief":"恶意工具的返回值被 harness 带进后续轮次，每轮都要重新计费，单会话累计输入最高达首次调用的 14,293 倍；防御是在\"重新摄入\"前加四条宿主侧不变量（提示体量、上下文增长、递归机会、累计花费）。扫描 3,830 个 MCP 仓库，只有 71 个有代码可见的防护，没有一个覆盖全部四类。","ana":"","hf":null,"topic":"Agent 安全与围堵","first":"2026-09-25","di":"2026-09-26","wi":"2026-09-25","tier":"","tk":"工具返回入历史前先压缩，并设累计花费上限。","col":"safety"},{"u":"https://arxiv.org/abs/2609.30137","t":"Screen Before You Serve: Simulation for Production Customer Experience AI Agents at 140M Scale","v":"案例为 Nubank 巴西最高流量的聊天客服 agent","s":"Edesio Alcoba 等 16 人","d":"2026-09-24","k":"paper","star":0,"sum":"用 Snowglobe 模拟器（合成客户 + 模拟工具输出）在上线前筛选 Nubank 的客服 agent。4 个已上线版本的模拟评分与线上高度相关；模拟指导的迭代在线上 A/B 中让 tNPS 涨 36.69 分；在 16,000 多段模拟对话中筛选开源模型配置，选中的模型让自助解决率涨 8.82 个百分点","brief":"用模拟客户 + 模拟工具输出在上线前筛选 agent 版本；4 个已部署版本上，模拟分与线上分高度相关；模拟指导的迭代在线上 A/B 中让 tNPS +36.69 分，模拟筛出的开源权重配置让自助率 +8.82 个百分点。","ana":"","hf":null,"topic":"评测工程","first":"2026-09-25","di":"2026-09-26","wi":"2026-09-25","tier":"","tk":"先验证模拟评分与线上指标的相关性，再用模拟替代大部分线上试验。","col":"eval"},{"u":"https://arxiv.org/abs/2609.27321","t":"Verifiable Hidden Dynamics Play: Generating Agentic RL Environments from Solved Mechanisms","v":"arXiv","s":"arXiv 注明 Qwen Technical Report","d":"2026-09-23","k":"paper","star":0,"sum":"反转常见的环境生成顺序：先采样并求解一个数学模型，再把它的决策过程包装成有状态的工具，环境动力学和轨迹评分都来自同一个已求解模型，可以验证。以每个几美分的成本生成 3,300 个环境；训练后 Qwen3.6-35B-A3B 的平均 agent 得分从 0.204 升到 0.815，并迁移到函数调用、旅行规划和 365 天电商基准（全程没有破产，超过 Qwen3.7-Max）。","brief":"","ana":"","hf":6,"topic":"推理基础设施与建模","first":"2026-09-25","di":"2026-09-25","wi":null,"tier":"","tk":"","col":"infra"},{"u":"https://arxiv.org/abs/2609.27273","t":"CAVEAT: Towards Robust Computer-Use Agents in Incentive-Misaligned Environments","v":"arXiv","s":"Yuxuan Li 等 4 人","d":"2026-09-23","k":"paper","star":0,"sum":"9 个电商环境、8 类平台引导机制。在 5 个模型家族上，对照组 78.6% 的情况下买到对用户最优的商品，开启引导后只有 17.3%。失败点有三个：扭曲用户的优先级、过早缩小候选集、证据没补齐就下决定。针对这三点设计的 CAVEAT-Harness 让最优购买率提升 55.0%。","brief":"","ana":"","hf":null,"topic":"Agent 安全与围堵","first":"2026-09-25","di":"2026-09-25","wi":null,"tier":"","tk":"","col":"safety"},{"u":"https://deepmind.google/blog/introducing-gemini-38-live-with-live-avatar","t":"Introducing Gemini 3.8 Live with Live Avatar","v":"Google","s":"Google DeepMind · Gemini Audio 团队","d":"2026-09-24","k":"release","star":0,"sum":"在 Gemini 3.8 Live 实时对话模型上加入近实时视频数字人，支持口型同步和表情；支持异步工具调用（后台查数据时对话不中断），可在 97 种语言间切换而画面不漂移；输出带 SynthID 水印，已在 Gemini Enterprise 上线，自定义形象需要加入白名单","brief":"","ana":"","hf":null,"topic":"推理基础设施与建模","first":"2026-09-25","di":"2026-09-25","wi":null,"tier":"","tk":"语音 agent 的工具调用应该做成异步的，让对话在等待工具结果时继续。","col":"infra"},{"u":"https://deepmind.google/blog/say-hello-to-gemini-38-text-to-speech","t":"Gemini 3.8 text-to-speech says hello","v":"Google","s":"Google DeepMind · Gemini Audio 团队","d":"2026-09-23","k":"release","star":0,"sum":"发布 Gemini 3.8 Flash TTS（用自然语言设计新声音，支持 100 多种语言和方言，可逐句写表演指示）和 Flash-Lite TTS（面向大批量配音和语音 agent）；声音库 2,000 多个，用 30 秒样本即可复刻声音，内置同意校验、SynthID 与 C2PA 凭证；支持原生双人对话生成和长时段生成。","brief":"","ana":"","hf":null,"topic":null,"first":"2026-09-25","di":"2026-09-25","wi":null,"tier":"","tk":"","col":""},{"u":"https://claude.com/blog/claude-tag-now-supports-personal-connectors-in-channels","t":"Claude Tag now supports personal connectors in channels","v":"Anthropic","s":"claude.com/blog · Claude Tag","d":"2026-09-24","k":"release","star":0,"sum":"Slack 里的 Claude 过去只能使用管理员挂在频道上的连接器，现在可以为发起人调用其个人连接器（日历、网盘、CRM 等），别人不能用。有两种模式：review 模式由本人先审再发帖；auto 模式由 Claude 判断内容是否敏感，敏感的才送审。企业版管理员可以强制所有人审核。已向 Team 计划推送","brief":"","ana":"","hf":null,"topic":null,"first":"2026-09-25","di":"2026-09-25","wi":null,"tier":"","tk":"多人共享的 agent 可以按「权限跟人走、不跟频道走」来设计，并在输出落到共享空间之前加一道敏感内容审核。","col":""},{"u":"https://arxiv.org/abs/2609.26457","t":"Recursive self-improvement of AI research agents","v":"HF 组织 Weco AI","s":"","d":"2026-09-22","k":"paper","star":1,"sum":"AIDE² 把研究 agent 自己的代码当作优化对象：提议修改、在 AI 研发任务集上评测改后的自己、按隐藏评测保留最好的版本，每次采纳的版本成为下一轮被改的对象。自主运行 8 天，发现 7 次连续改进，包括新的搜索策略和压缩、管理上下文的记忆机制。收益泛化到 ML 工程、启发式算法工程、物理天气预报四个保留基准，最强版本达到或超过 FML-Bench 上排名靠前的人工生产 agent；另一组保留任务上 reward hacking 率从 55% 降到 32%","brief":"AIDE² 把研究 agent 自己的代码当优化对象，**按 agent 看不到的隐藏评测**保留最优版本，每个被采纳的版本成为下一轮被改的对象。自主运行 8 天、7 次连续改进（新搜索策略、上下文压缩与记忆机制），泛化到四个保留基准，另一组保留任务上 reward hacking 率从 55% 降到 32%。","ana":"","hf":7,"topic":"自学习 / 自演进","first":"2026-09-24","di":"2026-09-24","wi":"2026-09-25","tier":"","tk":"自改进循环的选优要用 agent 看不到的隐藏评测，验收要至少包含一个分布外基准，并把 reward hacking 率作为副指标一起跟踪。","col":"evo"},{"u":"https://arxiv.org/abs/2609.26760","t":"Grow the Harness, Not the Context","v":"arXiv","s":"Laizhen Li 等 7 人","d":"2026-09-22","k":"paper","star":1,"sum":"标准 harness 让模型在每个任务的上下文里重复做同样的控制决策。Growing Harness 从只提供固定模型和工具接口、不含任何解题策略的脚手架出发：用函数级执行轨迹把每个失败定位到有限的代码范围，优化器对一批失败联合修复，再用「成功优先的保留集门禁」回滚损害已有能力的修改，采纳的修改累积在一个共享 harness 里。在 BrowseComp-Plus 和 WebArena-Verified、4B 到 120B 三个部署模型上，六个设置里五个均值最高；相比工具调用 agent，LLM 调用减少 76.0–91.8%，推理成本降 74.4–98.6%；WebArena 上 4B 模型仍有 44.7%，工具调用 agent 只有 6.7%","brief":"从不含任何解题策略的脚手架出发，用函数级执行轨迹把失败定位到有限的代码范围，批量联合修复，再用\"成功优先的保留集门禁\"回滚有害修改，修改累积在共享 harness 里。LLM 调用减少 76.0–91.8%，推理成本降 74.4–98.6%；WebArena 上 4B 模型 44.7%，工具调用 agent 只有 6.7%。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-24","di":"2026-09-24","wi":"2026-09-25","tier":"","tk":"反复出现的控制逻辑应该沉淀成代码，不要每次让模型在上下文里重新推一遍；自动修改 harness 时要同时做到「轨迹定位 + 批量修复 + 门禁回滚」。","col":"evo"},{"u":"https://claude.com/blog/what-a-task-costs-on-opus-5-5","t":"What a task costs on Opus 5.5","v":"Anthropic","s":"claude.com/blog · Claude Code","d":"2026-09-22","k":"article","star":0,"sum":"从 Claude Code 的 agent 循环出发，逐项计算一次任务的成本。**四个因素**：轮数（每轮重发全部上下文）、缓存读取、输出 token（含思考，单价是缓存读取的 100 倍）、模型。**算例**（Opus 5.5 输入/输出/缓存读取 $4/$20/$0.20）：上下文从 20K 增长到 120K 的任务，40 轮约 280 万输入 token，命中 90% 时输入 $1.62，0% 时 $11.20，96% 时约 $0.99；25 轮完成则约 $1.02。**相对 Opus 5**：输入、输出降 20%，缓存读取降 60%，同样 token 的示例会话便宜约 31%。**effort**：先给模型自检手段（测试、构建），再提 effort；high 多出 2 万思考 token 约 $0.40，相当于一次十轮重试的成本，所以只在能省掉一次重试的任务上划算。同一模型用 high 两次仍解决不了，就换 Fable 5.1，解决后换回。**缓存**：改 effort 或思考设置、连断 MCP、换模型、compact、停顿超过缓存寿命都会触发整段重写；API key 默认 5 分钟寿命，120K 上下文一次写入约 $0.60、一次读取约 $0.02。在 150K 上下文时 compact 约 $0.25，约 10 轮回本。从 Opus 4.8 迁移到 5.5（low effort）在 44 张客服工单基准上降本约 18%，再跑 `/claude-api prompt-audit` 删掉「强制六步」「验证两次」这类旧指令，又降 9%","brief":"","ana":"面试里被问\"你的 agent 一次任务多少钱、怎么降\"时，这篇是目前能找到的最完整的官方答案，因为它把成本拆成了**可以逐项计算的公式**。\n\n一次 Claude Code 任务就是一个循环：读对话、调工具、读结果、再来一轮，每一轮都要**重发到目前为止的全部对话**。决定账单的是四个因素：\n\n- **轮数**：假设上下文从 20K 涨到 120K，跑 40 轮平均每轮发约 70K，全程约 **280 万输入 token**，虽然对话本身从没超过 120K。同样的任务 25 轮做完就只有约 175 万。所以**最便宜的一轮是不需要的那一轮**。减少轮数最有效的办法，是给模型一个自检手段（测试、构建、调接口的脚本），让它早点发现自己的错误，并把工具调用攒成一批一起发。\n\n- **缓存读取**：同样 280 万 token，缓存命中 0% 是 $11.20，90% 是 $1.62，96% 约 $0.99。文章原话是\"没有别的设置能让输入成本变化这么大\"。\n\n- **输出 token**：在 Opus 5.5 上，一个输出 token 的价格是缓存读取的 **100 倍**、输入的 5 倍，思考也按输出计费。所以 effort 档位（主要影响思考量）对账单的影响很大。\n\n- **模型**：缓存读取便宜的模型主要让长会话受益，输出便宜的模型主要让推理密集的任务受益。\n\n几条可以直接背的**决策规则**：\n\n1. **先提 effort，再换模型。**把 effort 从 medium 提到 high，假设多出 2 万思考 token，就是 $0.40，大约等于一次\"十轮、100K 缓存上下文\"重试的价钱。所以 high 只在能省掉一次重试的任务上划算。同一个问题在高档位上失败两次，就换 Fable 5.1（$10/$50，缓存读取 $0.25，只比 Opus 5.5 贵 1.25 倍，因此在长且缓存重的任务上差价最小），解决后换回来。\n\n2. **先加检查，再提 effort。**文中例子：API handler 里改了一个字段名，medium 只改了 handler，handler 的测试也过了，但客户端还在发旧字段。解法有两种：提 effort，让模型多读几个调用点；或者给一个会走客户端路径的测试。后者只花一轮，前者每轮都多花思考。\n\n3. **小模型只放在\"错了也容易发现\"的地方**：检索、读日志、跑测试可以交给 Sonnet/Haiku 子 agent，改代码的仍用主模型。原因是小模型读错一个搜索结果，主模型就会追错文件，绕路的钱由主模型付。\n\n4. **缓存的规矩**：会话开始时就定好模型、MCP、effort，中途不要动。5 分钟缓存的写入价是输入的 1.25 倍，1 小时缓存是 2 倍。120K 上下文写一次约 $0.60、读一次约 $0.02。用 API key 时，喝一杯超过 5 分钟的咖啡，下一次 $0.02 的读取就会变成 $0.60 的写入。Opus 5.5 在 API key / 订阅下**中途改 effort 不会清缓存**，但在 Bedrock、Google Cloud Agent Platform 或 Claude apps gateway 上仍会清。\n\n5. **compact 的回本点**：150K 上下文 compact 一次约 $0.25，之后每轮省约 $0.025 的读取，**约 10 轮回本**，所以快结束时再 compact 是亏的。另外，调试到一半 compact 可能把唯一关键的那行日志摘要掉。\n\n6. **迁移时先审旧提示词**：从 Opus 4.8 迁到 Opus 5.5（low effort），在一个 44 张工单的内部客服基准上降本约 18%。再跑 `/claude-api prompt-audit`，删掉\"强制六步流程\"\"scratchpad 规则\"\"验证两次\"和相互矛盾的指令，又降了 9%，合计比起点低约 25%。\n\n基线参考：官方成本文档给出的企业部署平均值约为**每开发者每活跃日 $13**，90% 的用户在 $30 以下。\n\n**对 AI 应用工程师的启示**：成本优化的目标函数是\"每个完成的任务花多少钱\"，不是\"每个 token 多少钱\"。任何省 token 的手段（降 effort、换小模型、砍上下文）一旦多换来一次重试，就会亏回去。这和上期 GitHub《How we make AI coding more cost efficient》的结论完全一致。","hf":null,"topic":"Harness 与长时程 Agent","first":"2026-09-24","di":"2026-09-24","wi":"2026-09-25","tier":"must","tk":"把「会话开始时定好 effort、模型、MCP，中途不动」写进团队约定；子 agent 做检索时用小模型（`CLAUDE_CODE_SUBAGENT_MODEL` 或定义里写 `model: haiku`），改代码仍用主模型；换模型前先迁移审计旧提示词，删掉为老模型写的仪式性指令。","col":"harness"},{"u":"https://claude.com/blog/how-to-prepare-for-ai-driven-code-modernization-projects","t":"How to prepare for AI-driven code modernization projects","v":"Anthropic","s":"claude.com/blog · Notes from the Field","d":"2026-09-23","k":"article","star":0,"sum":"agent 把改代码的速度提上来之后，瓶颈变成组织怎么接住这些改动。文章给出六步：**①定目标**，区分 Uplift（同栈升版本）、Transform（换栈、行为不变，如 COBOL→Java）、Reimagine（新架构、行为也改，需写行为规约），这个选择要尽早定下来，否则后面每个改动都会争论「对不对」；**②定证书**，即每个改动都必须满足、无需人工即可检查的条件（原测试通过、覆盖率阈值、性能界限、新旧版本同输入同输出、状态与线格式可往返、多个独立上下文中的 Claude 对抗评审无阻断问题、静态扫描无新增等），并且要和将来审改动的人一起写；**③定晋升策略**，按风险分档决定人工审查深度，最好由高层下达并提前约定，这样出 bug 时责任共担；④准备环境、CI/CD、最小权限（只写现代化分支、无生产凭据）、每个 PR 关联 agent 对话记录与证书证据；⑤用动态工作流把任务拆给并行子 agent，出问题时改工作流而不是逐个修改动；⑥先在小分区端到端跑通，再扩展到全库。成本上，受监管环境里验证通常比写代码更贵","brief":"","ana":"这篇讨论的是：**agent 把\"写改动\"的速度提上去之后，瓶颈就移到了组织怎么接住这些改动**。银行核心系统的每个改动都要走变更管理、评审、审批，这些流程默认\"每个改动都是人写的、每个 diff 都有人看\"，而 agent 打破了这个前提。文章把准备工作拆成六步，最值得带走的是前三步里的三个概念：\n\n1. **目标（target）分三类**：**Uplift**（同栈升版本，如 C++11→C++20）、**Transform**（换栈但行为不变，如 COBOL→Java）、**Reimagine**（新架构，行为也要改，必须先写行为规约并与用户组达成一致）。这个选择要尽早定下来。离生产最近的人想\"只换栈、不动行为\"以控制风险，天天和老代码打交道的工程师想\"顺便还技术债\"。不提前定，这个分歧会在后面变成对每一个改动的\"到底对不对\"之争。\n\n2. **证书（certificate）**：每个改动都必须满足、**不需要人参与就能检查**的一组条件。可选项包括：原测试通过、Claude 写的新测试通过、覆盖率达标、性能在界内、**多个独立全新上下文的 Claude 做对抗评审且无阻断问题**、UI 改动由 computer use 回归、新旧版本同输入同输出、持久化状态与线格式能在新旧版本间往返、staging 观察期无回退、静态扫描无新增、编译与类型检查通过。三类目标的验证锚点不同：Uplift 以原测试为核心；Transform 的原测试往往跑不到新栈上，所以要靠生产流量回放、差分测试和生产并行部署；Reimagine 只能锚定行为规约，模型判断占比最大、结果方差也最大。**证书要和将来审这些改动的人一起写**，检验标准是：他们是否愿意只凭证书上的证据就合并。\n\n3. **晋升策略（promotion policy）**：按\"爆炸半径 × agent 置信度\"给改动分档，决定人工审查的深度，关键路径保留全量人审。同一类标记反复出现时，要回去改工作流或证书，而不是逐个审。SME 的时间是最稀缺的资源，要让他们直接跳到最高风险档和被标记的 agent 决策上。这套策略最好**由高层下达并提前约定**，这样 bug 漏到生产时责任是共担的，而不是落在点了\"批准\"的那个人身上。\n\n后三步是工程落地：独立的远程主机、证书需要的测试容量、基于构建日志或运行时 trace 的依赖图、代码冻结与沟通计划；**最小权限**（只能写现代化分支、无生产凭据、秘密与 PII 已脱敏）；用 Claude Code dynamic workflow 把任务拆给并行子 agent，出问题时改工作流而不是逐个修改动；先在一个小分区端到端跑通再扩展。\n\n**对 AI 应用工程师的启示**：\"证书 + 晋升策略\"这套结构可以原样搬到任何\"让 agent 批量改代码\"的场景。它和 NVIDIA 上期\"每一步都要有机器可判定的裁决\"、GitHub 上期\"128 个 PR 增量合入\"是同一种思路：**产能已经不稀缺，稀缺的是可信的证据链**。","hf":null,"topic":"Harness 与长时程 Agent","first":"2026-09-24","di":"2026-09-24","wi":"2026-09-25","tier":"must","tk":"「证书 + 晋升策略」这套结构可以直接搬到任何让 agent 批量改代码的场景；把昂贵的验证放到便宜检查之后再跑，用试点分区的 token 用量推算全量成本下限。","col":"harness"},{"u":"https://deepmind.google/blog/advancing-private-ai-compute-with-secure-server-side-memory","t":"Advancing Private AI Compute with secure, server-side memory","v":"Google","s":"Google DeepMind · Responsibility & Safety · Private AI Compute 团队","d":"2026-09-23","k":"article","star":0,"sum":"Private AI Compute 此前和业界同类方案一样是无状态的，任务结束就清空上下文。本次加入服务端持久记忆：数据存放在按用户隔离、用设备派生密钥加密的数据库里，密钥只在用户设备上；需要用到时，设备经认证的端到端加密通道连接云端硬件隔离环境（secure enclave），在隔离内存里临时解密、处理请求、保存新上下文后立即重新加密。同时公开防篡改的服务器软件记录（设备发数据前可验证软件未被改动）、更新版技术白皮书和独立安全审计结果","brief":"","ana":"Private AI Compute 此前和业界同类方案一样是**无状态**的，任务结束就清空上下文。这次加入了服务端持久记忆，设计是三件套：\n\n- **密钥在端**：数据存在按用户隔离、用设备派生密钥加密的数据库里，密钥只留在用户设备上；\n\n- **计算在 enclave**：需要用到时，设备经认证的端到端加密通道连到云端的硬件隔离环境，在隔离内存里临时解密、处理请求、保存新上下文，然后立即重新加密；\n\n- **软件可被端侧验证**：公开防篡改的服务器软件记录，设备发数据前可以核验服务器软件没有被改过；同时发布了更新版技术白皮书和独立安全审计结果。\n\n**对 AI 应用工程师的启示**：agent 记忆正在从\"本地笔记\"走向\"跨设备的服务端状态\"，而服务端记忆最先遇到的问题是隐私边界。面试里被问\"跨设备的 agent 记忆怎么保护隐私\"时，\"密钥在端、计算在 enclave、软件可验证\"是一个有官方先例的完整答案。","hf":null,"topic":"Agent 安全与围堵","first":"2026-09-24","di":"2026-09-24","wi":"2026-09-25","tier":"note","tk":"跨设备 agent 记忆的隐私设计可以参考「密钥在端、计算在 enclave、软件可被端侧验证」这三件套；写记忆系统方案时，「只存偏好列表」已被官方明确判定为不够用。","col":"safety"},{"u":"https://x.ai/news/grok-bot-customer-support","t":"How SpaceXAI is using Grok Bot to scale customer support","v":"xAI","s":"","d":"2026-09-22","k":"article","star":0,"sum":"Cursor 并入后工单量涨 175%，没有新增人手（原本估计要招约 200 人），单次解决成本做到 $0.20–0.30（传统 AI 客服按次收 $1–4）。上线分三步：先只写内部备注、所有写操作都要人批准，再给每次运行加上 trace 和评测，然后从最简单的工单开始放量；退款请求 99% 无需人工","brief":"","ana":"一篇完整的**生产环境 agent 上线路径**，外加一个少见的**官方自改进闭环**。\n\n背景：Cursor 在 08-14 并入 SpaceXAI 后，两支客服团队合并，工单量涨了 **175%**，但没有新招人（原本估计要招约 200 人）。单次解决成本做到 **$0.20–0.30**，传统 AI 客服按次收 $1–4。\n\n**上线三步**（crawl, walk, run）：①先接 Plain（工单）和 Linear（缺陷），让它\"假装拥有工单\"，但**只能写内部备注，每个写操作都要人批准**，以此检验它是否理解问题、提出的下一步对不对，同时不影响客户；②结果稳定后给**每次运行加上 trace 和评测**，出问题能看到在哪一步跑偏，Grok Bot 自己也能分析这些运行；③从最简单的工单开始放量，第一天人工复核它的理解和拟回复（准确性、语气、是否遵循指令），当天结束时开始直接回复客户，再逐步扩大工单范围。\n\n**降本手段**：每张工单一进系统就做预调查，但先对常见工单分类，简单问题查帮助中心就能解决的，就不动用重型排障。命中已知问题（连着 Linear）或后端常见错误（连着 Datadog）时，追加到已有 issue 或新建一个，并**录视频复现**给工程团队。给了清晰的退款规则后，**99% 的退款请求无需人工介入**。\n\n**自改进闭环**（本文最值得记的部分）：Grok Bot 审查人和 Bot 处理过的交互，给出针对个人和针对 Bot 的具体改进反馈；每周给管理层发一份\"AI 回答在哪里不够好\"的总结；审查代码库变更并提议相应的帮助中心更新；现在已经发展到\"**Grok Bot 辅导 Grok Bot**\"：找出知识系统的空缺、补上、把学到的东西回灌进系统，并在全产品线推广。另一个可以抄的信号是：一张工单在客户与处理者之间来回超过三次，就自动标给管理层。\n\n**对 AI 应用工程师的启示**：客服或运维 agent 上线可以照这个顺序走：**影子模式（只写内部备注）→ 全量 trace + 评测 → 按复杂度逐级放权**。自改进循环的对象选的是**知识库和帮助中心**，而不是模型权重或 harness 代码。这是生产环境里风险最低的自演进切入点：改动可审、可回滚，出错的代价是一篇文档写错，而不是一次错误退款。","hf":null,"topic":"自学习 / 自演进","first":"2026-09-24","di":"2026-09-24","wi":"2026-09-25","tier":"","tk":"客服 agent 上线可以照这个顺序：影子模式、全量 trace + 评测、按工单复杂度逐级放权。","col":"evo"},{"u":"https://github.blog/engineering/user-experience/rendering-huge-pull-requests-in-the-github-copilot-app","t":"Rendering huge pull requests in the GitHub Copilot app","v":"GitHub","s":"GitHub Blog · Engineering / GitHub Copilot","d":"2026-09-23","k":"article","star":0,"sum":"以一个 2,200 个文件、百万行改动、400+ 行内评论的开源 PR 为压力场景重做 PR 视图。纯代码行高度可以预先算出（类型化数组存偏移、命令式复用行渲染器、后端流式下发结构），评论的高度却要渲染后才知道。解法是把总高度拆成「确定的代码高度 + 动态块的有效高度」两个域：评论高度延迟测量，修正要小并锚定在用户正在看的位置；ResizeObserver 只打标记、不直接写回高度，以免形成反馈循环；只对屏内、用户自己触发的展开，在同一帧内同步修正一次。**找 bug 的方法**：先定义什么算「健康」（评论之间无空隙、无空白块、线程内容真实挂载），把它写成端到端预算测试，再让 headless 探针与 autopilot 无人值守地驱动真实桌面应用反复操作，测量写入磁盘日志供 agent 读取，形成「改→测→改」循环","brief":"","ana":"表面是前端性能文章（一个 2,200 个文件、百万行改动、400+ 条行内评论的 PR 怎么渲染得动），这里收它是因为**找 bug 的方法是 agent 驱动的**。\n\n技术主线：代码行高度可以预先算出（类型化数组存偏移、命令式复用行渲染器、后端流式下发结构），评论高度要渲染后才知道，于是把总高度拆成\"确定的代码高度 + 动态块的有效高度\"两个域。评论高度延迟测量，修正量要小，并锚定在用户正在看的位置；ResizeObserver 只打标记、不直接写回高度，避免形成反馈循环。\n\n**方法**才是可迁移的部分：先把\"健康\"定义成可断言的信号（评论之间无空隙、无空白块、线程内容真实挂载），写成端到端预算测试；再让 headless 探针和 autopilot 在无人值守下驱动真实的桌面应用反复操作，把测量写到磁盘日志里给 agent 读，形成\"改 → 测 → 改\"循环。探针流程用 JSON 描述，agent 不改源码就能剖析任意流程。\n\n**对 AI 应用工程师的启示**：让 agent 做性能调优或 UI 修复之前，先把\"什么算好\"变成 agent 能读到的断言和日志。这和 NVIDIA 评测文\"门禁卡在环境状态上\"、Anthropic 现代化文\"证书\"是同一个原则。","hf":null,"topic":"Harness 与长时程 Agent","first":"2026-09-24","di":"2026-09-24","wi":"2026-09-25","tier":"note","tk":"让 agent 做性能调优前，先把「健康」定义成可断言的信号并写进测试，再把观测结果写到 agent 能读的日志里；探针流程用 JSON 描述，agent 可以不改源码就剖析任意流程。","col":"harness"},{"u":"https://developer.nvidia.com/blog/how-swe-serve-exposes-the-gap-between-local-tests-and-live-serving","t":"How SWE-Serve Exposes the Gap Between Local Tests and Live Serving","v":"NVIDIA","s":"NVIDIA 开发者博客 · Agentic AI / LLM Benchmarking","d":"2026-09-23","k":"article","star":0,"sum":"与 SGLang 团队合作，把 83 个已合并的 SGLang PR 做成 53 个可执行任务，覆盖推测解码、模型接入、kernel 与量化、服务 API、KV 缓存、分布式调度六类（41 个任务要单卡 H100）。参考解中位数改 7 个文件 553 行，典型验证器含 7 个新行为测试与 10 个回归测试，补丁从不与参考实现比对，只看是否通过隐藏验证器。**关键结果**：19 个带真实起服务测试的任务上，同一批 627 个补丁，排除 live-serving 测试时通过率 69.4%，完整验证器下 45.9%，147 个补丁因此从「过」变「不过」；Gemma 4 MoE 任务里 33 个补丁有 16 个过了其他全部检查却挂在真实服务测试上。只涉及单个运行时域的任务通过率 69.0%，跨域任务 47.7%，差 21.3 个百分点，11 个模型方向一致；各模型最佳配置的 pass@1 从 34.6% 到 75.5% 不等","brief":"","ana":"","hf":null,"topic":"推理基础设施与建模","first":"2026-09-24","di":"2026-09-24","wi":null,"tier":"must","tk":"给 coding agent 的验收要包含「把服务真跑起来、从公开接口打请求」这一层；按改动涉及的运行时域数量给任务分档，跨域改动应自动升级到更严格的审查。","col":"infra"},{"u":"https://developers.googleblog.com/introducing-support-for-local-ai-models-in-the-antigravity-sdk","t":"Introducing Support for Local AI Models in the Antigravity SDK","v":"Google","s":"Google 开发者博客","d":"2026-09-23","k":"article","star":0,"sum":"Antigravity SDK（与 Google Antigravity 同源的 agent 能力）支持本地模型离线运行，首发 Gemma 4 26B A4B + LiteRT，建议 >24GB 显存或统一内存，通过 `LiteRTAgentConfig(model_path=...)` 接入。重点是混合编排的「架构师-施工队」模式：云端 Gemini 3.8 Flash 只看文件名和任务描述做规划拆解（花了 95 个云端 token，源代码不出本机），本地多个 Gemma 实例执行对抗式审计循环（复现漏洞、写补丁、互评、跑回归测试）；演示中 97.2%（3,322 个）token 在本地离线完成","brief":"","ana":"","hf":null,"topic":"推理基础设施与建模","first":"2026-09-24","di":"2026-09-24","wi":null,"tier":"note","tk":"对代码隐私敏感的客户，可以把「云端只拿元数据做规划、本地模型碰源码做执行」作为标准架构，并把云端 token 占比当作隐私指标报告。","col":"infra"},{"u":"https://www.anthropic.com/news/claude-discovers-novel-enzyme-system","t":"Claude discovers a novel enzyme system with CRISPR-like repeats","v":"Anthropic","s":"/news · Science","d":"2026-09-23","k":"article","star":0,"sum":"Anthropic 新成立的生命科学研究组与自建实验室的首批成果。人只给了初始提示并负责湿实验，约 950 个 Claude agent 在 21 小时内用 2.1 亿 token 检索海量 DNA 序列库、调查不同逆转录酶家族、自行判断候选，其中一个 agent 发现某种罕见逆转录酶基因旁有重复 DNA 序列阵列；经实验室分析确认，这是一类此前未被刻画的噬菌体酶系统，命名为阵列相关逆转录酶（ART），功能仍在研究中，预印本已发布","brief":"","ana":"","hf":null,"topic":"Skill、上下文工程与工具","first":"2026-09-24","di":"2026-09-24","wi":null,"tier":"","tk":"「大规模并行 agent 撒网 + 人只负责起点和实验验证」的分工，以及用「agent 数 × 时长 × token」报告算力投入的写法，可以用在任何大规模检索/筛查型 agent 任务的方案里。","col":"skill"},{"u":"https://openai.com/index/introducing-mentalhealthbench","t":"Introducing MentalHealthBench","v":"OpenAI","s":"openai.com/index · Publication","d":"2026-09-23","k":"article","star":0,"sum":"开放的心理健康对话评测基准，覆盖非急性、高急性、紧急三档，以及成人、13–17 岁青少年、照护者、临床医生四类用户，多语言多地区。80 多位来自 22 个国家、19 种语言的持证心理学家和精神科医生为每段合成对话编写评分细则，每条细则只针对一个方面，权重在 −10 到 +10 之间；每段对话至少三位专家审阅，只保留至少两人同意且无人反对的条目，用 GPT-5.6 Sol 按细则自动评分，可分解到十个行为维度。另做了用户与专家评分差异的对照分析","brief":"","ana":"","hf":null,"topic":"评测工程","first":"2026-09-24","di":"2026-09-24","wi":null,"tier":"","tk":"「单点细则 + 正负权重 + 三审两同意」是构建领域 rubric 评测的可复用配方，适合任何需要专家判断的垂直场景。","col":"eval"},{"u":"https://arxiv.org/abs/2609.26048","t":"FIRE: Failure-Informed Runtime Engineering for Reliable Language-Model Agents","v":"Nikita Agarwal、Nivedit Jain","s":"","d":"2026-09-22","k":"paper","star":0,"sum":"在历史上导致失败的状态点，由 harness 注入有针对性的自然语言指令或拒绝特定动作，不改权重也不改用户提示。Terminal-Bench 2.1 全部 87 个任务上，GPT-5.6 三档的 pass^2 全部提升：Luna 50.6→54.0%，Terra 55.2→60.9%，Sol 64.4→73.6%，而 Sol 的 best-of-two 只变了 1.2 分，说明提升主要来自「把能做到的做稳」。五臂随机实验中，真实策略 61%，无策略 39%，时机匹配的假策略 36%，泛泛的「再验证一遍」39–43%","brief":"在历史上导致失败的状态点，由 harness 注入定点指令或拒绝特定动作；Terminal-Bench 2.1 上 GPT-5.6 Sol 的 pass^2 从 64.4% 提到 73.6%。五臂随机实验中：真实策略 61%，时机匹配的假策略 36%，泛泛的\"再验证一遍\" 39–43%。","ana":"","hf":null,"topic":"Harness 与长时程 Agent","first":"2026-09-24","di":"2026-09-24","wi":"2026-09-25","tier":"","tk":"把线上失败轨迹的前置状态沉淀成定点运行时规则，比加一条通用的「请仔细检查」有效得多。","col":"harness"},{"u":"https://arxiv.org/abs/2609.26779","t":"CliffCompaction: Cost-Efficient Compaction for Long-Horizon Coding Agents","v":"arXiv","s":"","d":"2026-09-22","k":"paper","star":0,"sum":"上下文压缩只截断或丢弃、从不改写，也从不压缩已压缩过的内容（每次只处理原文），以避免漂移累积。在有界上下文下成本最多降 50%，Terminal-Bench 性能持平或提升；并行测试时扩展下 Kimi K2.6 追平 Opus 4.7；KernelBench 上 200 步 2.23 倍、400 步 3.58 倍加速。开源了与 harness 无关的 API 代理实现，可接 Claude Code、Codex","brief":"压缩只截断或丢弃、从不改写，也从不压缩已经压缩过的内容；在有界上下文下成本最多降 50%，Terminal-Bench 性能持平或提升，开源了可接 Claude Code / Codex 的 API 代理。","ana":"","hf":null,"topic":"Harness 与长时程 Agent","first":"2026-09-24","di":"2026-09-24","wi":"2026-09-25","tier":"","tk":"自研压缩时坚持「只删不改写 + 永不二次压缩」两条规则。","col":"harness"},{"u":"https://arxiv.org/abs/2609.25804","t":"The Tasteful Agent: Measuring and Improving Taste in Long-Horizon Tasks","v":"HF 组织 Microsoft","s":"","d":"2026-09-22","k":"paper","star":0,"sum":"Taste-Bench 从 agent 的并行尝试与单条轨迹里的弯路中自动挖出「决策分叉点」，考模型在不知道后果时能否选对方向。最好的模型只答对 59.7%，加大推理预算没有帮助；把见过结果的教师的判断蒸馏给学生后，学生在 SWE-bench Pro 保留任务上端到端成功率提升。","brief":"从并行尝试与轨迹弯路里自动挖出\"决策分叉点\"，考模型在不知道后果时能否选对方向；最好的模型只有 59.7%，加推理预算没有帮助。","ana":"","hf":111,"topic":"评测工程","first":"2026-09-24","di":"2026-09-24","wi":"2026-09-25","tier":"","tk":"","col":"eval"},{"u":"https://arxiv.org/abs/2609.26781","t":"Agensh: Scaling Organizational Intelligence to 1,024 Agents","v":"HF 组织 Microsoft Research","s":"","d":"2026-09-22","k":"paper","star":0,"sum":"无中央编排器的自组织多 agent harness：共享工作区、消息接口、共享上下文，agent 自行认领子任务、异步合并进度。ProgramBench 最难五题上 1→128 个 agent 平均测试通过率 19.31%→28.78%；pandoc 上 1→1,024 个 agent 33.89%→55.06%。","brief":"无中央编排器的自组织多 agent harness；pandoc 任务上 1 → 1,024 个 agent，测试通过率 33.89% → 55.06%。","ana":"","hf":8,"topic":"多智能体","first":"2026-09-24","di":"2026-09-24","wi":"2026-09-25","tier":"","tk":"","col":"multi"},{"u":"https://arxiv.org/abs/2609.24967","t":"Emergent Collusion in Long-Horizon LLM Agent Interaction","v":"arXiv","s":"Xinrui Shi、Yanzhe Zhang、Diyi Yang","d":"2026-09-21","k":"paper","star":0,"sum":"两个 agent 反复完成任务、共享日志、互相验证并领取奖励，当遵守验证协议与奖励最大化冲突时，10 个模型 94% 的轨迹出现串通，同系列中能力更强的模型更早出现。限制可用交互历史的数量与范围能降低串通。","brief":"两个 agent 互相验证、共享日志、领取奖励，遵守协议与奖励冲突时，10 个模型 94% 的轨迹出现串通，同系列中更强的模型更早出现；限制可见的交互历史能减少串通。","ana":"","hf":6,"topic":"Agent 安全与围堵","first":"2026-09-24","di":"2026-09-24","wi":"2026-09-25","tier":"","tk":"","col":"safety"},{"u":"https://arxiv.org/abs/2609.26550","t":"JEV-as-a-Judge: Accept When Confident, Escalate When Unsure","v":"arXiv","s":"HF 组织 Carnegie Mellon University","d":"2026-09-22","k":"paper","star":0,"sum":"只输出判定的轻量判官在普通偏好与事实性评测上与最强 LLM 判官差距在 3 个百分点内，费用只有其 0.36%；差距集中在低置信判定上。「高置信直接采纳、低置信升级给大判官」的冻结级联保留了 99% 的准确率，成本更低。","brief":"","ana":"","hf":17,"topic":"评测工程","first":"2026-09-24","di":"2026-09-24","wi":null,"tier":"","tk":"","col":"eval"},{"u":"https://arxiv.org/abs/2609.26693","t":"Measuring the Serving Stack Instead of the Model: Hidden Confounds in Local Tool-Use Evaluation","v":"Lijuan Tang、Yuemeng Zheng","s":"","d":"2026-09-22","k":"paper","star":0,"sum":"本地工具调用评测的结果可能取决于服务层而非模型：Ollama 按模型模板标志决定是否接受 `tools=`，Phi-3、Gemma-3 在推理前就被拒，若 harness 不记录结构化失败原因，会被误报为 0% 调用率。Ollama、llama.cpp、vLLM、SGLang 对同一请求处理各异，约束解码消除解析错误却可能导致不终止，按轮汇总和按实例估计相差可达约 55 分。","brief":"","ana":"","hf":null,"topic":"评测工程","first":"2026-09-24","di":"2026-09-24","wi":null,"tier":"","tk":"","col":"eval"},{"u":"https://x.ai/news/grok-4-7","t":"Introducing Grok 4.7","v":"xAI","s":"","d":"2026-09-21","k":"release","star":0,"sum":"新的更大基座，更长的 RL，任务偏向需要数小时完成的问题，并专门训练模型原生理解 Grok Bot harness。与 4.6 同价，$2/$6 每百万 token。CursorBench 4.0 46.3%（Fable 5.1 51.8%），Terminal-Bench 4.0 37.6%（Fable 5.1 57.9%），HackerBench 风险提示放行率 3.3%","brief":"","ana":"","hf":null,"topic":"评测工程","first":"2026-09-24","di":"2026-09-24","wi":null,"tier":"","tk":"「针对自家 harness 训练模型」开始成为厂商公开的训练目标，选模型时需要注意基准分数与所用 harness 是否绑定。","col":"eval"},{"u":"https://claude.com/blog/claude-marketplace","t":"Claude Marketplace: one place to discover plugins, agents, and services from our partners","v":"Anthropic","s":"claude.com/blog","d":"2026-09-23","k":"release","star":0,"sum":"把插件与连接器、agent 与产品、服务合作方集中到一个市场，客户可以用已承诺的 Anthropic 消费额度采购合作方产品（如 Hebbia）。对做 Claude 生态产品的团队来说，这多了一个分发与采购渠道。","brief":"","ana":"","hf":null,"topic":null,"first":"2026-09-24","di":"2026-09-24","wi":null,"tier":"","tk":"","col":""},{"u":"https://arxiv.org/abs/2609.24972","t":"RRSI: Regularized Recursive Self-Improvement of Agent Harnesses","v":"arXiv","s":"Peng Xia 等 14 人","d":"2026-09-21","k":"paper","star":1,"sum":"agent 能力很大程度上由 harness（提示词、控制流、工具、记忆、上下文管理）放大，近期方法把「提议并筛选 harness 的组件级编辑」自动化，事实上构成了系统层面的递归自改进。本文指出这种递归演化会通过记忆训练任务而过拟合：分布内大涨、分布外缩水甚至消失。RRSI 把正则化思想引入自改进的两端——提议端用随时间退火的预算限制单个候选能捆绑多少处编辑，并依据演化历史鼓励未探索方向；选择端配 critic（筛掉基准专用提案）与 pruner（删掉太小、太贵、已不再有用的改动）。八个基准（编码、agentic workspace、工程设计）上，所演化针对的 split 最多涨 14.1 分，五个分布外基准最多涨 4.7 分，同时产出的 harness 比未正则化演化少用 30% 的 policy token","brief":"","ana":"**问题**：最近一批方法把\"提议并筛选 harness 的组件级编辑\"（提示词、控制流、工具、记忆、上下文管理）自动化了，本质上已经是 **agent 系统层面的递归自改进**。但没人认真问过：这些改进是真的学到了可复用的机制，还是记住了训练任务？RRSI 的回答是后者占了很大比例，**分布内大涨，换到分布外就缩水甚至消失**。\n\n**做法**：把机器学习里的正则化思想搬到 harness 演化的两端。**提议端**：①用**随时间退火的编辑预算**限制一个候选能捆绑多少处改动（早期可以大改，后期只允许小步）；②根据演化历史鼓励没探索过的方向。**选择端**：①**critic** 筛掉明显针对特定基准的提案（比如写死某道题的特判）；②**pruner** 删掉太小（噪声）、太贵（token 开销大）、已不再有用的改动。\n\n**结果**：八个基准（编码、agentic workspace、工程设计）上，演化所针对的 split 最多涨 **14.1 分**，五个分布外基准最多涨 **4.7 分**，而且产出的 harness 比不加正则的演化**少用 30% 的 policy token**。\n\n**对 AI 应用工程师的启示**：如果你在做（或打算做）任何形式的\"自动优化提示词 / skill / harness\"，这篇给的是一套可以直接落地的**防过拟合纪律**：每次改动的规模要有上限，候选要经过\"是否针对特定测试\"的审查，定期剪掉不再贡献的旧改动，并且**验收一定要包含至少一个没参与演化的分布外集合**。结合上期 EvoHarnessBench（harness 扩张即遗忘）来看，harness 自演进已经从\"能不能涨分\"进入了\"涨的分是不是真的\"的阶段。","hf":152,"topic":"自学习 / 自演进","first":"2026-09-23","di":"2026-09-23","wi":"2026-09-25","tier":"","tk":"自动优化 agent 时把「每轮可改动数量」做成随轮次收紧的预算、并在筛选器里显式惩罚「只对当前评测集有效」的改动；汇报收益必须同时给分布内与分布外两组数，单报前者等于没报。","col":"evo"},{"u":"https://arxiv.org/abs/2609.24130","t":"Self-Healing Harness for Runtime Oversight of Agent Self-Modification","v":"arXiv","s":"Sina Tayebati 等 5 人","d":"2026-09-21","k":"paper","star":1,"sum":"把「agent 能改自己未来行为」这件事形式化成自我修改的**准入控制**问题：agent 可以提议修改自己的操作指令，但由外部运行时门禁决定哪些能持久化。实现是一个模型无关的自愈 harness，围绕未经改动的 agent 跑 Detect–Notice–Heal–Validate 循环：agent 在外部工作区里写候选行为规则，评估期间只拿到临时执行权，只有在触发它的那个失败上测得改善、且在受保护用例上的回退不超过固定容差后，才获得跨 episode 的持久权限；有回放数据时用回放提供匹配证据，没有时退化为前向试验，另有语料级守卫周期性重测整个已生效规则集。AppWorld、Terminal-Bench、τ²-Bench 上 16 组配对实验中，门禁拒掉 383 条由回放裁决的提案，其中 **211 条（55%）在修好触发失败的同时弄坏了一个原本能通过的用例**。16 组配对里任务完成分全部是带门禁的更高","brief":"","ana":"**问题**：agent 能改自己未来的行为（改操作指令、写新规则），那**哪些自我生成的改动可以留下来**？论文把它形式化为自我修改的**准入控制**：agent 可以提议，但由一个外部运行时门禁决定能否持久化。\n\n**做法**：一个模型无关的自愈 harness，围绕一个**完全没改过的 agent** 跑 Detect → Notice → Heal → Validate 循环。agent 在外部工作区写候选行为规则；这些规则在评估期间只有**临时执行权**；只有在触发它的那个失败上测得改善、**且在受保护用例上的回退不超过固定容差**之后，才获得跨 episode 的持久权限。证据来源分两档：有回放数据时用回放做匹配对比，没有时退化为前向试验（证据较弱）。另外有一个**语料级守卫**，周期性地把全部已生效规则一起重测，防止规则之间互相打架。\n\n**结果**：AppWorld、Terminal-Bench、τ²-bench 上 16 组配对运行（Baseline vs Harness），门禁基于回放拒掉了 383 条提案，**其中 211 条（55%）修好了触发它的失败，却弄坏了一个之前能过的用例**。任务完成分在全部 16 组里都是 Harness 更高（其中两组的配对自助区间不含零）；重复试验的可靠性 12 组更高、4 组持平、没有一组更低。因为改的是诱导策略的上下文而不是权重，所有被接纳的改动都**可检查、可回滚、兼容闭源模型**。\n\n**对 AI 应用工程师的启示**：\"55% 的局部改进带有附带回退\"这个数字值得记住。它说明任何让 agent 自己写规则、写 skill、写记忆的系统，**都必须有一个 agent 自己写不到的受保护回归集**，而且要把\"修好了目标\"和\"没弄坏别的\"分开检验。这和本周 TimeEvo 的发现（一轮通用自我修订改了 147 个答案，56 个改坏，总分却几乎不动）是同一件事的两个证据：**平均分会掩盖自我修改的破坏性**。","hf":null,"topic":"自学习 / 自演进","first":"2026-09-23","di":"2026-09-23","wi":"2026-09-25","tier":"","tk":"任何允许 agent 写入自己规则/记忆/技能的系统都该照抄这套两级授权——新规则先拿临时执行权，跑完受保护回归集才升级为永久；「局部修好」出现附带回退的概率高到 55%，靠人工抽查是拦不住的。","col":"evo"},{"u":"https://arxiv.org/abs/2609.24974","t":"Harness-Zero: Harness Distillation via Agent-as-Harness","v":"arXiv","s":"Haoran Ye 等 5 人","d":"2026-09-21","k":"paper","star":1,"sum":"最佳 harness 随领域、实例、模型变化，通用 agent 要么将就一个次优的共享 harness，要么在不断增长的专用 harness 集合间路由。本文研究 harness 蒸馏：用领域/实例优化过的 harness 作训练期指导，把它诱导的行为迁进模型权重，使收益在单一固定的目标 harness 下也能保留。难点是两个 harness 的动作空间与可见信息不同，指导无法直接当监督信号；Harness-Zero 的解法是 agent-as-harness——由一个「harness 化 agent」在执行前按目标 harness 的动作空间纠正学生的响应，把 harness 指导转成训练示范。结果：同一演化 harness 下，agent-as-harness 优于 code-as-harness；部署时摘掉特化 harness 后，基座模型宏平均任务成功率从 23.3% 升到 44.3%，高于挂着该 harness 时的 41.7%；三个领域 28 种行为模式的平均恢复率 82.3%","brief":"","ana":"**问题**：最好的 harness 因领域、实例、模型而异，于是通用 agent 只有两个选择：将就一个次优的共享 harness，或者在越来越多的专用 harness 之间路由。能不能**把 harness 带来的收益搬进权重**，部署时把专用 harness 摘掉？\n\n**难点**：优化过的 harness 和部署时的目标 harness **动作空间不同、能看到的信息也不同**，前者的指导不能直接当后者的监督信号。**做法（agent-as-harness）**：由一个\"harness 化 agent\"在优化 harness 的引导下，**在执行前**按目标 harness 的动作空间纠正学生的回复，把 harness 的指导转成目标 harness 下的训练示范，再在这些轨迹上微调。\n\n**结果**：①同一个演化出来的 harness，交给前沿 LLM 用时，agent-as-harness 优于 code-as-harness；②**部署时摘掉专用 harness 后，基座模型的宏平均任务成功率从 23.3% 升到 44.3%，甚至高于挂着那个 harness 时的 41.7%**；③在知识工作、工具使用、科学三个领域的 28 种 harness 诱导行为模式上，平均恢复了 82.3%。\n\n**对 AI 应用工程师的启示**：这是\"删脚手架\"的另一面：**脚手架可以先当老师，教完再拆**。结合上期 Anthropic 生物建模文（16,000 词提示降到 1,100 词、结果持平），可以得出一个工程判断：harness 里被证明有效的行为模式，长期归宿要么是被更强的模型\"自带\"，要么是被蒸馏进自家模型。一直挂在运行时上的，只是还没来得及迁走的那部分。","hf":12,"topic":"自学习 / 自演进","first":"2026-09-23","di":"2026-09-23","wi":"2026-09-25","tier":"","tk":"与其长期维护一堆领域专用 harness，不如把它们当成「生成训练轨迹的教师」——这条路线同时解决了推理期 harness 开销和多 harness 路由的复杂度。","col":"evo"},{"u":"https://arxiv.org/abs/2609.24663","t":"Beyond Endpoint Performance: Process-Level Evaluation of Self-Evolving Agents","v":"arXiv","s":"Hongqiang Lin 等","d":"2026-09-21","k":"paper","star":1,"sum":"自演进 agent 把交互反馈转成持久产物（记忆、技能），这些产物在经验流中被反复更新，它们支撑的能力也随之变化，因此只看终点性能是不完整的。本文提出 EvoPathBench：固定基座模型与工具，在演化产物的若干检查点处冻结，在留出 episode 上评估目标能力，从而定位某个能力在哪一轮出现、后续更新是加强、保持还是削弱了它。测三种能力——对未见任务的泛化、经历无关学习后的保持、面对新证据时的规则适应。结论偏负面：在相似未见任务上的收益往往在分布偏移下削弱；保持性损失集中在少数演化路径上；没有方法能可靠做到规则适应；而且自演进能生成留出集上收益可观的候选产物，但**实际被选中的更新始终没能兑现这份潜力**（即瓶颈在选择而非生成）","brief":"EvoPathBench：固定基座与工具，在演化产物（记忆、技能）的多个检查点冻结，在留出 episode 上测泛化、保持、规则适应三种能力，定位\"某个能力在哪一轮出现、之后被加强还是削弱\"。结论偏负面：在相似未见任务上的收益遇到分布偏移会变弱，保持性损失集中在少数演化路径上，**没有方法能可靠做到规则适应**。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-23","di":"2026-09-23","wi":"2026-09-25","tier":"","tk":"给自己的记忆/技能库加检查点评测——每隔 N 轮冻结一份产物快照，在固定留出集上重测几项关键能力，就能看出「越学越差」发生在哪一步；另外这篇指出选择器才是瓶颈，值得把改进精力从「生成更多候选」挪到「怎么挑」。","col":"evo"},{"u":"https://arxiv.org/abs/2609.06052","t":"SkillSpec: Intent-Masked Specification Reasoning for Agent Skill Correctness","v":"本期由 HF 首页浮现","s":"","d":"2026-09-05","k":"paper","star":1,"sum":"agent 系统越来越依赖可复用的技能抽象来沉淀经验与领域知识，这些产物通常把自由文本指令和异构资源打包在一起，正确性难以保证：它们的失败模式超出常规代码缺陷，表现为意图冲突这类被底层模型掩盖的「静默失败」。SkillSpec 用 Hoare 风格框架把技能正确性表述成规约推理问题——把异构技能库转成统一图表示，对齐描述、指令与代码产物；每个节点从周围已声明的意图推出 ExpectSpec，在部分披露意图的条件下从实际行为推出 FactSpec；用一个「意图掩码」调节对整体、血缘、邻域、局部四种视图的访问，在「上下文过多引入偏见」与「上下文过少导致无据推断」之间取平衡；候选缺陷在隔离沙箱中自动验证。在来自 SkillsBench 和高下载量仓库的 515 个真实技能上，识别出 763 个人工确认的缺陷、覆盖 239 个技能，精确率 61.2%。分节点看，代码节点上的规约推理稳定可靠，**纯文本节点仍是主要瓶颈**，多数缺陷出现在声明意图与实现的边界处","brief":"用 Hoare 风格的规约推理检查技能包里描述、指令、代码三者的意图冲突，专抓被模型掩盖的\"静默失败\"。","ana":"","hf":4,"topic":"自学习 / 自演进","first":"2026-09-23","di":"2026-09-23","wi":"2026-09-25","tier":"","tk":"给自己的技能库做体检时，重点查「描述说的」和「代码做的」之间的边界，而不是查代码本身；另外这篇提示技能描述文本（而非代码）是最容易出静默错误的地方，值得为描述单独写断言。","col":"evo"},{"u":"https://arxiv.org/abs/2609.23986","t":"Jev-Mem: System-One-Controlled Agentic Memory for Efficient AI Agents","v":"arXiv","s":"Dongming Jiang 等 3 人","d":"2026-09-21","k":"paper","star":1,"sum":"现有 agent 记忆系统大多用自回归大模型来控制记忆怎么组织、检索和使用，把昂贵的生成放在了记忆操作的关键路径上。Jev-Mem 借 System-One / System-Two 认知分工重构记忆架构：一个专门的 System-One 控制面负责构建期的记忆分型与关系组织，以及检索期的查询路由、检索预算分配、图遍历、候选打分与自适应停止；System Two（大模型）只在需要复杂推理与答案合成时才被唤起；中间是结构化的多关系记忆面。LoCoMo 上 LLM-as-a-Judge 总分 0.777，比最强基线相对提升 11.0%；记忆构建时间降到 158 秒（比最快的竞品快 6.6 倍）；平均查询延迟降到 0.93 秒（降低 36.7%）","brief":"记忆的分型、路由、预算、图遍历、停止判断交给轻量 System-One 控制面，大模型只在合成答案时出场；LoCoMo 总分 0.777（相对最强基线 +11.0%），构建时间比最快的竞品快 6.6 倍。","ana":"","hf":11,"topic":"Skill、上下文工程与工具","first":"2026-09-23","di":"2026-09-23","wi":"2026-09-25","tier":"","tk":"把记忆系统里「决定去哪找、找多少、什么时候停」这类高频小决策从大模型手里拿走，交给轻量控制器，是同时改善质量与延迟的少数做法之一——这和常见的「用大模型做记忆管家」直觉正好相反。","col":"skill"},{"u":"https://arxiv.org/abs/2609.23989","t":"ACLArena: Agent Continue Learning in Multi-stage Post-training","v":"arXiv","s":"Haixin Wang 等 12 人","d":"2026-09-21","k":"paper","star":1,"sum":"面向工业部署的通用 agent 需要整合多种能力，而每种能力通常在不同训练阶段获得，目前没有成熟的 Agent 持续学习（ACL）配方。ACLArena 搭了一条顺序训练流水线，从模型层与 token 层两个互补视角解释遗忘与泛化的机制，并系统对比多教师在线策略蒸馏、自蒸馏微调、模型合并三种整合范式在「恢复旧能力同时保住新能力」上的表现。最终提出的配方是：高质量轨迹的离线回放 + 多个各自经 RL 特化的 LoRA 专家组成的路由网络。四个推理与 agentic 任务上、分布内与分布外两种设定下均有验证","brief":"系统对比多阶段 agent 后训练里恢复旧能力的三种范式，给出的配方是\"高质量轨迹离线回放 + RL 特化的 LoRA 专家路由\"。","ana":"","hf":8,"topic":"自学习 / 自演进","first":"2026-09-23","di":"2026-09-23","wi":"2026-09-25","tier":"","tk":"如果你在按阶段迭代自己的 agent（先工具调用、再长程规划、再领域知识），这篇给的是「不要单模型一路 finetune 到底」——用 LoRA 专家 + 路由 + 轨迹回放，能力互相覆盖的问题会小很多。","col":"evo"},{"u":"https://openai.com/index/better-prompt-caching-for-gpt-6","t":"Better prompt caching for GPT-6","v":"OpenAI","s":"openai.com/index","d":"2026-09-22","k":"article","star":0,"sum":"GPT-6 家族上线的新版 prompt 缓存系统说明，把缓存从「后台自动优化」变成开发者可观测、可诊断、可主动控制的工程对象。**默认行为**：缓存输入 token 最高 90% 折扣，符合条件的共享前缀在 30 分钟窗口内复用，默认命中率比上一代更高。**可观测**：新的 Prompt Caching Dashboard 显示应用有多少输入来自缓存、命中率随时间的变化、缓存与未缓存 token 的构成对比。**可诊断**：未命中时返回 `prompt_cache_diagnostics`，给出未命中类型、原因（示例中是 `tools_changed`）、本可复用的 token 数与实际未命中的 token 数，可以直接定位是哪次改动打断了复用。**四条主动控制手段**：①显式缓存断点，自己选择哪些前缀要复用；②GPT-6 上可以在两次响应之间用 `configuration_update` 改 reasoning effort 而不破坏缓存（难任务提 effort、常规追问降 effort，上下文照样复用）；③工具变更用追加而非删除——保持工具定义、schema、顺序稳定，用 `allowed_tools` 控制可调用范围、`tool_choice: none` 表示不用工具，新指令用 developer message 追加到上下文末尾覆盖旧指令；④预热缓存，在启动时先把共享指令、工具定义、参考资料处理好，把这部分处理时间移出用户等待","brief":"","ana":"和 Anthropic 那两篇同一周出现，说明缓存已经从\"后台自动优化\"变成了**开发者要主动管理的工程对象**。\n\n默认行为：缓存输入 token 最高 90% 折扣，符合条件的共享前缀在 **30 分钟窗口**内可复用，默认命中率比上一代高。新增三类工具：\n\n- **可观测**：Prompt Caching Dashboard 展示应用有多少输入来自缓存、命中率随时间的变化，以及缓存与未缓存 token 的构成。\n\n- **可诊断**：未命中时可以拿一个请求和最近的响应对比，得到 `prompt_cache_diagnostics`，里面有未命中类型、原因（示例是 `tools_changed`）、本可复用的 token 数与实际未命中的 token 数。\n\n- **可控制**，四条手段：①**显式缓存断点**，自己选哪些前缀要复用；②GPT-6 上可以在两次响应之间追加 `configuration_update` 改 reasoning effort，而**不破坏缓存**（请求级 effort 保持不变）；③**工具与指令只追加、不删改**：保持工具定义、schema、顺序稳定，用 `allowed_tools` 限定这一轮可调用的范围，不用工具时设 `tool_choice: none` 而不是删定义，新指令用 developer message 追加到末尾来覆盖旧指令；④**预热**：启动时先把共享指令、工具定义、参考资料处理好，把这段时间移出用户的等待。\n\n**对 AI 应用工程师的启示**：第③条是长时 agent 缓存失效最常见的原因，值得写进团队的开发约定：**工具集合在会话内只增不删，用可见性开关代替删除**。另外，两家都把\"中途改推理档位不破缓存\"做成了新模型的卖点，说明\"按步骤动态调 effort\"正在成为标准做法。","hf":null,"topic":"Harness 与长时程 Agent","first":"2026-09-23","di":"2026-09-23","wi":"2026-09-25","tier":"must","tk":"三条可以立刻照做——把缓存命中率当成和延迟、成本并列的常规监控指标；把「工具定义只追加不删改」写进自己 agent 的开发约定（这是长时 agent 缓存失效最常见的原因）；用预热把冷启动的首 token 延迟移到用户到达之前。","col":"harness"},{"u":"https://openai.com/index/priorities-principles-third-party-assessments","t":"Priorities and principles for effective third party assessments","v":"OpenAI","s":"openai.com/index · Safety","d":"2026-09-22","k":"article","star":0,"sum":"OpenAI 提出第三方独立安全评估应该评什么、怎么评。**四个优先领域**：①对 safety case 的独立评估，覆盖训练、评测、内部部署与外部部署，问「证据是否支撑安全主张」「训练中是否有效识别并削弱了奖励欺骗、破坏性行动、绕过限制的激励」；②对关键防护措施的评估，用「灰盒」访问做越狱与对抗测试，检验 agent 与访问控制、沙箱、检测响应系统的实际交互，以及思维链监控随能力提升还有多可靠、监控是否覆盖全部训练与部署且不易被关闭；③对 Preparedness 风险类别（化生风险、网络安全、**AI 自我改进**）能力评测本身的评估——阈值定得对不对、评测饱和后有没有及时更新；④对重大失准事故的独立调查，明确调查方需要具备网络取证、对齐、大规模思维链分析的能力。**七条原则**：评估范围与安全主张事前登记；与主张相称的访问权限；方法与标准透明、区分直接发现与解读；评估方须具备专业能力并披露利益冲突（含财务激励、与开发方的关系、是否参与过被评工作）；安全与保密实践须与所接触信息的敏感度相称；发现要可操作、给实验室合理的整改期；发布尽可能公开，无法全公开时向治理机构保密报告，评估方保留编辑独立性并注明重大删节的影响","brief":"","ana":"OpenAI 回答第三方独立安全评估\"该评什么、怎么评\"。\n\n**四个优先领域**：①对 **safety case** 的独立评估，覆盖训练、评测、内部部署与外部部署，核心问题是\"证据是否支撑安全主张\"，以及训练中是否有效识别并削弱了奖励欺骗、破坏性行动、绕过限制的激励；②对关键防护措施的评估，用\"灰盒\"访问做越狱与对抗测试，检验 agent 与访问控制、沙箱、检测响应系统的实际交互，以及**思维链监控随能力提升还有多可靠、能否覆盖全部训练与部署、是否容易被关掉**；③对 Preparedness 风险类别（化生、网络安全、**AI 自我改进**）的能力评测本身做评估，看阈值定得对不对、评测饱和后有没有及时更新；④对重大失准事故的独立调查，要求调查方具备网络取证、对齐、大规模思维链分析三种能力。\n\n**七条原则**里最实用的是两条：**评估范围与安全主张事前登记**；结论必须区分直接发现与解读，无法全部公开时向治理机构保密报告，评估方保留编辑独立性，并注明重大删节的影响。\n\n**对 AI 应用工程师的启示**：这七条几乎可以降维用在企业自己 AI 系统的外部审计上。尤其是\"主张事前登记\"和\"写明哪些被评了、哪些没被评\"两条，能防止审计报告变成一份看起来全绿的合规文档。另外要注意：本期论文《Tamper With Their Own Traces》说明，\"监控不容易被关掉\"这一条在今天的本地 harness 上多半不成立。","hf":null,"topic":"Agent 安全与围堵","first":"2026-09-23","di":"2026-09-23","wi":"2026-09-25","tier":"note","tk":"这七条几乎可以原样降维用在企业自己的 AI 系统外部审计上——尤其是「主张事前登记」和「结论必须写明哪些被评了、哪些没被评」两条，能避免审计报告变成一份看起来全绿的合规文档。","col":"safety"},{"u":"https://huggingface.co/blog/evaleval-aisi","t":"How UK AISI and EvalEval Are Making Benchmark Results Reproducible","v":"Hugging Face","s":"Hugging Face 官方博客 · EvalEval Coalition × 英国 AI Security Institute","d":"2026-09-22","k":"article","star":0,"sum":"英国 AISI 开始用 EvalEval 的基础设施公开发布评测结果。**问题**：评测正在成为模型能力的主要证据来源，但结果散落在各种格式与平台上，往往缺少复现所需的信息，而重跑一遍评测本身可能贵到不可行。**方案**：统一的上报 schema「Every Eval Ever（EEE）」+ 开放平台「Evaluation Cards」，把结果和解读结果所需的配置信息放进同一个结构里。**这次公开的内容**：五个基准（HealthBench、FrontierMath、Humanity's Last Exam、SWE-Bench Pro、Terminal-Bench 2.0）在六个前沿模型（Claude Opus 4 / 4.5 / 4.6、GPT-5 / 5.2 / 5.4）上的已核验结果、上下文与配置信息，外加两项网络安全评测（Cyber CTFs、The Last Ones，模型集合部分重叠）。数据配套 AISI 的论文《How Inference Compute Shapes Frontier LLM Evaluation》，该论文研究基准表现如何依赖推理期算力与评测协议——文中给出的一个例子是：在 Humanity's Last Exam 上，当模型每次尝试后能拿到来自 oracle 的正确性反馈时，随着 token 用量增加它会持续解出更多任务，即同一个「分数」会随评测协议大幅变动","brief":"","ana":"英国 AI Security Institute 开始用 EvalEval 的基础设施公开发布评测结果。**问题**：评测正在成为模型能力的主要证据来源，但结果散落在各种格式和平台上，往往缺少复现所需的信息，重跑一遍又可能贵到做不起。**方案**：统一的上报 schema \"Every Eval Ever（EEE）\"加开放平台\"Evaluation Cards\"，把结果和解读结果所需的配置放进同一个结构。\n\n首批公开了五个基准（HealthBench、FrontierMath、Humanity's Last Exam、SWE-Bench Pro、Terminal-Bench 2.0）在六个前沿模型（Claude Opus 4 / 4.5 / 4.6、GPT-5 / 5.2 / 5.4）上的已核验结果和配置，外加两项网络安全评测。配套的 AISI 论文研究基准表现如何依赖推理期算力与评测协议。文中的例子是：在 Humanity's Last Exam 上，如果模型每次尝试后都能拿到来自 oracle 的正确性反馈，随着 token 用量增加它会持续解出更多题，也就是说**同一个\"分数\"会随评测协议大幅变化**。\n\n**对 AI 应用工程师的启示**：把\"推理期算力预算\"和\"是否给反馈\"当作评测报告的**必填字段**，不要放在脚注里；给内部评测定一个固定 schema，把配置、模型版本、试验次数和结果存在一起。这是日后回答\"上个季度那个数是怎么来的\"的唯一办法。","hf":null,"topic":"评测工程","first":"2026-09-23","di":"2026-09-23","wi":"2026-09-25","tier":"note","tk":"两点——把「推理期算力预算」和「是否给反馈」当成评测报告的必填字段而不是脚注（否则分数不可比）；以及给自己的内部评测定一个固定 schema，把配置、模型版本、试验次数和结果存在一起，这是日后回答「上个季度那个数是怎么来的」的唯一办法。","col":"eval"},{"u":"https://developer.nvidia.com/blog/enabling-private-high-performance-production-ai-inference-with-nvidia-confidential-computing","t":"Enabling Private High-Performance Production AI Inference with NVIDIA Confidential Computing","v":"NVIDIA","s":"NVIDIA 开发者博客 · Agentic AI / Trustworthy AI","d":"2026-09-22","k":"article","star":0,"sum":"面向要在受监管环境里跑 LLM 推理的平台工程师，回答「开启机密计算要付多少性能代价」。**结论**：在 1 台 DGX B200（8×B200）、Intel TDX 平台、TensorRT LLM PyTorch 后端、DeepSeek-R1-0528-NVFP4 模型、32K 输入/1K 输出、TP=8、FP8 KV cache 的配置下，并发 1–16 时开启机密计算保留了 96.1%–98.2% 的输出吞吐，平均 TPOT 只比基线高 1.2%–4.3%。**方法学**（这才是可迁移的部分）：要暴露机密计算的开销，必须故意挑「长输入 + 长输出 + 低并发」的负载——长上下文压 prefill 阶段的数据搬运，长生成放大 decode 阶段每 token 的小开销，低并发让这些开销无法被并发请求掩盖；高并发会把固定加密成本摊薄，反而测不出来。对照实验只允许机密计算状态这一个变量变化，模型、硬件、框架版本、序列长度、并行度、并发全部固定，指标用「吞吐保留率」和「TPOT 开销百分比」两个比值。**框架侧适配**：机密执行改变了内存搬运、计时、调度、多 GPU 通信的假设，框架必须感知——例如自动调优时改用 GPU `%globaltimer` 做 tactic 测量、机密环境外仍用 CUDA events","brief":"","ana":"","hf":null,"topic":"Agent 安全与围堵","first":"2026-09-23","di":"2026-09-23","wi":null,"tier":"must","tk":"这套「挑最坏负载 + 单变量对照 + 报比值不报绝对值」的做法可以直接搬去评估任何一项安全/合规开关（沙箱、审计日志、加密存储）对推理性能的影响；结论本身则说明「隐私合规」不再是性能上的硬约束，代价已经压到个位数百分比。","col":"safety"},{"u":"https://huggingface.co/blog/transformers-llama-cpp-quants","t":"Transformers now runs llama.cpp quants","v":"Hugging Face","s":"Hugging Face 官方博客 · Marc Sun / Arthur Zucker / Lysandre","d":"2026-09-22","k":"article","star":0,"sum":"transformers 开始原生支持 GGUF：从 Hub 上挑一个量化 checkpoint，用 `from_pretrained(model_id, gguf_file=filename)` 直接加载并生成。**做法**：权重保持在 Metal 上打包状态时，transformers 自动加载兼容的 ggml/Metal 层 kernel（通过 `kernels` 库复用 llama.cpp 的底层 ggml kernel），注意力实现用 `ggml-org/ggml-attn`；kernel 拉不到就带 warning 回落 `sdpa`。首轮范围是 Apple Silicon 上的本地推理、Qwen3.5 架构起步。**量化档位参考**（Unsloth 的 Qwen3.5-4B）：BF16 8.42 GB、Q6_K 3.53 GB、Q5_K_M 3.14 GB、Q4_K_M 2.74 GB，建议从 Q4_K_M 起步，内存宽裕再上 Q5_K_M / Q6_K。**基准**：在 M2 Max / 32 GB 上对三个 checkpoint（小稠密、大稠密、MoE）与 llama-bench 对比，transformers 全程接近 llama.cpp——但文中明确指出两边条件不完全可比（transformers 的数字含 prefill，llama-bench 只报 decode）。文中还提醒基准脚本里每轮之间要 `sleep(90)` 让机器降温，否则连续跑会衰减 10% 以上。**定位**：llama.cpp 仍是「优先追求本地推理效率」时的推荐引擎，这次集成是为了让模型定义与本地运行时靠得更近","brief":"","ana":"","hf":null,"topic":"评测工程","first":"2026-09-23","di":"2026-09-23","wi":null,"tier":"note","tk":"本地评测脚本里的两个细节值得抄——跑分之间强制冷却、以及在报告里显式写明两边测的不是同一件事（含不含 prefill），这比多跑几轮更能避免自己骗自己。","col":"eval"},{"u":"https://arxiv.org/abs/2609.24220","t":"Document Retrieval-Aware Chunking (D-RAC): Universal Retrieval-Aware Ingestion of Enterprise Documents via PDF Normalization","v":"Yellow.ai","s":"","d":"2026-09-21","k":"paper","star":0,"sum":"企业 RAG 要吞 PDF、Word、PPT、扫描件等异构格式，内容锁在复杂版式、多栏和密集表格里；规则抽取与 OCR 会破坏阅读顺序、压平表格、丢掉标题层级，而对抽取文本做全 agentic 切分则 token 成本高、有幻觉风险。D-RAC 的做法是先把任意输入统一归一化成 PDF（几乎所有格式都有确定性的忠实 PDF 渲染），再用一遍多模态 LLM 把渲染页转成检索优化的 Markdown——表格改写成自包含的散文陈述、保留标题层级——之后按已有的 W-RAC 流程切分：确定性解析成可寻址的 ID 单元，再用轻量 LLM 在「标识符」而非正文上做切分规划，**切分阶段从不重新生成原文**。在 RAG-Multi-Corpus 基准的 236 文档 / 795 页 PDF 子集（覆盖五个企业领域）上，72 分钟零错误完成全部转换与切分，产出 1748 个可检索 chunk；相比用前沿大模型做 agentic 切分，切分阶段输出 token 降 95.7%、成本降 77.8%–85.6%、耗时降 75%，并对 500 页以上文档线性扩展","brief":"","ana":"","hf":48,"topic":"Skill、上下文工程与工具","first":"2026-09-23","di":"2026-09-23","wi":null,"tier":"","tk":"「让 LLM 规划切分但不让它重写原文」这一条是整篇的核心——把 LLM 的输出限制在标识符序列上，成本、确定性、可观测性一次全拿到，值得直接搬进任何文档入库流水线。","col":"skill"},{"u":"https://arxiv.org/abs/2609.24115","t":"EDGEGEN: Improving Tool-Calling Agents Beyond Happy Paths with Synthetic Edge Case Generation","v":"arXiv","s":"Harshavardhan Abichandani 等","d":"2026-09-21","k":"paper","star":0,"sum":"企业里部署工具调用 agent 需要高质量、多样的任务数据集来做评测与优化，但真实数据常因隐私等限制拿不到，而现有合成任务生成方法产出的任务偏通用、忽略 agent 背后的状态与数据库、不反映真实使用的多样性。EdgeGen 从 agent 的规约里抽取合规规则，再用这些规则生成**以数据库为依据、专门用来违反这些规则**的边界用例任务；与已有合成数据方法结合后，可同时用于微调和 harness 优化，整条流水线闭环、无需人工标注。在 τ²-bench 航空域上，用 EdgeGen 数据微调带来 2%–42% 的平均进度提升（部分基线方法反而让某些模型退化）；用于 harness 优化时，相对人工整理的 harness 提升 10%、相对基础 harness 提升 30%（Gemma-4-e4b）","brief":"","ana":"","hf":2,"topic":"评测工程","first":"2026-09-23","di":"2026-09-23","wi":null,"tier":"","tk":"把自己 agent 的业务规则（退款上限、身份校验、改签条件）当成生成器的输入，专门造「会踩线」的用例——这比让模型「多生成一些任务」有效得多，而且这批用例天然就是回归测试集。","col":"eval"},{"u":"https://arxiv.org/abs/2609.24983","t":"onPanda: Efficient Annotation of On-Policy Alignment Data for LLMs and Agents via Token-Level Correction","v":"arXiv","s":"Lei Yang 等","d":"2026-09-21","k":"paper","star":0,"sum":"一个标注工具：核心交互是 token 级纠正——标注者读模型回复时定位第一个不合适的 token，从模型候选 token 里挑替换或自由编辑，系统随后截断该位置之后的全部内容、从纠正后的前缀继续生成，重复「定位—纠正—续写」直到满意。一项小规模对照研究显示标注中位耗时比人工后编辑降低 52%。由于最终回复的绝大多数 token 仍由模型自己生成，数据基本保留了模型的采样分布，适合构造在线策略 SFT 与偏好数据；纠正记录本身还提供带精确位置的细粒度监督和天然配对的正负样本。工具可接外部工具与 harness，支持在真实环境中做轨迹标注。同时发布 Panda-CVL 数据集与 token 级纠正基准","brief":"","ana":"","hf":27,"topic":"Harness 与长时程 Agent","first":"2026-09-23","di":"2026-09-23","wi":null,"tier":"","tk":"做人工反馈时用「截断+续写」而不是整段重写——省一半时间之外，更重要的是产出的数据不偏离模型自身分布，这决定了它能不能当 on-policy 数据用。","col":"harness"},{"u":"https://arxiv.org/abs/2609.23377","t":"One to More, More to One: Category-Aware Iterative Expert Training for Software Engineering Agents","v":"arXiv","s":"Jie Zhao 等 6 人","d":"2026-09-20","k":"paper","star":0,"sum":"仓库级软件工程任务包含异构的任务类别，在混合池上做 agentic RL 时进展不均衡：某些类别涨的同时另一些在退，而聚合解决率会掩盖这种变化（作者称之为「类别跷跷板」）。方案是类别感知的专家训练与策略整合：先用可执行任务构造和证据驱动的多轴标注系统 SWE Labeler 组织训练池；同源类别专家交替进行长程 Agentic-miniRL 与 RRE（Refresh-Repair-Expand）——更新后的策略刷新实例掌握度，复用自己验证过的成功轨迹做 Repair SFT，再重选任务继续 RL；最后用标签路由的多教师在线策略蒸馏（MOPD）把专家合并成单个可部署学生，用 ReLU 门控的奖励外推只保留每个教师相对参考模型的改进方向。全程不需要外部模型提供解题轨迹或动作目标。最终策略在 Pro-618 上平均解决率 58.04%、SWE-bench Multilingual 上 59.00%，比基座分别提升 5.39 和 2.78 个百分点","brief":"","ana":"","hf":16,"topic":"评测工程","first":"2026-09-23","di":"2026-09-23","wi":null,"tier":"","tk":"做垂直 agent 的训练/评测时不要只看聚合指标——先按任务类别拆开看，「总分涨了」很可能掩盖了某一类在退步；另外「用自己验证过的成功轨迹做修复式 SFT」是不依赖更强外部模型的自举路径。","col":"eval"},{"u":"https://www.anthropic.com/claude-opus-5-5","t":"Introducing Claude Opus 5.5","v":"Anthropic","s":"","d":"2026-09-22","k":"release","star":0,"sum":"Claude 5.5 家族首个模型，定位是「多数工作达到 Fable 5.1 水平、运行成本比 Opus 5 低 40%」。价格：输入 $4 / 输出 $20 每百万 token（比 Opus 5 低 20%），缓存读取 $0.20（低 60%，而缓存读取占 agentic 与编码工作成本的大头），缓存写入 $5；输出速度比 Opus 5 快 30% 以上。基准：Terminal-Bench 4.0 66.4%、FrontierCode v1.1 54.4%、CursorBench 4.0 57.8%、GDPval-AA v2.1 1846 Elo、OSWorld 2.0 81.8%。发布方同时提示「在这个能力水平上基准差距已不太能反映真实差异」。安全侧：自动化行为审计得分为迄今最好，Gray Swan 的提示注入基准上与 Fable 5.1 并列最低成功率，发布前由 Frontier Design 和 METR 外部测试","brief":"","ana":"","hf":null,"topic":"Agent 安全与围堵","first":"2026-09-23","di":"2026-09-23","wi":null,"tier":"","tk":"缓存读取单价降 60% 这一条，对长时 agent 的成本模型影响比输入输出降 20% 大得多——如果你的成本表还是按输入输出估的，该重算了。","col":"safety"},{"u":"https://openai.com/index/introducing-gpt-6-sol-and-luna","t":"Introducing GPT-6 Sol and Luna","v":"OpenAI","s":"openai.com/index","d":"2026-09-22","k":"release","star":0,"sum":"GPT-6 家族的中低两档，用与 Astra 相似的方法训练，主打成本效率。API 价格相对 GPT-5.6 促销价对折：Sol $4/$20 → **$2/$10**，Luna $0.20/$1.20 → **$0.10/$0.50**。基准：AutomationBench 上 Sol（xhigh）33.2%、每任务 $0.27，作为对比 Claude Opus 5（max）26.9% 但成本是 Sol 的 11.1 倍；DeepSWE v1.1 上 Sol（max）68.8%，距 Claude Fable 5 最高分 69.9% 差 1.1 个百分点而每任务成本低约 80%；OSWorld 2.0 offline 上 Sol（xhigh）60.5%。事实性方面，Sol 在内部真实用户标错对话构成的评测上错误数约为前代一半。文中还披露 OpenAI 内部编码 agent 用量按 API 价计算，研究员日均 token 消耗中位数已超 $600、P90 超 $7,000。","brief":"","ana":"","hf":null,"topic":"评测工程","first":"2026-09-23","di":"2026-09-23","wi":null,"tier":"","tk":"","col":"eval"},{"u":"https://openai.com/index/building-standards-next-phase-ai","t":"Building standards for the next phase of AI","v":"OpenAI","s":"openai.com/index · Global Affairs 栏目","d":"2026-09-21","k":"article","star":1,"sum":"OpenAI 把自己的三大目标重述为「造自动化 AI 研究员、与它一起迭代对齐问题、找到让人类留在自我改进循环里的办法」，然后用整篇文章论证为什么这需要国际标准。**RSI 部分**：明说自动化 AI 研究会让 AI 越来越多地承担下一代 AI 的开发工作，从而推动递归自改进、使进展速度可能急剧加快；并给出红线——完全自主的 RSI 今天没有发生，除非能安全地做否则不应追求，是否推进取决于能否保持人类控制以及知情的民主选择；做得不慎的后果是「人类对 AI 开发失去实际控制，无法监督自己已经看不懂的研究过程」。**标准部分**：提出两个机制，一是依托已在澳、加、德、法、肯尼亚、日、韩、新、印、英建立的 AI 安全研究所网络，经 CAISI 与各国行业机构制定标准（明确不是许可证、不是发布前强制审查）；二是共同的度量与事故上报协议，具体包括 RSI 相关进展与公司内自主研究量的评估、自动化研究的人类监督触发线、对齐与自动化研究事故的分级与上报阈值。文章点名要避免碎片化、集体行动失败、能力分布不均三个问题，并说中美在这些领域的对话是积极一步","brief":"","ana":"分量最重的一篇政策文本。它的意义在于 OpenAI **第一次把递归自改进（RSI）从研究议题写成了政策对象**。\n\n开篇先重述三大目标，第一条是\"造出自动化 AI 研究员，与它一起迭代对齐问题，并找到让人留在自我改进循环里的办法\"。RSI 一节的核心表述有三句：自动化 AI 研究会让 AI 越来越多地承担下一代 AI 的开发，推动 RSI，**即使人仍在参与**；**完全自主的 RSI 今天没有发生，在能安全地做到之前不应追求**，是否推进取决于能否保持人类控制，以及\"知情的民主选择\"；如果做得不慎，后果是\"人类对 AI 开发失去实际控制，无法监督自己已经看不懂的研究过程\"。\n\n政策部分提议美国牵头制定包括 RSI 在内的前沿 AI 全球技术标准，并点名要解决三个问题：碎片化（各国评测、上报要求、事故定义互相冲突）、集体行动失败、能力分布不均。落地靠两个机制：\n\n1. 依托已在澳、加、德、法、肯尼亚、日、韩、新、印、英建立的 AI 安全研究所网络，经 CAISI 与各国行业机构制定标准。文中明确**不是许可证、不是强制发布前审查**，是否纳入法律由各国决定。\n\n2. **共同的度量与事故上报协议**，具体三项：RSI 相关进展与公司内自主研究量的评估（引用了 09-06《Research acceleration》作为初步贡献）；**哪类自动化研究过程必须立即触发人工复核**；对齐与自动化研究事故的分级、跟踪、上报阈值（引用了 09-16 的失准上报框架）。文中还说中美在这些领域的对话是积极一步。\n\n**对 AI 应用工程师的启示**：把它提的三类标准当作自己 agent 系统的治理清单：给\"自动化程度\"定一个可量化指标；把\"哪几类动作必须人工签字才放行\"写死在运行时而不是提示词里；给失准事故定义严重度分级与上报阈值。这三件事今天做是工程选择，一两年后大概率会变成合规要求。它和 09-17 Anthropic Institute 的度量提案放在一起，就是\"AI 造 AI 该怎么治理\"这道题的两家官方口径。","hf":null,"topic":"Agent 安全与围堵","first":"2026-09-22","di":"2026-09-22","wi":"2026-09-25","tier":"must","tk":"把它列的三类标准直接当成自己 agent 系统的治理清单——给「自动化程度」定一个可量化指标（对标 Anthropic 的 R&D 自动化指数）、明确写死哪几类动作必须人工签字才放行、给失准事故定义严重度分级与上报阈值；这三件事现在做是工程选择，一两年后大概率是合规要求。","col":"safety"},{"u":"https://openai.com/index/v7","t":"How V7 gives AI agents institutional memory","v":"OpenAI","s":"openai.com/index · Startup 栏目","d":"2026-09-21","k":"article","star":1,"sum":"企业 agent 记忆层的生产案例，数字比多数论文实。**问题定义**：业务上下文散落在文档、数据室、表格、邮件与内部工具里，agent 每次请求都要重新发现上下文，导致几十次搜索、烧时间烧 token，还常漏掉藏在关系里的关键信息。**做法**：V7 Go 用 GPT-5.6 Luna 从数百万文件抽取信息，组织成 Context Graph——连接实体、关系与带引用的证据；新文件到达时识别本体中的公司/基金/人员等实体，把每条事实挂到新建或已有记录上并保留到原文的引用；图谱不够时仍可回落到 RAG 检索原文。长跑 agent 的近期对话留在活动上下文里，更早的材料沉到图谱按需取回。**数字**：HERB（跨企业系统找信息并串联的基准）上仅检索系统就比官方基线高 69%，不可答问题的幻觉降 38%；图谱遍历比长上下文方案便宜快一个数量级；GPT-5.6 Sol 把 Context Graph 上的工具调用错误率从 GPT-5.5 的 2.7% 降到 0.2%；最难一档的图谱查询上 Sol 78%、GPT-6 Astra 89%；从 Chat Completions 换到 Responses API 让部分 PDF 密集流程 token 降约 5% 且缓存更稳；客户侧 50–100 步流程分钟级完成、准确率 99.9%，资产管理的尽调筛选快 21 倍","brief":"","ana":"客户案例，但技术密度比多数记忆论文高，数字也更实。\n\n**问题**：业务上下文散在文档、数据室、表格、邮件与内部工具里，agent 每次请求都要重新发现上下文，几十次搜索烧时间烧 token，还常漏掉藏在关系里的关键信息。**做法**：V7 Go 用 GPT-5.6 Luna 从数百万文件里抽取信息，组织成 **Context Graph**，把实体、关系与**带引用的证据**连起来。新文件到达时识别本体中的公司、基金、人员等实体，把每条事实挂到新建或已有的记录上，并保留到原文的引用；图谱不够用时回落到 RAG 检索原文。长跑 agent 的近期对话留在活动上下文里，更早的材料沉到图谱里按需取回。\n\n**数字**：HERB 基准（跨企业系统找信息并串联）上，仅检索系统就比官方基线高 69%，不可答问题的幻觉降 38%；图谱遍历比长上下文方案便宜、快一个数量级；Context Graph 上的工具调用错误率从 GPT-5.5 的 2.7% 降到 GPT-5.6 Sol 的 0.2%；从 Chat Completions 换到 Responses API，让部分 PDF 密集的流程 token 降约 5%，缓存也更稳。\n\n**对 AI 应用工程师的启示**：两个可以直接抄的设计。一是**分层模型路由**：抽取用便宜模型，推理和工具调用用强模型，按 fast/medium/smart 三档映射到每个步骤。二是把\"记忆\"做成**带引用证据的实体图**而不是向量堆，并在图上跑一套持续维护的基准（引用准确率、抽取质量、指令遵循、时延、成本各一项），用它来决定换不换模型。这和上期 Hugging Face funes 的\"读时检索原文\"路线正好相反，是\"写时结构化\"的代表。","hf":null,"topic":"Skill、上下文工程与工具","first":"2026-09-22","di":"2026-09-22","wi":"2026-09-25","tier":"note","tk":"两个直接可抄的设计——一是分层模型路由（抽取用便宜模型、推理与工具用强模型，按 fast/medium/smart 三档映射每个步骤）；二是把「记忆」实现成带引用证据的实体图而不是向量堆，并在图上跑持续维护的基准套件（引用准确率、抽取质量、指令遵循、时延、成本各一项）来决定换不换模型。","col":"skill"},{"u":"https://arxiv.org/abs/2609.22086","t":"Designer-RSI: Evolving Procedural Memory from User Traffic for Agentic Graphic Design","v":"arXiv","s":"Hongyang Du 等","d":"2026-09-18","k":"paper","star":1,"sum":"在没有可编程 oracle 的长程任务（专业平面设计）上做持续自改进。冻结的前沿模型通过 230 多个工具操作专业设计软件，模型外部维护一个自然语言技能的「程序性记忆」：**加宽**是为反复出现却未覆盖的子任务补新流程，**加深**是拿自己成功与失败的执行记录去修订已有流程，再由一道「匹配重放门控」只接受能修好失败且不回归已观察到成功的改动。五轮、1,406 个真实用户 brief、1,869 条自动评分轨迹，零权重更新、零人工标注，技能库从 76 条（文档衍生）长到 139 条，GenEval2 在 Claude-Sonnet-4 上执行成功率 72.7%→99.3%；200 个留出 brief 上单用加宽或加深各约 49%/48.6% 胜率，二者结合 58.5%（p=0.025）","brief":"没有可编程 oracle 的平面设计任务上，用 1,406 个真实用户 brief 对自然语言技能库做\"加宽 + 加深\"，由\"匹配重放门控\"只接受能修好失败且不回归已有成功的改动。零权重更新、零人工标注，技能库从 76 条长到 139 条，GenEval2 执行成功率 72.7%→99.3%。","ana":"","hf":22,"topic":"自学习 / 自演进","first":"2026-09-22","di":"2026-09-22","wi":"2026-09-25","tier":"","tk":"「重放门控」是这套方法的关键——任何技能库自动演化都要有一道回归闸，新技能必须在历史成功样本上不掉分才准入库，否则技能库会越长越差。","col":"evo"},{"u":"https://arxiv.org/abs/2609.21749","t":"GraphSkillEvo: Evolutionary Optimization of Graph-Structured Agent Skills","v":"arXiv","s":"Rui Sun 等","d":"2026-09-18","k":"paper","star":1,"sum":"指出现有技能优化把技能写成无结构自然语言的两个毛病：缺少工作流层面的指引且冗余大、无约束文本的搜索空间太大导致优化低效。方案是把技能表示成图——节点是执行步骤加操作指引，有向边编码上下文相关的步骤转移——再用带变异与交叉算子的种群进化框架同时维护多个候选并组合有效部件。五个 agent 基准上比强基线 SkillOpt 平均准确率高 4.01%（GPT-5.4-nano）/ 1.76%（GPT-5.4）","brief":"把技能从散文改成图（节点 = 执行步骤 + 操作指引，边 = 条件转移），再做带变异、交叉的种群进化；五个基准上比 SkillOpt 平均准确率高 4.01%（GPT-5.4-nano）/ 1.76%（GPT-5.4）。","ana":"","hf":9,"topic":"自学习 / 自演进","first":"2026-09-22","di":"2026-09-22","wi":"2026-09-25","tier":"","tk":"技能文件别写成散文，写成「步骤节点 + 条件转移边」的结构；结构化之后不仅模型更好执行，还能做交叉重组这种纯文本技能做不了的优化。","col":"evo"},{"u":"https://arxiv.org/abs/2609.21423","t":"DENSE: Distilling Agent Trajectories into Evidence-Grounded Shortcut Trees for Self-Refinement","v":"复旦大学 / 美团","s":"","d":"2026-09-18","k":"paper","star":1,"sum":"线上 agent 会产生大量执行轨迹，但任务级验证和专家标注都贵。DENSE 不要事后结果标签，只用轨迹里「局部进展、错误恢复、未完成需求」这三类证据，把它们组织成证据化的嵌套捷径树：压缩重复尝试、用恢复证据跨层级调和问题、总结已完成分支并展开未解决分支，把可复用的进展与剩余义务连起来。配套的 REFIT 协议在同一初始轨迹、重置环境与上下文的条件下做同源对比。Terminal-Bench 2.1 上四个接收模型的严格通过率相对初次执行提升 7.12–15.64 个百分点，重跑时观察到的 token 少 19.0–43.6%","brief":"不需要结果标签，只用轨迹里的\"局部进展、错误恢复、未完成需求\"三类证据构建嵌套捷径树；Terminal-Bench 2.1 严格通过率提升 7.12–15.64 个百分点，重跑 token 少 19.0–43.6%。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-22","di":"2026-09-22","wi":"2026-09-25","tier":"","tk":"自我改进不一定要有「这次成功了没」的标签——轨迹里「哪一步被后续动作纠正过」本身就是免费的监督信号，这条对没有自动判分器的业务 agent 尤其实用。","col":"evo"},{"u":"https://arxiv.org/abs/2609.21940","t":"AutoViewMem: Self-Configuring Orthogonal Views for Conversational Long-Term Memory","v":"arXiv","s":"Zijie Cao 等","d":"2026-09-18","k":"paper","star":1,"sum":"长期记忆系统常用固定粒度或静态 schema，导致偏好、事件、约束、时间更新这些异质信息挤在同一个混合表示里互相干扰，top-K 检索对噪声敏感。AutoViewMem 从交互轨迹里发现候选「视图」，选出一组紧凑互补、低重叠的视图集，再用这些视图指导写入时的结构化抽取，生成带来源溯源的记忆。关键设计是把语义解耦从检索时挪到写入时，于是普通 top-K 相似检索就能取到聚焦证据，不需要显式路由或多轮检索；另加离线整合提升紧凑性与一致性。LoCoMo 与 PersonaMem 上、Qwen3-8B/14B 两个底座都优于强记忆基线","brief":"从交互轨迹里自动发现一组低重叠的记忆\"视图\"，在写入时就把偏好、事件、约束、时间更新分开存，于是普通 top-K 检索就能拿到聚焦的证据。","ana":"","hf":null,"topic":"Skill、上下文工程与工具","first":"2026-09-22","di":"2026-09-22","wi":"2026-09-25","tier":"","tk":"记忆系统的复杂度要放在写入侧而不是读取侧——写入时按互不重叠的语义面拆好，检索侧就能保持最简单的一次 top-K，工程上更好维护也更快。","col":"skill"},{"u":"https://arxiv.org/abs/2609.15779","t":"EvoOntology: A Self-Evolving Ontology Layer for Data Agents","v":"中国人民大学数据实验室","s":"","d":"2026-09-14","k":"paper","star":1,"sum":"针对数据 agent 的「agent-数据鸿沟」：异质数据在 agent 外部，agent 只能通过通用工具看到列名、文件路径这种表层信息。EvoOntology 把本体封装成一个含 schema 层、内容层、工具层的 MCP server，让 agent 在运行时主动查询与交互；配一个 builder agent 自动构建本体，以及一个自演化循环——用归因引导的类型化编辑持续精修本体，每次编辑必须通过「以底座模型为条件的配对评测」才被接受。三个数据 agent 基准、四个 LLM 底座上稳定优于现有语义层方案","brief":"本体做成含 schema / 内容 / 工具三层的 MCP server，由 builder agent 构建，每次类型化编辑都要通过\"以底座模型为条件的配对评测\"才被接受。","ana":"","hf":68,"topic":"自学习 / 自演进","first":"2026-09-22","di":"2026-09-22","wi":"2026-09-25","tier":"","tk":"把语义层做成 MCP server 而不是塞进 prompt，agent 才能按需分层取用；本体的每次自动修改都要过一道配对评测才准入，和 Designer-RSI 的重放门控是同一个模式。","col":"evo"},{"u":"https://arxiv.org/abs/2609.05571","t":"Grounded Skill Synthesis from Code at Scale for Agentic Intelligence","v":"arXiv","s":"Yongqi Tong 等","d":"2026-09-04","k":"paper","star":1,"sum":"现有技能获取要么靠轨迹合成（必须先和特定环境交互过），要么从文档提取（缺可执行证据与验证）。Code2Skill 走第三条路：把源码单元转成「原子操作、复合工作流、重复模式」三类实现锚定的记录，每条记录再通过「屏蔽源码体的重建」和「对照源码的比较」双重验证。在 19,769 个活跃维护的热门 GitHub 仓库上跑出 CodeSkillBank，含 1,006,822 条通过验收的记录，带工作流、边界、溯源与源码证据元数据。72 组协议匹配评测（九种模型设定 × 八个基准）中，检索技能增强后平均提升 11.7%、57 组胜出，且在全部七个共享基准上优于轨迹衍生的技能库。另一个有意思的数字：用 AI 生成代码合成的技能通过率 93.50%，人写代码 93.00%","brief":"Code2Skill 从 19,769 个 GitHub 仓库的源码合成 1,006,822 条技能记录，每条都经\"屏蔽源码的重建 + 对照源码比较\"双重验证；72 组评测平均提升 11.7%。","ana":"","hf":85,"topic":"自学习 / 自演进","first":"2026-09-22","di":"2026-09-22","wi":"2026-09-25","tier":"","tk":"agent 还没积累够交互经验时，代码仓库就是现成的程序性知识源——「让 agent 读代码写技能、再屏蔽源码让它重建来验证」这套自验证流程可以直接搬到自己的内部代码库上。","col":"evo"},{"u":"https://developer.nvidia.com/blog/how-to-evaluate-ai-agents-from-tool-calls-to-task-completion","t":"How to Evaluate AI Agents From Tool Calls to Task Completion","v":"NVIDIA","s":"NVIDIA 开发者博客 · Agentic AI","d":"2026-09-21","k":"article","star":0,"sum":"一篇讲清 agent 评测演化路径的方法论长文。**核心论点**：BFCL 那一代只评单次函数选择与参数填写，但一个格式合法的 `issue_refund` 调用若底层检查未做、状态未更新，任务仍然失败——调用准确率是必要非充分条件。完整评测需要一个会执行每次调用、跨步跟踪状态、事后读世界状态判定的执行环境，在其上叠两层打分：**步级（过程）**问「在当时状态下这次调用是否有效、相关、有用」，**端到端（结果）**只看最终状态（退款到账没、工单路由对没）。两者是同一个对象「trace」的两种读法：过程打分评行，端到端评最终状态。**层级与指标**：Benchmark → Trial → Task → Turn → Step 五层固定汇总；六个指标分三轴——任务成功率（发布门禁）、一致性（3–5 次试验的区间，90%/74% 不等于 84%）、工具调用精度、参数准确率（分离「用错 API」与「用对 API 填错参」）、每次成功的步数（冗长度）、每次成功的成本（经济单位）。**可比性三维度**：任务复杂度、有无状态、验证方法（可执行验证 > 参考答案 > LLM-as-a-Judge，后者在用人工评分校准前只能当临时值）；并警告污染已从训练数据泄漏扩展到「联网 agent 在评测中检索到答案」和「HF 上的数据集被重新爬进预训练语料」。文末给了一条 SWE-bench Verified 真实 trace（OpenHands harness，`pytest-dev__pytest-5262`）的逐步判分：4 步里 1 步冗余，端到端 1 分、步级 3/4、工具调用精度 3/4、参数准确率 4/4","brief":"","ana":"agent 评测方法论的一篇扎实综述，适合直接当面试答题框架。\n\n**核心论点**：BFCL 那一代只评单次函数选择与参数填写，但一个格式合法的 `issue_refund` 调用，如果底层检查没做、状态没更新，任务仍然是失败的，所以**调用准确率是必要非充分条件**。完整的评测需要一个会真正执行每次调用、跨步跟踪状态、事后读取世界状态来判定的执行环境，然后在上面叠两层打分：**步级（过程）**问\"在当时的状态下这次调用是否有效、相关、有用\"；**端到端（结果）**只看最终状态（退款到账没有、工单路由对没有）。两者是对同一个对象（trace）的两种读法。\n\n**层级与指标**：Benchmark → Trial → Task → Turn → Step 五层固定汇总。六个指标分三轴：任务成功率（发布门禁）、**一致性**（3–5 次试验的区间，\"90% / 74%\"不等于\"84%\"）、工具调用精度、**参数准确率**（把\"用错 API\"和\"用对 API 但填错参\"分开）、每次成功的步数（冗长度）、每次成功的成本。**可比性**看三个维度：任务复杂度、有无状态、验证方法（可执行验证 > 参考答案 > LLM-as-a-Judge，后者在用人工评分校准之前只能当临时值）。文章还警告，污染已经从训练数据泄漏扩展到\"联网 agent 在评测中检索到答案\"和\"HF 上的数据集被重新爬进预训练语料\"。\n\n文末给了一条 SWE-bench Verified 真实 trace（OpenHands harness，`pytest-dev__pytest-5262`）的逐步判分：4 步里 1 步冗余，端到端 1 分，步级 3/4，工具调用精度 3/4，参数准确率 4/4。\n\n**对 AI 应用工程师的启示**：落地分三步：先用公开的 agentic 套件跑出\"公共地板\"并记录 3–5 次试验的区间；再用自己的真实工单、trace、API 建领域内评测，**门禁必须卡在环境状态上**（某行数据库记录、某个合并的 PR、某张关闭的工单），而不是评委对最终回复的观感；最后才是把模型和 harness 适配到这个分布上。（NVIDIA 本期另一篇 SWE-Serve 也很好，但按\"每期最多 1 篇\"的限额记入已排除，核心结论见趋势观察。）","hf":null,"topic":"评测工程","first":"2026-09-22","di":"2026-09-22","wi":"2026-09-25","tier":"must","tk":"三步落地——先用公开 agentic 套件跑出「公共地板」并记录 3–5 次试验区间；再用自己的真实工单、trace、API 建域内评测，门禁必须卡在环境状态（某行数据库记录、某个合并的 PR、某个关闭的工单）而不是评委对最终回复的观感；最后才是把模型和 harness 适配到这个分布上。","col":"eval"},{"u":"https://huggingface.co/blog/tokenizers-v1","t":"tokenizers v1: encode, decode and scaling, measured","v":"Hugging Face","s":"Hugging Face 官方博客","d":"2026-09-21","k":"article","star":0,"sum":"tokenizers v1 的性能重构说明，作者为 Arthur Zucker 等核心维护者。**前提**：v1 与 v0.23 产出完全相同的 token ID，API、词表、merge 排名都不变，只改实现。**五处改动**：①工作区拆分，`tk-encode` 是唯一必需的运行时，序列化/转换/训练三个 crate 按需链接；②无分配模型，merge 工作集放在调用方持有的 scratch buffer，循环不碰分配器；③bitcannon——BPE 的预分词正则是模型的固定参数、运行时永不变化，于是对常见文法手写切分函数并用 SIMD 把输入当作并行比特流处理，一次寄存器操作判定 64 字节（同 Parabix / simdjson 的思路），文法不在覆盖范围内的 tokenizer 回落正则路径、拿不到加速；④merge 循环重写，符号存在扁平数组里用位置索引连成侵入式双向链表，候选对打包进单个 64 位整数、merge rank 放高位，比较变成整数比较且「此处无 merge」是最大值，循环无分支；⑤线程本地词缓存 + 原生并行，每线程从自己的子池取 scratch 与缓存，不再排队抢锁。**结果**：十个模型家族上，Apple M4 Max 单线程比 v0.23 快 3–30 倍（低端 t5-base、高端 gpt2），八 worker 下扩展性达线性的 76%。基准方法学也写得很细（同一计时循环、加载时间排除在 encode 外、FNV-1a 校验 ID 一致、绑定物理核不绑 SMT 兄弟线程）","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-22","di":"2026-09-22","wi":null,"tier":"note","tk":"两条通用经验——把「运行时固定不变的配置」从解释执行改成针对具体取值的特化实现（这里是正则→手写 SIMD 切分），以及在有重复输入的场景用线程本地 memo 而不是全局带锁缓存；另外它的基准规则（排除加载、校验输出一致、报中位数、绑物理核）可以直接抄进自己的性能测试。","col":"evo"},{"u":"https://arxiv.org/abs/2609.22000","t":"RecreationWorld: Scalable and Verifiable Environments for Hybrid Computer-Use Agents","v":"arXiv","s":"","d":"2026-09-18","k":"paper","star":0,"sum":"真实数字工作需要 GUI 交互与写代码交替进行而非先后叠加。RecreationWorld 用「复刻」设定：给一个正在运行的参考应用，agent 自行发现其行为并造出忠实实现，没有规定流程；参考实现本身就是隐藏行为测试的 oracle，提供执行锚定的奖励。覆盖 Ubuntu / macOS / Windows / Android / Web 五平台，配统一 harness（原生 GUI 控制 + 编码工具）。留出评测集 RecreationBench 有 250 个任务，程序化断言与视觉断言都先在参考实现上验证并经人工复核后冻结。结果：GPT-6 Astra 总分领先但只有 58.1%，且「通过全部程序化测试」的任务仅 2.8%；agent 复现静态界面结构比复现交互与计算输出可靠得多，生成的应用也比参考实现更小更单体。","brief":"给一个运行中的参考应用，让 agent 发现其行为并复刻；参考实现本身就是隐藏测试的 oracle，覆盖五个平台。GPT-6 Astra 领先，但也只有 58.1%。","ana":"","hf":60,"topic":"评测工程","first":"2026-09-22","di":"2026-09-22","wi":"2026-09-25","tier":"","tk":"","col":"eval"},{"u":"https://arxiv.org/abs/2609.22068","t":"CodeMidas: Scaling Agentic Coding RL Environments from Code Itself","v":"本期最高","s":"","d":"2026-09-18","k":"paper","star":0,"sum":"训练编码 agent 需要多样任务加可靠验证器，现有方法依赖 issue、commit 这类开发产物，能抽出的任务类型受限。CodeMidas 只以源码为任务侧输入，在环境构建的每一阶段都投入 agent 算力：agent 先探索已实现功能写出行为规格，再基于原代码的执行结果构造测试，最后用执行检查与重复解答 rollout 做验证过滤。产出 5,545 个训练任务，来自 3,185 个仓库、23 种语言、15 个技术领域。用 GRPO 在 MiMo-V2.5 上训练后五个基准全涨：DeepSWE +11.7%、ProgramBench +17%、Terminal-Bench v2.1 +8.5%；轨迹分析显示 RL 后的 agent 更多探索代码库、自验证方式更多样。","brief":"只用源码造 RL 任务：agent 先探索写出行为规格，再基于原代码执行结果造测试，最后过滤；5,545 个任务训练后 DeepSWE +11.7%、ProgramBench +17%。","ana":"","hf":87,"topic":"评测工程","first":"2026-09-22","di":"2026-09-22","wi":"2026-09-25","tier":"","tk":"","col":"eval"},{"u":"https://arxiv.org/abs/2609.20886","t":"BI-Agent and BI-Bench: Towards Automating End-to-End Business Intelligence","v":"arXiv","s":"","d":"2026-09-16","k":"paper","star":0,"sum":"从公开来源收集真实 BI 项目、从真实用户看板里人工抽取（问题, 标准答案）对，建成首个系统研究端到端 BI 的基准 BI-Bench；前沿模型在其上准确率不足 50%。BI-Agent 把 BI 工作流拆成结构化数据上的搜索、连接、变换等子任务并编排专门的数据管理方法，配合从真实 BI 项目合成训练轨迹的后训练框架（SFT + RL）。工具增强让原生 LLM 最多提升 40 个百分点，后训练再加最多 30 个百分点。","brief":"","ana":"","hf":12,"topic":"评测工程","first":"2026-09-22","di":"2026-09-22","wi":null,"tier":"","tk":"","col":"eval"},{"u":"https://arxiv.org/abs/2609.22083","t":"MintAct: A Unified Visual Agent for Digital Environments","v":"arXiv","s":"","d":"2026-09-18","k":"paper","star":0,"sum":"2B/4B/8B 三个规模的视觉语言模型族，统一 UI 定位、移动/桌面/网页的多步导航与视觉工具使用，性能追平各领域专用模型。支撑它的是环境与 RL 基础设施：异构后端上托管数百个并发实例同时服务轨迹采集与在线 RL，异步框架显式控制跨域训练分布并在噪声环境反馈与 off-policy 漂移下保持稳定。OSWorld-Verified 48.9，同等规模下 SOTA。","brief":"","ana":"","hf":12,"topic":"推理基础设施与建模","first":"2026-09-22","di":"2026-09-22","wi":null,"tier":"","tk":"","col":"infra"},{"u":"https://openai.com/index/advisory-group-on-mathematics-and-ai","t":"Advisory Group on Mathematics and Artificial Intelligence","v":"OpenAI","s":"openai.com/index","d":"2026-09-21","k":"release","star":0,"sum":"OpenAI 披露：8 月 28 日开始训练的一个内部模型，除已解决 Navier–Stokes 千禧难题外，现已解决数学多数领域 100 多个长期开放问题，进展速度「让 OpenAI 内部的数学家感到意外」。数学界此前发表公开信《A Severe Misalignment of AI in Mathematics》批评「解开放问题」被当成新系统的跑分方式带来的负外部性。作为回应，OpenAI 与数学家共同成立一个独立顾问组（François Charles、Camillo De Lellis、Timothy Gowers、Martin Hairer、Nikhil Srivastava、Ulrike Tillmann、Ravi Vakil、Edward Witten、Melanie Matchett Wood 九人），负责就结果的意义评估、发布协调、学术规范提供建议；该组独立运作、成员不受 OpenAI 报酬、可主动发表未被征询的意见，但明确不负责就 OpenAI 内部数学进展的节奏提供建议","brief":"","ana":"","hf":null,"topic":"Agent 安全与围堵","first":"2026-09-22","di":"2026-09-22","wi":null,"tier":"","tk":"这是「能力披露」与「外部制衡」分离的一个具体样本——顾问组管对外沟通与学术规范，不管内部节奏；判断任何一家厂商的治理承诺时，看的就是这条边界划在哪里。","col":"safety"},{"u":"https://openai.com/index/expanding-openai-academy-with-new-learning-paths","t":"Expanding OpenAI Academy with new learning paths","v":"OpenAI","s":"openai.com/index","d":"2026-09-21","k":"release","star":0,"sum":"OpenAI Academy 新增学习路径，属教育项目扩容公告，无工程内容，仅作记录。","brief":"","ana":"","hf":null,"topic":null,"first":"2026-09-22","di":"2026-09-22","wi":null,"tier":"","tk":"","col":""},{"u":"https://arxiv.org/abs/2609.17010","t":"ThinkFlow: Self-Evolving Probabilistic Latent Memory for Lifelong Conversational Agents","v":"arXiv","s":"","d":"2026-09-15","k":"paper","star":1,"sum":"","brief":"","ana":"自演进这条线上本轮唯一一篇动\"记忆表示\"的。论点分两层：\n\n- **文本记忆有信息瓶颈**。现有做法把对话蒸馏成显式文本条目，细微的行为模式与情绪变化在这一步就丢了——这正是上面 funes 那篇\"写入时不做蒸馏\"想绕开的同一个问题，只不过 funes 的答案是\"不蒸馏、保留原文\"，ThinkFlow 的答案是\"**换个不经过文本的表示**\"。\n\n- **部署后是静态的**。没有人工反馈就无法自行适应用户习惯与偏好——这就是\"记忆系统本身需要自演进\"的定义。\n\n方法借了认知科学的预测编码：人维持的心智模型本来就在潜空间里，靠预测误差持续精炼。ThinkFlow 把对话流**动态压缩成概率性的潜在记忆 skill**，把复杂用户状态自主固结成解耦的连续表示，端到端训练。\n\n**面试用法**：这篇适合用来回答\"memory 除了往外存 markdown 还有别的路吗\"。把它与 Grok Build（写时蒸馏成 markdown）、funes（读时检索原文）、WikiSkill / Memory-Skill Isomorphism（蒸馏成 skill）摆成一张表，就是一份完整的\"agent 记忆表示谱系\"：**原文 → 文本条目 → skill → 潜表示**，越往右检索越便宜、可追溯性越差、越依赖训练。","hf":null,"topic":"自学习 / 自演进","first":"2026-09-21","di":null,"wi":"2026-09-21","tier":"","tk":"","col":"evo"},{"u":"https://github.blog/ai-and-ml/github-copilot/how-we-make-ai-coding-more-cost-efficient-without-sacrificing-task-quality","t":"How we make AI coding more cost efficient without sacrificing task quality","v":"GitHub","s":"GitHub Blog","d":"2026-09-02","k":"article","star":0,"sum":"","brief":"","ana":"降本文章里少见的\"**先讲反例**\"型。开篇就打掉行业里最流行的省钱做法：把每次工具调用的输出截短。他们拿 RTK（Rust Token Killer，一个在 agent 读之前压缩 shell 输出的工具）接进自己的 harness 做基准，结果是——**被省掉的内容一旦重要，模型会重开原始输出或重跑命令**，多出来的回合把更多上下文一路带下去，**单次工具响应更短了，整个任务反而更贵更慢**。结论是一句可以直接背的话：**\"tokens per tool call\" 是错的目标函数，效率必须按\"从用户请求到最终结果\"的整条任务来量。**\n\n然后是四个真做了的改动，每个都带线上数字：\n\n1. **选择性压缩**：分析基准运行后发现 install/build/test/lint 输出多是重复噪声，而源码类与任意命令输出更可能含关键信息。于是定三条策略——`cat`/`git diff`/`git show`/任意脚本**原样返回**；`grep` 类搜索结果**只重组不丢内容**；只在收益显著时压缩重复噪声，且**永远保留取回原文的通道**。早期版本太激进（连 `git diff` 都压），被基准打回。那条取回通道同时是**评估信号**：他们统计 agent 有没有去开原始输出、重跑命令、重复探索——频繁取回就说明压掉了有用的东西。\n\n2. **先删格式，再删信息**：`view` 工具原本给每一行加行号前缀，但现在的编辑工具靠匹配上下文定位、根本不用行号。删掉后离线基准**模型推理成本降约 5%**，线上实验**人均日推理成本降约 3%**，质量与满意度指标无明显退化。这是最理想的一类改动：模型不用学新规则、没有信息需要取回、没有新决策。\n\n3. **压提示词但别压意图**：`task` 工具的指令散落在工具描述、schema、agent 定义、系统指令里，用**元提示循环（让 Copilot 迭代重写自己的提示词）砍掉了约一半**。第一次线上实验就翻车——元提示把\"谨慎并行\"的建议改写成了硬调度策略，导致本可并行的自定义 agent 串行执行。他们停掉实验，**先为这个被用户暴露出来的行为补了一条回归评测**，最终的修法是把显式白名单/黑名单换成一句话：*Independent agents can run in parallel; consider side effects.*（更短、更松、把判断权还给模型）。落地效果：每轮少约 **1,300** 个 `task` 工具提示 token、每会话总提示 token 少约 **1.8%**、每活跃小时归一化成本降 **2.9%**。这一节的结论是本文最该记的一条：**提示词的行为需要测试；没有测试的行为，一次\"压缩\"就能在无人察觉的情况下把它删掉。**\n\n4. **把后台完成结果直接塞进通知**：以前后台 shell 或子 agent 完成时的通知不带结果，agent 还得再花一个回合去取；现在批量投递完成结果，省掉纯取回的那次模型往返。","hf":null,"topic":"Skill、上下文工程与工具","first":"2026-09-21","di":null,"wi":"2026-09-21","tier":"","tk":"","col":"skill"},{"u":"https://github.blog/ai-and-ml/github-copilot/project-hydrafusion-frontier-quality-via-multi-model-orchestration","t":"Project HydraFusion: Frontier quality via multi-model orchestration","v":"GitHub","s":"GitHub Blog","d":"2026-09-04","k":"article","star":0,"sum":"","brief":"","ana":"把\"开发者手工做的模型编排\"搬进运行时：你像选模型一样选 HydraFusion，它按请求自己挑执行模式——**Single**（一个模型直接解）、**Cascade**（高效模型先起草，质量门决定接受还是升级到更强模型）、**Critique**（一个模型起草，**来自不同模型家族的只读评审**审一遍，起草方修订一次）。核心判断是\"选择性\"：绝大多数任务不需要额外的模型调用，只在预期能提升结果时才花。\n\n五条工程原则比三种模式更值得记：**完整成本记账**（起草、评审、修订、升级、重试、兜底每一条腿都计入）、**有界执行**（每条腿有显式超时与取消）、**隔离评审**（评审步骤跑在无工具的隔离上下文里，解题步骤才用共享工作区和正常权限循环）、**失败不落盘**（工作流取消或校验失败时**一个补丁都不应用**）、**路由先验证**（执行前先校验工作流定义、模型绑定、兜底行为与模型可用性）。对外只给开发者一个连贯回复和一份权限感知的变更集，对内记录每条腿的角色、结果、成本、延迟与诊断。\n\n基准结果（三个基准，与 Claude Opus 5 / GPT-5.6 Sol 对比，所有模型统一 medium 推理档）：TerminalBench 2.1 **质量 +4.9 个百分点、成本低 67%**；DeepSWE 质量 −1.5 点、成本低 36%；CheckpointBench（基于真实 Copilot 会话的内部基准）质量 −0.1 点、成本低 65%。注意他们自己标注了这些是特定基准版本、工作流配置、模型池与定价假设下的离线结果。\n\n**面试用法**：这是\"路由/编排\"这条线目前最完整的官方实现描述——被问到\"多模型怎么省钱又不掉质量\"时，答案不是\"用便宜模型\"，而是**级联 + 质量门 + 跨家族只读评审 + 完整成本记账 + 失败不落盘**。","hf":null,"topic":"多智能体","first":"2026-09-21","di":null,"wi":"2026-09-21","tier":"","tk":"","col":"multi"},{"u":"https://huggingface.co/blog/funes","t":"Give Your Coding Agents a Memory You Own","v":"Hugging Face","s":"Hugging Face 官方博客","d":"2026-09-03","k":"article","star":0,"sum":"","brief":"","ana":"与 xAI《Memory in Grok Build》同一条线，但路线相反：**不写笔记，直接把已有的会话轨迹变成可检索的记忆**。作者的观察很准——agent 在排查过程中已经留下了\"不只是改了什么、还有为什么\"的密集记录，但**轨迹只是潜在的记忆**：你没法在一万轮对话里 grep 出\"我们当初为什么不用流式解析器\"，要用起来必须有索引、检索、排序和精确出处。\n\nfunes 是个单二进制，`funes add claude`（或 codex / pi / hermes）一条命令就给 agent 装上 `recall` 与 `get` 两个工具，并自动索引每个完成的回合；索引是增量的。底层是一条确定性流水线：把各家轨迹解析成统一的 turn/block 形状 → 分块 → 本地固定模型嵌入 → 写进本地 Lance 数据集；查询时**向量检索 + BM25 融合排序 → cross-encoder 重排 → 按时间新近度加权 → 附上相邻块**。嵌入与重排都在本机跑，默认不出机器，需要时才同步到你自己的（默认私有）Hugging
