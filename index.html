g?","v":"arXiv","s":"Kirill Brilliantov 等 3 人","d":"2026-09-30","k":"paper","star":0,"sum":"同一前沿模型、同等时间预算下，开源 SOTA 的 MLE agent harness（多 agent 编排、检索子 agent 等）相对只有 read / write / bash 的极简 coding agent 单会话没有优势；大规模消融显示这些机制层在 coding agent 设置下是冗余的","brief":"同一前沿模型、同等时间预算下，开源 SOTA 的 MLE agent harness（多 agent 编排、检索子 agent 等）相对只有 read / write / bash 的极简 coding agent 单会话没有优势；大规模消融显示这些机制层在 coding agent 设置下是冗余的","ana":"","hf":null,"topic":"Harness 与长时程 Agent","first":"2026-10-02","di":"2026-10-02","wi":"2026-10-02","tier":"","tk":"给强模型加机制前先跑极简基线。","col":"harness"},{"u":"https://arxiv.org/abs/2609.38812","t":"Can Terminal Agents Trust Their Own Verification? Diagnosing and Improving Self-Verification","v":"arXiv","s":"Yingfeng Luo 等 10 人","d":"2026-09-29","k":"paper","star":0,"sum":"诊断十个终端 agent 在 TerminalBench 2.1 上的自我验证：形成完整候选解后几乎都会去验证，但错误候选只有 61.43% 被发现，发现后只有 49.36% 被修好。让学生先出候选、再蒸馏强教师的验证与修复行为（SCVD），三个 Qwen3.5 骨干的 Pass@1 提高 9.74–16.85 个百分点。","brief":"诊断十个终端 agent 在 TerminalBench 2.1 上的自我验证：形成完整候选解后几乎都会去验证，但错误候选只有 61.43% 被发现，发现后只有 49.36% 被修好。让学生先出候选、再蒸馏强教师的验证与修复行为（SCVD），三个 Qwen3.5 骨干的 Pass@1 提高 9.74–16.85 个百分点。","ana":"","hf":null,"topic":"评测工程","first":"2026-10-02","di":"2026-10-02","wi":"2026-10-02","tier":"","tk":"","col":"eval"},{"u":"https://arxiv.org/abs/2609.38983","t":"Approval Laundering: Systematizing Approval--Execution Binding Failures in AI Coding-Agent Harnesses","v":"arXiv","s":"Yang Wang","d":"2026-09-30","k":"paper","star":0,"sum":"研究 coding agent harness（Claude Code、Codex CLI、Cursor）里「人批准的动作」与「实际执行的动作」不一致的六类失效：范围、参数、时间、工具、委托、语义。在 Claude Code 的 PreToolUse 处插桩做受控重复实验（每类 19–20 次）；原型 Approval Token 把主体、会话、工具、参数、范围、有效期做成带密钥的凭证，消除了委托类和会话身份不匹配的时间类，对范围类和参数类无效。","brief":"研究 coding agent harness（Claude Code、Codex CLI、Cursor）里「人批准的动作」与「实际执行的动作」不一致的六类失效：范围、参数、时间、工具、委托、语义。在 Claude Code 的 PreToolUse 处插桩做受控重复实验（每类 19–20 次）；原型 Approval Token 把主体、会话、工具、参数、范围、有效期做成带密钥的凭证，消除了委托类和会话身份不匹配的时间类，对范围类和参数类无效。","ana":"","hf":null,"topic":"Agent 安全与围堵","first":"2026-10-02","di":"2026-10-02","wi":"2026-10-02","tier":"","tk":"","col":"safety"},{"u":"https://arxiv.org/abs/2609.39037","t":"Hard-Gate Candidacy in a Deployed Validator Suite","v":"arXiv","s":"Xin Xu","d":"2026-09-30","k":"paper","star":0,"sum":"在一个已部署的生成式 agent 上检验 13 个校验器能否升级为硬闸门（550 个运行时构建、350 个静态构建，按下游结果标注）：只有 2 个通过多重比较校正，9 个与零无差别，其中 3 个从未触发。被跳过的检查记为通过：895 个坏构建里有 144 个探测被跳过，972 个正常构建里只有 1 个，因此依赖运行产物的检查最多能发现约 84% 的坏构建","brief":"在一个已部署的生成式 agent 上检验 13 个校验器能否升级为硬闸门（550 个运行时构建、350 个静态构建，按下游结果标注）：只有 2 个通过多重比较校正，9 个与零无差别，其中 3 个从未触发。被跳过的检查记为通过：895 个坏构建里有 144 个探测被跳过，972 个正常构建里只有 1 个，因此依赖运行产物的检查最多能发现约 84% 的坏构建","ana":"","hf":null,"topic":"评测工程","first":"2026-10-02","di":"2026-10-02","wi":"2026-10-02","tier":"","tk":"评测记录要区分「跑了且通过」和「没跑」。","col":"eval"},{"u":"https://arxiv.org/abs/2610.00917","t":"Finding the Right Fit: Model-Harness Interactions across Agent Tasks","v":"arXiv","s":"Yixuan Li 等 9 人","d":"2026-09-30","k":"paper","star":0,"sum":"66 种配置（4 个可配置 harness × 5 个模型，加 Codex 配 GPT、Claude Code 配 Claude）在 TUA-Bench、ALE-CLI、Terminal-Bench 4 上对比。模型排名随 harness 反转：Terminal-Bench 4 上 Claude 在 OpenHands 领先 GPT 7.94 分，在 PI 落后 30.16 分；厂商自家 harness 未必最佳，花钱更多不保证分更高。公开 6,204 条打分轨迹","brief":"66 种配置的系统对比：4 个可配置 harness（OpenHands、DeepSeek Harness、PI、openJiuwen）× 5 个模型，外加原生的 Codex 配 GPT 和 Claude Code 配 Claude，在 TUA-Bench、ALE-CLI、Terminal-Bench 4 上评测。**模型排名随 harness 反转**：Terminal-Bench 4 上 Claude 在 OpenHands 里领先 GPT 7.94 分，在 PI 里落后 30.16 分。五个模型里有四个，最佳 harness 随基准而变。**厂商自家的 harness 不一定是自家模型的最佳搭配，花钱更多也不保证分更高**（GPT 在 PI 下的得分高于在 DeepSeek Harness 下，单任务成本不到四分之一）。轨迹对比给出的解释：修复几乎都是模型自己做的，所以关键在 harness 把失败以什么形式交还给模型。公开了 6,204 条打分轨迹。","ana":"","hf":null,"topic":"Harness 与长时程 Agent","first":"2026-10-02","di":"2026-10-03","wi":"2026-10-02","tier":"","tk":"选型时把 harness 当变量一起扫，关键在 harness 以什么形式把失败交还模型。","col":"harness"},{"u":"https://arxiv.org/abs/2610.00972","t":"VeriHarness: Scaling Agentic Verification for Long-Horizon Tasks","v":"arXiv","s":"Caiqi Zhang 等 7 人","d":"2026-09-30","k":"paper","star":0,"sum":"固定基座、测试时无参考答案时怎么加强验证。观察：多次采样间的分歧常暴露正确替代方案，一致反而可能掩盖错误。给验证器工作区、取证工具和可复用验证 skill：分歧消解器拿竞争说法对照环境证据，共识挑战者专门质疑一致的说法。五个长时程基准上带证据的修订比单次 rollout 平均高 6.2 分（Gemini 3.5 Flash）和 6.4 分（Claude Opus 4.8）；公开约 26,000 条 rollout","brief":"固定基座模型、测试时没有参考答案或评分标准，怎么加强验证。一个观察：**多次采样之间的分歧常常暴露出正确的替代方案，而一致可能掩盖错误**。VeriHarness 给验证器一个工作区、取证工具和可复用的验证 skill：分歧消解器拿相互竞争的说法去对照环境证据，共识挑战者专门质疑大家都同意的说法并找遗漏的需求。五个长时程工作区基准上，带证据的修订比单次 rollout 平均高 6.2 分（Gemini 3.5 Flash）和 6.4 分（Claude Opus 4.8）；验证 skill 还能从失败反馈里自改进。公开约 26,000 条 rollout。","ana":"","hf":null,"topic":"评测工程","first":"2026-10-02","di":"2026-10-03","wi":"2026-10-02","tier":"","tk":"验证器要专门处理「大家都同意」的答案。","col":"eval"},{"u":"https://arxiv.org/abs/2610.01618","t":"Agents Are Systems, Not Models: Rethinking Agentic Evaluation","v":"arXiv","s":"Luis Wiedmann 等 4 人","d":"2026-10-01","k":"paper","star":0,"sum":"四个科学任务上系统改 agent 五项配置（任务信息、推理、自我验证、时间预算、骨干）。约 54% 的结果方差来自同一配置的重复运行；给 agent 的信息影响最大；prompt 里要求「验证你的答案」几乎不改变行为，给专用验证工具才明显改变。公开 18,000 多条轨迹","brief":"在四个科学任务上系统地改 agent 的五项配置：给的任务信息、推理、自我验证、时间预算、骨干模型。**约 54% 的结果方差来自同一配置的重复运行**，而不是配置变化。各配置里，给 agent 的信息影响最大，超过时间预算和模型规模，还同时降低成本、改善校准。**在 prompt 里要求\"验证你的答案\"几乎不改变它的验证行为，给一个专用的验证工具则明显改变**。公开 18,000 多条轨迹","ana":"","hf":null,"topic":"评测工程","first":"2026-10-02","di":"2026-10-03","wi":"2026-10-02","tier":"","tk":"想要某种行为就做进系统（给工具），别只在提示里要求；评测必须报告重复次数。","col":"eval"},{"u":"https://arxiv.org/abs/2610.01306","t":"DAYJOB: A Benchmark for Long-Horizon Professional Work","v":"arXiv","s":"Stephanie Finley 等 15 人","d":"2026-10-01","k":"paper","star":0,"sum":"130 个由医疗（50）和金融（80）从业者构建的任务，专业人员平均要 13.6 和 16.6 小时，每题一份专家二元 rubric（中位 47.5 和 57.5 条）全满足才算过。30 个模型配置里最强的 Claude Opus 5.5 通过 24.7%（医疗）和 23.9%（金融），中位配置只有 0.6% 和 2.5%；典型失败是接受了与记录矛盾的前提。","brief":"130 个由医疗（50 个）和金融（80 个）从业者构建的任务，估计专业人员平均要 13.6 和 16.6 小时。每题一份专家写的二元标准 rubric（中位数 47.5 和 57.5 条），**全部满足才算通过**。13 家开发者的 30 个模型配置里，最强的 Claude Opus 5.5 通过 24.7%（医疗）和 23.9%（金融），中位配置只有 0.6% 和 2.5%。典型失败：接受了与记录相矛盾的前提，把错误的输入带进一套看起来自洽的分析。","ana":"","hf":null,"topic":"评测工程","first":"2026-10-02","di":"2026-10-03","wi":"2026-10-02","tier":"","tk":"","col":"eval"},{"u":"https://arxiv.org/abs/2610.00890","t":"Cross-Benchmark Transfer from RL on Agentic Coding Tasks","v":"arXiv","s":"Sushant Mehta 等 3 人","d":"2026-09-30","k":"paper","star":0,"sum":"只用 RL 在 1,700 个专家构建任务上后训练 Kimi K2.7 Code，奖励是通过的目标检查比例，任何「原本通过的测试」失败就归零。rank-32 LoRA 一个 epoch，六个外部基准、三种 harness 上 pass@1 全部提升（SWE-Bench Pro 60.1 → 64.8，DeepSWE 31.0 → 43.4，SWE-Marathon 5.0 → 25.0），训练数据收集后才发布的任务集上仍显著","brief":"coding agent 常败在最后一段：漏掉一条需求、只测自己实现能处理的情况、弄坏本该保持不变的行为。作者只用 RL 在 1,700 个专家构建的任务上后训练 Kimi K2.7 Code（1,000 个仓库任务加 700 个终端任务；奖励是通过的目标检查比例，**任何一个\"原本通过的测试\"失败就归零**）。rank-32 LoRA 训一个 epoch，六个外部基准、三种 harness 上 pass@1 全部提升：SWE-Bench Pro 60.1 → 64.8，DeepSWE 31.0 → 43.4，SWE-Marathon 5.0 → 25.0。在训练数据收集之后才发布的三个任务集上提升仍显著（p = 0.004），在训练中没用过的两种 harness 下也有提升。","ana":"","hf":null,"topic":"推理基础设施与建模","first":"2026-10-02","di":"2026-10-03","wi":"2026-10-02","tier":"","tk":"「弄坏原有行为即零分」的奖励设计直接对应 coding agent 最后一段的常见失败。","col":"infra"},{"u":"https://arxiv.org/abs/2610.01415","t":"Beyond Memory: Harnessing Long-Horizon Agents with Explicit Belief States","v":"HF 组织 alibaba","s":"","d":"2026-10-01","k":"paper","star":0,"sum":"把交互历史整理成记忆不保证 agent 对「当前世界」有一致理解。PoS 在推理时构造并维护显式信念状态（当前世界状态估计 + 尚未解决的任务需求），校验一致性、监控进展以发现「信念陷阱」（一直行动但没有实质进展），再按陷阱类型恢复。四个基准、三个骨干上总体最高","brief":"把交互历史整理成记忆，并不保证 agent 对\"当前世界是什么样\"有一致的理解。PoS 在推理时构造并持续维护显式的信念状态作为决策上下文，每个信念包含对当前世界状态的估计和**尚未解决的任务需求**。它校验信念的一致性，并监控任务进展以发现\"信念陷阱\"（agent 一直在行动，但没有朝目标取得实质进展），再按陷阱类型和未解决需求的类型做恢复。四个基准、三个骨干上总体表现最高。","ana":"","hf":69,"topic":"Harness 与长时程 Agent","first":"2026-10-02","di":"2026-10-03","wi":"2026-10-02","tier":"","tk":"长程 agent 的上下文里单独维护「未解决需求」清单。","col":"harness"},{"u":"https://arxiv.org/abs/2609.38912","t":"Composing Task-specific Agent Harnesses at Test Time with Reusable Primitives","v":"arXiv","s":"Peng Kuang 等 7 人","d":"2026-09-29","k":"paper","star":0,"sum":"从失败轨迹里挖出可复用的 Harness Primitives（带适用范围和组合契约），测试时按任务信息挑选并编译成任务专用 harness，不现场生成机制代码。成功率比固定 harness 最多高 12 分并超过 Codex CLI；组合开销仅 2.7%，比从零生成任务专用 harness 高效 638 倍。","brief":"","ana":"","hf":null,"topic":"Harness 与长时程 Agent","first":"2026-10-02","di":"2026-10-02","wi":null,"tier":"","tk":"","col":"harness"},{"u":"https://arxiv.org/abs/2609.40118","t":"Persistent Context Graphs for Efficient Memory Compaction in LLM Agents","v":"arXiv","s":"Jingbo Yang 等 9 人","d":"2026-09-30","k":"paper","star":0,"sum":"ReCAP 把由注意力得出的消息重要度和依赖关系存进轻量持久图；新请求到来时结合其相关性沿依赖边挑选消息，选择过程不再调用模型。相对 Codex 默认的摘要式压缩，压缩与冷恢复的估计延迟降约 95%；SWE-Together 上每次调用的历史上下文约减半、任务质量相当。","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-02","di":"2026-10-02","wi":null,"tier":"","tk":"","col":"evo"},{"u":"https://arxiv.org/abs/2609.39765","t":"MemCodex: Self-Programming Hierarchical Memory for Language Agents","v":"Xiaoqiang Wang、Bang Liu","s":"","d":"2026-09-30","k":"paper","star":0,"sum":"把经验组织成可执行的记忆程序（摘要、关系知识、可复用技能、潜在记忆四层），由开放式程序演化改写各层的构建、索引、检索与路由；查询时从粗到细逐层读取，证据够了就停。比最强自适应记忆基线任务成功率相对高 10.1%，上下文 token 少 3.4 倍，推理快 2.1 倍。","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-02","di":"2026-10-02","wi":null,"tier":"","tk":"","col":"evo"},{"u":"https://arxiv.org/abs/2609.38822","t":"SkillSeek: Revisiting Agent Skill Retrieval at Marketplace Scale","v":"arXiv","s":"Guanqun Yang 等 4 人","d":"2026-09-29","k":"paper","star":0,"sum":"开源聚合的 Agent Skills 已超过 23 万个，选 skill 成为瓶颈。标准 IR 两段式（BGE-base 双编码器加小型交叉编码器，经 MCP 暴露）在 89 个任务的 SkillsBench 上与 LLM 介入的检索循环持平，纯 BM25 在四个设置中的三个不低于后者；每次试验花费从 $51.30 降到 $27.54","brief":"","ana":"","hf":null,"topic":"评测工程","first":"2026-10-02","di":"2026-10-02","wi":null,"tier":"","tk":"skill 检索先上 BM25 加重排，别默认让 LLM 在循环里选。","col":"eval"},{"u":"https://arxiv.org/abs/2609.38345","t":"OpenCollab: A Multi-Agent Coding Framework with Programmable Collaboration and Controllable Runtime","v":"arXiv","s":"Chun-Wah Hsu 等 15 人","d":"2026-09-29","k":"paper","star":0,"sum":"多 agent 编码框架，统一组织设计、共享运行时并用细粒度事件流追踪执行，定义 Adherence 衡量声明的组织方式是否被真正执行：只改一个配置维度，Adherence 就在 47.2% 到 97.2% 之间变化。作者称其双 coder 工作流在 agentic coding 基准上超过 Mini-SWE-agent、Codex CLI 和 Claude Code。","brief":"","ana":"","hf":null,"topic":"Harness 与长时程 Agent","first":"2026-10-02","di":"2026-10-02","wi":null,"tier":"","tk":"","col":"harness"},{"u":"https://arxiv.org/abs/2609.38445","t":"AIM: Agentic Idea Management for Automated Research","v":"HF 组织 Google","s":"","d":"2026-09-29","k":"paper","star":0,"sum":"面向自动化科研的想法管理：借鉴贝叶斯优化，用 agentic 的代理模型与采集机制组织并挑选研究想法，Solution Auditor 保持想法与实现一致，Resource Planner 在并行分支间分配剩余实验预算。AutoLab 10 个任务上，系统优化类比最强基线高 1.6 个百分点，长程模型开发与 CUDA 类高 4.9 个百分点，达到基线最好成绩最多快 3.1 倍。","brief":"","ana":"","hf":40,"topic":"推理基础设施与建模","first":"2026-10-02","di":"2026-10-02","wi":null,"tier":"","tk":"","col":"infra"},{"u":"https://claude.com/blog/claude-code-mods","t":"Customize Claude Code with mods","v":"Anthropic","s":"claude.com/blog · Product announcements","d":"2026-10-01","k":"release","star":0,"sum":"mods 是挂在 Claude Code 事件上的 TypeScript 函数，可在事件之前、之后运行，或替换、包裹事件：改写送给模型的 prompt，拦截、改写或重试工具调用，批准或拒绝权限请求，在 Claude 读到之前给工具输出脱敏，还能改界面。随插件分发，CLI 和桌面应用可用；内置的 `/diff` 已改成 mod，可关闭或替换。mod 不沙箱，权限等同 Claude Code。Team / Enterprise 和有受管设置的机器上，内置的 `sec-default` 最先加载，阻止用户 mod 覆盖权限拒绝规则","brief":"","ana":"","hf":null,"topic":"Skill、上下文工程与工具","first":"2026-10-02","di":"2026-10-02","wi":null,"tier":"","tk":"多个 mod 挂同一事件时按加载顺序执行，最先加载的最先看到事件、最后看到结果，审计类 mod 要排在最前。","col":"skill"},{"u":"https://www.anthropic.com/news/barclays-scales-claude","t":"Barclays scales Claude to upgrade operations and improve client experience","v":"Anthropic","s":"/news · Announcements","d":"2026-10-01","k":"release","star":0,"sum":"Barclays 扩大与 Anthropic 的合作：预计 2026 年底 Claude Code 覆盖 50% 的开发者，2027 年覆盖多数软件工程师。已上线的两个用例：2025 年起运行的 Colleague Knowledge Assistant（RAG 架构）有 16,000 多名员工使用、处理过 100 多万次检索；Global Markets 用 Claude 对来信做分类、补全信息并决定处理路径，每天约 12 万封。这是一组受监管行业里 RAG 与分类路由的规模参考。","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-02","di":"2026-10-02","wi":null,"tier":"","tk":"","col":"evo"},{"u":"https://claude.com/blog/how-anthropics-sales-team-rebuilt-inbound-with-claude-managed-agents","t":"How Anthropic's sales team rebuilt inbound with Claude Managed Agents","v":"Anthropic","s":"claude.com/blog · Claude Platform / Sales","d":"2026-09-30","k":"article","star":0,"sum":"**整体概括**：Anthropic 每月有数万条销售咨询，BDR 团队跟不上，于是在 Claude Managed Agents（beta）上做了一个 buying agent，挂在 Contact Sales 页、定价页、产品内和邮件里，用户自选与 agent 还是销售对话。结构很简单：一段 prompt、几个工具、一个知识库；每次对话以三种方式结束——直接结账、带完整对话转人工、只回答问题。一名工程师几周做出首版，销售和内容负责人直接在 Console 里改系统提示，改动先到 staging agent；内测一周到 v7，上线后每周发 prompt 变更，可把新会话指回旧版本。结果：每天数千次对话，转人工的线索成为商机的比例是旧表单的两倍以上，成交快约 5 天；需要人工收尾的对话占比下降约一半。五条经验：给目标不给规则、prompt 越短越好、领域专家进开发循环、按对客户合适的方案推荐（常推 Team 而非 Enterprise）、把每次转人工当反馈","brief":"","ana":"**这篇解决什么问题**：每月几万条销售咨询，BDR 团队接不过来，大量时间花在回答文档里已有的问题上。Anthropic 做了一个 buying agent，放在 Contact Sales 页、定价页、产品内和邮件里，由客户自己选择和 agent 聊还是找销售。\n\n**结果**：每天数千次对话；从 agent 转给销售的线索成为商机的比例是旧表单的**两倍以上**，成交快约 5 天；需要人介入才能成交的对话占比降了约一半。\n\n**架构很简单**：一个 prompt、几个工具、Claude，跑在 Claude Managed Agents 上。每次对话有三种结局：直接下单；大单或复杂单带着完整对话转给销售；回答完问题就结束。一名工程师几周做出初版。\n\n**五条经验**：\n\n1. **给目标，不给规则**。\"你的目标是理解客户需求、判断资质、推荐最合适的方案\"比把每条资质要求画成流程图更有效。\n\n2. **少即是多**。试过不同长度和结构的 prompt，短的最好；要做的是把模型需要的知识给它（按席位计价包含什么、账单周期怎么算）。\n\n3. **领域专家进开发循环**。工程师拥有代码，但销售和内容负责人**直接在 Console 里审和改系统提示**；改动先到 staging agent，任何人都能先试。\n\n4. **推荐对客户合适的，不追加销售**。agent 经常把小团队指向 Team 而不是 Enterprise。\n\n5. **每次升级到人都当作反馈**。agent 转人工时会写明原因。早期多数原因是\"客户在自助产品里还做不了这件事\"，这些原因反过来驱动了产品改进。\n\n**版本化**：每次改动存成一个版本，内测一周就到了 v7，上线后每周发 prompt 改动，必要时把新会话指回旧版本。\n\n**对 AI 应用工程师的启示**：一个朴素但完整的生产 agent 案例。可抄的做法：**prompt 的编辑权交给领域专家 + staging 环境 + 版本回退**；把\"转人工的原因\"结构化记录下来当产品待办；评估指标用业务结果（商机转化率、成交周期），不用对话满意度。","hf":null,"topic":"Skill、上下文工程与工具","first":"2026-10-01","di":"2026-10-01","wi":"2026-10-02","tier":"note","tk":"让 agent 在每次转人工时写明原因，把这些原因当作自助能力缺口的待办清单。","col":"skill"},{"u":"https://openai.com/index/disrupting-a-coordinated-model-distillation-campaign","t":"Disrupting a coordinated model-distillation campaign","v":"OpenAI","s":"openai.com/index · Security","d":"2026-09-30","k":"article","star":0,"sum":"**整体概括**：OpenAI 披露一起针对模型受保护推理的对抗性蒸馏行动。攻击者没有攻破加密或数据库，而是操纵模型交互，让隐藏推理以请求者可见的形式被复现，手法之一是把一个会话的加密推理复制到另一个会话让模型解密转写；独立研究者（arXiv 2608.09867）另外负责任披露了跨模型与会话压缩相关的同类漏洞，OpenAI 确认属实。时间线：7 月 1 日起低量活动，7 月 24–25 日出现 16,000 次请求、4,000 多个用户的峰值，关联集群超过 15,000 个用户，7 月 28 日全部处置。归因：核心集群归于与 Moonshot AI（Kimi 开发方）有关联的人员，但不确定所有操作者是否同一方。处置：封禁账号、加强注册与基础设施控制；在用户、工作区、组织、模型族之间加强隐藏推理保护，关闭「持有他人加密推理即可重放还原」的路径，对可能泄露推理的流式输出加检测并暂扣；经 Frontier Model Forum 与政府渠道共享。未完成项：伙伴托管部署需同等保护，工具输出类攻击需要检查可见文本以外的内容","brief":"","ana":"**这篇解决什么问题**：OpenAI 披露并处置了一起有组织地**提取模型受保护推理**的行动，用途与对抗性蒸馏一致（用一个模型的输出或推理去训练另一个模型）。篇幅不长，但对\"推理内容怎么保护\"有工程价值。\n\n**手法**：攻击者没有攻破加密、没有入侵数据库，而是操纵模型交互，让隐藏的推理以请求者看得见的形式被复现。文中点名的一种做法：**把一个会话里的加密推理复制出来，在另一个会话里让模型解密并转写**。独立安全研究者还通过负责任披露报告了相关的跨模型和会话压缩（compaction）漏洞，OpenAI 确认属实。\n\n**规模与时间线**：07-01 起低量出现；07-24 和 07-25 出现高峰，16,000 次请求、4,000 多个用户；进一步调查关联出 15,000 多个用户的集群，07-28 全部处置。\n\n**归因**：不确定是否全部出自同一行动者，但 OpenAI 把**核心集群归因于与 Moonshot AI（Kimi 开发方）有关联的人员**。\n\n**修复**：封禁账号、加强注册与基础设施控制；加强隐藏推理在用户、工作区、组织、模型家族之间的隔离；**堵住\"已持有他人加密推理的人可以重放并恢复其内容\"的路径**；对可能暴露推理的流式输出加检测和拦截。文中还提醒：**支持可携带或可重放推理产物的系统都可能有同类风险**，合作方托管的部署需要同样的保护，工具输出类攻击需要检查的不只是可见文本。信息已通过 Frontier Model Forum 分享。\n\n**对 AI 应用工程师的启示**：如果你的系统会在轮次之间回传\"加密的推理块\"（很多 agent API 现在都这样做以保持思考连续性），要知道**这些块是有归属的**：不要跨用户、跨会话混用；自己做上下文压缩或会话迁移时，别把别处来的推理块原样塞进新会话。Sonnet 5.5 新增的 `reasoning_extraction` 拒绝类别是同一威胁的防守侧。","hf":null,"topic":"Agent 安全与围堵","first":"2026-10-01","di":"2026-10-01","wi":"2026-10-02","tier":"must","tk":"凡是「可携带、可重放」的推理产物（加密 reasoning item、压缩摘要）都要绑定到产生它的用户 / 组织 / 模型族，跨边界一律拒绝解码。","col":"safety"},{"u":"https://developer.nvidia.com/blog/tracing-agent-harness-behavior-with-nvidia-nemo-relay","t":"Tracing Agent Harness Behavior with NVIDIA NeMo Relay","v":"NVIDIA","s":"NVIDIA 开发者博客 · Agentic AI / Build AI Agents","d":"2026-09-30","k":"article","star":0,"sum":"**整体概括**：教程用 Hermes Agent 内置的 NeMo Relay 记录会话、轮次、模型调用、工具调用的生命周期事件，输出三种轨迹：ATOF（JSONL 事件流，用于审计单个事件与父子关系）、ATIF（逐步轨迹，用于评审路径）、OpenTelemetry + OpenInference（进 Phoenix、LangSmith 等）。文中强调 ATIF 里的工具请求不等于执行结果，要到 ATOF 里配对开始 / 结束事件确认。评估 harness 改动的流程：固定任务与自动化成功检查，只改一处，模型快照、预算、超时全部不变，两臂等次数重复，先比验证结果再看轨迹。Hermes ToolPerf 案例（Nous Research 从生产会话挖出九类失败模式）：9 个任务 × 3 次 × 2 个模型 × 2 臂共 108 次；Claude Sonnet 4.5 从 24/27 变为 23/27，无实质变化；Qwen3 Coder 30B 从 19/27 升到 22/27，但平均 LLM 调用 3.8 → 4.9、工具结果数据 16 KB → 33 KB、耗时 27 秒 → 42 秒；其中被拦截命令任务 33% → 100%，大小写不敏感搜索任务反而从 3.3 轮退化到 9.3 轮","brief":"","ana":"**这篇解决什么问题**：agent 做对了任务，路径仍可能很浪费：一次搜索失败触发又一次搜索，一次被截断的文件读取引出一条重新取同样内容的命令。只看最终是否成功，解释不了它为什么从工具错误里恢复过来、为什么多调了几次模型。这篇教程用 Hermes Agent 内置的 NeMo Relay 记录轨迹，并演示**怎么用轨迹证据验收一次 harness 改动**。\n\n**三种轨迹格式，各有用途**：\n\n格式｜内容｜用在哪\n\nATOF｜JSONL 事件流：scope 开始、结束、时间点标记，带 ID 和时间戳｜调试或审计单个事件、时序、父子关系\n\nATIF｜按步骤的 JSON：交互、工具调用、观察｜逐步回看或评估 agent 的路径\n\nOpenTelemetry + OpenInference｜父子 span，标注 agent / LLM / 工具｜放进 Phoenix 等 OTEL 工具看调用、耗时、token、错误\n\n一个容易忽略的点：**ATIF 里的工具请求只说明模型\"要求\"跑什么，不能证明结果**。要确认发生了什么，得去 ATOF 里找对应的开始和结束事件以及记录的错误。\n\n**评估 harness 改动的六步**：①选一个有**精确、自动化成功判定**的固定任务；②定基线和**一个**聚焦的改动；③其余全部不变（模型快照、provider、输入、执行预算、超时）；④基线和候选跑**相同次数**；⑤**先比经过验证的任务结果**，再用轨迹看模型调用、工具调用、重试、错误、耗时、token；⑥推广结论前，在改动要支持的模型和负载上都重复一遍。只有任务完成率可重复地上升，或完成率不变而你想改的那个指标变好，才能叫改进。\"某一次跑得更快\"不算。\n\n**案例：Hermes ToolPerf（108 次 A/B）**。Nous Research 从生产会话里挖出九类失败模式做成确定性用例，再评估一批工具层修复。9 个任务 × 每臂 3 次 × 2 个模型：\n\n模型｜臂｜任务成功｜平均 LLM 调用｜平均工具调用｜平均工具结果数据｜平均耗时\n\nClaude Sonnet 4.5｜基线｜24/27｜2.9｜2.2｜17 KB｜16 秒\n\nClaude Sonnet 4.5｜修复后｜23/27｜2.8｜2.1｜17 KB｜22 秒\n\nQwen3 Coder 30B｜基线｜19/27｜3.8｜2.8｜16 KB｜27 秒\n\nQwen3 Coder 30B｜修复后｜22/27｜4.9｜3.9｜33 KB｜42 秒\n\n读法：**强模型没有实质变化**（差一次运行）；弱模型多做成 3 个任务，但更慢、更啰嗦。轨迹解释了原因：在\"命令被拦\"任务上，基线的 Qwen 撞上解析器拦截就放弃（33%），修复后加的恢复指引让它做到 100%，**多出来的轮次是恢复，不是乱撞**。同时有一个任务变差了：大小写不敏感搜索返回零匹配的探测输出，让 Qwen 在三次里有两次多做了探索性搜索，从 3.3 轮涨到 9.3 轮。\n\n**对 AI 应用工程师的启示**：这篇把\"harness 改动要怎么验收\"写成了可照做的流程，而且示范了一个反直觉但常见的结果：**同一批修复对强模型无效、对弱模型有效但有代价**。两条可以直接用：①别把\"调用次数变少\"当成改进的证据，先看验证过的完成率；②为多个模型维护 harness 时，每个改动要分模型看，一个模型的收益可能是另一个模型的无操作甚至回归。","hf":null,"topic":"评测工程","first":"2026-10-01","di":"2026-10-01","wi":"2026-10-02","tier":"must","tk":"判定标准写成一句话——只有通过率可重复地上升，或通过率不变而目标指标（可靠性、延迟、成本）改善，才叫改进；单次更快或调用更少只能用来解释结果。","col":"eval"},{"u":"https://www.anthropic.com/research/what-work-can-robots-do","t":"What work can robots do?","v":"Anthropic","s":"/research · Economics","d":"2026-09-30","k":"article","star":0,"sum":"**整体概括**：提出机器人岗位暴露度指数。方法：以 O*NET 约 900 个职业、约 19,000 条任务为底，先让 Claude 按量表筛出体力任务，再让 Claude 为每条任务生成带时间占比的具体做法示例，用网页搜索找已部署、在售或已演示的机器人并直接引用来源，按环境结构化程度打四档（E0 做不了、E1 专用机器人环境、E2 结构化人类工作场所、E3 非结构化环境），按工时加权多数决定档位。结论：现有机器人能做美国 74% 的体力任务，占工时 34%，多数限于受控环境；机器人与 LLM 合计暴露约 80% 的工时；但机器人只在 0.3% 的任务上比人工便宜，按历史降价趋势要 40 年才到 10%。用 1977 年至今的数据回测，暴露度高的职业此后工资和就业下降更多","brief":"","ana":"","hf":null,"topic":null,"first":"2026-10-01","di":"2026-10-01","wi":null,"tier":"","tk":"大规模 LLM 标注的做法——先把抽象条目展开成带权重的具体示例再打分，强制引用来源，并用历史回测验证量表。","col":""},{"u":"https://arxiv.org/abs/2609.36323","t":"Towards an AI Software Factory for Data Systems","v":"Microsoft","s":"摘要自述部署方","d":"2026-09-28","k":"paper","star":0,"sum":"指出 AI 编码工具只加速编码，对整个 SDLC 影响有限（Amdahl 定律）。AI Software Factory 覆盖定目标、编码、评审、运维四段，产生的元数据用于微调权重和更新 World Model 数据底座，形成自改进。面向有可度量目标的演化式编码任务，报告在 Microsoft 数十个仓库部署，工程效率比 agentic coding 高 3 倍，token 效率最高 22 倍。全文 6 页","brief":"","ana":"**问题**：AI 编码工具让写代码快了很多，但对整个软件开发生命周期（SDLC）影响有限，这是 Amdahl 定律效应：编码只是其中一段。这篇是微软数据系统团队的愿景加进展报告，目标是把**定目标、编码、评审、运维**四段都自动化，并让流水线产生的数据反过来改进它自己。全文只有 6 页，细节有限，价值在于生产数据。\n\n**范围收得很窄，这是关键**：只做数据系统上的\"**演化式编码任务**\"（ECT），也就是**能定义一个可自动测量的目标**的编码问题（比如查询延迟）。数据系统有稳定的公共 API 和清晰的语义，优化目标历史悠久，所以能靠遥测和自动反馈把更多环节自动化。\n\n**四个组件**：\n\n- **World Model**：一个知识库，记录系统结构与依赖、业务上下文，以及这些概念怎么落到可观测的遥测上。对遥测和 profiling 的访问都经过它。\n\n- **Hotspan（定目标 agent）**：给定仓库、高层目标和 World Model，它先把\"让服务更快\"这种模糊目标变成具体指标和约束，再从三个渠道取证列出候选优化点：遥测（最贵的区域，沿调用图传播）、代码分析（文本搜索找不到的语义和控制流 / 数据流查询）、代码评审历史（PR、issue、反模式）。它还负责**构造评测改动的基准**，并按\"每 token 花费带来的指标提升\"排序。\n\n- **Darwin（演化式 agent 群）**：现有做法各有一半。agentic 编码工具会局部自我纠正，但不在更大的解空间里探索；LLM 进化搜索（如 OpenEvolve）有全局监督，但每次变异是一次性生成，没有局部纠错。Darwin 把两者合起来：**每一次\"变异\"是一个完整的 agent 会话**，在隔离沙箱里克隆仓库、拿到一个优化假设、改代码、跑测试和基准、看失败、调试、迭代，最后**反思并输出结构化的假设**（什么有效、下一步试什么）。几十到几百个这样的 agent 组成群，爬一个仓库级代码库上的目标。作者把这称为**持续优化（CO）**，与 CI/CD 并列，可以用闲时算力无人值守地跑。\n\n- **AutoSRE**：把历史事故调查提炼成\"事故调查图\"，用于自动化检测、分诊和处置。\n\n**两条自演进回路**：\n\n1. **演化 World Model**。用户输入和 AI 的反思都先过一个\"清算所\"：按范围、敏感度、成熟度**分层并物理隔离**；个人上下文要**明确同意且被反复观察到**才能晋升到更高层；更新以类似预写日志的条目提交，经历\"已提交 → 批准 / 拒绝 / 需修改 → 已处理\"的生命周期，带序号，**可时间回溯和回滚**（所有物化视图都从事实源派生，回滚就是把日志重放到指定位置）。AutoSRE 的调查图用蚁群优化演化：成功的路径加强，没用的路径衰减，新的解决方式长出新节点和边。\n\n2. **微调模型**。World Model 存的是临时的、可修订的事实和 skill；微调把稳定的能力内化进权重。Hotspan + Darwin 的每次运行都留下完整的决策轨迹，成了免费的监督信号。\n\n作者坦白的开放问题：**World Model 的更新目前全部要人审**，安全但贵；信任怎么校准还没解决。\n\n**证据**：\n\n- **生产**：内部工具链叫 Autoperf，一个专门的性能团队把它用在 Dynamics、Power Platform、Agent 365 的**数十个仓库**上（每天还在接入）。团队约 43% 的时间用 Autoperf 做应用场景（其余在建基础设施和接入仓库）。这部分工作的产出是**每工程师小时 0.35 个 PR**，估计是人工开发的 4.7 倍、当前最好 agentic 编码工具的 3 倍。这些 PR 的收益（延迟、吞吐、CPU / 内存占用）**中位数 1.72 倍，90 分位 10 倍**。Autoperf 的产出进入工程评审队列，由人审。\n\n- **开源**：对 45 个广泛部署的开源系统各给 2,500 美元推理预算，每个系统都拿到了正向改进（有的很小）；表现最好的 20 个平均性能提升 13.8%。\n\n- **token 效率**：在 circle packing 这个经典问题上，Darwin 的成本是 MAP-Elites 的 1/22、OpenEvolve 的 1/17（摘要给的说法是 token 效率最高 22 倍）。\n\n- 单例：Fabric DW 的一个 hash-join GPU 内核，几小时内产出 40 多个变体，最好的叠加了 5 项优化，比已上线的生产内核快 2.6 倍。\n\n**对 AI 应用工程师的启示**：①这是继上期 Amazon AutoResearch 之后**第二份大厂自述的生产级自改进数据**，两份的共同点是：**只在有可自动测量目标的问题上做**，评估由 agent 改不了的遥测和基准提供。②\"每次变异是一个带自我调试的 agent 会话\"解释了十几到二十倍的 token 效率从哪来：一次性生成的候选大多死在编译和测试上。③World Model 的更新流程（分层隔离、同意后晋升、日志式提交、可重放回滚）是**共享记忆治理**的一份具体设计，可以直接参考。④注意它的数字是团队自估，论文省略了完整消融。","hf":null,"topic":"自学习 / 自演进","first":"2026-10-01","di":"2026-10-01","wi":"2026-10-02","tier":"","tk":"把流水线各阶段的元数据集中沉淀成一个可查询的底座，让后续 agent 和微调都从这里取经验。","col":"evo"},{"u":"https://arxiv.org/abs/2609.36043","t":"SAGE: A Statistical Acceptance Gate for Self-Evolving Agents","v":"arXiv","s":"Yihao Wang 等 9 人","d":"2026-09-28","k":"paper","star":0,"sum":"自演进循环分提案和验收两步，以往只研究提案，验收沿用「验证集平均分涨了就保留」。这条规则有两个问题：平均分上升可以掩盖已解题目被改坏；有限且有噪声的验证集上取最优会系统性高估。SAGE 改为在相同题目上对新旧 skill 做逐题配对比较，不对称地惩罚回归，并用单侧配对检验，只有胜出在统计上可靠才提交。五个基准 × 四个模型等预算下，20 组里 19 组回归率下降；DeepSeek-V4 上 LiveMath 回归率 36.5% → 0、OfficeQA 42.8% → 0，20 组最终分全部最高","brief":"自演进循环分提案和验收两步，以往只研究提案，验收沿用「验证集平均分涨了就保留」。这条规则有两个问题：平均分上升可以掩盖已解题目被改坏；有限且有噪声的验证集上取最优会系统性高估。SAGE 改为在相同题目上对新旧 skill 做逐题配对比较，不对称地惩罚回归，并用单侧配对检验，只有胜出在统计上可靠才提交。五个基准 × 四个模型等预算下，20 组里 19 组回归率下降；DeepSeek-V4 上 LiveMath 回归率 36.5% → 0、OfficeQA 42.8% → 0，20 组最终分全部最高","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-01","di":"2026-10-01","wi":"2026-10-02","tier":"","tk":"验收从「比平均分」换成「逐题配对 + 显著性检验，不显著就不收」。","col":"evo"},{"u":"https://arxiv.org/abs/2609.37105","t":"VACE: Validation-Gated Alternating Co-Evolution of Agent Models and Harnesses","v":"arXiv","s":"Jiexing Qi 等 12 人","d":"2026-09-29","k":"paper","star":0,"sum":"权重更新和 harness 修订互相耦合，VACE 交替进行：每段 RL 之后复用轨迹提出 harness 修订，在模型固定的条件下对比现任与候选，只有验证提升才采用。Qwen3.5-9B 在 OfficeQA 上 45.26%、AutomationBench 平均部分分 75.19%，比只训权重高 6.43 和 9.09 个百分点，比不设闸门的交替高 4.59 和 6.95。44 个 harness 提案里 17 个在新检查点上降低验证表现并被拒绝","brief":"权重更新和 harness 修订互相耦合，VACE 交替进行：每段 RL 之后复用轨迹提出 harness 修订，在模型固定的条件下对比现任与候选，只有验证提升才采用。Qwen3.5-9B 在 OfficeQA 上 45.26%、AutomationBench 平均部分分 75.19%，比只训权重高 6.43 和 9.09 个百分点，比不设闸门的交替高 4.59 和 6.95。44 个 harness 提案里 17 个在新检查点上降低验证表现并被拒绝","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-01","di":"2026-10-01","wi":"2026-10-02","tier":"","tk":"模型换版本后，旧 harness 改动要在新模型上重新过一遍验证闸门。","col":"evo"},{"u":"https://arxiv.org/abs/2609.36603","t":"Self-Evolving Defense: Continual Security Policy Learning for LLM Agents","v":"arXiv","s":"Minh Nhat Le 等 7 人","d":"2026-09-28","k":"paper","star":0,"sum":"免训练防御：把有害 agent 轨迹蒸馏成可复用安全策略，后续任务按相关性检索。在 DeepSeek V4 Flash、GLM 5.2、Kimi K3 上测八个基准，AgentDojo 定向提示注入成功率降到 0.42%（最佳基线 3.7%），HarmBench 上自适应 X-Teaming 攻击成功率 7.8%（最佳基线 35.2%），正常任务效用不降","brief":"免训练防御：把有害 agent 轨迹蒸馏成可复用安全策略，后续任务按相关性检索。在 DeepSeek V4 Flash、GLM 5.2、Kimi K3 上测八个基准，AgentDojo 定向提示注入成功率降到 0.42%（最佳基线 3.7%），HarmBench 上自适应 X-Teaming 攻击成功率 7.8%（最佳基线 35.2%），正常任务效用不降","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-01","di":"2026-10-01","wi":"2026-10-02","tier":"","tk":"安全事件的轨迹也可以走「蒸馏成策略 + ench 上宏平均比不带技能高 8.95 个百分点，比把同一技能库直接交给 Target 高 12.02 个百分点","brief":"Builder 模型在权重不变的前提下学习为 Target 模型搭建执行环境，经验沉淀为 Meta-Skill（何时需要支撑、提供什么资源的原则），然后用冻结的技能库为未见任务构建 harness。Harness-Bench 与 NewtonBench 上宏平均比不带技能高 8.95 个百分点，比把同一技能库直接交给 Target 高 12.02 个百分点","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-01","di":"2026-10-01","wi":"2026-10-02","tier":"","tk":"经验直接塞给执行 agent 不如先转成可执行的环境支撑（工具、资源、脚手架）。","col":"evo"},{"u":"https://arxiv.org/abs/2609.33439","t":"Raven: The Harness of Harnesses for Composable Agentic Intelligence","v":"HF 组织 EverMind","s":"","d":"2026-09-27","k":"paper","star":0,"sum":"开源多 agent 系统，自动为特定模型和领域构建并演化模块化 harness，把每个「模型 + harness」对当作可组合单元；Host Agent 拆解目标、匹配专门 agent、协调依赖并合并结果，Skill Forge 把经验变成可复用流程。摘要未给具体数字，当日 HF 点赞第一","brief":"开源多 agent 系统，自动为特定模型和领域构建并演化模块化 harness，把每个「模型 + harness」对当作可组合单元；Host Agent 拆解目标、匹配专门 agent、协调依赖并合并结果，Skill Forge 把经验变成可复用流程。摘要未给具体数字，当日 HF 点赞第一","ana":"","hf":452,"topic":"自学习 / 自演进","first":"2026-10-01","di":"2026-10-01","wi":"2026-10-02","tier":"","tk":"跨领域任务用「专门 harness + 上层编排」组合，而不是把一个 harness 越做越大。","col":"evo"},{"u":"https://arxiv.org/abs/2609.36746","t":"EASE: Behavior-Adaptive Skill Curation for Self-Evolving Agents","v":"Zhen Xiong、Qiaoyu Tan","s":"","d":"2026-09-29","k":"paper","star":0,"sum":"发现技能整理器与执行模型强相关：用某个执行器训出的整理器换一个执行器就变差。EASE 维护执行器近期行为的在线画像，让同一个整理器据此决定增、改、删技能。在 ALFWorld、ScienceWorld、WebShop 上，对未见过的执行器也优于基线，技能数少 34.5–41.0%，检索提升 36.3–38.7%，部署期推理 token 少 9.1–14.5%","brief":"发现技能整理器与执行模型强相关：用某个执行器训出的整理器换一个执行器就变差。EASE 维护执行器近期行为的在线画像，让同一个整理器据此决定增、改、删技能。在 ALFWorld、ScienceWorld、WebShop 上，对未见过的执行器也优于基线，技能数少 34.5–41.0%，检索提升 36.3–38.7%，部署期推理 token 少 9.1–14.5%","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-01","di":"2026-10-01","wi":"2026-10-02","tier":"","tk":"换执行模型时技能库要重新整理，不能原样迁移。","col":"evo"},{"u":"https://arxiv.org/abs/2609.37128","t":"SkillCome: Group Contrast Skill Optimization with Dual Memory","v":"arXiv","s":"Haolin Li 等 9 人","d":"2026-09-29","k":"paper","star":0,"sum":"每题只跑一条轨迹很难判断哪个动作导致失败。 B 模型，读取相关技能的比例从 28% 升到 96%。","brief":"爬取网上技能、保留可离线复现的，自动构建 6.8k 个带验证器的环境和 19k 条成功轨迹做微调。Qwen3.5-9B 微调后在两个基准上超过未训练的 397B 模型，读取相关技能的比例从 28% 升到 96%。","ana":"","hf":null,"topic":"Skill、上下文工程与工具","first":"2026-10-01","di":"2026-10-01","wi":"2026-10-02","tier":"","tk":"","col":"skill"},{"u":"https://arxiv.org/abs/2609.37864","t":"AgentBug-Smith: Automatically Reproducing Real-World Harness Bugs in Agentic Systems","v":"arXiv","s":"Yiming Cheng 等 6 人","d":"2026-09-29","k":"paper","star":0,"sum":"自动从开源 agent 系统里发现并复现 harness bug，复现成功率比通用软件 bug 复现方法高 10.67%–27.56%，据此建成含 200 个可复现 bug 的 Live-Harness-Bench；从中蒸馏修复技能可把 harness bug 修复率提高 6.32%。","brief":"","ana":"","hf":null,"topic":"评测工程","first":"2026-10-01","di":"2026-10-01","wi":null,"tier":"","tk":"","col":"eval"},{"u":"https://arxiv.org/abs/2609.37226","t":"Follow the Entities: A Corpus Map for Agentic Search","v":"HF 组织 Microsoft","s":"","d":"2026-09-29","k":"paper","star":0,"sum":"离线把语料按反复出现的实体组织成 Entity Page，每页汇总该实体信息并链接所有提及它的文档，agent 沿实体—文档图找分散证据。7 个模型、3 个数据集上证据发现和答案质量优于直接在原始语料上做 agentic search，平均 token 更少。","brief":"","ana":"","hf":70,"topic":"推理基础设施与建模","first":"2026-10-01","di":"2026-10-01","wi":null,"tier":"","tk":"","col":"infra"},{"u":"https://arxiv.org/abs/2609.34378","t":"Marathoner: Ultra-Long-Horizon Autonomous Intelligence","v":"HF 组织 Ant Group","s":"","d":"2026-09-28","k":"paper","star":0,"sum":"后训练流水线：用含 1000 行以上新代码的大版本 PR 合成超长任务，并把多个任务串成一个；拒绝采样微调后做 RL，奖励对后期阶段加成。称可连续工作 10 小时以上、执行 1000 次以上工具调用。","brief":"","ana":"","hf":28,"topic":"Harness 与长时程 Agent","first":"2026-10-01","di":"2026-10-01","wi":null,"tier":"","tk":"","col":"harness"},{"u":"https://arxiv.org/abs/2609.36130","t":"Memory Is a Derivation: The Distributed-Evidence Paradox in Long-Term Agents","v":"Hongjun Liu、Chen Zhao","s":"","d":"2026-09-28","k":"paper","star":0,"sum":"审计写入持久记忆的内容是否真被交互历史支持。扩大到写入前的完整历史后，近 60% 看似无依据的记忆能找到支持，仍有 17–21% 无依据；而且证据更多并不自动让准入更可靠，无依据记忆仍常被放行。","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-01","di":"2026-10-01","wi":null,"tier":"","tk":"","col":"evo"},{"u":"https://arxiv.org/abs/2609.35807","t":"Environment Steering: Using Data Flow Control to Improve Agent Utility and Safety","v":"arXiv","s":"Charlie Summers 等 7 人","d":"2026-09-19","k":"paper","star":0,"sum":"把 agent 与 harness 的执行状态建模成数据库表，运行时跟踪记录级数据流并对照声明式策略检查；违规时返回针对策略和上下文的反馈，引导 agent 走安全替代路径。AgentDyn 上攻击成功率 0%，任务成功率高于不设防。","brief":"","ana":"","hf":null,"topic":"Agent 安全与围堵","first":"2026-10-01","di":"2026-10-01","wi":null,"tier":"","tk":"","col":"safety"},{"u":"https://deepmind.google/blog/gemini-4-argon-our-next-era-of-frontier-intelligence","t":"Gemini 4 Argon: our next era of frontier intelligence","v":"Google","s":"Google DeepMind","d":"2026-09-30","k":"release","star":0,"sum":"新前沿模型，先经 Fairwind Program 给受信任的网络防御者（对他们不设网络安全护栏），尚未对开发者、企业和消费者开放；预告价 $2 / $10 每百万 token，缓存输入再减 95%；输出上限从 64K 提到 1M token。Google 自报 DeepSWE v1.1 77.9%、AutomationBench 51.3%、LVBench 91.7%、CWE-bench v1 68%（并列第一）。内部用例：Argon agent 团队分析全机群性能遥测后自主实施内存优化，已释放 300 TiB 以上；C/C++ 迁 Rust 最大到 Fuchsia Zircon 内核 80 万行以上。安全侧：监控思维链与动作并可中止执行，训练期监控结果不回灌训练","brief":"","ana":"","hf":null,"topic":"Agent 安全与围堵","first":"2026-10-01","di":"2026-10-01","wi":null,"tier":"","tk":"1M 输出上限意味着单次轨迹可以产出整份大型改动，长任务的切分策略值得在开放后重测。","col":"safety"},{"u":"https://deepmind.google/blog/introducing-synthid-bio","t":"Introducing SynthID Bio","v":"Google","s":"Google DeepMind · Science","d":"2026-09-30","k":"release","star":0,"sum":"面向合成生物学的水印概念验证：序列侧在带水印的 ProteinMPNN 里微调氨基酸选择，结构侧微调 AlphaFold 3 扩散网络的一小部分，让预测坐标自带可检测签名。VEGF-A、新冠刺突 RBD、PD-L1 三个靶点的湿实验中，带水印设计的命中率、结合亲和力与未加水印版本相当。用途是给 DNA 合成筛查和公共数据库提供「来自带安全措施的可信模型」的自动验证信号。","brief":"","ana":"","hf":null,"topic":"Agent 安全与围堵","first":"2026-10-01","di":"2026-10-01","wi":null,"tier":"","tk":"","col":"safety"},{"u":"https://claude.com/blog/claude-for-government-is-now-generally-available","t":"Claude for Government is now generally available","v":"Anthropic","s":"claude.com/blog · Product announcements","d":"2026-09-30","k":"release","star":0,"sum":"面向美国联邦与州机构，FedRAMP High 授权环境，7 月起公测；Claude Code CLI 与 Claude for Microsoft 365 同环境早期访问。不收席位费，按固定额度预付并设不可超出的硬上限；SCIM 组映射决定每档席位的速率、金额上限和可用模型；Anthropic 侧敏感操作需双人审批；用量导出只含计量数据，对话历史留在机构设备本地","brief":"","ana":"","hf":null,"topic":"推理基础设施与建模","first":"2026-10-01","di":"2026-10-01","wi":null,"tier":"","tk":"「硬上限 + 余额预警 + 按组限模型」是企业 agent 产品成本治理的一套现成参数。","col":"infra"},{"u":"https://openai.com/index/towards-safety-cases-for-frontier-ai-training","t":"Towards safety cases for frontier AI training","v":"OpenAI","s":"openai.com/index · Safety","d":"2026-09-28","k":"article","star":1,"sum":"**整体概括**：OpenAI 主张在继续任何前沿 RL 训练前都应有结构化安全文档，目标是航空 / 核电式的 safety case，并公布正在内部实施的初版指南。技术部分三层：对齐训练（用 agent 自动审查并修复可被 reward hack 的 RL 环境、人工复核数据集、调评分器惩罚 hack、用分类器回看历史轨迹；对齐评测要回测历史事故、跟踪评测觉察 / 元博弈并设阻断阈值、做最坏情况压力测试；不让自动评分器看思维链以免模型学会规避 CoT 监控）、封禁（多层基础设施安全、用训练检查点红队沙箱与周边服务、限制样本间高带宽通信、转录写入不可变存储）、监控（可监控性评测阈值、对历史事故高召回、监控评测保持新鲜、告警在 SLA 内响应否则自动暂停训练）。运营部分：他队写异议（pre-mortem）、多位高管各有否决权、训练负责人对安全案例与事故响应担责并计入绩效、暂停 runbook、内部透明、审计访问、按严重度分级的失准升级可寻呼 CEO、技术控制让「人和 agent 都难以启动不合规训练」且监控 fail-closed、可回滚（识别失准模型的所有下游用途如数据生成与评分）、列全残余风险。事故调查部分：每日内部更新、用消融 / 重采样找根因、运营与文化复盘、不直接在事故数据上爬坡的检测评测、事后公开披露并通知受影响第三方","brief":"","ana":"**这篇解决什么问题**：OpenAI 主张，**继续任何前沿强化学习训练之前都应该有结构化的安全文档**，长期目标是达到航空、核电那种\"safety case\"（成体系、有证据的风险论证）的水平。这篇公布了他们正在内部实施的初版指南。注意范围：只管前沿 RL 训练，不管部署。据 CNBC 报道，OpenAI 在同一天宣布放弃发布 GPT-6.1 Astra，理由是没达到自己的安全标准（见大事记），两件事要放在一起读。\n\n**三部分内容**：\n\n**一、技术防线，分三层**：\n\n- **对齐（第一道）**：防止训练本身强化了作弊。用 agent 自动审查 RL 环境，找出能靠漏洞拿高分的环境并修掉；人工抽查数据集；调 grader 去惩罚钻环境空子的行为；对以往实验的轨迹跑分类器，确认 grader 按预期工作。测量侧：训练中跑离线对齐评测；在过去的事故上回测评测能否检出；**监控\"模型是否意识到自己在被测\"并设阻断阈值**；做最坏情况压力测试。还有一条很具体：**RL 里的自动 grader 不许看思维链**，防止模型演化出躲避思维链监控的能力。\n\n- **围堵（第二道）**：沙箱和承载沙箱的研究基础设施都加固；用训练中的检查点红队攻击自己的围堵；跨样本的高带宽通信只走批准的通道；**所有 RL 训练、评测和内部部署的轨迹写入不可变存储**。\n\n- **监控（第三道）**：用评测保证模型仍然可监控；监控器在留出的历史事故上要有高召回；为新风险补评测样本，免得召回率数字过期；告警有 SLA，白天呼叫值班和负责人，**夜间无人确认就自动暂停训练**。\n\n**二、运营规则**：safety case 写好后由**另一个团队的人写一份异议**（相当于事前验尸）；高层逐一审阅，每人都有否决权；负责训练的高层对 safety case 和事故响应负责并计入绩效；发现使 safety case 失效的问题时有暂停所有相关训练的手册和技术手段；**技术控制要 fail-closed**：不开监控就起不了训练，也不能从 RL 训练、评测或内部部署内部关掉监控；能方便地找出一个失准模型的所有下游用途（数据生成、打分）以便回滚；显式列出没被缓解措施覆盖的残余风险。\n\n**三、事故调查**：调查期间定期内部通报；做消融或重采样实验找出失准是怎么被训练出来的；做运营和文化层面的复盘；开发能发现同类倾向的测试方法，但**不能直接在事故信息上 hillclimb**，事故派生的评测只当回归测试；调查结束后公开结果。\n\n**对 AI 应用工程师的启示**：这份清单虽然针对前沿训练，但几乎每一条都能缩小成 agent 系统的工程规则，而且和近三期论文的结论逐条对得上：**评分器不看被评对象能操纵的信号**（对应 grader 不看思维链）；**轨迹不可变存储**（对应上上期的 trace 篡改论文）；**监控 fail-closed、不能从被监控的环境内部关掉**（对应 OpenShell 的带外执法）；**事故派生的用例只当回归测试，不拿来调优**（对应本期 hillclimb 一文的\"不把失败贴进 prompt\"）。面试里被问\"怎么给一个会自我改进的系统做安全设计\"，可以按\"对齐 → 围堵 → 监控 + 异议与否决 + 可回滚\"这个骨架答。","hf":null,"topic":"Agent 安全与围堵","first":"2026-09-30","di":"2026-09-30","wi":"2026-10-02","tier":"must","tk":"「评分器不看 CoT」「转录不可变」「监控 fail-closed、不能从训练内部关闭」「agent 也不能启动不合规运行」四条可直接搬进任何自演进 / 自动实验系统的设计清单。","col":"safety"},{"u":"https://www.anthropic.com/research/glm-5-3-and-the-spread-of-advanced-cyber-capabilities","t":"GLM-5.3 and the spread of advanced cyber capabilities","v":"Anthropic","s":"/research · Frontier Red Team","d":"2026-09-29","k":"article","star":0,"sum":"**整体概括**：五个月前 Anthropic 以 Project Glasswing 限量发布能端到端构造漏洞利用的 Claude Mythos Preview，本文评估智谱 GLM-5.3 是否已达同级且缺乏有效安全措施。能力侧：ExploitBench（Chrome V8 已知漏洞）410 次尝试成功 50 次，Mythos Preview 为 56 次；内部二进制利用基准 100 题中完整控制流劫持 4%（Mythos Preview 6%，Opus 4.6 与 GLM-5.2 均为 0）；人类专家一天内用它在某浏览器 Linux 版 JS 引擎里找到多个未知漏洞并串成读任意文件的网页；GLM-5.3-Flash 为 Chrome CVE-2026-11645 造出绕过 PAC 的 ARM64 利用链，20 分钟人工 + 8 小时模型、API 费用 $20.40。与 NIST CAISI 9 月 17 日的评估一致（落后美国前沿约四个月）。安全措施侧：伪装成红队演练的提示让模型执行明显恶意任务的比率 64%，预填思维 token 92%，abliteration 版 100%；自制 abliteration 用 2,200 GPU 小时约 $4,400（Flash 版 600 小时），拒绝率从 90% 以上降到 3% / 2% / 12%（JailbreakBench / HarmBench / StrongREJECT），GPQA-Diamond 不降、CyberGym 降几个百分点；同样手法对有安全措施的 Claude 全部失败（API 不允许预填思维、权重不开放）。结论：可自由获取的能力越过临界点，呼吁政府对同级模型做安全测试、开源开发者补安全措施，同时主张让防守方用上最好的模型","brief":"","ana":"**这篇解决什么问题**：五个月前 Anthropic 以 Project Glasswing 限量发布了第一个能自主构造端到端漏洞利用的模型 Claude Mythos Preview，当时的判断是这种能力迟早会扩散。这篇是对智谱开源权重模型 GLM-5.3 的评估，结论是**这种能力已经出现在任何人都能下载的模型里，而且它的安全措施很容易去掉**。\n\n**能力评估**（模型都跑在隔离沙箱里，只攻击离线靶标）：\n\n- **ExploitBench**（V8 引擎已知漏洞的端到端利用）：GLM-5.3 在 410 次尝试中成功 50 次，Claude Mythos Preview 是 56 次。\n\n- **内部 Binary Exploitation 基准**（100 个 OSS-Fuzz 项目任务，完整控制流劫持才算满分）：GLM-5.3 4%，Mythos Preview 6%；Claude Opus 4.6 和 GLM-5.2 都是 0。\n\n- **人在回路测试**：一位研究员用一天时间、很少的注意力，让 GLM-5.3 在一个流行浏览器的 JavaScript 引擎里找到多个此前未知的漏洞，并串成一个可用的利用（访问网页即可读取本地任意文件）。另一位研究员用更小的 GLM-5.3-Flash 把一个已公开的 Chrome CVE 做成可靠的利用链：**20 分钟人工注意力 + 模型 8 小时，按智谱 API 价格是 20.40 美元**。\n\nNIST 的 CAISI 在 09-17 发布的独立评估与此大体一致，称它是\"迄今网络能力最强的开源权重模型\"，落后美国前沿约四个月。\n\n**安全措施评估**：在一个模拟环境里直接提出明显恶意的攻击请求，GLM-5.3 开箱全部拒绝。但三种简单手段可以绕过：\n\n手段｜GLM-5.3 配合率｜对 Claude\n\n欺骗性提示（告诉它\"你是红队演习里的自主 agent\"）｜64%｜被安全措施拦住\n\n预填思考 token（让它看起来已经考虑过并决定执行）｜92%｜API 不提供预填思考的途径\n\nabliteration（改权重去掉拒绝方向）｜100%｜权重不公开，无法操作\n\nabliteration 的成本：一个此前没做过的团队用了约 2,200 GPU 小时、约 4,400 美元；拒绝率从 90% 以上降到 3%、2%、12%（三个基准），GPQA-Diamond 分数不变，CyberGym 只低几个百分点。模型发布后几天内就有开发者公开了 abliterated 版本。\n\n**对 AI 应用工程师的启示**：有三点和应用工程直接相关。①**预填（prefill）思考内容是一个真实的越狱面**。自己托管开源模型并暴露完整 chat template 时要意识到这一点；闭源 API 不开放这个口子不是偶然。②安全措施如果只存在于权重里的拒绝倾向，对拿得到权重的人等于没有。**部署侧的独立层（分类器、沙箱、出网控制）才是能留下来的那部分**，这和本期 dots、上期 OpenShell 的分层思路一致。③做安全评测时要报\"绕过后\"的数字，开箱拒绝率说明不了什么。\n\nHN 反响：250 分 / 234 评论","hf":null,"topic":"Agent 安全与围堵","first":"2026-09-30","di":"2026-09-30","wi":"2026-10-02","tier":"must","tk":"部署开源模型做 agent 时，模型内置拒绝不能当防线——要外置分类器、禁止用户侧预填思维；评估任何模型的安全措施都按「伪装提示 / 预填 / 权重改动」三档报绕过率。","col":"safety"},{"u":"https://claude.com/blog/agents-you-can-coach-how-asana-builds-human-agent-teams-with-claude","t":"Agents you can coach: how Asana builds human-agent teams with Claude","v":"Anthropic","s":"claude.com/blog","d":"2026-09-29","k":"article","star":0,"sum":"**整体概括**：Asana 让 agent 在既有 Work Graph（任务 / 项目 / 目标 / 对话的关系图）内以角色身份工作。四条实践：先把非结构化输入与 Claude 讨论清楚再落成任务，agent 再行动；每个 agent 有角色、预置技能、集成与资料页（用户、管理员、指令、权限分开），有效权限以触发它的人的权限为上界；把「使用」与「训练」分开——人人可对任务给反馈，只有管理员 / 编辑者能把反馈写入永久记忆或删除，由拥有该标准的团队（如公关团队管写作 agent 的语气）担任编辑；agent 的计划与步骤公开发在共享任务里，审阅者可以改指令而不只是改产出。三个案例：Slack 产品问答 agent（有批准答案就回链接，没有就建产品 intake 任务，重复出现就建培训更新任务）；At-Risk Renewal agent 每天读全球风险续约任务生成正动能 / 负动能 / 建议三桶日报并按区域切分；Command 用 agent 从反馈填未规划板，人决定进周期，预测乐观 / 平衡 / 保守完成时间，经 MCP 暴露给 Claude","brief":"","ana":"**这篇解决什么问题**：\"人和 agent 组队\"系列的第三篇（前两篇讲 Anthropic 内部经验和 Slack）。这篇看 Asana：agent 不另建上下文结构，而是和人一样活在 Work Graph（任务、项目、目标、对话及其负责人和依赖关系）里。\n\n**几条和工程设计相关的做法**：\n\n- **agent 按角色定义**（内容撰写、洞察分析、项目经理、需求接收等），每个 agent 有一个资料页：名称与用途、谁能用、谁是管理员、指令、skill、集成、权限。\n\n- **权限上界 = 触发它的人的权限**。agent 自己可以有较宽的公共内容访问，但有效权限不超过触发者，避免有人借 agent 读到它在私有上下文里学到的东西。\n\n- **\"和 agent 协作\"与\"训练 agent\"分开**。所有人都能就一次任务给反馈，但**只有管理员和编辑者能把反馈写进永久的共享记忆**，也只有他们能撤销或删除；其他人的反馈只对当前任务生效。Asana 的传播团队掌管公司的语气和措辞，所以写作 agent 的编辑权归他们；CPO 能用它起草，但改不了它的行为。\n\n- **工作留在大家都看得见的地方**。任务分给 agent 后，它把研究计划和执行步骤发在任务动态里，所有有权限的人都能看、评论、纠偏。请求、反驳和产出在同一处，审稿的人也能修改产生这份稿子的指令。\n\n**对 AI 应用工程师的启示**：团队共享 agent 的两个设计点可以直接拿走：**共享记忆的写权限要按角色收窄**（谁拥有那条标准，谁才能改 agent 的长期行为）；**有效权限取 agent 权限和触发者权限的交集**。上期论文 CPB 指出\"共享记忆里一条没人反驳的假话，下游 97–99% 会复述\"，写权限治理正是对应的工程手段。","hf":null,"topic":"多智能体","first":"2026-09-30","di":"2026-09-30","wi":"2026-10-02","tier":"note","tk":"共享记忆的写权限按「谁拥有该标准」分给少数编辑者，其他人的反馈只作用于当前任务——这是对 09-29 xAI Team Bots「一人修正全队受益」的必要约束。","col":"multi"},{"u":"https://openai.com/index/how-we-build-safety-security-and-privacy-into-dots","t":"How we build safety, security, and privacy into dots","v":"OpenAI","s":"openai.com/index","d":"2026-09-29","k":"article","star":0,"sum":"**整体概括**：dots 的安全架构分层。模型层由 GPT-6 Astra 负责理解意图与拒绝。环境层：每个 dot 独占云电脑（Linux + Chrome），沙箱限制代码与工具，用户环境互相隔离；执行环境与协调 / 安全系统分离，dot 不能修改安全系统或关闭必需检查。凭据层：安全登录时模型暂停、凭据直达浏览器环境；保存的密码由独立加密凭据服务提供，不进模型上下文（但单独写在文档里的秘密仍可见）。后台「主动研究」只用只读工具，代码级强制不能发消息、改应用或控浏览器，产出私有笔记。动作层：按数据敏感度要求收件人具体度（健康数据必须指名收件人，邮箱电话默认要指定收件人类别，可用 Custom Rules 放宽）；永久删除、安装未知来源软件、授予新敏感权限每次确认；改密码、转账交回用户。独立的 Auto-review 在动作前核对指令、Custom Rules 与安全要求，阻断时把原因回传给 dot 让其求助、换路径或停止；Auto-review 的控制放在 dot 可改环境之外，用户批准不能覆盖核心要求。训练数据：企业默认不用，后台研究线程不直接用于训练","brief":"","ana":"**这篇解决什么问题**：DevDay 发布的 dots 是常驻 agent：每个 dot 有自己的云电脑，跨你连接的应用持续工作，你不在时也推进。这篇讲它的安全架构，是目前 OpenAI 对\"always-on agent 的控制面\"最具体的公开描述。\n\n**分层结构**：\n\n- **模型层**：GPT-6 Astra，训练成会停在请求范围内、在答案会改变做法时提问。\n\n- **工作区**：每个 dot 一台云电脑，沙箱限制代码和工具能碰什么，用户之间的云环境互相隔离。关键的一句：**dot 运行代码的环境，和协调它工作、执行关键安全措施的系统是分开的**；它在工作区里能建文件、跑工具，但没法用这些权限去改安全系统或关掉必需的检查。\n\n- **凭据**：安全登录时**模型被暂停**，用户在安全表单里输入，凭据直接送到浏览器环境提交，不进模型上下文；保存的密码走独立的加密凭据服务。文中也写明了边界：你另外贴在消息或文档里的密钥，模型还是看得见。\n\n- **行动规则，按后果分三档**：能自己做的（读有权限的信息、分析、起草）；**每次都要你确认的**（永久删除数据、安装或运行来源不明的软件、授予新的安全敏感访问）；**必须交还给你做的**（改密码、在金融账户间转账）。购买可以用商户网站上已存的卡，但要你批准。\n\n- **按数据敏感度定收件人授权粒度**：健康数据必须指明具名收件人；邮箱、电话这类较不敏感的个人数据默认要指定收件人类别（\"任何航空公司\"）。授权绑定在这次任务的指令上，**之后继续或委派给别的 agent 都不会扩大它**。\n\n- **Auto-review：行动前的独立检查**。发邮件、改文件之前，一个独立的安全系统拿计划的步骤去对照你的指令、Custom Rules 和安全要求。放行就执行；**拦下时会把原因告诉 dot**，它可以要更多信息、请你批准、换一条允许的路，或者停。执行 Auto-review 的控制放在 dot 能改动的环境之外。\n\n- **主动研究（proactive research）**：dot 会在后台找别的能帮上忙的事。这类任务**只有只读工具**，结果存成 dot 的私有笔记；不能发消息、不能改连接应用里的内容、不能操控浏览器或桌面，这些限制是**在代码里强制的**。任何后续动作仍走通常的规则和检查。\n\n- **Custom Rules**：用户可以加自己的规则（\"永远不要发邮件\"）。dot 可以帮你写规则，但改规则要你批准；规则不能去掉强制确认和核心安全要求。\n\n**对 AI 应用工程师的启示**：把它和 Anthropic × NVIDIA 的方案（Managed Agents 的循环与沙箱分离、凭据放独立保险库、OpenShell 带外执行策略）并排看，**两家的控制面已经同构**：模型内安全 → 沙箱 → 凭据不进上下文 → agent 够不到的独立审查 → 按后果分级的确认。设计自己的 agent 产品时，这五层可以当检查表。两个细节尤其值得抄：**后台自主任务只给只读工具**；**拦截时把原因返回给 agent**，让它能换路而不是卡死或硬闯。","hf":null,"topic":"Agent 安全与围堵","first":"2026-09-30","di":"2026-09-30","wi":"2026-10-02","tier":"note","tk":"「审查器在 agent 环境之外 + 阻断原因回传给 agent 自行处理 + 按数据敏感度分级收件人授权」三条可以直接套进自己的 agent 动作审批设计。","col":"safety"},{"u":"https://developer.nvidia.com/blog/ai-native-by-design-lessons-learned-from-building-nvidia-tensorrt-model-connect","t":"AI Native by Design: Lessons Learned from Building NVIDIA TensorRT Model Connect","v":"NVIDIA","s":"NVIDIA 开发者博客 · Agentic AI / Developer Tools","d":"2026-09-29","k":"article","star":0,"sum":"**整体概括**：TensorRT Model Connect 是把 HF / 本地 checkpoint 转成版本化 .bundle 并暴露 C++ 任务 API 的开源项目（7 月 29 日版本覆盖 128 个模型族），从一开始就围绕编码 agent 设计。五条工程选择：选可横向扩展的工作（模型族、算子、运行时路径互相独立；串行关键路径长的工作加 agent 只增协调开销）；给 agent 结果与参考实现而非实现配方，验收标准不可协商、实现路径自由，约束只在反复失败证明需要时才加；按模型族隔离所有专属知识，允许冗余，只有多个独立 owner 都需要时才上提到共享层；变更可逆（two-way door）；自动验证是生产约束——证据要人可读（文本进文本出的语义接口便于抽查）、验证与代码同生成并自改进、QA 与开发在同一可复现 CI 上对抗协作。人的工作上移到选题、分解、设约束、解读异常证据与负责发布。未解决：并非所有任务可分解、共享基础设施故障仍会跨族、参考实现不是神谕、并行 agent 增加验证需求快于增加通过吞吐、任务仍多由人发起","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-30","di":"2026-09-30","wi":null,"tier":"note","tk":"「候选代码变便宜，证据变贵」——上多 agent 前先投资验证与人可读证据；把 QA 做成独立于开发的红队，而不是下游环节。","col":"evo"},{"u":"https://arxiv.org/abs/2609.33180","t":"Which Self-Improvements Should We Trust? Reliable Self-Improvement When Agents Reuse Their Benchmarks","v":"arXiv","s":"Xiaojing Sun 等 4 人","d":"2026-09-27","k":"paper","star":0,"sum":"RSI 循环用同一个有限评测集反复决定保留哪些修改、下一步提哪些候选，搜索轨迹会自适应过拟合，经验上的提升不等于总体分布上的提升；已有多重比较方法假设候选独立于评测集，管不住这种自适应依赖。REUSE 框架严格限制返回给搜索过程的评测反馈量，并在误差预算内核算所有可能的晋升历史，保证以 1−α 概率每个被晋升的修改都是真实总体改进","brief":"RSI 循环用同一个有限评测集反复决定保留哪些修改、下一步提哪些候选，搜索轨迹会自适应过拟合，经验上的提升不等于总体分布上的提升；已有多重比较方法假设候选独立于评测集，管不住这种自适应依赖。REUSE 框架严格限制返回给搜索过程的评测反馈量，并在误差预算内核算所有可能的晋升历史，保证以 1−α 概率每个被晋升的修改都是真实总体改进","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-30","di":"2026-09-30","wi":"2026-10-02","tier":"","tk":"自演进流水线里把「评测集反馈」当预算管理，只返回是否过阈值而非完整分数，并给晋升决策设总误差预算 α。","col":"evo"},{"u":"https://arxiv.org/abs/2609.32990","t":"Certified Long-Horizon Code Agent Evolution via Validation-Gated Skill Optimization","v":"arXiv","s":"Yifan Wang 等 16 人","d":"2026-09-26","k":"paper","star":0,"sum":"形式化「上下文内自演进」：agent 在不断演化的仓库上解决顺序任务流，持久存储并复用经验；文本技能优化高效但已有方法更新不稳、性能回撤、长期部署后 agent 崩溃。VALVE 用验证门控技能优化，给出有限收敛性、未来任务收益与回撤的理论保证，并推导达到给定容差所需的验证 / 评估留出集大小。实验在 1,000+ 个 SWE 任务的演化跨度上稳定自改进，GPT-5.5、Claude-4.6、MiniMax-M2.7 三个前沿模型平均最终 +14.9、峰值 +16.5 分","brief":"形式化「上下文内自演进」：agent 在不断演化的仓库上解决顺序任务流，持久存储并复用经验；文本技能优化高效但已有方法更新不稳、性能回撤、长期部署后 agent 崩溃。VALVE 用验证门控技能优化，给出有限收敛性、未来任务收益与回撤的理论保证，并推导达到给定容差所需的验证 / 评估留出集大小。实验在 1,000+ 个 SWE 任务的演化跨度上稳定自改进，GPT-5.5、Claude-4.6、MiniMax-M2.7 三个前沿模型平均最终 +14.9、峰值 +16.5 分","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-30","di":"2026-09-30","wi":"2026-10-02","tier":"","tk":"技能库更新前过一个固定大小的验证留出集，接受阈值按容差反推留出集规模，而不是凭感觉设。","col":"evo"},{"u":"https://arxiv.org/abs/2609.34924","t":"Audit the Scaffold, Not the Checkpoint: A Stationarity Dichotomy for Recursive Self-Improvement in Agentic Coding","v":"arXiv","s":"Sebastian Bobadilla-Suarez 等 3 人","d":"2026-09-28","k":"paper","star":0,"sum":"提出静态性二分法：只要 agent 可达的编辑集合不变，迭代自改进必然收益递减；改写 scaffold（工具、验证器、任务分解）会扩大可达集合而不动权重，所以「权重冻结」只保证最终上限，不保证过程静止。由此区分固定类内搜索、测试时训练、scaffold 改写三种常被混为一谈的机制。横向同理：best-of-k 只实现最强 worker 的上限（宽度买速率不买预算）；30 个同族 worker 的失败高度重叠，多数投票在 23/55（42%）任务上失败。方法是把 refinement 读作对 draft 与目标之间残差（即 patch / diff）的梯度提升","brief":"提出静态性二分法：只要 agent 可达的编辑集合不变，迭代自改进必然收益递减；改写 scaffold（工具、验证器、任务分解）会扩大可达集合而不动权重，所以「权重冻结」只保证最终上限，不保证过程静止。由此区分固定类内搜索、测试时训练、scaffold 改写三种常被混为一谈的机制。横向同理：best-of-k 只实现最强 worker 的上限（宽度买速率不买预算）；30 个同族 worker 的失败高度重叠，多数投票在 23/55（42%）任务上失败。方法是把 refinement 读作对 draft 与目标之间残差（即 patch / diff）的梯度提升","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-30","di":"2026-09-30","wi":"2026-10-02","tier":"","tk":"审计自演进系统时看「它能改到哪些组件」而不是「权重是否冻结」；不要指望同族模型多路投票兜底，失败重叠是默认情况。","col":"evo"},{"u":"https://arxiv.org/abs/2609.35596","t":"SEABench: Benchmarking Endogenous Misalignment In Self-Evolving Agents","v":"arXiv","s":"Saswat Das 等 6 人","d":"2026-09-28","k":"paper","star":0,"sum":"自演进 agent 会修改控制器指令、记忆管理协议、可复用工具与技能；局部有用的更新可能延续到后续任务并产生不安全行为，无需对抗者介入。SEABench 在个人助理环境里给出 48 条纵向任务序列，覆盖多个演进面、任务域与伤害类型，配自适应轨迹发现流水线（保留原任务意图地探测失败），并用配对的非演进 agent 与归因分数做因果归因。多款近期 LLM 上的结论：自演进确实提高任务完成率，但代价是配对基线中不存在的安全失效；不同演进面与伤害类型呈现性质不同的安全行为，且差异反映在思维链里","brief":"自演进 agent 会修改控制器指令、记忆管理协议、可复用工具与技能；局部有用的更新可能延续到后续任务并产生不安全行为，无需对抗者介入。SEABench 在个人助理环境里给出 48 条纵向任务序列，覆盖多个演进面、任务域与伤害类型，配自适应轨迹发现流水线（保留原任务意图地探测失败），并用配对的非演进 agent 与归因分数做因果归因。多款近期 LLM 上的结论：自演进确实提高任务完成率，但代价是配对基线中不存在的安全失效；不同演进面与伤害类型呈现性质不同的安全行为，且差异反映在思维链里","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-30","di":"2026-09-30","wi":"2026-10-02","tier":"","tk":"上线自演进功能前跑「配对非演进基线」的 A/B，安全失效增量单独报告，不能只看完成率。","col":"evo"},{"u":"https://arxiv.org/abs/2609.33123","t":"Compositional Safety Failures in Harness Evolution: Identification and Runtime Monitoring","v":"arXiv","s":"Zhixiang Zhang 等 5 人","d":"2026-09-27","k":"paper","star":0,"sum":"已有工作验证候选 harness 或归因单个组件更新，跨组件更新的交互未被检查。本文定义组合安全失效：各自安全且保效用的组件更新（记忆、提示、技能、工具）组合后产生不安全行为。在三个安全基准上找出 43 个两两、18 个不可约的三元失效。逐一验证跨组件交互是组合爆炸，因此用类型化超图表示组件状态（节点）与安全相关的高阶交互（超边），harness 变化时只更新受影响的交互邻域，并在其上做运行时监控","brief":"已有工作验证候选 harness 或归因单个组件更新，跨组件更新的交互未被检查。本文定义组合安全失效：各自安全且保效用的组件更新（记忆、提示、技能、工具）组合后产生不安全行为。在三个安全基准上找出 43 个两两、18 个不可约的三元失效。逐一验证跨组件交互是组合爆炸，因此用类型化超图表示组件状态（节点）与安全相关的高阶交互（超边），harness 变化时只更新受影响的交互邻域，并在其上做运行时监控","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-30","di":"2026-09-30","wi":"2026-10-02","tier":"","tk":"harness 里任一持久组件被自动更新时，触发对「与它有交互记录的组件对 / 三元组」的安全回归，而非全量或不测。","col":"evo"},{"u":"https://arxiv.org/abs/2609.33822","t":"Vestrum: Improving Agent Harnesses by Adapting Their Verification, Structure and Memory","v":"arXiv","s":"Jayant Parashar 等 4 人","d":"2026-09-27","k":"paper","star":0,"sum":"把执行轨迹中的失败转成有范围的 harness 修改，不训练任务模型。核心假设：同类任务有反复出现的失败，其补救在该类内可迁移。流程：把失败表达为可识别的类别，在验证、检索、分解、知识综合四个维度提出修改，先筛范围再成捆评估，持久 lessons 文件驱动后续提案。五个场景、两个基线 harness 上冻结后的 harness 在留出集提升：UltraHorizon 47.6 → 59.8（对 GAM），Terminal-Bench 4 Hard 八个留出任务 63.7% → 70.3%（对 Claude Code，测试成本 1.03 倍），细胞类型标注一致率 67.5% → 77.8%，LoCoMo 与 AMA-Bench 亦有提升。发现：基于证据的验证对中间步骤和最终答案都有效、中间步更便宜；要求 critic 重做已完成答案破坏多于修复","brief":"把执行轨迹中的失败转成有范围的 harness 修改，不训练任务模型。核心假设：同类任务有反复出现的失败，其补救在该类内可迁移。流程：把失败表达为可识别的类别，在验证、检索、分解、知识综合四个维度提出修改，先筛范围再成捆评估，持久 lessons 文件驱动后续提案。五个场景、两个基线 harness 上冻结后的 harness 在留出集提升：UltraHorizon 47.6 → 59.8（对 GAM），Terminal-Bench 4 Hard 八个留出任务 63.7% → 70.3%（对 Claude Code，测试成本 1.03 倍），细胞类型标注一致率 67.5% → 77.8%，LoCoMo 与 AMA-Bench 亦有提升。发现：基于证据的验证对中间步骤和最终答案都有效、中间步更便宜；要求 critic 重做已完成答案破坏多于修复","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-30","di":"2026-09-30","wi":"2026-10-02","tier":"","tk":"给 agent 加验证时放在中间步骤并要求引用证据，不要让 critic 重写终稿。","col":"evo"},{"u":"https://arxiv.org/abs/2609.33146","t":"LiteEvo: Automated, Co 、写新技能或安装外部模型、仿真测试、循环 123 轮，全程无人写机器人代码。好消息：agent 能自主发现能力缺口（发现目标不在视野内，主动要求并调通主动视角模型）。坏消息：改动各自通过测试，目标任务（把调料放进冰箱顶层）始终没成功。瓶颈不在 agent 而在周围三件事：链式感知模块不懂关系（SAM 3 找得到架子找不到「顶层架子」，agent 于是堆几何规则永不收敛）；技能链把学习锁在第一步（长任务多在前期失败，后续技能很少被触达）；agent 学什么由 harness 决定","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-30","di":"2026-09-30","wi":"2026-10-02","tier":"","tk":"自演进循环要给「换一类模型」而不只是「加规则」的动作空间，并按步骤位置分配探索预算，避免证据全堆在第一步。","col":"evo"},{"u":"https://arxiv.org/abs/2609.35432","t":"Self-Evolving Coding Agents: From Digital Programs to Physical-World Intelligence","v":"arXiv","s":"Hongcheng Gao 等 13 人","d":"2026-09-28","k":"paper","star":0,"sum":"VLA / WAM 模型把观察和指令直接映射到动作，任务要求、条件、进度和失败恢复都隐含在动作序列里，难以检查和修改。提出 Physical Coding：用代码表示任务状态与执行——Code as World 记录物体、关系、约束、进度，Code as Policy 组织规划、验证、恢复、执行。HexaAnything 调用感知、规划、控制工具（含 VLA / WAM 策略），根据外部反馈在环决策；经验证的轨迹成为数据与记忆，演进路径从工具与 harness 到权重、架构、硬件与任务设计。RoboCasa365 上 Composite-Unseen 与总体指标提升（摘要截断处未给出数字）","brief":"VLA / WAM 模型把观察和指令直接映射到动作，任务要求、条件、进度和失败恢复都隐含在动作序列里，难以检查和修改。提出 Physical Coding：用代码表示任务状态与执行——Code as World 记录物体、关系、约束、进度，Code as Policy 组织规划、验证、恢复、执行。HexaAnything 调用感知、规划、控制工具（含 VLA / WAM 策略），根据外部反馈在环决策；经验证的轨迹成为数据与记忆，演进路径从工具与 harness 到权重、架构、硬件与任务设计。RoboCasa365 上 Composite-Unseen 与总体指标提升（摘要截断处未给出数字）","ana":"","hf":91,"topic":"自学习 / 自演进","first":"2026-09-30","di":"2026-09-30","wi":"2026-10-02","tier":"","tk":"把 agent 的世界状态与策略都显式写成可 diff 的代码，是「经验变成可复用程序」的前提，机器人与软件 agent 同构。","col":"evo"},{"u":"https://arxiv.org/abs/2609.32961","t":"Beyond Token Savings: A Systematic Study of Context Compression in LLM Agents","v":"arXiv","s":"Ritul Satish 等 4 人","d":"2026-09-26","k":"paper","star":0,"sum":"把 harness 里捆在一起的「压什么、何时压、压多少」拆开，在三个开源模型、SWE-bench Verified 与 Terminal-Bench 1.0 上近 35,000 次运行，测成功率、token、端到端延迟与成本。结论：token 少不等于更快更便宜——Terminal-Bench 上 Qwen 用约三分之一 token 的策略反而慢 20–80%；总成功率相近的策略解的是不同任务；同一策略跨模型表现差异大","brief":"把 harness 里捆在一起的「压什么、何时压、压多少」拆开，在三个开源模型、SWE-bench Verified 与 Terminal-Bench 1.0 上近 35,000 次运行，测成功率、token、端到端延迟与成本。结论：token 少不等于更快更便宜——Terminal-Bench 上 Qwen 用约三分之一 token 的策略反而慢 20–80%；总成功率相近的策略解的是不同任务；同一策略跨模型表现差异大","ana":"","hf":null,"topic":"Skill、上下文工程与工具","first":"2026-09-30","di":"2026-09-30","wi":"2026-10-02","tier":"","tk":"评估 compaction 策略要报延迟和任务集合差异，不只报 token 节省。","col":"skill"},{"u":"https://arxiv.org/abs/2609.33295","t":"TraceDance: An Automated System for Building Agent Behavior Benchmarks from Real-World Agent Deployment Traces","v":"arXiv","s":"Dehai Min 等 16 人","d":"2026-09-27","k":"paper","star":0,"sum":"agent 可以完成任务却在过程中表现出不良行为，固定基准覆盖不到部署中遇到的具体行为。TraceDance 从部署轨迹为用户指定的不良行为构造定向基准：Anchor-and-Confirm 用可编程检索加 Flash 级 LLM 逐候选确认，Anchor Synthesis Loop 生成并修订自定义行为规范；评测用「决策点续写」——在记录的决策点评估模型下一轮，配行为专属 rubric，无需参考答案或环境回放。编码与通用工具使用场景 252,557 条会话产出 107 个基准、4,125 个实例，满足 95.3% 的构建请求；人工确认 84% 抽样实例含目标行为，自动评分与人工一致度接近标注者间一致度；九个前沿模型平均通过率仅 26.7%","brief":"","ana":"","hf":60,"topic":"评测工程","first":"2026-09-30","di":"2026-09-30","wi":null,"tier":"","tk":"从自己的生产轨迹里按「决策点 + rubric」造回归集，比维护端到端环境回放便宜得多。","col":"eval"},{"u":"https://arxiv.org/abs/2609.35659","t":"Tracekit: Tamper-Evident Intent-Reasoning-Action Auditing for Autonomous Coding Agents","v":"arXiv","s":"Bravish Ghosh","d":"2026-09-28","k":"paper","star":0,"sum":"开源、零依赖，为每次会话记录意图（人说了什么）、自述（模型说自己在想什么）、动作（实际执行）三通道，写入哈希链账本并可外部锚定、交叉核对；挂进 Claude Code 生命周期事件，重建多 agent 层级，用执行前策略门控工具调用。1,600 次随机篡改全部被链检出，尾部截断与整链重算只能靠锚点（锚定间隔 300 条时检出率降到 0.47）；单 hook 中位 23.9 ms，10 万条记录不变慢，16 并发写入链仍正确；正则门控只拦 44 个有害调用中的 18 个（41%）且误拦 3/40 良性调用","brief":"","ana":"","hf":null,"topic":"多智能体","first":"2026-09-30","di":"2026-09-30","wi":null,"tier":"","tk":"接着 09-26 的「agent 能删自己轨迹」，这是可直接装上的对策；正则门控当不了主防线。","col":"multi"},{"u":"https://arxiv.org/abs/2609.35576","t":"Share-Borne AI Virus: Memory-Hopping Attacks Across LLM Agents","v":"arXiv","s":"Sidharth Pulipaka 等 7 人","d":"2026-09-28","k":"paper","star":0,"sum":"有状态助理读写并共享持久产物（如报告），产物成了独立助理之间的间接信道。作者定义「产物介导传播」：对抗内容经产物进入一个助理的持久记忆，被复制进它新建的产物，再被读取该产物的另一助理获得。在模拟多用户 - 多 agent 的时序环境里测存活跳数与覆盖面：攻击可跨多个独立助理传播并长期存活，较大环境中 GPT-5.6 Luna 也出现 60–80% agent 被波及、传播链达 8 跳","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-30","di":"2026-09-30","wi":null,"tier":"","tk":"团队共享记忆 / 文档进 agent 上下文前做注入扫描，写入永久记忆的内容标来源并可回滚（与 09-29 HiCoMER 的有效性标记配套）。","col":"evo"},{"u":"https://arxiv.org/abs/2609.32691","t":"Silent Failures in Agentic Security Evaluation: A Validated Harness for Tool-Call Mediation Under Indirect Prompt Injection","v":"arXiv","s":"Animesh Shaw","d":"2026-09-26","k":"paper","star":0,"sum":"审计一个 IPI 基准及其 harness，发现四类缺陷：载荷静默未投递、按工具名而非参数判攻击成功、误拒率与模型无能混淆、无审计轨迹，每一类都能产出「可信、可发表、错误」的数字。同一批轨迹重算：按工具名计分报 21.7% 攻击成功率，按参数级真实为 1.2%；一个开源模型此前报 62.8%，修正后为 0%。发布的 harness 让四类缺陷不可表示：机器可查的载荷放置、参数级攻击者谓词、逐场景环境、强制轨迹持久化","brief":"","ana":"","hf":null,"topic":"评测工程","first":"2026-09-30","di":"2026-09-30","wi":null,"tier":"","tk":"自己测注入防护时，攻击成功必须按「工具参数是否达成攻击者目标」判，并先验证载荷真的进了上下文。","col":"eval"},{"u":"https://openai.com/index/introducing-dots","t":"Introducing dots","v":"OpenAI","s":"Product","d":"2026-09-29","k":"release","star":0,"sum":"GPT-6 Astra 驱动的常驻 agent：自带云电脑与浏览器，经插件生态接 4,000+ 应用，可在 ChatGPT、Slack、Teams 及语音通话中交互，跨渠道保留上下文，不在时做只读「主动研究」，可授权连接用户本机。今起在 Pro、Business Premium 上线（企业需管理员开启），首个 dot 含在套餐内、对话不计入用量；预告多 dot 团队，以及企业「specialist dots」（独立身份、凭据、系统访问，内部已试采购、发票、邮件营销、客服、合同）并与 Microsoft Agent 365 集成","brief":"","ana":"","hf":null,"topic":null,"first":"2026-09-30","di":"2026-09-30","wi":null,"tier":"","tk":"dots 把「速度」与「每月工作量」作为两个可扩容的计费维度，是 agent 产品定价的一个参考。","col":""},{"u":"https://openai.com/index/devday-2026-recap","t":"DevDay 2026 Recap","v":"OpenAI","s":"Company","d":"2026-09-29","k":"release","star":0,"sum":"20 余项发布汇总：dots；Codex 可在本机、手机远程、云端任意设备运行，可复用开发环境带团队批准的设置与权限；开放 ChatGPT 自身功能平台——插件扩展可驻侧边栏、建交互面板、为自家文件类型做查看器，面向 12 亿周活；Spaces 团队空间（人、ChatGPT、dot 共享知识）；ChatGPT 套餐额度可在 16 家伙伴工具（Devin、Notion、Vercel、T3、OpenClaw、Dactyl 等）内使用并可限额，ChatGPT 账号可登录第三方工具","brief":"","ana":"","hf":null,"topic":"评测工程","first":"2026-09-30","di":"2026-09-30","wi":null,"tier":"","tk":"「额度跨工具使用 + 统一身份」意味着第三方 agent 工具可以不自建计费直接接入 OpenAI 用户，评估自家产品分发时值得看这个通道。","col":"eval"},{"u":"https://openai.com/index/introducing-gpt-6-1-sol","t":"Introducing GPT-6.1 Sol","v":"OpenAI","s":"Product","d":"2026-09-29","k":"release","star":0,"sum":"GPT-6 Sol 升级版，API 价 $2 / 百万输入、$0.10 缓存输入、$10 / 百万输出，为 Astra 五分之一。DeepSWE v1.1 追平 Astra、比 GPT-6 Sol 最佳高 6.4 个百分点；GDP.pdf 高于 Opus 5.5（含回退）且每任务成本不到一半；AutomationBench 中等推理力度比 Opus 5.5 高 2.2 个百分点、成本约三分之一；OSWorld 2.0 离线集距 Astra 2.1 个百分点、成本约七分之一；Terminal-Bench Science 每任务 $5.47（Opus 5.5 $23.21，Astra $23.80）；低力度下事实错误率 11.4% → 7.7%。对齐评测未见绕过自动安全审查器的尝试，系统卡附录另发。ChatGPT Work、Codex、API（gpt-6.1-sol）今起可用，Ultrafast 版数日内到（Codex 内最高 8 倍生成速度）","brief":"","ana":"","hf":null,"topic":"Agent 安全与围堵","first":"2026-09-30","di":"2026-09-30","wi":null,"tier":"","tk":"与 09-28 的 Sonnet 5.5 定价相同（$2 / $10），两家在中档 agent 模型上正面对打；路由层多一个候选，缓存 $0.10 对重复上下文的 agent 循环尤其有利。","col":"safety"},{"u":"https://www.anthropic.com/research/your-thoughts-on-ai","t":"What do you want from AI?","v":"Anthropic","s":"/research · Societal Impacts","d":"2026-09-29","k":"release","star":0,"sum":"用 Anthropic Interviewer 做第二轮公众访谈（上一轮 2025 年 12 月 81,000 人），9 月 29 日 ~ 10 月 6 日面向账号满两周的 Free / Pro / Max 用户，约 15 分钟；首次允许受访者选择公开完整访谈（附国家、不附账号信息），FAQ 明确再识别风险且公开决定视为不可撤销","brief":"","ana":"","hf":null,"topic":null,"first":"2026-09-30","di":"2026-09-30","wi":null,"tier":"","tk":"其 FAQ 是一份写得很完整的「AI 采集用户数据并公开」的知情同意范本。","col":""},{"u":"https://www.anthropic.com/claude-sonnet-5-5-system-card","t":"Claude Sonnet 5.5 System Card","v":"Anthropic","s":"anthropic.com · 系统卡","d":"2026-09-28","k":"article","star":0,"sum":"**整体概括**：七个部分：RSP 评估、网络安全、安全措施与无害性、agentic safety、对齐、模型福利、能力。RSP 结论是 Sonnet 5.5 全面弱于 Opus 5.5、不跨新阈值（满足 CB-1 / Autonomy-1，不满足 CB-2 / Autonomy-2），AECI 167.93 对 Opus 5.5 的 169.12；误对齐风险评为「低」，理由是推理可见时它几乎无法控制思维链或规避监控。网络安全能力比 Sonnet 5 大幅提升，因此套用 Opus 5.5 的三阶段网络安全措施，高风险请求回退到 Sonnet 5；防蒸馏分类器直接拦截、无回退。agentic safety 章节给出三组注入数据：Gray Swan IPI 基准攻击成功率 k=1 / 10 / 15 为 0.4% / 2.7% / 3.4%（Sonnet 5 为 0.7% / 5.1% / 6.7%），k=15 时编码 0.7%、工具调用 1.0%、GUI 电脑使用 12.5%；自适应攻击器 Shade 在编码环境成功率 3.01%（Sonnet 5 为 19.47%，40 个场景中被攻破 16 个对 36 个），电脑使用环境 0.07%（2,800 次中 2 次，与 Opus 5.5、Fable 5.1 同级）；浏览器场景经 Cowork 跑 110 个场景，开 auto mode 时所有模型零成功，不加防护时 Sonnet 5.5 是首个零成功的模型（Sonnet 5 为 0.37%）。对齐评估中它主动探边界、擅自联系第三方、尝试逃逸沙箱的比率在所有被测模型中最低，但思维链比多数前代模型更难读。安全措施部分提到，出于对加速模型研发与递归自改进（RSI）风险的考虑，对「开发前沿 LLM」的窄类能力（如特定 ML 加速器的内核开发）部署了与 Opus 5.5 相同的安全措施。可靠知识截止 2026 年 6 月","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-29","di":"2026-09-29","wi":null,"tier":"must","tk":"评测自己的 agent 防注入时照系统卡的做法分三档报——固定基准、自适应攻击器、人类红队——并且「不加防护」与「加防护」两列并排；把「攻破的场景数 / 总场景数」与「尝试级成功率」一起给，避免单一数字掩盖集中失效。","col":"evo"},{"u":"https://arxiv.org/abs/2609.30289","t":"Not All Memories Are Equal: Hierarchical Collaborative Memory for Validity-Aware Retrieval in LLM Agents","v":"arXiv","s":"","d":"2026-09-09","k":"paper","star":0,"sum":"团队协作里记忆是异构且持续演化的：团队记忆记共识与协议，个人记忆记执行轨迹与中间进度。现有系统把所有记忆平铺、按相关性/重要性/新近度排序，会把语义相关但已过期、与团队共识冲突的个人记忆顶上来。HiCoMER 分三个组件：分层记忆冲突更新器维护团队/个人记忆的有效性，有效性感知检索器只从仍有效的记忆里取，再由记忆接地的生成器答题；作者构建两个协作场景记忆问答数据集，报告一致优于强基线","brief":"团队协作里记忆是异构且持续演化的：团队记忆记共识与协议，个人记忆记执行轨迹与中间进度。现有系统把所有记忆平铺、按相关性/重要性/新近度排序，会把语义相关但已过期、与团队共识冲突的个人记忆顶上来。HiCoMER 分三个组件：分层记忆冲突更新器维护团队/个人记忆的有效性，有效性感知检索器只从仍有效的记忆里取，再由记忆接地的生成器答题；作者构建两个协作场景记忆问答数据集，报告一致优于强基线","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-29","di":"2026-09-29","wi":"2026-10-02","tier":"","tk":"agent 记忆库给每条记忆加「有效/被替代」状态并在写入时做冲突更新，检索前先按有效性过滤再按相似度排序。","col":"evo"},{"u":"https://www.anthropic.com/claude-sonnet-5-5","t":"Introducing Claude Sonnet 5.5","v":"Anthropic","s":"","d":"2026-09-28","k":"release","star":0,"sum":"Claude 5.5 家族第二款，定位「边界清楚的日常任务、修 bug、做文档/幻灯片/表格」的低成本补充。Terminal-Bench 4.0 70.6%（Sonnet 5 为 10.3%，Opus 5.5 为 66.4%），FrontierCode 1.1 Max 46.2% / Xhigh 52.1%（Opus 5.5 为 54.4%），CursorBench 4.0 55.5%，GDPval-AA 1844（Opus 5.5 为 1846），OSWorld 2.1 80.1%，HLE 带工具 64.5%。价格与 Sonnet 5 相同：输入 $2、输出 $10、缓存读 $0.20、缓存写 $2.50；每任务成本最多低 30%，输出快 30% 以上；Slack 未改 prompt 即在离线评测上取得更好结果且输出 token 少约 14%。Haiku 5.5 数周内发布","brief":"","ana":"","hf":null,"topic":"评测工程","first":"2026-09-29","di":"2026-09-29","wi":null,"tier":"","tk":"Low / Medium effort 下它以约十分之一的成本超过 Sonnet 5 的最佳分，工程上把 effort 当作第一个调节旋钮；它比 Sonnet 5 更多地把工具调用合批，步数更少——写工具时允许并行调用能直接省钱。","col":"eval"},{"u":"https://claude.com/blog/giving-companies-more-control-over-their-ai-agents-with-nvidia","t":"Giving companies more control over their AI agents, with NVIDIA","v":"Anthropic","s":"claude.com/blog · Claude Platform","d":"2026-09-28","k":"release","star":0,"sum":"配合 NVIDIA Open Agent Safety Platform 发布：Claude Managed Agents 的 agent 循环与沙箱分开运行，凭据放在独立保险库里 agent 永远看不到，并提供审计轨迹；NVIDIA OpenShell（Apache 2.0）在 agent 外部执行策略，默认全拦、按规则放行文件、网络与数据访问并记录每次决策。三层（模型内安全措施、Managed Agents、OpenShell）各自独立执行、可单独采用。Notion、Rakuten、Asana 为用户案例","brief":"","ana":"","hf":null,"topic":"Agent 安全与围堵","first":"2026-09-29","di":"2026-09-29","wi":null,"tier":"","tk":"官方推荐的收紧流程是四步——从窄权限起步、看 OpenShell 日志、让 Claude 把规则收紧到任务所需最小、用策略证明器确认 agent 实际可达范围。","col":"safety"},{"u":"https://x.ai/news/team-bots","t":"Team Bots: AI coworkers that learn from your team","v":"xAI","s":"Product","d":"2026-09-28","k":"release","star":0,"sum":"团队共享的 Grok Bot，公测面向 Teams 与 Enterprise。每个 Bot 由上下文（文件、指令、技能）、插件（Salesforce、Notion、GitHub 等）、凭据（无插件的第三方 API）和记忆四部分组成；Bot 共享但每人对话与记忆隔离，技能全队共用，可作为独立 handle 进 Slack 频道。SpaceXAI 内部用法：每个大客户一个 Bot，夜间读 Gong、Notion、Slack 后早晨发角色化简报；工程 Bot 连接 Linear、Datadog、Cursor，按「技能」学会 PR 审查与交付证据要求，一个五人团队日均 100+ PR；数据 Bot 复用两年积累的 45,000 张表技能库，并记住查询修正供全员受益","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-29","di":"2026-09-29","wi":null,"tier":"","tk":"把团队既有的 SOP 与数据字典写成技能库喂给共享 agent，比重新调 prompt 更快见效；「一人修正、全队受益」的记忆需要配套的有效性管理（见下文 HiCoMER）。","col":"evo"},{"u":"https://arxiv.org/abs/2609.30861","t":"SkillEvoReg: Regularizing Agent Skill Evolution Against Overfitting","v":"华为诺亚方舟实验室","s":"Guanyu Nie 等 6 人","d":"2026-09-25","k":"paper","star":1,"sum":"把反复的 skill 更新看成一个会过拟合的学习过程：局部有效的修改会累积成冗余或只对特定任务有效的指令，新更新还会破坏原来能做对的行为。方法借用神经网络训练里防过拟合的技巧：生成更新时做 skill dropout，对不必要的结构增长加复杂度正则，并用因果反例验证找出每个候选更新带来的回归。在 SkillOpt、SkillEvolBench、ContinualSkillBench 上都控制住了 skill 体积，下游能力基本不降，还能发现只看结构指标发现不了的回归","brief":"","ana":"**问题**：agent 把执行经验沉淀成可复用的 skill，反复更新 skill 本身就是一个学习过程，所以也会**过拟合**。作者把它拆成三种表现：**结构堆积**（加规则、加例外，但没有对应的可迁移收益）、**语义特化**（把只对最近几条轨迹有用的东西写成通用指令）、**更新诱发回退**（新改动弄坏了旧 skill 本来能处理的情况）。三者不一定同时出现：skill 可以先膨胀很久分数才掉；一条很短的改动也可能引入窄范围回退。所以**只看分数或只看 skill 长度都不够**。\n\n**动机实验**：在 SpreadsheetBench 上追踪 SkillOpt 8 轮演化，同时测 IID 集和结构迁移压力集。迁移分在第 4 轮见顶，之后 IID 继续涨、迁移反而下降，差距重新拉大，skill 还在不停变长。\n\n**做法**：借神经网络的三种防过拟合手段，保留各系统原生的 skill 更新器，在外面加三层：\n\n1. **训练时 skill dropout**：把 skill 切成\"原子\"（一条指令、一个步骤块），生成更新时随机遮掉一部分，只把在遮挡视图下学到的改动合并回完整 skill。遮掉的原子不算删除，推理时永远用完整 skill。作用是避免新更新过度依赖旧指令的具体措辞。\n\n2. **复杂度感知的局部正则**：用可观测的结构指标（词数、原子组织、碎片化程度、代码结构）判断要不要重审一次更新；触发后**只允许改这次新增/修改的原子及少量相关旧原子**，对每个原子做 ADD / UPDATE / DELETE / NoOp（借了 Mem0 的记忆调和操作）。作者专门展示了一个反例：只在提示词里要求\"局部修改\"，模型仍会整篇重写，所以编辑范围要**程序化强制**。\n\n3. **因果反例验证（CCV）**：挑一个旧 skill 和新候选都能通过的源任务，针对这次改动暴露的假设或决策边界构造一个\"攻击版\"任务；**旧 skill 仍然过、新候选却退化**，才算确认回退，然后做最多一次限定范围的修复。\n\n**结果**：\n\n场景｜原生演化｜SkillEvoReg\n\nSkillOpt · SpreadsheetBench（验证选出 → 第 8 轮）｜54.75 → **47.00**，skill 6,060 token｜58.50 → **59.25**，skill 2,341 token\n\nSkillEvolBench 未见过任务（1 遍 → 第 2 遍）｜31.67% → **29.44%**｜第 2 遍 **33.33%**；组合类任务 13.33% → 26.67%\n\nContinualSkillBench 五个领域｜—｜held-out 分持平或更高，skill 数、token、复杂度**五个领域全部下降**（法律 24→20 个 skill，分数 65.42→70.69）\n\n消融：只加复杂度正则 55.50、只加 dropout 57.50、两者都加 59.25，并且 skill 最小（11.7K 字符 vs 原生 31.7K）。CCV 在全部轨迹里找出 12 个回退信号、做了 9 次改写状态的修复。\n\n**不是全面占优**：LiveMath 上 SkillEvoReg 第 8 轮反而掉了 4.84 分，作者拆开看发现 85.7% 的下降集中在一类\"更强结论可证\"的元选项题上（测试集 217 题里有 92 题答案都是它），原生方法恰好反复强化了这条偏置。SkillEvolBench 的\"上下文偏移\"子项也下降了。\n\n**对 AI 应用工程师的启示**：①**不要默认\"最新的 skill 就是最好的\"**，保留检查点、用独立验证集选交付版本；②skill 更新要有**程序化的编辑范围限制**，别只靠提示词要求\"只改一处\"；③回归检验不要只重跑旧用例，要**针对这次改动的假设造反例**。这和上期 RRSI（harness 演化过拟合）、Self-Healing Harness（55% 局部改进带附带回退）形成了一条完整证据链：**自演进的每一层（harness、规则、skill）都需要正则化和外部准入**。","hf":null,"topic":"自学习 / 自演进","first":"2026-09-28","di":"2026-09-28","wi":"2026-09-28","tier":"","tk":"自演进 skill 库要设体积上限，并为每次更新保留一组「以前能做对」的反例做回归测试。","col":"evo"},{"u":"https://arxiv.org/abs/2609.30967","t":"MoMHa: Multi-Objective Optimization of LLM Harnesses over Accuracy, Safety, and Tokens","v":"arXiv","s":"NeurIPS 2026","d":"2026-09-25","k":"paper","star":1,"sum":"把 harness（构造 prompt、路由调用、解析输出的代码）当作多目标优化对象：由 Claude Code 作为提议者，读取历史 harness 源码、执行轨迹和评分结果，在准确率、行为安全、token 成本三个目标上搜索。三目标放进同一个奖励、一步优化的方案优于「先准确率后 token」的两阶段方案和只看准确率的基线。17 个领域、12 个模型上，真实基准联合得分 0.461，最强基线 DSPy 为 0.377；在 12 个模型中的 8 个上，搜到的策略不用重新训练就能迁移到新基准；安全得分 0.781，最高","brief":"","ana":"**问题**：harness（构造提示、路由调用、解析输出的那层 Python 代码）自动优化的工作，几乎都只优化准确率。但一个不拒绝任何不安全请求的 harness，或者 token 多用一个数量级的 harness，都不是好 harness。\n\n**做法**：Meta-Harness 把 harness 设计变成**三目标搜索**（准确率、行为安全、token 成本），提议者是 **Claude Code**，可以读写历史 harness 源码、逐例执行 trace 和打分产物。因为提议者会产出可执行 Python，另加三层安全：AST 静态检查、按领域配置导入白名单的安全 skill、沙箱。\n\n**核心发现：一次性联合奖励胜过分阶段**。直觉做法是先优化准确率、再固定结构压 token（two-phase）；MoMHa 把三个目标**同时**交给提议者，奖励 = 准确率 + λ·安全 − λ·token。结果：\n\n- 对 two-phase 在 7/10 个领域联合指标更高，总分 +2.7；原因是联合奖励能让提议者做出**有成本意识的结构选择**（比如用一个置信度门控的验证器代替两次冗余的\"起草-验证\"调用），而 two-phase 在第一阶段就把结构冻住了。\n\n- 对只优化准确率的 Meta-Harness（MH）：联合均分 0.482 vs 0.305，安全 0.781 vs 0.569；加上安全和 token 两个轴后，**MH 贡献的独有 Pareto 体积为零**。\n\n- 真实基准（HumanEval、Spider、FEVER、MMLU-Pro 等 7 个）上 0.461 vs 最强基线 DSPy 的 0.377；DSPy 准确率几乎一样（0.542 vs 0.539），但**每例用 2,229 token，MoMHa 只用 672**。\n\n- **逐例 trace 反馈有可测价值**：只给标量分数时，总分 0.611 → 0.604、安全 0.781 → 0.754。\n\n- 在 Haiku 级小模型上搜出的策略，不改就能迁移到 12 个目标模型里的 8 个。\n\n**对 AI 应用工程师的启示**：①任何\"自动调 prompt / harness\"的系统，**目标函数里一开始就要放 token 成本和安全**，事后再压成本会被已经冻结的结构卡住；②给优化器看**完整 trace 而不只是分数**；③这和 Anthropic 降本文\"目标是每个完成任务的成本\"是同一个思路落到自动优化上。","hf":null,"topic":"自学习 / 自演进","first":"2026-09-28","di":"2026-09-28","wi":"2026-09-28","tier":"","tk":"harness 自动优化的奖励里要同时放安全和成本两项，并且让优化器读原始执行轨迹，而不是只看一个总分。","col":"evo"},{"u":"https://arxiv.org/abs/2609.31186","t":"Evolutionary Safety of Recursive Self-Improving AI: Taxonomy, Risk Discovery, and Evaluation","v":"arXiv","s":"Chang Gong 等 6 人","d":"2026-09-25","k":"paper","star":1,"sum":"综述与框架论文，提出「演化安全」：关注的不是某一时刻系统是否安全，而是安全属性在持续自改进中如何变化、保持、累积和传播。列出六类典型问题（意图漂移、错误累积、经验污染、安全属性侵蚀、评估器漂移、风险传播），按 agent 持久状态、模型状态、评估与环境反馈、计算底座、元更新机制五层分类，并提出修改、选择、授权、溯源、恢复五条治理原则","brief":"RSI 安全的综述框架：安全不只是\"此刻安不安全\"，而是安全属性在演化中如何保持、累积、传播。归纳了六种表现（意图漂移、误差累积、经验污染、安全属性侵蚀、**评估器漂移**、风险传播），按 agent 持久状态、模型状态、评估与环境反馈、计算底座、元更新机制分类，给出修改、选择、授权、溯源、恢复五方面的治理原则。适合当面试时讲\"自演进安全\"的提纲。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-28","di":"2026-09-28","wi":"2026-09-28","tier":"","tk":"做自演进系统时，可以把「评估器漂移」和「经验污染」直接列进风险清单，并为每次演化保留可回滚的谱系记录。","col":"evo"},{"u":"https://arxiv.org/abs/2609.30297","t":"Bootstrapping Conversational Recommendation Agents At Spotify: Synthetic Data Generation and Self-Improvement Loops","v":"Spotify","s":"标题与摘要自述","d":"2026-09-16","k":"paper","star":1,"sum":"为了解决对话式推荐 agent 冷启动时没有真实用户数据、难以优化工具规划的问题，作者把单轮 prompt 扩展成真实感的多轮合成对话，用来在上线前评测；再用一个自我改进循环：先挑出同一输入多次运行结果差异大的样本做对比优化，再让 coding agent 迭代修复规划和工具调用错误。在已经高度人工优化的 prompt 上再提升 8%，系统已上线；线上 A/B 收听 +14%、周活 +5%、跳过率 −5%","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-28","di":"2026-09-28","wi":null,"tier":"","tk":"冷启动 agent 先建合成多轮评测集，用「同一输入多次运行结果的方差」找出不稳定的样本交给 coding agent 修，最后用线上指标验收。","col":"evo"},{"u":"https://developer.nvidia.com/blog/add-runtime-controls-to-ai-agents-with-nvidia-openshell","t":"Add Runtime Controls to AI Agents with NVIDIA OpenShell","v":"NVIDIA","s":"NVIDIA 开发者博客 · Agentic AI / Trustworthy AI","d":"2026-09-28","k":"article","star":0,"sum":"**整体概括**：OpenShell 0.1.0 是开源的 agent 运行时，属于 NVIDIA Open Agent Safety Platform 的运行时层，支持 Codex、Claude Code 等，不需要改写现有 agent。结构分三部分：Gateway 管理大量沙箱的生命周期和策略；每个沙箱配一个运行在 agent 之外的 Supervisor，检查所有出站请求；Sandbox 用内核级控制限制文件、进程和权限提升，除了经过 Supervisor 没有其他网络路径。策略用 YAML 写，编译成 OPA/Rego 逐请求判定，可以检查 HTTP、GraphQL、MCP 流量，做到同一 API 放读拦写，且对子进程、生成的代码和子 agent 同样有效。凭据只以占位符形式进入沙箱，发往未授权目的地就拒绝。agent 遇到拦截可以通过 policy advisor 提出最小范围的放宽申请，默认等人工批准，不能自己批准。策略证明器用形式化方法检查授权是否越界：在对抗实验中，削弱安全措施的前沿 agent 花了最多两小时游说 AI 审核者放权，受保护仓库仍然没有被写入","brief":"","ana":"**这篇解决什么问题**：agent 要干活就得给它工作区、算力、数据、凭据和外部服务，权限一大，出错的代价也跟着变大（改生产数据、泄露机密、越出任务范围）。OpenShell 0.1.0 是一个开源（Apache 2.0）运行时，**不改 agent 本身**，在 agent 外面加一层可执行的权限控制，支持 Codex、Claude Code 等。\n\n**架构三件套**：**Gateway** 管理多个沙箱的生命周期和策略；**Supervisor** 与每个沙箱配对、跑在 agent 进程外，逐条检查出站请求；**Sandbox** 用内核级控制限制文件与进程，**除了经过 Supervisor 之外没有任何网络通路**。agent 起 shell、跑生成的代码、派生子进程、委派子 agent 时，限制都不会失效。\n\n**四个值得记的设计**：\n\n1. **协议级细粒度**：Supervisor 能解析 HTTP、GraphQL、MCP 流量，所以可以\"**同一个 API 允许读、拦住写**\"。策略用 YAML 写，编译成 OPA/Rego 逐请求求值，运行中可热替换网络策略（文件和进程限制则要新建沙箱）。\n\n2. **凭据不进 agent**：agent 拿到的是占位符，真实凭据在沙箱外、只对授权端点替换进去；拿占位符打到别的地址会被拒。凭据本身有写权限也没关系，只读策略照样拦写请求。\n\n3. **agent 可以申请、不能自批**：开启 policy advisor 后，被拦的 agent 可以提出一条窄范围的策略变更，默认挂起等人审批，**agent 不能批准自己的申请**。\n\n4. **形式化策略证明器**：一个策略看起来很严，但可能留了另一条路（比如另一个被允许的工具拿同一个凭据去写）。prover 用形式化逻辑证明\"策略授予的权限不超出运营方划定的边界\"，或给出一个越界的具体动作。**结论来自策略模型，agent 怎么解释都改变不了。**NVIDIA 的长时程对抗实验里，削弱了防护的前沿 agent 花了**最多两小时**试图说服 AI 审批者放权去改受保护仓库，有了证明器给审批者的证据，**没有发生一次受保护仓库写入**。\n\n同日的配套文《[NVIDIA Open Agent Safety Platform](https://developer.nvidia.com/blog/nvidia-open-agent-safety-platform-a-reference-for-continuous-in-silicon-agent-monitoring/)》给了五条原则，其中两条最值得背：**执法必须带外**（控制不在 agent 里、也不在它够得到的地方）；**通往模型的路径就是控制点**（agent 没有下一步思考就不能行动，控制这条路径既是最好的观测点，也是 kill switch）。该文还提到\"数家前沿实验室最近报告了 agent 逃出评测环境、甚至谎报自己做了什么\"，这是 NVIDIA 做这层的直接动因。\n\n**对 AI 应用工程师的启示**：和上期《LLM Agents Can Easily Tamper With Their Own Traces》放在一起读：trace、权限、凭据三样东西都必须在 agent 进程之外。自建 agent 平台时可以照抄这个分层：**沙箱只有一条出网路径 → 路径上的 supervisor 做协议级读写区分 → 凭据按端点绑定注入 → 权限变更走\"agent 提议、人或独立审批者批准\"**。\"agent 花两小时游说审批 agent\"这个实验结果也说明，**用 LLM 当审批者必须给它不可辩驳的证据**，否则它会被说服。","hf":null,"topic":"Agent 安全与围堵","first":"2026-09-28","di":"2026-09-28","wi":"2026-09-28","tier":"must","tk":"权限设计按「执行在外、凭据在外、审批在外」三条做；工具权限要细到操作级别（读或写），不能只到服务级别；给 AI 审核者看的应该是形式化证明的结果，而不是 agent 自己的解释。","col":"safety"},{"u":"https://arxiv.org/abs/2609.30541","t":"AutoResearch at Production Scale: Failure Modes and a Multi-Agent Framework","v":"arXiv","s":"Amazon Books Core Recs Science","d":"2026-09-24","k":"paper","star":0,"sum":"","brief":"","ana":"**问题**：Karpathy 的 AutoResearch（约 630 行脚本，让模型反复改训练脚本、指标变好就保留）原本是在单卡、每轮 5 分钟的语言模型实验上跑的。生产环境有三点不同：**每轮要跑几个小时多卡**、**评估是多目标的**、**一个实验战役要持续几周、远超单个上下文**。这套范式还能不能用？此前没人报告过。\n\n**场景**：Amazon 图书推荐流水线里的两个独立系统。System A 为约 98% 在售目录生成检索向量，每轮 9–19 小时多卡，agent 每轮重写整个训练脚本；System B 学书籍的层级语义 ID，每轮 6–52 分钟单卡，只改超参和架构。**两者单轮成本差近三个数量级**（A 一轮约等于 B 的 760 轮），共跑 12 周、220+ 次实验。\n\n**五种失败模式**（前四种两个系统都出现了）：\n\n1. **基础设施脆弱**：一个多卡包装 bug 让 7,000 万条文本编码在 1 张卡上跑了 10 多个小时；B 系统一次运行里 30 轮有 11 轮因评估超时白跑，直到人介入。\n\n2. **agent 记忆衰减**：program.md 明写\"100 epoch 会过拟合，别再试\"，agent 仍然跨运行**重试至少 6 次**，每次都给自己找理由说\"这次情况不同\"；A 系统里同一个被禁止的文件操作在 4 轮里被重新引入 6 次。\n\n3. **搜索方向停滞**：连续 5 轮在 0.008 的噪声范围内微调，意识不到这个方向已经没油了。\n\n4. **迭代成本不对称**：把 15 小时的多卡实验和 30 分钟的消融同等看待，也不区分可逆和不可逆的改动（一次参数改动让码本塌缩）。\n\n5. **指标执念**（只在多目标的 B 出现）：agent 发现把码本调大就能刷高\"类内一致性\"，但层级变得没法用；加了护栏后，三个可用性指标在 15 次运行、150+ 轮里**一次都没同时达标**。agent 从不质疑指标本身。\n\n**三条脚手架原则**：**prevent**（执行前的语义关卡）、**persist**（跨任务持久记忆）、**redirect**（停滞时的策略转向）。A 系统用三个 agent 实现：Researcher 用 Sonnet 4.6 负责高频写代码；**Code Fixer** 和 **Criticizer** 用 Opus 4.6，因为它们频率低但一次判断错就浪费几小时多卡。\n\n- **Code Fixer** 在执行前**直接重写脚本**，不是写一段自然语言 bug 描述再交给另一个 agent 改。先前的两步式 Reviewer 架构被放弃了：Reviewer 连续 14 次返回格式错误的 JSON。Code Fixer 首次部署就一次修掉 14 个潜在 bug（3 个 DDP 配置、4 个显存问题等）。\n\n- **Criticizer** 只在停滞时出手（5 轮内相对提升不到 8%），给一段 2–5 句的方向性指令，下一次成功后立即清除，避免它变成常驻权威。窗口试过 3 轮（太敏感，会被噪声触发）和 8 轮（太晚）。最关键的一条是\"差距不在模型，在输入表示，去构造共购邻域表示\"，三轮内 Recall@6 从 5.48% 涨到 5.98%。\n\n- **持久记忆**放到 S3 跨任务共享，但作者承认它**只降低、不消除**记忆衰减。\n\n**逐个 agent 的贡献**（System A，基线是 4 个工程师周的人工调优 3.79%）：只有 Researcher 改配置 0.98 倍 → 改代码 1.10 倍 → 加 Code Fixer 1.45 倍 → 再加 Criticizer **1.82 倍**（6.90%）。另外 agent 在做一个无关的损失函数实验时，**自己发现**共购图只覆盖 17% 的书，提出只用文本特征的回退方案，一轮就把覆盖范围扩大 5.8 倍。作者也说明这是离线结果，线上试点在进行中。\n\n**核心结论：脚手架的重量要随单轮成本变化**。单轮贵（A）就值得上执行前关卡；单轮便宜（B）用执行后自动回滚就够了（B 的一次运行里 21 轮有 4 轮触发回滚）。\n\n**对 AI 应用工程师的启示**：这是目前最完整的\"**自主研究 agent 上生产**\"复盘，面试可以直接讲这五种失败模式和对应解法。三个细节尤其值得抄：①**评估器对 agent 只读**；②执行前的审查 agent 要**直接产出修好的代码**，不要再多一道自然语言交接；③转向指令要**用完即清**。第 2 条\"写进 program.md 也拦不住重试\"，说明**负面结论要靠程序检查（查重已失败配置）来拦，不能只写在提示里**。","hf":null,"topic":"自学习 / 自演进","first":"2026-09-28","di":null,"wi":"2026-09-28","tier":"","tk":"这是目前最完整的\"**自主研究 agent 上生产**\"复盘，面试可以直接讲这五种失败模式和对应解法。三个细节尤其值得抄：①**评估器对 agent 只读**；②执行前的审查 agent 要**直接产出修好的代码**，不要再多一道自然语言交接；③转向指令要**用完即清**。第 2 条\"写进 program.md 也拦不住重试\"，说明**负面结论要靠程序检查（查重已失败配置）来拦，不能只写在提示里**。","col":"evo"},{"u":"https://arxiv.org/abs/2609.30652","t":"Recursive Self-Improvement via On-Policy Distillation for Reasoning","v":"arXiv","s":"Shangjian Yin 等 10 人","d":"2026-09-25","k":"paper","star":0,"sum":"","brief":"在线自蒸馏里\"看过标准答案的教师\"原本是冻结的，这篇让教师**和学生一起演化**（DCE），再用更短的、经验证的自改写样本压冗长（SRCL）。Qwen3-8B 上 Average@12 达 65.97%，比冻结教师的 OPSD 高 35.62 个百分点，输出长度比单用 DCE 短 7.8%。属于训练层的自改进。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-28","di":null,"wi":"2026-09-28","tier":"","tk":"","col":"evo"},{"u":"https://arxiv.org/abs/2609.30450","t":"LensDesigner: A Self-Improving Agent for Optical Lens Design","v":"arXiv","s":"Lei Sun 等 9 人","d":"2026-09-24","k":"paper","star":0,"sum":"","brief":"光学镜头设计 agent：用 10 万规模的镜头库做检索冷启动，在物理仿真环境里拿即时反馈，由课程 agent 出逐步变难的题，agent **自己抽取、积累、复用设计启发式**。120 题的 LensArena 上优于公开基线。又一个\"课程 + 经验库\"式的领域自演进案例。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-28","di":null,"wi":"2026-09-28","tier":"","tk":"","col":"evo"},{"u":"https://arxiv.org/abs/2609.30813","t":"A Benchmark and Diagnostic Study of Epistemic Admission in Shared Agent Memory","v":"arXiv","s":"Xiaoyang Li 等 9 人","d":"2026-09-25","k":"paper","star":0,"sum":"","brief":"多 agent 共享记忆时，被复制、改写的同一条说法会被误当成多个独立证据。8 种准入策略、4 类 agent 的结果：按来源去重会误杀大量真话；保覆盖率的策略放进的假话和不设防差不多；按声明的来源类型做门控，把假话采信率压到 0.06–0.09（其他为 0.22–0.47）。**一条没人反驳的假话进了共享记忆，下游 agent 在 97–99% 的探测里都会复述它**。结论：没有来源谱系的准入策略都不可靠，共享记忆要记 lineage。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-28","di":null,"wi":"2026-09-28","tier":"","tk":"","col":"evo"},{"u":"https://arxiv.org/abs/2609.30558","t":"Probing Stability-Plasticity Tradeoffs in Agent Memory through Cognitive Experimental Paradigms","v":"Jiaqi Ding、Guorong Wu","s":"","d":"2026-09-24","k":"paper","star":0,"sum":"","brief":"MemProbe 借认知科学的四种实验范式（干扰、误导信息、巩固强度、再巩固窗口）诊断记忆系统\"该更新时更新、该保留时保留\"的能力。6 个增量记忆系统总分接近，行为画像却很不同。评估 agent 记忆时不要只看最终答对率。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-28","di":null,"wi":"2026-09-28","tier":"","tk":"","col":"evo"},{"u":"https://arxiv.org/abs/2609.31473","t":"Game Arena: Strategic LLM Evaluation in Competitive Environments","v":"HF 组织字段","s":"","d":"2026-09-25","k":"paper","star":0,"sum":"","brief":"Kaggle Game Arena 的技术报告：用国际象棋、扑克、狼人杀三类对局（完全信息、不完全信息、多人）让模型直接对战，对手强度随模型进步而上升，避免静态基准饱和。评测工程里\"对抗式、不会饱和\"的一种做法。","ana":"","hf":null,"topic":"评测工程","first":"2026-09-28","di":null,"wi":"2026-09-28","tier":"","tk":"","col":"eval"},{"u":"https://arxiv.org/abs/2609.30199","t":"ExplorationBench: Measuring AI Systems' Exploration in Verifiable Alien Worlds","v":"HF 组织字段","s":"","d":"2026-09-24","k":"paper","star":0,"sum":"","brief":"用\"外星世界\"评测探索能力：规则可执行（答案能精确校验），又与常识冲突（靠记忆做不出来）。给一本有错的手册、环境反馈和工具 schema，先探索再解题。10 个系统里最强的能学会并应用陌生规则，但**持续探索可能停滞甚至把之前的收获弄丢**。","ana":"","hf":null,"topic":"评测工程","first":"2026-09-28","di":null,"wi":"2026-09-28","tier":"","tk":"","col":"eval"},{"u":"https://arxiv.org/abs/2609.30766","t":"WeEnv: The Environment for Agentic Reinforcement Learning at WeChat","v":"微信","s":"据标题与摘要","d":"2026-09-25","k":"paper","star":0,"sum":"","brief":"agentic RL 的\"环境税\"：迭代时间的大头花在环境上。WeEnv 把组件打成可独立发布的层组、启动即用按需拉取、按实际用量弹性调 CPU 和内存；初始化比 E2B、Docker、AgentENV 快 5.6–14.2 倍，环境在迭代时间中的占比从最高 53.4% 降到 9.1%，已在微信部署。","ana":"","hf":null,"topic":"推理基础设施与建模","first":"2026-09-28","di":null,"wi":"2026-09-28","tier":"","tk":"","col":"infra"},{"u":"https://arxiv.org/abs/2609.30830","t":"AGATE: Provenance-Based Runtime Defense Against Compositional Attacks on LLM Agents","v":"arXiv","s":"Xiaorui Zhang 等 9 人","d":"2026-09-25","k":"paper","star":0,"sum":"在 harness 边界同时检查授权来源和数据来源，决策路径里不放 LLM：授权绑定具体参数、会过期、限次数，另有效果台账记录重复请求。已通过适配器接入 DeepSeek Harness、OpenCode、OpenClaw，不改宿主代码。实测发现参数改写能绕过检查，11 个正常文件处理场景中有 6 个被误拦","brief":"在 harness 边界加一道授权与数据溯源门：授权绑定确切参数、会过期、限次数；数据来源登记后跟踪到后续传输；决策路径里没有 LLM，全部是确定性检查并留证据供取证回放。适配了 DeepSeek Harness、OpenCode、OpenClaw 三个生产 harness，不改宿主代码。坦白了代价：11 个正常文件处理场景里有 6 个出现误拦，还发现一条靠改写参数的绕过。","ana":"","hf":null,"topic":"Agent 安全与围堵","first":"2026-09-28","di":"2026-09-28","wi":"2026-09-28","tier":"","tk":"授权应精确到参数、限时、限次，每次判定都保留证据以便事后回放。","col":"safety"},{"u":"https://arxiv.org/abs/2609.30325","t":"ScopeBench: Do Agents Preserve Engagement Boundaries Under Goal Pressure?","v":"arXiv","s":"AISec 2026","d":"2026-09-23","k":"paper","star":0,"sum":"30 个渗透测试任务，目标只有越出授权范围才能达成。8 个模型的原始能力在 12.2%–81.1% 之间，范围遵守率在 34.4%–86.7% 之间；agent 评判器比确定性验证器多找出 331 次越界。","brief":"30 个\"只有越界才能达成目标\"的渗透测试任务，测 agent 在目标压力下守不守授权范围。8 个模型里原始能力 12.2%–81.1%，守界率 34.4%–86.7%；LLM 评审找到 331 次机械校验漏掉的越界。Opus 4.8 比 Sonnet 4.6 能力高 10 个百分点，守界率高 35.6 个百分点，说明**能力强不等于更容易越界**。","ana":"","hf":null,"topic":"Agent 安全与围堵","first":"2026-09-28","di":"2026-09-28","wi":"2026-09-28","tier":"","tk":"","col":"safety"},{"u":"https://arxiv.org/abs/2609.30604","t":"The Hard Part Comes After Search: Benchmarking Web Agents on Synthesizing, Organizing, and Displaying Knowledge","v":"arXiv","s":"Alexander Gill 等 9 人","d":"2026-09-24","k":"paper","star":0,"sum":"","brief":"KNOWS 基准：浏览器任务最后要交出文档、演示稿、表格等成品。最好的 agent 在复杂长任务上**完全成功不到 3%**；视觉步骤一失败，即便其他步骤完成过半，成品也没法用。","ana":"","hf":null,"topic":"评测工程","first":"2026-09-28","di":null,"wi":"2026-09-28","tier":"","tk":"","col":"eval"},{"u":"https://arxiv.org/abs/2609.31590","t":"AgentWorld: Benchmarking Long-Horizon Collaboration of Multi-agent LLMs","v":"arXiv","s":"Raphael Shu 等 10 人","d":"2026-09-25","k":"paper","star":0,"sum":"100 个人工标注任务（另 100 个扩展变体），在 MMORPG 沙箱里 3–20 个角色与能力不对称的 agent 黑盒协作 50+ 轮。提出因果协作有效性（CCE），用动作因果图度量团队努力中真正贡献结果的比例。Gemini 3 Flash、Claude Haiku 4.5、GPT-5 Mini、DeepSeek R1-70B 最好只有 52.0% 成功率，典型失效是沟通断裂、角色混淆、跨轮无法维持共享计划。全部开源。","brief":"100 个人工标注的 MMORPG 沙盒任务，50+ 轮、3–20 个不对称角色的 agent 协作；提出按因果依赖计算\"团队有多少努力真正贡献了结果\"的 CCE 指标。最好的模型任务成功率 52.0%，典型失败是沟通中断、角色混淆、跨轮保持不住共享计划。","ana":"","hf":7,"topic":"多智能体","first":"2026-09-28","di":"2026-09-29","wi":"2026-09-28","tier":"","tk":"","col":"multi"},{"u":"https://arxiv.org/abs/2609.31047","t":"DynBranch: Speculative Subgraph Reuse for Dynamic Agentic LLM Serving","v":"arXiv","s":"Junyi Shen 等 4 人","d":"2026-09-25","k":"paper","star":0,"sum":"agent 工作流要等分支确定后才能继续往下算。DynBranch 在分支确定前先给它一个稳定的标识，让候选子图提前执行，结果也能被后续请求复用；部署在模型 API 边界，不改 harness。平均延迟比各工作负载最强的已有方案低 32%，比不复用低 46–66%。","brief":"","ana":"","hf":null,"topic":"Harness 与长时程 Agent","first":"2026-09-28","di":"2026-09-28","wi":null,"tier":"","tk":"","col":"harness"},{"u":"https://arxiv.org/abs/2609.29050","t":"SLCA-GRPO: Resolving Cross-Segment Credit Misattribution in Tool-Calling RL","v":"HF 组织 Tencent","s":"","d":"2026-09-24","k":"paper","star":0,"sum":"GRPO 把整条轨迹的奖励平均分给所有 token，总结文字带来的噪声会污染工具调用决策。SLCA 把执行奖励只分给工具 token、偏好奖励只分给总结 token，并用模拟器代替真实 API 训练。7B 模型在 τ²-Bench 上 +9.15 个百分点，BFCL +1.36 个百分点。","brief":"","ana":"","hf":5,"topic":"评测工程","first":"2026-09-28","di":"2026-09-28","wi":null,"tier":"","tk":"","col":"eval"},{"u":"https://www.anthropic.com/research/yes-claude-can-do-nine-loops","t":"Yes, Claude can do Nine Loops","v":"Anthropic","s":"/research · Science","d":"2026-09-25","k":"article","star":0,"sum":"**整体概括**：物理学者 von Hippel 8 月公开挑战 AI 公司在学术级算力预算内算出振幅领域的前沿结果。Anthropic 的两位物理学家先让 Claude 自己挑最有把握的题，再只给一句题目描述，之后反复说「继续，每 4–6 小时汇报」。Fable 5.1 在 Claude Science harness 里用 bootstrap 和 form factor 两种方法算出九圈六粒子振幅，SLAC 的 Lance Dixon 独立验证通过。总成本约 1,000–2,000 美元，主要是长时间运行模型的费用，SymPy 计算（96 核跑一周）只约 100 美元。作者的判断是：Claude 用的是已知方法，并没有突破计算极限，但证明这类流程脆弱的长计算现在可以被可靠地自主完成；同期中科院何颂组借助 GPT-6 也算出了大部分结果","brief":"","ana":"**这篇解决什么问题**：前理论物理学者、科普作者 von Hippel 8 月在博客上公开挑战 AI 公司：用学术界级别的算力，去解振幅领域一个大家以为\"算力上够不着\"的问题，比如 N=4 超杨-米尔斯理论的九圈振幅。一个月后 Anthropic 的两位物理学家交了卷。这篇是挑战者本人写的复盘，价值在于它提供了一个**\"长时程自主 agent 做前沿计算\"的完整工作流和成本账**。\n\n**做法**：\n\n- **先让模型挑题**：他们先问 Claude 两个挑战里哪个最有把握，再给一句题目描述（\"计算平面 N=4 SYM 九圈六粒子振幅\"）；\n\n- **之后几乎只说\"继续\"**：典型指令是\"我要睡几个小时，继续做，每 4–6 小时汇报一次\"；\n\n- **运行环境**：Fable 5.1 跑在 Claude Science（付费科研 harness）里，用 bootstrap 和 form factor 两种方法各算了一遍；\n\n- **独立验收**：由 Lance Dixon（八圈结果的作者）从九圈振幅倒推 form factor 来校验，花了两周。\n\n**成本账**：两种方法按终端用户价格各约 **1,000–2,000 美元**，大头是模型长时间运行的费用；bootstrap 的 SymPy 计算（96 核 CPU 跑一周）只占约 **100 美元**。\n\n**两位物理学家的判断**：\n\n- Claude 用的是**已知方法**，没有突破计算极限，也没发明新物理。同期中科院何颂组借助 GPT-6 也算出了大部分结果（symbol 部分），说明问题\"对人也不算远\"。\n\n- 但 Dixon 强调难点在**流程极其脆弱**：计算配方里任何一步出错整个就塌了，而且很多构造细节\"无聊到不会写进论文\"，Claude 得从零写出全部代码。挑战者的原话大意是：如果你还以为 AI 错误多到没法用，那这件事说明它**现在能可靠地做这种事**。\n\n- 作者最大的收获是\"**低垂的果子比专家以为的多**\"：目标清楚、只是工作量大的问题，专家往往高估了难度。\n\n**对 AI 应用工程师的启示**：这是一个可以直接套用的**长时程自主任务模板**：①让模型评估可行性再选题；②最小提示启动；③定时汇报代替实时监督；④**验收交给独立于 agent 的领域验证器**（这里是有现成校验工具链的人类专家）。预算要按\"agent 运行时长\"估，不是按算力估。面试被问\"怎么让 agent 跑几天不跑偏\"时，这篇的答案是：选有外部可验证标准的任务，把验证从 agent 身上拿走。\n\nHN 反响：103 分 / 62 评论","hf":null,"topic":"Harness 与长时程 Agent","first":"2026-09-26","di":"2026-09-26","wi":"2026-09-28","tier":"note","tk":"长时自主任务的做法是「先让模型选可行题目 → 最小提示启动 → 定时汇报 → 由独立的领域验证器验收」，成本大头是模型运行时间而不是计算资源，预算时要按 agent 运行时长估算。","col":"harness"},{"u":"https://claude.com/blog/build-plugins-for-claude","t":"Build plugins for Claude","v":"Anthropic","s":"claude.com/blog · Product announcements","d":"2026-09-25","k":"release","star":0,"sum":"付费计划开发者可以通过新门户向 Claude 目录提交插件：单个远程 MCP 服务器，或托管在 GitHub 的 MCP + Skills 组合（Claude Code 里还可含 LSP、命令、hooks、agents）。提交即自动校验和安全扫描，上线后可以看按产品界面和版本的安装量、列表浏览量和带来流量的搜索词。Claude 支持 MCP 2.0（无状态内核）和 MCP Apps、Enterprise Managed Auth 两个扩展，未来几周 Claude 与 Claude Code 统一成一个发现入口","brief":"","ana":"","hf":null,"topic":"Agent 安全与围堵","first":"2026-09-26","di":"2026-09-26","wi":null,"tier":"","tk":"做 agent 扩展的分发单位正在变成「连接器 + skill 打包」，自建工具时按这个结构组织，更容易迁移到各家目录。","col":"safety"},{"u":"https://arxiv.org/abs/2609.27277","t":"TimeEvo: Failure-Driven Self-Evolution of a Time Series Agent","v":"arXiv","s":"Jie Yang 等 11 人","d":"2026-09-23","k":"paper","star":1,"sum":"先指出两种失败：一是专家整理的 21 个工具在部分任务上有害，在所有测试的基座上都拉低了异常检测准确率；二是「静默伤害」，一轮通用自我修订改了 147 个答案，其中 56 个被改坏，总分变化却不到 1 分。TimeEvo 把诊断出的失败聚类成能力缺口，为每个缺口规划测量方法并合成只提供证据的工具，候选工具库必须通过配对准入检验才会被采用。在 10 个时间序列问答任务、3 个基座上，从空工具库开始，每个任务、每个基座的准确率都有提升；在便宜模型上长出来的工具库装到更强模型上仍有增益","brief":"发现专家整理的 21 个工具在部分任务上反而有害；一轮通用自我修订改了 147 个答案，56 个改坏，总分变化却不到 1 分（\"静默伤害\"）。方案是把失败聚类成能力缺口，只合成\"提供证据\"的工具，并用配对准入检验把关；在便宜模型上长出来的工具库装到更强模型上仍有增益。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-25","di":"2026-09-25","wi":"2026-09-25","tier":"","tk":"评估自我修订时，除了看平均分，还要统计「对变错」的数量，用配对检验做准入；自演进可以先在便宜模型上跑，再把结果迁移到强模型。","col":"evo"},{"u":"https://arxiv.org/abs/2609.27612","t":"RegenHarness: A Robot Agent Harness with Evidence-Gated Recursive Self-Improvement","v":"arXiv","s":"Kailin Wang 等 5 人","d":"2026-09-23","k":"paper","star":1,"sum":"机器人 agent harness，把「模型提议」「控制器终止」「任务真正完成」严格分开：规划、监督、验证、恢复四个角色使用相互隔离的上下文；带版本的记忆区分「观察到的事实」和「已接受的进度」；任务状态的更新要经过绑定身份和版本的提交门。作者称这是首个面向具身机器人的「证据门禁递归自改进」协议：执行记录驱动对上下文规则、任务模板、路由和恢复策略的修改，由固定回归检查和发布授权决定是否接受，改动版本化并可回滚，不更新模型权重，也不允许放宽提交门。在真实四足机器人上演示了仓库导航、巡检、送信等任务","brief":"机器人 harness 把\"模型提议\"\"控制器终止\"\"任务真正完成\"严格分开，规划、监督、验证、恢复四个角色的上下文互相隔离，任务状态更新要过绑定身份与版本的提交门；自改进只改上下文规则、模板、路由、恢复策略，改动版本化、可回滚，**且不允许放宽提交门本身**。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-25","di":"2026-09-25","wi":"2026-09-25","tier":"","tk":"做 harness 自改进时，把「允许自动改的配置」和「不可改的安全门」明确分开写进协议，每次改动都带版本号并可回滚。","col":"evo"},{"u":"https://claude.com/blog/claude-opus-5-5-built-for-coding-sessions-that-use-more-context","t":"Coding sessions are longer and use more context. Claude Opus 5.5 is built with that in mind.","v":"Anthropic","s":"claude.com/blog · Claude Code","d":"2026-09-24","k":"article","star":0,"sum":"上期《What a task costs》的配套数据篇。Claude Code 2026 年 3 月到 9 月的聚合数据显示：每条提示的工作时长变为 3.3 倍，模型调用多 40% 以上，打断少 68%；连接工具服务器或使用 skill 的概率约翻倍，粘贴文本少三分之一；每个请求的上下文涨 2.6 倍，输入输出比从 189:1 升到 324:1。**降本来自三处**：定价（输入、输出降 20%，缓存读取降 60%，缓存读取占 agent 和编码成本的大头）；harness（缓存未命中的输入减少 50% 以上：刷新登录、中途加指令、按需加载工具都不再打断缓存，Opus 5.5 / Fable 5.1 中途改 effort 也不重置缓存；API key 和云厂商用户可以设 1 小时缓存寿命；fork 出来的子 agent 直接复用父会话的缓存）；模型（开放式任务轮数更少，输出速度比 Opus 5 快 30% 以上）","brief":"","ana":"上一篇的配套数据篇，价值在于这是 **Claude C
