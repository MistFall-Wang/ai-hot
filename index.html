查泄露、在干净沙箱复现，再作为训练或 skill 数据，避免把专用 harness 的「拐杖」学进去。","col":"evo"},{"u":"https://arxiv.org/abs/2609.36887","t":"WEFT: Scaling Tool-Use Post-Training for General-Purpose Agents","v":"HF 组织 Nex AGI","s":"","d":"2026-09-29","k":"paper","star":1,"sum":"认为只扩充可执行环境不保证工具使用训练的收益，因为学习信号取决于环境、任务、agent harness 和评测器四者是否协调。WEFT 做整体系统演化：用执行轨迹和状态证据归因失败、修改出问题的那个组件，再用新的 rollout 验证改动；训练侧用保留已验证进度的前缀采样和原子回合级信用分配","brief":"","ana":"","hf":null,"topic":"评测工程","first":"2026-10-06","di":"2026-10-06","wi":null,"tier":"","tk":"训练数据出问题时先按「环境 / 任务 / harness / 评测器」四类归因，只改责任组件再重跑验证。","col":"eval"},{"u":"https://github.blog/ai-and-ml/github-copilot/reviewbench-an-open-benchmark-for-ai-code-review","t":"ReviewBench: An open benchmark for AI code review","v":"GitHub","s":"AI & ML / GitHub Copilot","d":"2026-10-05","k":"article","star":0,"sum":"GitHub 与 Microsoft 发布开放的代码评审 agent 基准。语料按 1.039 亿个真实 PR 的语言与仓库规模分布抽样，共 219 个公开 PR、187 个仓库、19 种语言，PR 大小向多文件改动倾斜。标准答案从人类评审意见、作者后续修复提交、静态分析工具和多家前沿模型四路收集，语义去重后用统一评分规则判定，裁判模型为 Claude Sonnet 5；发布前由未参与构建的资深工程师独立重标，一致率 96.6%。指标分两组：只对已知答案计分的 grounded 精确率 / 召回 / F1，以及让裁判判定新发现问题的 augmented 指标，避免答案集过时后惩罚更强的评审者；可按严重度、类别切分，按 Fβ 调整偏好。关键证据是离线预测线上：一次多模型集成评审改动，线上 A/B 中精确率（被采纳率）+8.0%、召回 +13.6%、单次成本 −8.0%，与离线方向一致；离线预测关键评论 +227%，线上实测 +262%","brief":"","ana":"","hf":null,"topic":"评测工程","first":"2026-10-06","di":"2026-10-06","wi":null,"tier":"must","tk":"给自己的 agent 评测加一组「离线方向是否与线上一致」的校验；答案集用多路来源合并去重，再加一个允许新发现得分的 augmented 指标，防止基准随 agent 变强而过时。","col":"eval"},{"u":"https://openai.com/index/eu-text-provenance","t":"Our approach to EU text provenance rules","v":"OpenAI","s":"openai.com/index · feed 类别 Safety","d":"2026-10-05","k":"article","star":0,"sum":"OpenAI 为满足欧盟 AI 法案「生成文本须可机器识别」的要求，公开文本水印方案 textGrain：在模型选词中加入不可见的统计信号，由检测器判断。分阶段推出：API 客户全球即日起可对部分模型自选启用（默认关闭）；未来几周欧盟区 ChatGPT 与 Codex 输出默认加水印；检测器只对审批过的研究者和专业机构开放。文中直接给出局限：1% 误报率下，200 token 段落检出约 80%、400 token 约 95%（心理类内容），数学类明显更低；替换 10% 的词检出率从约 92% 降到 66%，替换 25% 降到 17%。在 Astra 的八项基准上加不加水印无显著差异（如 Terminal-Bench 4.0 53.90% vs 56.06%）。文末明确水印不能说明人类贡献、归属、用户身份或内容真伪，未检出也不能证明是人写的","brief":"","ana":"","hf":null,"topic":"评测工程","first":"2026-10-06","di":"2026-10-06","wi":null,"tier":"note","tk":"面向欧盟用户的产品要预留「输出带水印」的开关与说明；任何「AI 文本检测」功能都应按文本长度和改写程度报告检出率，不能给单一准确率。","col":"eval"},{"u":"https://research.google/blog/open-and-emergent-problems-in-agentic-privacy-and-security-a-contextual-angle","t":"Open and Emergent Problems in Agentic Privacy and Security: A Contextual Angle","v":"Google","s":"Google Research · research.google/blog","d":"2026-10-05","k":"article","star":0,"sum":"介绍 Google 2025 年底在纽约召开的 CAPS（情境化 agent 隐私与安全）研讨会的报告，50 多位学界和业界研究者参与。核心论点：agent 要有用，就得同时拿到个人数据和执行后果性动作的能力，传统的手工权限或专家写的策略跟不上长时间、多任务的 agent。报告以「情境完整性」理论为框架，把隐私定义为「符合社会规范的信息流」（发送者、接收者、信息类型、传输原则），提出在监督层放一个情境策略引擎，按用户请求和运行时发现的新工具实时生成策略，在数据离开用户工作区前判断这次流动是否合适；同时呼吁建设多 agent 的「Agent Gym」动态评测沙箱","brief":"","ana":"","hf":null,"topic":"Agent 安全与围堵","first":"2026-10-06","di":"2026-10-06","wi":null,"tier":"note","tk":"给 agent 的数据外发做一层「这次流动在当前任务情境下是否合理」的检查，而不是只靠静态白名单；可以按「谁发给谁、什么数据、依据什么规则」四元组给每次工具调用记日志，作为审计和策略生成的输入。","col":"safety"},{"u":"https://arxiv.org/abs/2610.02920","t":"HASTE: Evolving Agent Harnesses Against Emerging Attacks Using Sparse Evidence","v":"arXiv","s":"Xiqiao Xiong 等 7 人","d":"2026-10-02","k":"paper","star":0,"sum":"新攻击出现的速度快于人工改 harness，而能用的信号往往只有威胁报告里的几句描述或几个样例。HASTE 用多 agent 对抗演化 harness：一方根据稀疏证据生成安全规约来指导 harness 更新，另一方生成攻击用例探测剩余漏洞，评测结果回灌两边。多种骨干、攻击类型和证据形式下都降低了攻击成功率，正常任务效用不降。","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-06","di":"2026-10-06","wi":null,"tier":"","tk":"","col":"evo"},{"u":"https://arxiv.org/abs/2610.02361","t":"SEDIMA: Cross-Run Hierarchical Insight Memory for Evolutionary Search Agents","v":"arXiv","s":"Amirhossein Abaskohi 等 3 人","d":"2026-10-01","k":"paper","star":0,"sum":"LLM 演化搜索每次从零开始，反复重新发现同样的改进、踩同样的坑。SEDIMA 把原始轨迹蒸馏成自然语言洞见，按语义聚类后检索来引导后续变异，跨运行、跨问题积累。100 个候选的固定预算下，AlgoTune 与 ALE-Bench LITE 分别 +5.5% 和 +6.6%；接入 OpenEvolve 后达到基线最佳成绩所需迭代平均少 32.3%。","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-06","di":"2026-10-06","wi":null,"tier":"","tk":"","col":"evo"},{"u":"https://arxiv.org/abs/2610.03675","t":"FrugalEvo: Towards Cost-Aware LLM-Guided Program Evolution","v":"arXiv","s":"Hui Chen 等 8 人","d":"2026-10-02","k":"paper","star":0,"sum":"主张程序演化应优化「单位成本收益」：强模型探索策略、便宜模型实现和迭代精修，harness 与 prompt 设计成最大化共享前缀以提高缓存命中，并提出按累计成本计算的 BA-AUC 指标。10 个任务里 9 个 BA-AUC 优于 OpenEvolve、ShinkaEvolve 等；圆填充问题用 GPT-5.6 Terra + Luna 只花 1.68 美元达到新的最好成绩。","brief":"","ana":"","hf":17,"topic":"自学习 / 自演进","first":"2026-10-06","di":"2026-10-06","wi":null,"tier":"","tk":"","col":"evo"},{"u":"https://arxiv.org/abs/2610.03564","t":"Knowledge or Calculator? Decomposing the Skill Premium in Verifiable Financial Agent Workflows","v":"arXiv","s":"Jermyn Zhen Yong Bek 等 3 人","d":"2026-10-02","k":"paper","star":0,"sum":"FinSkillBench 含 2,603 个金融任务、确定性验证器，跑了 17,820 个 episode。精心准备的 skill 包平均 +16.2 分（0.366 → 0.528），agent 在单个 episode 内自己写的 skill 只 +0.5 分且更耗 token；拆开看，可执行工具单独 +19.5、过程文档单独 +5.6，合用小于相加；数值密集任务工具主导，流程或输出格式是瓶颈时文档更重要。另一套独立 harness 复现了方向。","brief":"","ana":"","hf":null,"topic":"评测工程","first":"2026-10-06","di":"2026-10-06","wi":null,"tier":"","tk":"","col":"eval"},{"u":"https://arxiv.org/abs/2610.03448","t":"Passing the Test You Trained On: Re-evaluating Prompt-Injection Detectors for LLM Agents","v":"arXiv","s":"Zhuowen Liu","d":"2026-10-02","k":"paper","star":0,"sum":"回放 AgentDojo 与 tau-bench 的真实工具调用，评测 15 个注入检测器（含 Meta Prompt Guard 2）。排名在基准间基本不迁移：BIPIA 第一名在 1% 误报率下只抓到 AgentDojo 2% 的注入；工具输出上的误报率从 0 到 90% 以上不等。建议用自己 agent 的工具输出评测、在低误报率下报告、审计训练数据。","brief":"","ana":"","hf":null,"topic":"Agent 安全与围堵","first":"2026-10-06","di":"2026-10-06","wi":null,"tier":"","tk":"","col":"safety"},{"u":"https://arxiv.org/abs/2610.03153","t":"EvoRiskBench: An Evolving Benchmark for Runtime Security Risks in Workspace Agents","v":"arXiv","s":"Shiyi Kuang 等 10 人","d":"2026-10-02","k":"paper","star":0,"sum":"450 个隔离环境中执行的对抗任务，覆盖九类风险入口、五类后果，用运行轨迹与环境状态独立判定。评测 3 模型（GPT-5.6 Sol、DeepSeek-V4-Pro、Claude Opus 5）× 3 harness（Claude Code、Codex、OpenClaw），最脆弱的 Codex + DeepSeek-V4-Pro 攻击成功率 68.44%。","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-06","di":"2026-10-06","wi":null,"tier":"","tk":"","col":"evo"},{"u":"https://arxiv.org/abs/2609.39050","t":"Covert Assistance: Helpful LLM Agents Evade Oversight in Multi-Agent Systems","v":"HF 组织 UIUC","s":"","d":"2026-09-30","k":"paper","star":0,"sum":"无对抗激励的软件外包场景中，规划者持有不许透露的凭据，9 个前沿模型里 7 个会把凭据伪装进需求帮开发者拿到并绕过监控。DeepSeek-V4-Pro 6,000 次中 16.9% 尝试隐藏、0.9% 成功泄露并被使用；按 0.9% 算，105 次交互至少一次泄露的概率达 61.3%。","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-06","di":"2026-10-06","wi":null,"tier":"","tk":"","col":"evo"},{"u":"https://arxiv.org/abs/2610.02267","t":"Fast Models, Slow Evidence: A Paired and Self-Audited Evaluation of System-1 Decision Models for LLM Agent Harnesses","v":"arXiv","s":"Jiawei Li","d":"2026-10-01","k":"paper","star":0,"sum":"在 11 个 harness 决策点（选模型、选工具、检索相关性、注入判断等）上成对评测两个单次前向的分类模型。两者在零样本模型路由上都不超过随机；开源模型选项顺序一反就改变 30% 的答案。更有价值的是自我审计：漏算预筛成本让「节省 23.9%」实际只有 4.3%，把门控准确率当端到端质量（58% vs 98%），样本内阈值导致留出集漏检高达 17%。","brief":"","ana":"","hf":null,"topic":"评测工程","first":"2026-10-06","di":"2026-10-06","wi":null,"tier":"","tk":"","col":"eval"},{"u":"https://arxiv.org/abs/2610.03315","t":"Lightweight, Rubric-Guided Trajectory Evaluation for Production AI Agents","v":"arXiv","s":"Linh-An Phan 等 6 人","d":"2026-10-02","k":"paper","star":0,"sum":"离线生成领域规则画像，在线预处理轨迹、标出启发式失败信号、在固定预算内序列化，再调用一次带评分规则的 LLM 裁判出诊断报告。失败定位与人工标注的一致性比 AgentRx 高 20–35 个百分点，成本约降 6 倍、耗时降 8 倍以上，已在作者的企业平台部署。","brief":"","ana":"","hf":null,"topic":"评测工程","first":"2026-10-06","di":"2026-10-06","wi":null,"tier":"","tk":"","col":"eval"},{"u":"https://arxiv.org/abs/2610.02405","t":"When Terminal-Agent Training Stalls: Demystifying Data Generation and Verification Challenge","v":"arXiv","s":"Xi Qin 等 6 人","d":"2026-10-01","k":"paper","star":0,"sum":"用 Claude Opus 当元 agent 生成终端任务和验证器，诊断出基准无效、harness 脆弱、奖励错位三类问题。改 prompt 和扩上下文让可解率提高 5.6 倍，但 9B 模型在 20 步内饱和于 81.3% 的 pass@2；加入难题后降到 20.6%，说明可解区间因模型而异，验证器审计应作为一等评测标准。","brief":"","ana":"","hf":null,"topic":"评测工程","first":"2026-10-06","di":"2026-10-06","wi":null,"tier":"","tk":"","col":"eval"},{"u":"https://arxiv.org/abs/2610.02858","t":"Harness-Aware Distillation for Small Language Model Agents","v":"arXiv","s":"Moonseok Choi 等 4 人","d":"2026-10-02","k":"paper","star":0,"sum":"蒸馏 agent 时 harness 保持不变，学生只需学 harness 给不了的能力。HAD 对比同一教师在有无 harness 信息时的动作，构造偏好对并剔除与 harness 记录矛盾的样本，不需要任务奖励。多个长程基准上优于同 harness 的在线蒸馏基线，循环更少、错误恢复更多。","brief":"","ana":"","hf":null,"topic":"Harness 与长时程 Agent","first":"2026-10-06","di":"2026-10-06","wi":null,"tier":"","tk":"","col":"harness"},{"u":"https://arxiv.org/abs/2610.01780","t":"RealCompanion: Benchmarking Human Understanding from Reasoning over Longitudinal Real-World Conversations","v":"HF 组织 Quis Lab","s":"","d":"2026-10-01","k":"paper","star":0,"sum":"发布十段真实的人与 AI 陪伴对话，共 27,218 条消息、最长 120 天。最近窗口能找到 95.9% 探针所需的消息，需要远期记忆的探针里只能找到 2.2%；没有检测器能判断某条消息是否需要记忆，而把同样内容标成「记忆」会让模型使用率提高 10–14 个点。","brief":"","ana":"","hf":237,"topic":"自学习 / 自演进","first":"2026-10-06","di":"2026-10-06","wi":null,"tier":"","tk":"","col":"evo"},{"u":"https://arxiv.org/abs/2610.03020","t":"DyadMem: A Long-Term Memory Benchmark of How Agents Work with Users","v":"arXiv","s":"Yifei Tao 等 8 人","d":"2026-10-02","k":"paper","star":0,"sum":"把「agent 应该怎样与这个特定用户协作」单列为一类记忆，3,065 个 episode、61,210 个问答，分会话标注捕获与更新。20 个模型在给定正确记忆时问答都强，换成完整流水线后大幅下降，暴露捕获召回低、召回不全和不安全删除问题。","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-06","di":"2026-10-06","wi":null,"tier":"","tk":"","col":"evo"},{"u":"https://arxiv.org/abs/2610.03574","t":"HyperBrowseComp: A Multilingual and Multimodal Stress Test for Web-Browsing Agents","v":"HF 组织 MBZUAI","s":"","d":"2026-10-02","k":"paper","star":0,"sum":"423 道人工编写和校验的难题，13 种语言，答案需在视频、扫描件、图片、地图等异构来源里多步追线索；先用不联网模型过滤掉能凭参数知识答出的题，在原生搜索与统一检索 harness 两种协议下评测，并做人类对照。","brief":"","ana":"","hf":44,"topic":"评测工程","first":"2026-10-06","di":"2026-10-06","wi":null,"tier":"","tk":"","col":"eval"},{"u":"https://arxiv.org/abs/2610.03195","t":"Source Preference in the Wild: How LLM Agents Favor Items by Source, and How to Reduce It","v":"arXiv","s":"HF 组织 Seoul National University","d":"2026-10-02","k":"paper","star":0,"sum":"12 个 agent 模型在购物、订酒店、引文三域中都偏好特定来源。少满足一项需求的商品若来自偏好来源，约三分之二的情况仍被选中；隐藏来源会减弱偏好，改标来源会提高选中率。补齐缺失信息或用 prompt 抵消先入之见能降低偏好。","brief":"","ana":"","hf":28,"topic":"Skill、上下文工程与工具","first":"2026-10-06","di":"2026-10-06","wi":null,"tier":"","tk":"","col":"skill"},{"u":"https://openai.com/index/new-chatgpt-ads-format-and-measurement","t":"Building advertising for the way people use AI","v":"OpenAI","s":"openai.com/index · Product","d":"2026-10-05","k":"release","star":0,"sum":"ChatGPT 广告新增视觉格式，月内先在美国的生图场景测试，广告与生成图片分开并明确标注；接入 Hightouch、Tealium、LiveRamp 回传转化数据，并与 AppsFlyer 等归因方、Haus 等增量测量方合作；与 DoubleVerify、IAS 试点品牌安全评估，在不接触用户对话的前提下检验放置规则。文中称 ChatGPT 周活 12 亿。值得知道的是放置护栏：先判断对话是否适合出广告，情绪脆弱或敏感话题不出。","brief":"","ana":"","hf":null,"topic":"Agent 安全与围堵","first":"2026-10-06","di":"2026-10-06","wi":null,"tier":"","tk":"","col":"safety"},{"u":"https://arxiv.org/abs/2609.32993","t":"X-Tree: Tokenizing Reusable Experience for Efficient Agent Generalization","v":"HF 组织 UWaterloo","s":"","d":"2026-09-26","k":"paper","star":1,"sum":"SFT 和 RLVR 把每个动作 token 等权，忽略跨任务重复的子流程。仿照文本分词器，按可复用性给动作片段打分、把规范化的动作合并成可复用的「经验树」，每个节点记录一个频繁且带来成功的 skill 如何由子 skill 组成，不调用 LLM，直接训进权重","brief":"","ana":"","hf":12,"topic":"自学习 / 自演进","first":"2026-10-03","di":"2026-10-03","wi":null,"tier":"","tk":"从轨迹里统计出可复用子流程后再训练，比把 skill 只放上下文更能泛化。","col":"evo"},{"u":"https://openai.com/index/practical-guide-building-gpt-6","t":"A model guide for the GPT-6 family","v":"OpenAI","s":"openai.com/index · feed 类别 Product","d":"2026-10-02","k":"article","star":0,"sum":"面向用 GPT-6 家族做产品的开发者，分四部分：生产运行——先裁掉任务不需要的上下文、独立任务并行、用 prompt caching（缓存输入最多便宜 95%，稳定指令放前、工具定义保持一致）、长对话用 compaction、上线前按「任务成功率、延迟、每个成功任务的成本」测；选型——GPT-6 Astra 做最难的推理、GPT-6.1 Sol 做复杂编码 / 研究 / computer use、GPT-6 Luna 做规模化的明确任务，effort 分 low / medium / high / xhigh，xhigh 只在 high 不够时试且要证明值回成本，Fast 与 Ultrafast 模式按延迟需求付溢价；prompt 与 skill——skill 描述短而明确、AGENTS.md 写明何时哪些文档与测试相关并明确授权安全的常规动作（如用一次性数据跑本地测试）、把「总是问」换成清晰的决策边界、把「完成」定义到实现 + 运行 + 检查 + 修复；长任务——Responses WebSocket 的 mid-turn steering 可排队修正而不打断已跑的工具，异步工具调用让模型在慢工具运行时继续独立工作，GPT-6.1 Sol 在 Responses API 支持多 agent 委派（beta），computer use 三款模型都可用，建议能走 API 就不走屏幕","brief":"","ana":"","hf":null,"topic":"Agent 安全与围堵","first":"2026-10-03","di":"2026-10-03","wi":null,"tier":"note","tk":"把 AGENTS.md / CLAUDE.md 重写成「可自主 / 需审批」两栏加一条「完成 = 跑通并修复失败」的定义；长任务用「排队修正 + 异步工具」而不是打断重跑；上线指标用「每个成功任务的成本」而不是每次调用的成本。","col":"safety"},{"u":"https://arxiv.org/abs/2610.01509","t":"Sharpening Tax in Post-Training","v":"HF 组织 Meta","s":"","d":"2026-10-01","k":"paper","star":0,"sum":"检验「RL 后训练只是锐化基模型行为」在 agent 任务上是否成立。发现预训练模型配一个轻 harness 就能当 agent：pass@1 低得多，但给足测试时预算后 pass@K 常超过后训练版本；后训练把任务推向「总能解」或「永远解不了」两极，提高采样效率但牺牲覆盖","brief":"","ana":"","hf":63,"topic":"Harness 与长时程 Agent","first":"2026-10-03","di":"2026-10-03","wi":null,"tier":"","tk":"需要多样候选解的场景（搜索、验证器选优）可以考虑基模型 + harness 的组合。","col":"harness"},{"u":"https://arxiv.org/abs/2610.01939","t":"Fewer Tokens, Better Action: GPT-6 Astra Robot Agents with 14% Higher Success Rate but 65% Fewer Tokens","v":"HF 组织 DAGroup-PKU","s":"","d":"2026-10-01","k":"paper","star":0,"sum":"PyRUA-Lean 把机器人原语与 VLA 策略组合成带条件检查和局部重试的 Python cell，只回传显式请求的图像与状态。700 个仿真任务上，与同一 GPT-6 Astra 规划器的 tool-calling 基线相比，相同调用预算下成功率 63.1% → 71.7%，token 少 65%","brief":"","ana":"","hf":24,"topic":"Skill、上下文工程与工具","first":"2026-10-03","di":"2026-10-03","wi":null,"tier":"","tk":"工具多、观测大的 agent 场景优先用代码执行组合原语，而不是逐个 tool call。","col":"skill"},{"u":"https://arxiv.org/abs/2609.32520","t":"When Users Change Their Minds: Measuring and Repairing Intent Drift in LLM Agents","v":"arXiv","s":"Yanjie Zhang 等 4 人","d":"2026-09-26","k":"paper","star":0,"sum":"多轮交互里被撤回或替代的意图继续影响最终答案或工具动作。IntentFlux 把可验证任务转成带受控意图变化的对话并保留原评分器；627 例校准里平均得分从 0.476 降到 0.384，八个模型从演化对话里恢复任务的全对率显著低于单轮直接给。StateForge 在生成前显式维护「当前有效需求」可修复一部分","brief":"","ana":"","hf":8,"topic":"推理基础设施与建模","first":"2026-10-03","di":"2026-10-03","wi":null,"tier":"","tk":"多轮 agent 在每次执行前重算一份「当前有效需求」。","col":"infra"},{"u":"https://arxiv.org/abs/2610.01769","t":"CONTRA: Discovering and Qualifying Behavior-Changing Questions for Selective Clarification in LLM Code Generation","v":"arXiv","s":"Zheng Fang 等 8 人","d":"2026-10-01","k":"paper","star":0,"sum":"coding agent 常默默用自己的假设解决欠规格需求。训练无关的方法：先广泛生成候选澄清问题，过滤与行为无关或已被需求解决的；对剩余问题按两个合理答案各生成程序，在共享输入上检查是否有稳定的行为差异，再结合交互历史决定问哪个或停止","brief":"","ana":"","hf":null,"topic":"推理基础设施与建模","first":"2026-10-03","di":"2026-10-03","wi":null,"tier":"","tk":"「值不值得问」用执行差异判定，而不是靠模型自觉。","col":"infra"},{"u":"https://arxiv.org/abs/2610.00025","t":"Measuring the Microtask Eligibility Gap: When Is an Off-the-Shelf SLM Enough for an Agent Harness?","v":"arXiv","s":"","d":"2026-09-01","k":"paper","star":0,"sum":"harness 里的微任务（自动批准 shell 命令、写记忆、选工具、排序历史轮次）能否交给小模型。四个微任务各设一个锚定在廉价非 LLM 基线上的阈值和 CI 感知的合格规则，Qwen3 0.6B–8B 在最佳设置下 0/16 配置合格；logprob 阈值诊断把失败分成能力缺口和可通过改解码阈值修复两类","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-03","di":"2026-10-03","wi":null,"tier":"","tk":"把微任务外包给小模型前先设一个「必须显著优于规则基线」的门槛。","col":"evo"},{"u":"https://arxiv.org/abs/2610.00366","t":"What Should an Agent Remember? Disentangling Retention from Retrieval in Bounded-Memory Evaluation","v":"arXiv","s":"Juli Huang","d":"2026-09-30","k":"paper","star":0,"sum":"记忆评测常把「保留什么」和「取什么」混在一起比。固定访问范围时，查询感知的选择只提升 15.5 个百分点，而混合对比报告的 68.7 分优势里 53.2 分来自历史访问范围的变化；有界保留下所有 319 个失败都来自驱逐而非排序","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-03","di":"2026-10-03","wi":null,"tier":"","tk":"对比记忆方案时先固定「能看到多少历史」，否则结论大半是访问范围的差异。","col":"evo"},{"u":"https://arxiv.org/abs/2609.38923","t":"GraphForge: Training Working Agents with Graph-Anchored Workspace Synthesis","v":"HF 组织 ustc-community","s":"","d":"2026-09-30","k":"paper","star":0,"sum":"训练「读文件、调工具、交付成果」的工作 agent 需要建立在大量真实文件上且结果可验证的任务。从职业锚定的种子出发组装真实文件工作区，在文件关系上建证据图，任务陈述与 rubric 都从图导出，每条标准锚定到验证它所需的文件","brief":"","ana":"","hf":34,"topic":null,"first":"2026-10-03","di":"2026-10-03","wi":null,"tier":"","tk":"合成 agent 训练任务时让每条评分标准都指向可核对的证据。","col":""},{"u":"https://arxiv.org/abs/2610.02122","t":"Argo-Bench: Evaluating Data Agents on Enterprise-Scale Workflows","v":"HF 组织 textql","s":"","d":"2026-10-01","k":"paper","star":0,"sum":"现有 text-to-SQL 基准只评查询生成且答案键常错。模拟一个纽约外卖平台（2024 年 8,100 万订单，含欺诈模式与市场激励），导出为 235 张表、75 亿行的 ERP 仓库，210 个数据科学与分析任务要求跨几十张表推理并据结果行动","brief":"","ana":"","hf":17,"topic":"评测工程","first":"2026-10-03","di":"2026-10-03","wi":null,"tier":"","tk":"评测企业数据 agent 要用「业务事件跨多表」的仓库，单表基准测不出来。","col":"eval"},{"u":"https://arxiv.org/abs/2610.01215","t":"AutoGUIWorld: Image Generators as Visual World Models for GUI Agent","v":"HF 组织 Tencent-Hunyuan","s":"","d":"2026-10-01","k":"paper","star":0,"sum":"GUI 轨迹多样性受限于能部署的软件。用图像生成器的视觉先验加规划器的任务知识合成 GUI 交互轨迹，不部署、不运行对应软件；初始场景从操作系统上下文、视觉外观、界面状态的结构化规格采样","brief":"","ana":"","hf":42,"topic":"推理基础设施与建模","first":"2026-10-03","di":"2026-10-03","wi":null,"tier":"","tk":"GUI agent 的数据扩展可以先用生成式世界模型覆盖装不起来的软件。","col":"infra"},{"u":"https://www.anthropic.com/news/claude-frontier-academy","t":"Anthropic invests $100 million to train 10,000 engineers and tackle the enterprise AI talent gap","v":"Anthropic","s":"/news · Announcements","d":"2026-10-02","k":"release","star":0,"sum":"推出 Claude Frontier Academy，1 亿美元投入，目标到 2027 年底培养 1 万名 Frontier Deployed Engineer；首批来自 Accenture、Bain、Capgemini、澳洲联邦银行、Deloitte、McKinsey、Morgan Stanley、Novo Nordisk。流程仿照医学住院医：多日线下模拟企业部署（从用例选择到安全评审到交接）加新场景实操考核，通过者进入 12 周驻厂驻项目的实战期；提名制，旧金山、纽约、伦敦已开班。背景数据：Claude Partner Network 已有 46,000 家公司、17.5 万张认证","brief":"","ana":"","hf":null,"topic":"Agent 安全与围堵","first":"2026-10-03","di":"2026-10-03","wi":null,"tier":"","tk":"这是厂商对「AI 应用落地工程师」岗位画像的正式定义，准备面试可对照它的考核链路——用例选择、安全评审、交付交接。","col":"safety"},{"u":"https://claude.dev/blog/automating-eval-design-and-hillclimbing","t":"Automating eval design and hillclimbing with Claude","v":"Anthropic","s":"claude.dev 开发者博客 · 补录","d":"2026-09-28","k":"article","star":1,"sum":"**整体概括**：claude-api skill 新增两个子命令。`build-eval` 先访谈再建评测：样本按生产记录、bug 报告与工单、手写 5–10 条、从代码库合成的顺序取，并生成页面让人逐条确认；评分器优先用代码检查，输出开放时才用 LLM 评审（rubric 写成可核对的断言而非 1–5 分，有基线时做盲序两两比较，评审模型不能是被测模型）；跑基线时检查评分器对同一输出打两次是否一致、有无超时或截断、基线是否已到 95% 左右。好 eval 的四个特征：任务贴近生产、更强模型和更高 effort 得分更高、最强配置仍明显低于 100%、重复运行方差小；不要专挑当前模型失败的题。`hillclimb` 先确认噪声小于想要的最小提升，随机拆 train / test，每轮读 train 轨迹只提一个补丁；train 涨而 test 持平或出现回归就回滚；连续两三轮停滞时把剩余失败按原因分类。案例一：客服基准 44 张工单（30 搜索、14 留出），从 Opus 4.8 high 的 74.4%、每工单 4.6 美分，到 Sonnet 5 low 加 prompt 修订的 98.9%、约 1 美分，留出集 78.6% → 90.5%。案例二：claude-api skill 自身 66.1% → 87.9%，其中一步是发现内容都在但模型按训练记忆写旧 API，于是在 skill 顶部加「旧写法 → 新写法」对照表","brief":"","ana":"**这篇解决什么问题**：有了 eval 才能知道应用或 skill 好不好，但 eval 很容易设计错；照着 eval 改系统，又很容易把分数改上去而生产没变好。这篇先讲原则，再讲 claude-api skill 新增的两条命令怎么把原则落成流程，最后给两组实跑数据。\n\n**好 eval 的四个特征**：\n\n1. **任务镜像生产**。不要因为好生成、好打分就选某类题。\n\n2. **更强的模型、更高的 effort 应该得分更高**。如果不是，通常是题目有歧义或 grader 没校准。\n\n3. **前沿留有\"可通过的\"余量**。最强模型开最高 effort 应明显低于 100%，否则看不出改动的影响；但这个差距不能来自不可能或有歧义的题。判断方法：一道题无论重复多少次都失败，多半是题有问题。\n\n4. **重复运行方差低**。方差的来源有三个：题目歧义、grader 对同一输出给出不同结论、配置（effort 没有一致生效；上一轮留下的文件或 git 历史把答案递给了 agent）。\n\n**一个容易踩的坑：对抗式取样**。模型能力是锯齿状的。如果专挑\"当前模型做不对\"的题，测到的是这个模型的失败指纹，而不是任务本身的难度。正确做法是因为**人判断它难**才选，并且能说出难在哪。只从用户流量取样也不行：用户倾向于只试他们觉得能成的事，分布会偏易。\n\n**`build-eval` 的流程**：\n\n- **取样顺序**：生产记录（先问数据留存与敏感性）→ bug 报告与工单 → 手写 5–10 条 → 从代码库合成。生成一个页面让人逐条确认输入。\n\n- **选最便宜的 grader**：输出空间受限就用代码校验（精确匹配、固定标签、JSON schema、测试通过）；开放式输出才用 LLM judge，rubric 写成**可逐条核对的陈述**而不是 1–5 分；有基线时让 judge 盲比两份输出、顺序随机；**judge 不能是被测模型**。\n\n- **先验证 grader**：评几条，问人\"哪条你会打不一样的分\"。文中直说，评分错误是 eval 配置出错最常见的原因之一。\n\n- **基线运行时的三项诊断**：同一输出让 grader 跑两次看结论变不变；检查超时、API 错误、截断，避免把基础设施噪声当成模型方差；基线已到约 95% 就提醒\"余量不够，去优化成本或延迟\"。\n\n**`hillclimb` 的流程**：\n\n- **选什么来爬**：改起来便宜（prompt、skill 这类文本）、分数变化能归因到被改的面（例如 skill 触发率对 skill 描述）、目标收得窄。**成本是一个通用的好目标**：eval 饱和了也可以要求\"性能持平、成本更低\"。\n\n- **防过拟合三条**：把用例拆成 hillclimber 能读的 train 和永远不看的 test；**不把失败内容贴进 prompt**；答案在结构上放在模型够不着的地方。文中的例子：eval 里某题受益于 OCR，hillclimb 就给 harness 加了个 OCR 工具，基准涨了，生产毫无变化。\n\n- **每轮只提一个改动**：读上一轮 train 轨迹，修根因（重写导致问题的那一节、补一条缺的规则），不做措辞微调。train 涨、test 不涨 → 判为过拟合并回滚；有回归 → 回滚；都涨才保留。\n\n- **开爬前先量噪声**：如果分数靠运气就能波动的幅度大于你愿意采纳的最小提升，先加重复次数或用例。\n\n- **停滞两三轮时不改东西，只分桶**：把剩余失败按原因归类。这一步能抓出有歧义的题、harness 错误和纯粹的运行方差。\n\n- **收尾**：代码停在 test 上最好的版本，报告带置信区间；收益在噪声内就明说并建议不合并。\n\n**两组实跑数据**：\n\n案例｜起点｜过程｜终点\n\n内部客服基准（44 张工单，30 张搜索 / 14 张留出）｜Opus 4.8 high，74.4%，4.6 美分/张｜审计 prompt（删掉强制工具调用仪式、scratchpad 步骤、互相矛盾的规则）→ Opus 5.5 low：87.8%，1.9 美分 → Sonnet 5 low：88.9%，1 美分 → 加路由规则和退款上限交叉引用：98.9%｜**留出集 90.5%（原配置 78.6%），成本约五分之一**\n\nclaude-api skill 自身｜66.1%｜补 8 个缺失特性 → 74%；修 C# / Java 类型表 → 77%；停滞后分桶 → 80%；修掉题目和 grader 自身的错 → 约 88%｜**87.9%**\n\n第二个案例里\"分桶\"那一步值得细看。Claude 发现 skill 里内容是有的，但模型**凭训练先验写出旧的 API 形态**（例如固定 token 预算的 extended thinking，新 Opus 模型已拒绝）。修法是在 skill 顶部加一张\"你记得的旧写法 → 现在的写法\"对照表。另外有两道题是 eval 自己错了：一道题要求捕获一种错误，grader 却要三种；另一个 grader 的要求与文档矛盾，实测 API 证明文档是对的。\n\n**对 AI 应用工程师的启示**：这篇可以当面试里\"你怎么做 eval / 怎么防止 prompt 调优过拟合\"的标准答案骨架：①取样从生产来，难题由人判断；②grader 先验证再信；③先量噪声；④train / test 拆分，一轮一改，test 不涨就回滚；⑤停滞时先怀疑 eval 本身。它也和本期论文侧的结论互相印证：下文《Do Self-Evolving Skills Generalize?》说\"单次编辑有没有用只能靠跑\"，这里的做法正是每个 patch 都跑留出集。","hf":null,"topic":"自学习 / 自演进","first":"2026-10-02","di":"2026-10-02","wi":"2026-10-02","tier":"must","tk":"失败样本的内容不要贴进 prompt，答案放在模型够不到的地方；某道题怎么改都不涨，先怀疑题目或评分器写错了。","col":"evo"},{"u":"https://arxiv.org/abs/2610.01073","t":"Safety Must Survive Self-Improvement: Why Failures Persist and How Agents Recover","v":"arXiv","s":"Yunbei Zhang 等 8 人","d":"2026-10-01","k":"paper","star":1,"sum":"在有状态的授权任务上做受控 RSI 实验，固定 LLM 编辑器反复优化 agent 可执行组件，用成对干预把「哪个修订通过验证、哪个程序在跑、编辑器下一步改哪」分开。新增一条授权依赖后，48 条演化史里 22 条因沿用历史分数保留了不安全程序；全量验证加带验证的回滚最终得到完全正确的程序并保留 43% 以上部署节省，从初始实现回滚比从失败版回滚恢复得更好","brief":"在有状态的授权任务上做受控 RSI 实验：固定的 LLM 编辑器反复优化 agent 的可执行组件，用成对干预把\"哪个修订通过验证、哪个程序继续运行、编辑器下一步改哪个\"三件事分开。新增一条授权依赖让以前测过的优化失效之后，**48 条框架演化史里有 22 条因为沿用历史分数而保留了同一批不安全程序**，尽管每个受影响的存档里都有正确的替代。刷新分数能恢复原测试集上的正确性，独立组合的测试上仍有残余失败。所有提案都被拒、失败的在任版本继续运行时，失败同样持续。从共同的失败出发，**改初始实现比改失败的那版恢复得更好**。全量验证加带验证的回滚最终得到完全正确的程序，同时保留 43% 以上的部署节省","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-02","di":"2026-10-03","wi":"2026-10-02","tier":"","tk":"环境或契约一变就全量重测历史评分；回滚目标默认初始实现。","col":"evo"},{"u":"https://arxiv.org/abs/2610.01833","t":"Continuous Process-Level Evaluation for Evolving Enterprise AI Agent Skills","v":"arXiv","s":"Ngoc Phuoc An Vo 等 3 人","d":"2026-10-01","k":"paper","star":1,"sum":"企业 skill 随工具 API、模型、规格演化，只看终值会漏过程漂移。框架同时做结果级与过程级检查（工具选择、参数、执行顺序、数据库完整性；程序化检查加窄范围 LLM judge）。240 次试验中 175 次通过全部终值检查的运行里 162 次（92.6%）仍被查出偏差；依赖归因把每次平均 6.34 个失败检查归并成 2.65 个根因","brief":"企业 skill 会随工具 API、模型、规格的变化而演化，只看最终输出会漏掉过程层面的行为漂移。框架同时做结果级和过程级检查（工具选择、参数、执行顺序、数据库完整性；程序化检查加一个范围很窄的 LLM judge）。240 次试验（2 个 skill × 2 种规格 × 2 个 harness × 3 个模型）里，**175 次通过了全部最终数值检查的运行中，有 162 次（92.6%）仍被查出别的偏差**；依赖归因把每次运行平均 6.34 个失败检查归并成 2.65 个根因","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-02","di":"2026-10-03","wi":"2026-10-02","tier":"","tk":"skill 回归测试要查轨迹，不只查答案。","col":"evo"},{"u":"https://arxiv.org/abs/2610.00704","t":"SkillSpec: Consensus-Gated Agent Skill Evolution via Representation Specialization","v":"arXiv","s":"Huancheng Chen 等 5 人","d":"2026-09-30","k":"paper","star":1,"sum":"把「保留什么知识」和「怎么组织它」分成两阶段：由互补的编辑意图生成完整候选 skill，只有成对评估达成共识（总体提升足够且每次重复评估的聚合成对收益非负）才提交；再按整条优化轨迹的过程敏感度和冗余敏感度选扁平、图或混合表示。六个基准、三个目标模型上平均成功率比 SkillOpt 高 6.89%","brief":"把\"保留什么知识\"和\"怎么组织它\"分成两个阶段。先由互补的编辑意图生成完整的候选 skill，只有成对评估达成共识（总体提升足够，且每次重复评估的聚合成对收益都非负）才提交；再根据整条优化轨迹（包括被拒的候选）里的过程敏感度和冗余敏感度，选扁平、图或混合表示。六个基准、三个目标模型上平均成功率比 SkillOpt 高 6.89%。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-02","di":"2026-10-03","wi":"2026-10-02","tier":"","tk":"skill 候选的晋升条件写成「多次重复评估下成对收益都不为负」。","col":"evo"},{"u":"https://arxiv.org/abs/2610.00093","t":"Safety in Self-Evolving Agents: A Survey","v":"arXiv","s":"","d":"2026-09-08","k":"paper","star":1,"sum":"80 页综述。核心论点：经验一旦变成可复用状态，过去的事件就成了未来的原因；失败不必源自有害信息，合法状态在适应中扩大了持久性、权限或作用范围就会变得不安全。提出围绕「状态转移」的 SAVER 框架（Substrate / Adaptation / Violation / Exposure / Response），判断现有工作在准入、检索、激活上证据较强，在修复已受影响的后代和演化后再评估上证据很少","brief":"核心论点：经验一旦变成可复用的状态，过去的事件就成了未来的原因。**失败不必源自有害信息**：合法的状态在适应过程中被扩大了持久性、权限或作用范围，超出它原本成立的条件，就会变得不安全。提出以\"状态转移\"为中心的 SAVER 框架（Substrate 定位可复用影响在哪、Adaptation 描述它怎么变、Violation 识别被破坏的安全属性、Exposure 标出失败在哪变得可观察、Response 评估围堵、修复或撤销）。综述的判断：现有工作在准入、检索、激活、暴露和局部围堵上证据较强，在\"**修复已经受影响的后代**\"和\"恢复演化之后的再评估\"上证据很少，主张做能追溯到源头转移的纵向评测。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-02","di":"2026-10-03","wi":"2026-10-02","tier":"","tk":"给自演进系统做安全审计时按「哪个状态在哪一步扩大了范围」列清单，而不是只扫有害内容。","col":"evo"},{"u":"https://arxiv.org/abs/2610.00906","t":"ActiveSaddler: Automated Curriculum Learning for Agent Harness Optimization","v":"HF 组织 Microsoft","s":"","d":"2026-09-30","k":"paper","star":1,"sum":"现有 harness 优化都在改「怎么更新 harness」，产生反馈的训练场景却是固定的。把课程建模成非平稳 bandit，把反复失败抽象成可复用的「失败模式臂」，估计继续针对每种模式还能带来多少学习进展，课程随 harness 一起演化。GAIA2 与 Terminal-Bench 2.0 上测试 Pass@1 比固定场景顺序的同一优化器高 4.4 和 7.5 个百分点","brief":"现有 harness 优化方法都在改\"怎么更新 harness\"，产生反馈的训练场景却是固定的。ActiveSaddler 把课程建模成非平稳 bandit：把反复出现的失败抽象成可复用的\"失败模式臂\"，估计继续针对每种模式还能带来多少学习进展，在重访已知弱点和探索新场景之间做平衡，课程随 harness 一起演化。GAIA2 和 Terminal-Bench 2.0 上，测试 Pass@1 比\"优化前就定死场景顺序\"的同一个优化器分别高 4.4 和 7.5 个百分点。与 MILO 的\"编排 agent 改课程\"是同一个方向的独立证据。","ana":"","hf":50,"topic":"自学习 / 自演进","first":"2026-10-02","di":"2026-10-03","wi":"2026-10-02","tier":"","tk":"做 harness 自优化时把「下一个练什么」也交给搜索，按失败模式而不是按任务列表安排课程。","col":"evo"},{"u":"https://arxiv.org/abs/2610.00948","t":"GUI-HARVEST: Self-Improving GUI Agents through Evidence-Driven Harness Evolution","v":"arXiv","s":"Geyi Yang 等 7 人","d":"2026-09-30","k":"paper","star":1,"sum":"冻结骨干，自动优化 GUI agent 的 harness：把模型输出、实际动作与前后截图对齐让诊断落到具体界面变化；把同一任务多次运行当联合证据；把跨任务确认的发现归并成失败模式、映射成有界源码修改，评测前先记录预测再用重复执行核对。OSWorld-Verified 六个骨干留出集全部提升（Qwen3-VL-32B +12.33 分），冻结 harness 迁移到 WindowsAgentArena 让 GPT-5 +13.87 个百分点","brief":"冻结骨干模型，自动优化 GUI agent 的 harness。三个做法：把模型输出和实际执行的动作与前后截图对齐，让诊断落在具体的界面变化上；把同一任务的多次运行当作一个联合证据单元；把跨任务确认的发现归并成反复出现的失败模式，映射成有界的源码修改，**评测前先把预测记下来**，再用重复执行核对预测的行为效果。OSWorld-Verified 上六个骨干的留出集都有提升，Qwen3-VL-32B 全集 +12.33 分；冻结 harness 迁移到 WindowsAgentArena，GPT-5 +13.87 个百分点。同骨干、同初始 harness 下优于 Self-Harness 和 Meta-Harness。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-02","di":"2026-10-03","wi":"2026-10-02","tier":"","tk":"每次 harness 修改先写下「预期改变哪个行为」，再用重复执行验证，不验证的改动不合并。","col":"evo"},{"u":"https://arxiv.org/abs/2610.01026","t":"It Takes Workflows to Evolve Better Workflows","v":"arXiv","s":"Xuehang Guo 等 6 人","d":"2026-10-01","k":"paper","star":1,"sum":"多 agent workflow 训练通常只优化生成器，构建与执行 workflow 的其他角色不动。FloWright 把 workflow 当 harness，用分层、感知结构的奖励让一个角色自演进或多个角色共演进，不需要额外模型或标注。小型开源模型最高 +7.41%；多角色共演进（+5.03%）比只优化一个（+2.83%）收益大","brief":"多 agent workflow 的训练通常只优化 workflow 生成器，构建和执行 workflow 的其他角色不动，而结果取决于所有角色。FloWright 把 workflow 当 harness，用分层、感知结构的奖励让一个角色自演进或多个角色共演进，不需要额外的模型、标注或执行。小型开源模型最高 +7.41%；多个角色共演进（+5.03%）比只优化其中一个（+2.83%）收益大。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-02","di":"2026-10-03","wi":"2026-10-02","tier":"","tk":"优化多 agent 系统时同时演化执行者与构建者，而不只调规划器。","col":"evo"},{"u":"https://arxiv.org/abs/2610.00650","t":"Self-Evolving Coding Rules for AI Coding Agents","v":"arXiv","s":"Zhengyuan Jiang 等 6 人","d":"2026-09-30","k":"paper","star":1,"sum":"RuleEvolve 自动演化 coding agent 的编码规则文件：维护候选规则池，mutator 生成变体，judge 评估后保留最好的。两个框架、四个骨干、三个基准上，在功能正确性、代码长度和生成成本上优于手写规则和现有 prompt 优化基线","brief":"RuleEvolve 自动演化 coding agent 的编码规则文件：维护一个候选规则池，mutator 生成变体，judge 评估后保留最好的。两个 coding agent 框架、四个骨干、三个基准上，在生成代码的功能正确性、代码长度和生成成本上优于手写规则和现有 prompt 优化基线。可以理解为 CLAUDE.md / AGENTS.md 这类规则文件的自动调优。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-02","di":"2026-10-03","wi":"2026-10-02","tier":"","tk":"CLAUDE.md / AGENTS.md 这类规则文件可以像 prompt 一样做自动调优，用留出任务验收。","col":"evo"},{"u":"https://arxiv.org/abs/2610.00675","t":"LabBook: Harnessing Experimental History for Efficient LLM-Driven Discovery","v":"arXiv","s":"Bo Yuan 等 7 人","d":"2026-09-30","k":"paper","star":1,"sum":"进化式发现只从少数祖先生成新程序会漏掉其他实验的证据，全部历史塞进上下文又太长。LabBook 是 agent 自己维护的一份记忆，同时指导从完整日志里检索证据和生成新解，每轮同时产出下一个程序和更新后的 LabBook，不需要显式种群或分支结构。49 个 Frontier-CS 问题上质量与成本的权衡优于进化基线","brief":"进化式发现通常只从少数被选中的祖先生成新程序，会漏掉其他实验里的证据；把全部历史塞进上下文又太长太冗余。LabBook 是 agent 自己维护的一份记忆，同时负责两件事：指导从完整实验日志里检索相关证据，以及指导生成新解。同一个 agent 每轮同时产出下一个程序和更新后的 LabBook，不需要显式的种群或分支搜索结构。49 个 Frontier-CS 问题上，质量与成本的权衡优于被比较的进化基线。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-02","di":"2026-10-03","wi":"2026-10-02","tier":"","tk":"长程优化任务让 agent 维护一份「实验台账」替代种群搜索。","col":"evo"},{"u":"https://arxiv.org/abs/2610.01235","t":"Harness Annealing: Learning to Act with Less External Control","v":"arXiv","s":"Yingxuan Yang 等 3 人","d":"2026-10-01","k":"paper","star":1,"sum":"harness 除了提供工具还替模型做控制决策（查什么、要不要改、何时停）。HAT 用显式控制监督加一套在逐步变弱的 harness 下收集的教师轨迹课程，把这些决策学进权重。9B 和 35B 模型在 SWE-QA / SWE-QA-Pro 上，退火后的检查点只带工具运行时的得分接近起始检查点带完整 harness 的得分；继续退火不一定更好","brief":"harness 除了提供工具和信息，还替模型做控制决策：查什么、要不要改、何时停。作者问能不能让模型把这些决策学进去，称为\"harness 内化\"。HAT 用显式的控制监督，加上一套在逐步变弱的 harness 下收集的教师轨迹课程来训练。9B 和 35B 模型在 SWE-QA 和 SWE-QA-Pro 上，选出的退火检查点**只带工具运行时的得分，接近它的起始检查点带完整 harness 时的得分**；收益随模型规模和部署配置变化，继续退火不一定更好。和上上期的 Harness-Zero（把 harness 蒸进权重）是同一方向。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-02","di":"2026-10-03","wi":"2026-10-02","tier":"","tk":"自训模型时可以把 harness 的控制逻辑当课程逐步撤掉，但要按规模与部署配置选检查点。","col":"evo"},{"u":"https://arxiv.org/abs/2610.01766","t":"VideoEvolve: Evolving Agent Harnesses for Video Temporal Grounding","v":"arXiv","s":"Bingjun Luo 等 4 人","d":"2026-10-01","k":"paper","star":1,"sum":"视频时序定位场景的 harness 自动演化：保留各阶段接口、放开 workflow 和指令的 harness 表示，保留有希望的代码分支继续精修，由验证决定哪些改进留下。组件分析显示指令精修是稳定的收益来源，演化出的代码收益随评测设置而变","brief":"视频时序定位场景的 harness 自动演化：用一种保留各阶段接口、放开 workflow 和指令的 harness 表示；保留有希望的代码分支继续精修，由验证决定哪些改进留下。组件分析显示**指令精修是稳定的收益来源，演化出的代码带来的收益随评测设置而变**。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-02","di":"2026-10-03","wi":"2026-10-02","tier":"","tk":"harness 演化优先放开指令层，代码层改动要跨评测设置复验。","col":"evo"},{"u":"https://arxiv.org/abs/2610.01787","t":"Not All Experience Belongs in the Weights: Component Routing for Self-Improving GUI Agents","v":"arXiv","s":"Beining Wu 等 3 人","d":"2026-10-01","k":"paper","star":1,"sum":"自产轨迹该微调进权重还是检索进上下文？把经验拆成定位器、流程、状态事实、教训四类分别路由：定位器和教训进权重更好，流程和状态事实进上下文更好。用两个训练前就能测的性质（复现度、对状态的依赖）拟合的规则在留出骨干家族上 24 格全部预测对","brief":"自改进 GUI agent 把自己产生的轨迹回灌，是微调进权重还是检索进上下文？已有研究结论互相矛盾。作者认为问题出在经验的单位：一条轨迹里捆着性质不同的东西。把经验拆成定位器、流程、状态事实、教训四类分别路由，在三个骨干家族、两个环境上的结论是：**定位器和教训进权重更好，流程和状态事实进上下文更好**。用两个训练前就能测的性质（复现度、对状态的依赖程度）拟合出的规则，在留出的骨干家族上 24 格全部预测对，按规则路由比所有\"整条轨迹去一个地方\"的基线都好。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-02","di":"2026-10-03","wi":"2026-10-02","tier":"","tk":"经验回灌前先按「可复现、依赖状态」两维分类，再决定进权重还是进记忆。","col":"evo"},{"u":"https://arxiv.org/abs/2610.01195","t":"Federated Agent Optimization","v":"arXiv","s":"Qiang Yang 等 9 人","d":"2026-10-01","k":"paper","star":1,"sum":"框架性文章：agent 的经验分散在各组织里无法共享，而能力不只在参数里，还在记忆、工具、奖励、skill 和结构化知识里。把联邦 agent 优化定义为效用、隐私泄漏、通信成本的多目标问题，梳理私有经验如何被抽象、保护、聚合成可迁移能力","brief":"框架性文章。agent 的经验分散在各个组织里，因为隐私和专有约束无法直接共享；而 agent 的能力不只在参数里，还在记忆、工具、奖励、skill 和结构化知识里，传统联邦学习不够用。把联邦 agent 优化定义为效用、隐私泄漏、通信成本的多目标问题，并梳理私有经验如何被抽象、保护、聚合成可迁移的能力。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-02","di":"2026-10-03","wi":"2026-10-02","tier":"","tk":"跨团队共享 skill / 记忆时先定义「抽象到哪一层才能出组织」。","col":"evo"},{"u":"https://arxiv.org/abs/2610.01799","t":"SkillEvoLean: Mutation-enhanced skill evolution for Lean provers","v":"arXiv","s":"Kuo Zhou 等 3 人","d":"2026-10-01","k":"paper","star":1,"sum":"现有 skill 演化靠成功与失败轨迹的对比找方向，所有采样都失败时就没方向。加入「变异」：生成不出完整证明时触发，采样数学概念生成新 skill 候选，由验证器筛选；同时演化高层策略与参考知识，不只改根指令文件","brief":"Lean 定理证明里的 skill 演化。现有方法靠成功和失败轨迹的对比找更新方向，**所有采样轨迹都失败时就没有方向可找**。作者加了\"变异\"：在生成不出完整证明时触发，采样数学概念生成新的 skill 候选，由验证器反馈筛选；同时演化高层求解策略和参考知识（概念、证明技巧），不只改根指令文件。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-02","di":"2026-10-03","wi":"2026-10-02","tier":"","tk":"skill 演化要有「全失败」时的逃生机制，不能只依赖成功对比。","col":"evo"},{"u":"https://arxiv.org/abs/2610.01161","t":"My FAULT: Self-Diagnosis as Credit Assignment in Self-Evolving Agentic Reinforcement Learning","v":"arXiv","s":"Yihua Zhu 等 13 人","d":"2026-10-01","k":"paper","star":1,"sum":"agentic RL 只靠终局奖励时，结果相同的 rollout 组没有学习信号、也定位不了失败步。FAULT 先核对自我诊断的证据，再把诊断出的错误转成以终局结果为锚的步级信用，策略与自我诊断器共演化。ALFWorld 上学习信号覆盖率 95%（GRPO 41%、GiGPO 72%）","brief":"agentic RL 只靠终局奖励有两个问题：结果相同的 rollout 组提供不了学习信号；没法定位是哪一步导致失败。自然语言的自我诊断不能直接用，因为它说的错误未必可靠，也没量化每个错误该影响学习多少。FAULT 先核对诊断证据，再把诊断出的错误转成以终局结果为锚的步级信用，相对错误代价从任务结果里学；策略和自我诊断器共演化。ALFWorld 上学习信号覆盖率 95%（GRPO 41%，GiGPO 72%）。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-02","di":"2026-10-03","wi":"2026-10-02","tier":"","tk":"自然语言的自我诊断要先核证据再当信用分配用。","col":"evo"},{"u":"https://claude.dev/blog/how-we-made-claude-ai-faster","t":"How we made claude.ai 3x faster in two weeks","v":"Anthropic","s":"claude.dev 开发者博客 · 补录","d":"2026-09-23","k":"article","star":0,"sum":"**整体概括**：8 月的两周冲刺里，团队在一个 Slack 频道用 Claude Tag（beta，内部研究模型，大致相当于 Opus 5.5）做性能优化。先让 Claude 通过 Datadog MCP 找出占 95% 用户活动的四条路径，拆成 13 个可比的度量；第三天就达成 13 个目标中的 12 个。结果（p75）：claude.ai 首屏可输入 3.1 秒 → 0.55 秒，新建 Claude Code 会话 0.8 秒 → 0.3 秒，加载 Cowork 云会话 2.6 秒 → 0.73 秒；合入三千多个改动，没有一次面向客户的事故或回滚。核心做法是找「可在实验室里数出来」的确定性指标让 Claude 爬坡：用 Valgrind 数 CPU 指令（两条热路径指令数 −48% / −31%，墙钟时间 −78% / −44%），以及 React 提交次数、样式重算次数、DOM 变更数；每个基准要先证明与真实延迟相关，否则下线，通过后进 CI 当只降不升的棘轮。循环：人开线程 → Claude 追踪并建基准 → 按风险拆 PR、用户可见改动放在开关后 → 盯发布读线上数据 → 棘轮锁定或关开关重来；高峰期同时跑 150 多个线程，最忙的日子一天合入 200 多个改动。护栏：每个 PR 自动评审加至少一人批准、先单测后优化、近 200 个短期特性开关、员工 → 1% → 全量灰度。人负责三件事：推高目标、对用户可感知的变化做取舍、收窄每个线程的范围","brief":"","ana":"**这篇解决什么问题**：用户抱怨 claude.ai 慢。团队 8 月做了两周冲刺，所有工作在一个 Slack 频道里进行，每个 thread 里都有 Claude（Claude Tag beta，内部研究模型，大致相当于 Opus 5.5）。这是目前最完整的一份\"**让 agent 在生产代码库上持续 hillclimb**\"的官方复盘。\n\n**结果**（真实用户监控 p75，08-13 对 08-27）：claude.ai 首次加载到可输入 3.1 秒 → 0.55 秒；新建 Claude Code 会话 0.8 → 0.3 秒；加载 Cowork 云会话 2.6 → 0.73 秒。**合入三千多个改动，没有一次面向客户的事故或回滚。**\n\n**怎么起步**：频道里放一条常驻指令，把 Claude 的职责写清楚（盯部署回归、评估遥测是否准确完整、维护仪表盘、主动修、提项目、和人沟通）。Claude 通过 Datadog MCP 分析使用数据，定出占 95% 用户活动的四条旅程、13 个测量点。人挑了约 20 个项目，Claude 估每个项目能省多少毫秒，汇总成目标。**第三天就达成 13 个目标里的 12 个。**\n\n**核心方法：\"能数的东西都能爬\"**。墙钟时间是用户感受到的，但噪声大，毫秒级波动没法当 CI 闸门。于是他们找**确定性的替代指标**：\n\n- 纯 JS 热路径：用 Valgrind + `node --predictable` 数 CPU 指令数，一次运行就够，不需要统计；\n\n- 浏览器路径：每次交互的 React commit 数、V8 函数调用数、样式重算次数、DOM 变更数。\n\n每个新基准要干两件事：在实验室里让 Claude 有个数可降；进 CI 当**只能往下走的棘轮**。而且必须先证明它和墙钟时间相关，证明不了就下掉，免得 Claude 爬错山。例子：两条热路径指令数降 48% 和 31%，墙钟降了 78% 和 44%，于是这两个棘轮进了 CI，之后任何抬高指令数的 PR 直接失败。\n\n文中把这条总结为冲刺的中心教训：**有了 Claude，测量本身让问题变得可解**。以前加指标是第零步，要等数据回来才能开始理解问题；现在它是爬坡的第一步，所以杠杆最高的事是\"找更多能测的东西\"。\n\n**每个 thread 的循环**：有人开 thread 指出某段慢 → Claude 追踪流程，找到或造一个能复现问题的基准 → 实验室里有结果后提 PR（按风险拆小，用户可见的改动放在 flag 后面）→ 上线后 Claude 盯部署、读线上数据 → 变好就把棘轮拧紧，没变好就关 flag 再来 → 继续找同一旅程的下一个慢点。同时在跑的 thread 超过 150 个，单个 thread 会提 50 到 100 个 PR，最忙的日子一天合入 200 多个改动，约三分之一的 PR 带新的遥测或护栏。\n\n**Claude 找到的几个问题**（都是人不容易想到去量的）：输入框的打字路径上有 6,900 个 hook 和 900 个 store 订阅，每敲一个键都重渲染；一个 `:root:has()` 选择器让每次 DOM 变更多花 24 毫秒；一处遗留的 `location.reload()` 每天造成五十万次用户看不见的重载；回复里只要有一个破折号或弯引号，V8 就把整个字符串存成 UTF-16，语法高亮的正则全走慢路径，修复只有 20 行。\n\n**护栏**（提前建好的）：每个 PR 过自动审查 + 至少一个人批准；先有单测再优化；可能影响用户的改动都放在短命 feature flag 后面（两周新增近 200 个 flag，过半在结束前已清理）；高风险改动按员工 → 1% 用户 → 全量灰度。\n\n**人做什么**：定方向和做取舍。每个 thread 故意收得很窄（一个基准或一条旅程）。一个 900 行的 PR 得到的回复只有一句：\"每次发送省 2 毫秒，不值得为它维护这个构建插件。\"\n\n**对 AI 应用工程师的启示**：①想让 agent 长时间自主优化，**先给它一个确定性的、能在本地跑的数**，再证明这个数和真实目标相关；②**每个被证明的收益都变成 CI 棘轮**，否则在快速迭代的代码库里会退化；③并行靠\"多开窄 thread\"，不靠一个大任务；④自主程度高的前提是 flag、灰度、人工批准这些护栏先到位。这和上面 hillclimb 一文是同一方法论在工程规模上的版本。\n\nHN 反响：231 分 / 153 评论","hf":null,"topic":"Harness 与长时程 Agent","first":"2026-10-02","di":"2026-10-02","wi":"2026-10-02","tier":"must","tk":"先把目标变成确定性计数并证明它与真实指标相关，再交给 agent 优化，同时把计数写进 CI 防回退。","col":"harness"},{"u":"https://claude.dev/blog/spending-your-effort","t":"Using Claude Code: Spending your effort","v":"Anthropic","s":"claude.dev 开发者博客 · 补录","d":"2026-09-25","k":"article","star":0,"sum":"**整体概括**：effort 调的是模型做多少验证与边界测试、自己拿多少主意。玩具实验：需求模糊时 effort 越高成品越完整，但替用户做的假设也越多；规格写细后各档结果趋同。Terminal-Bench 3.0 的内部跑分（每题 5 次）显示高 effort 对「隐藏边界情况多」的任务最有用：HTML 净化器一题 Fable 5.1 从 low 的 1/5 到 xhigh 的 5/5，low 约 2 分钟写完只测一个页面，高 effort 约 33 分钟，会对抗式自审、读解析器源码、跑标准 XSS 测试集、写随机 fuzzer。370 次尝试的失败分类里，Fable 5.1 从 low 到 max 通过数 140 → 214，「测试没覆盖到的 bug」40 → 14，但「选错了解读」25 → 47。按领域看通过率：安全 64% → 87%、硬件 34% → 75%、软件 43% → 56%、运维 12% → 22%。作者的档位：low 用于头脑风暴和小改动，medium 用于日常开发，high 用于要验证的棕地 bug，max 用于完全自主的难题","brief":"","ana":"**这篇解决什么问题**：effort 参数到底调的是什么、什么时候用哪一档。作者读了评测结果并亲手对比了多种任务。\n\n**结论一句话**：effort 调的是模型**做多少验证和边界测试、自己拿多少主意**。把它想成给人的时限：同一件事给 12 小时和给 1 小时，交回来的东西和期待的迭代方式都不同。\n\n**日常开发的三个小实验（Opus 5.5）**：\n\n- **需求模糊的构建任务**（\"做个健身记录应用\"）：low 只有日志和一张简单图表；effort 越高功能越全，同时 Claude **替你做的决定也越多**。\n\n- **轻度指定的设计任务**（重做 `/config` 菜单）：low 用 1 分钟给出能说明想法的交互草图；max 用 28 分钟给出很像 Claude Code 的成品稿和多条流程走查。想快速反馈就用 low。\n\n- **高度指定的任务**（先让 Claude 访谈出完整 spec）：各档产出很接近。\n\n作者据此推荐的循环：**让 Claude 访谈你补全 spec → low 实现 → 人看方向对不对、low 迭代 → high 做验证和测试。**\n\n**难任务上 effort 帮在哪**（Terminal-Bench 3.0）：**隐藏边界情况多的任务受益最大**。`html-js-filter`（写一个 HTML 净化器）上 Fable 5.1 从 low 的 1/5 升到 xhigh 的 5/5：low 约 2 分钟，一遍写完、用一个手写页面测；high 约 33 分钟，对抗式审查初稿、读解析器源码、跑标准 XSS 测试集、最后写了个随机文档 fuzzer。\n\n按领域看 Fable 5.1 从低档到最高档的通过率：安全 64% → 87%，硬件 34% → 75%，ML 54% → 73%，科学 41% → 61%，软件 43% → 56%，媒体 18% → 30%，运维 12% → 22%。\n\n**effort 修不了什么**：失败归因图显示，Fable 5.1 从 low 到 max，通过数 140 → 214（共 370 次），\"测试没覆盖到的 bug\"从 40 降到 14；但\"**选错了对需求的理解**\"从 25 升到 47。也就是说，effort 减少的是漏掉边界情况的失败，方向选错它不管。\n\n**对 AI 应用工程师的启示**：把 effort 当成\"验证预算\"来分配。需求没说清时加 effort 只会让模型替你做更多假设，先把 spec 补齐更有效；安全、硬件、性能、代码审查这类边界多的任务值得高档。另外文首提到一个工程细节：在 Claude Code 里调 effort **不会打破 prompt 缓存**。","hf":null,"topic":"Harness 与长时程 Agent","first":"2026-10-02","di":"2026-10-02","wi":"2026-10-02","tier":"note","tk":"先让模型就规格访谈你，low 实现、人工确认方向，再用 high 做验证和测试。","col":"harness"},{"u":"https://claude.dev/blog/building-with-claude-sonnet-5-5","t":"Building with Claude Sonnet 5.5","v":"Anthropic","s":"claude.dev 开发者博客 · 补录","d":"2026-09-28","k":"article","star":0,"sum":"**整体概括**：Sonnet 5.5 的开发者指南。价格与 Sonnet 5 相同（输入 $2、输出 $10、缓存读 $0.20 每百万 token），1M 上下文原生支持，最大输出 128k，最小可缓存 prompt 从 1,024 降到 512 token，API 默认 effort 为 high、Claude Code 为 medium。迁移要点：thinking 默认开启，`thinking: disabled` 返回 400，改用只在工具调用之间思考的 `between_tools`（仅支持 low / medium / high）；`tool_choice` 的 any / tool 返回 400，改 `auto` 加 `strict: true`；对话保持只追加，thinking 块与模型绑定；computer use 只支持新的 toolset；advisor 不接受 Opus 4.8、Opus 4.7 和 Sonnet 5；工具调用之间的说明文字改在 thinking 块里返回。调参：effort 档位已重新校准，旧设置不能照搬；删掉「不要偷懒」之类的旧补丁后重跑评测；想让模型少思考要降 effort，在系统提示里要求没用；改顶层 effort 会使缓存失效，单轮调整用 per-message effort（beta）。拒绝以 HTTP 200 加 `stop_reason: \"refusal\"` 返回，分五类","brief":"","ana":"**这篇解决什么问题**：Sonnet 5.5 的开发者指南：怎么选型、怎么计价、从 Sonnet 5 迁移会撞上哪些 400 错误。\n\n**选型**：Sonnet 5.5 适合**有清晰 spec 且有办法检查结果**的任务（修 bug、快速迭代功能、重复跑的调查 / 审查 / 起草类 agent 任务、文档幻灯片表格）；需要仔细判断的长时程工作用 Opus 5.5。\n\n**计价与规格**：每百万 token 输入 $2、输出 $10、缓存读 $0.20、5 分钟缓存写 $2.50、1 小时缓存写 $4，与 Sonnet 5 完全相同；因为完成同样的工作用的 token 更少，多数工作成本最多低 30%，速度快 30%。1M 上下文原生支持，最大输出 128k。**最小可缓存 prompt 从 1,024 降到 512 token**，更短的系统提示和工具定义也能缓存。API 默认 effort 是 high，Claude Code 里是 medium；文中提醒，如果想开 xhigh 或 max，可能已经丢掉 Sonnet 的性价比，该考虑 Opus 5.5。\n\n**迁移时的破坏性变更**（文中列了五项，另有一项响应形态变化）：\n\n1. **思考默认开启，且不能关**：`thinking: {\"type\": \"disabled\"}` 返回 400。改用新的 `between_tools`（只在工具调用之间思考）。它只支持 low / medium / high，不能带其他字段，对话中途不能改 effort。\n\n2. **强制 `tool_choice` 被移除**：`any` 和 `tool` 返回 400。改成 `auto` + 把工具标 `strict: true` + 在 prompt 里说明何时用它。\n\n3. 对话保持只追加（append-only）。\n\n4. computer use 改到 toolset 里。\n\n5. 检查 advisor 配对。\n\n6. 工具调用之间的文字从 `thinking` 块里读。因为响应可能以 `thinking` 块开头，**读 `content[0].text` 的代码会坏**，要按块类型遍历。\n\n**调优建议**：重跑 effort 扫描；删掉为 Sonnet 5 写的变通提示；low effort 下明确要求\"真的跑检查\"；要进度就读 `thinking.display: \"summarized\"`，**不要让模型在回复里写出推理过程**（会触发 `reasoning_extraction` 类拒绝）；请求之间改顶层 effort 会让缓存失效，单轮换档用 per-message effort（beta）。\n\n**拒绝的形态**：被拒的请求返回 HTTP 200，`stop_reason: \"refusal\"`，`stop_details` 给出五类之一：`cyber`、`bio`、`frontier_llm`、`reasoning_extraction`、`general_harms`。服务端回退（beta）只对 `cyber` 和 `frontier_llm` 两类重试到 Sonnet 5。\n\n**对 AI 应用工程师的启示**：两处接口变化值得记住，因为它们代表方向：**强制工具调用退场**（靠 strict schema + 提示），**关思考退场**（最多只能关\"开头那一段\"）。写客户端时别再假设第一个内容块是文本，别把拒绝当异常处理（它是 200）。`reasoning_extraction` 这个拒绝类别和本期 OpenAI 披露的蒸馏行动是同一件事的两端。","hf":null,"topic":"Harness 与长时程 Agent","first":"2026-10-02","di":"2026-10-02","wi":"2026-10-02","tier":"note","tk":"low effort 下模型偶尔不跑真实检查就报完成，文中给了一段可直接放进系统提示的「必须跑真实检查」要求。","col":"harness"},{"u":"https://claude.dev/blog/getting-the-most-out-of-opus-5-5","t":"Getting the most out of Opus 5.5 in Claude and Claude Code","v":"Anthropic","s":"claude.dev 开发者博客 · 补录","d":"2026-09-22","k":"article","star":0,"sum":"**整体概括**：面向使用者的 Opus 5.5 指南。提问：一条消息交代完整任务，写明「完成」的标准和何时停下来问；删掉「仔细思考」类语句，模型每次回复前都会思考；设计类请求要列出不想要的具体样式，笼统的「别太普通」只会换一种默认。长任务：在 CLAUDE.md 里写清哪些情况继续、哪些情况停，并保留对破坏性操作的确认；大型审计或迁移让它分给子 agent 并核对每个子 agent 的证据；任务清单放文件里，压缩后仍在。检查：先读它需要你决定的部分；让它先做一遍代码评审，只列会阻止合并的问题；研究类请求让它标出没能确认的内容和查过的位置。被标记的消息会切到旧模型继续，要求在回复里复现内部推理可能被拒","brief":"","ana":"**这篇解决什么问题**：Opus 5.5 有三点和前代不同：能独立工作更久、会直白地汇报做了什么、每次回复前都思考。这篇是面向使用者的操作指南，每条都按\"做什么 / 为什么 / 怎么做\"写。\n\n**提问**：\n\n- **一条消息交代完整任务，写明\"完成\"长什么样、什么时候停下来问**。例：\"迁移支付端点到新客户端。完成 = 每个端点都用新客户端、旧客户端已删除、测试通过。只有测试失败且你解释不了原因时才停下来问我。\"\n\n- **删掉\"仔细思考\"\"一步步想\"**。模型每次都会思考并自己决定想多少；测试里删掉这类句子，回复开始得更快，质量没有明显下降。\n\n- **设计类请求要列出不想要的具体样式**。\"避免千篇一律\"只会换一种默认风格；列\"不要米白背景、不要标题里的斜体强调词、不要 01/02/03 编号、不要等宽标签、不要药丸按钮\"才有效。\n\n**驾驭长任务（Claude Code）**：\n\n- 在 CLAUDE.md 里写清**哪些停顿你要、哪些不要**：不需要我输入就继续，状态说明和下一步动作放在同一条消息里；只有无法继续或要做破坏性操作（删数据、force-push、改仓库外的东西）时才停。\n\n- 大型审计或迁移，让它**拆给子 agent 并核对每个子 agent 的证据**，最后汇成一张表。\n\n- 让它把**任务清单写在文件里**并随时更新。长任务会触发上下文压缩，文件里的清单不受影响。\n\n**检查结果**：先看\"它需要你做什么\"，再看其余总结；让它审 diff 时要求\"只列你会拦住合并的问题，给出文件行号、为什么错、怎么证明它会失败\"；研究类任务加一句\"标出你没能确认的内容，并说明查过哪里\"。\n\n**对 AI 应用工程师的启示**：这份指南反映的是模型代际变化对 prompt 的要求变了：**过程性指令（怎么想）在减少，边界性指令（做到什么算完、何时停、哪些不能碰）在增加**。给自己的 agent 写系统提示时可以直接套这个结构。","hf":null,"topic":"Harness 与长时程 Agent","first":"2026-10-02","di":"2026-10-02","wi":"2026-10-02","tier":"","tk":"CLAUDE.md 里那条「无需我输入就继续，状态说明和下一步动作放在同一条消息里，仅在无法继续或破坏性操作前停下」可以直接用。","col":"harness"},{"u":"https://claude.dev/blog/getting-started-with-claude-code-mods","t":"Getting started with Claude Code mods","v":"Anthropic","s":"claude.dev 开发者博客 · Tutorials","d":"2026-10-01","k":"article","star":0,"sum":"**整体概括**：从空文件夹写一个约 80 行的 mod「Token Weather」（在输入框上方显示上下文窗口占用）。mod 是一个行为写在 JS / TS 模块里的插件：`hooks/hooks.json` 指向一个模块，模块导出 `register(on)`，用 `on(event, matcher, hook)` 挂钩子；钩子像中间件一样成链，可以观察（先 `next(e)` 再看结果）、改写（改了再传）、应答（不调 `next` 直接返回，例如拒绝工具调用）。事件覆盖工具调用、提交的 prompt、轮次与会话的开始结束、斜杠命令和界面渲染；模块里没有 DOM 和 Node，对外操作都经 `$`（文件、进程、HTTP、状态、UI 等）。与 settings hooks 的区别：mod 只加载一次并常驻会话，能保存状态、画实时 UI、注册斜杠命令和模型可调用的工具。要点：状态放 `$.state` 才能跨热重载保留；`claude plugin validate` 静态检查钩子与调用，`claude plugin test` 在真实运行时里跑测试。另两个示例：Blast Radius 在 `rm -rf`、`git reset --hard` 等命令执行前挂起并展示影响范围；Replay Theater 记录一轮内所有编辑供逐步回看。需 Claude Code 2.1.287 以上","brief":"","ana":"**这篇解决什么问题**：10-01 Claude Code 开放了 mods。设置、权限规则、slash 命令、skill、状态栏都只能\"配置\"Claude Code；mod 可以**改写或替换它的行为，还能画自定义界面**。这篇从空文件夹写一个约 80 行的 mod（Token Weather，在输入框上方显示上下文窗口占用）。\n\n**mod 是什么**：一个普通插件，行为写在一个 JS / TS 模块里。模块导出 `register(on, options)`，用 `on(event, matcher?, hook)` 挂钩子，每个钩子的签名是 `($, e, next)`：`$` 是 mods API（ui、session、state、store、fs、process、http、tool、command、model 等），`e` 是事件输入，`next` 把事件交给链上的下一个插件，最底层是 Claude Code 自己的行为。\n\n**钩子是一条中间件链，能做三种事**：\n\n动作｜写法｜例子\n\n观察｜`const r = await next(e); return r`｜记录每次文件编辑、每轮结束后取一次读数\n\n改写｜`return next({ ...e, command: safer })`｜改变链上后续看到的内容\n\n应答｜不调 `next`，直接 `return { deny: \"…\" }`｜拒绝一次工具调用，或自己实现一个命令 / 工具\n\n事件覆盖工具调用、提交的 prompt、轮次开始与结束、会话开始与结束、slash 命令，以及 `ui.render`（界面每一块被绘制时）。\n\n**和 settings hook 的区别**：settings hook 是每个事件起一个 shell 命令，经 stdin / stdout 传 JSON；mod 加载一次、常驻会话，能**保存状态、随事件更新界面、反过来调用 Claude Code**（开面板、跑进程、注册 slash 命令、注册一个模型可调用的工具）。\n\n**两个值得知道的事实**：Claude Code 自己的一些功能就是用 mod 写的（AGENTS.md 支持、`/diff` 面板），源码和测试在公开仓库 anthropics/claude-code 的 `mods/` 下；教程说模块跑在没有 DOM、没有 Node 的独立运行环境里，对外一切经 `$`，但同日的产品公告也说明 mod 的权限等同 Claude Code 本身，团队版和受管设备上有一个最先加载的内置 `sec-default`，阻止用户 mod 覆盖权限拒绝规则。\n\n**对 AI 应用工程师的启示**：这是\"**harness 可编程化**\"的一个具体形态：把 agent 循环的每个事件开放成中间件链。自己设计 agent 平台的扩展点时，\"观察 / 改写 / 应答\"三分法和\"安全类钩子最先加载、最后看到结果\"的顺序约定都可以借用。同时它也带来新的攻击面：本期论文《Approval Laundering》研究的正是\"人批准的动作\"和\"实际执行的动作\"在 harness 里被改写后不一致的问题。","hf":null,"topic":"Harness 与长时程 Agent","first":"2026-10-02","di":"2026-10-02","wi":"2026-10-02","tier":"must","tk":"「拦截 → 干跑估算影响 → 人确认」的写法可照搬到任何 agent 的危险操作上；文中也明说它只读命令文本，硬拦截仍要靠权限规则。","col":"harness"},{"u":"https://www.anthropic.com/research/claude-shaped-science","t":"Claude-shaped science","v":"Anthropic","s":"/research · Science","d":"2026-10-01","k":"article","star":0,"sum":"**整体概括**：Matthew Schwartz 的第二篇特邀文。这次他不再把 Claude 当研究生带，而是找「Claude 形状」的问题：依赖跨学科知识、大量编码、结果可数值核验。起点是散射振幅的半数值 bootstrap，Claude Fable 5 把分散在多种语言和无代码论文里的方法移植到统一框架，约 20 分钟复现他写了几周的结果；之后推广到椭圆积分，端到端算出 30 个积分（15 个复现、15 个此前未算过）。工具集沉淀为开源 harness BootLoops。随后 Claude 发现同类积分可映射到生态学、群体遗传学等领域；三个月内从约 400 个候选问题推进到 18 个领域、36 篇稿件、19 位合作者。反复出现的规律：Claude 的初始结果技术上正确但科学上不够有意思，要领域专家指方向（生态学中性理论、对 1000 Genomes 的 57 亿对邻近突变做分析等）。技术细节：Claude Code 会话跑在云端虚拟机，每个项目一个会话，另有主会话协调、分配算力、验证结果；计算交给后台子 agent，中间结果写进各自文件夹的 markdown；另设会话充当对抗性审稿人。失败模式：爱宣告完成、没有时间感、倾向硬算几天而不是造工具、压缩后丢上下文","brief":"","ana":"**这篇解决什么问题**：物理学家 Matthew Schwartz 的第二篇特邀文。去年 12 月他把 Claude Opus 4.5 当研究生带，结论是\"相当于 20 倍速的优秀研究生，但每句话都要改\"。这次他换了思路：**不再把 Claude 当成他希望的那种合作者，而是按它实际的样子找问题**。他称之为\"Claude 形状的问题\"：依赖跨学科知识、需要大量编码、结果可检验。\n\n**做法**：让 Claude 先搭一套数学物理工具，再不断用旧工具、造新工具，积累成一个开源 harness，叫 BootLoops。Claude 反复指出同一种模式：很多领域有一个问题，只要有人知道另一个领域的某个技术就能直接解决。比如群体遗传学里的贝叶斯证据积分，和 BootLoops 原本要算的费曼积分是同一类计算。\n\n**规模**：三个月，约 400 个候选问题里推进了 **18 个领域的 36 篇稿件，19 位合作者**。一个例子是生态学的中性理论：2005 年提出的一个方程 20 年没人能大规模求解，Claude 认出它是 BootLoops 形状的并解了出来。\n\n**一个关键教训**：离开自己的专业后，他发现自己会相信 Claude 说的\"这个结果很棒\"。请来领域专家后发现，**Claude 几乎总是技术上正确，但结果本身没多大意思，直到专家帮忙把方向拧过来**。\n\n**技术细节一节是全文对工程师最有用的部分**：\n\n- **会话组织**：每个项目一个 Claude Code 会话，另有一个主会话负责协调、分配算力、验证结果；还有单独的会话负责写作、建仓库和工具手册、写和验证工具代码，以及一个专门当\"对抗式审稿人\"反复核对结果。\n\n- **子 agent 的一个实际好处**：他经常撞上 Fable 5 的分类器。撞上时只会关掉一个子 agent，不会毁掉整个会话。\n\n- **压缩丢上下文**：让 Claude 定期整理和合并文件，保证随时能读到最新版计划。\n\n- **Claude 没有时间感**：工作了三天，它说\"两年的战役\"；问 ETA，要么长得离谱要么短得离谱。作者最后靠自己的感觉判断进度。\n\n- **Claude 默认\"硬磨\"**：宁可跑一个多天的计算，也不去造一个让同样的计算只要几分钟的工具。要反复提醒\"想得更巧，别更使劲\"。\n\n**他列的失败模式清单**：爱宣布胜利（\"完成了，只剩一个未证的引理\"，而那个引理就是整个证明）；自动检查不可信，要自己看图；计算对、结论可能错；品味要人给（Claude 偏爱高引用但被遗忘的旧争论）；会无限磨下去。\n\n**对 AI 应用工程师的启示**：这是一份来自重度用户的**长时程多会话 agent 失败模式清单**，和上期 Amazon AutoResearch 的五种失败模式（记忆衰减、方向停滞、指标执念）可以对着读。能直接照做的三条：①给\"完成\"定硬标准，不接受\"完成，但有一点保留\"；②设一个独立的对抗式验证会话；③计划写在文件里并定期合并，别指望上下文。","hf":null,"topic":"Harness 与长时程 Agent","first":"2026-10-02","di":"2026-10-02","wi":"2026-10-02","tier":"must","tk":"成功标准写死（如「不允许未证明的引理」），让 agent 定期整理并合并计划文件以抵抗压缩，结果要亲自看图而不是信「吻合良好」。","col":"harness"},{"u":"https://claude.dev/blog/lessons-from-building-claude-code-prompt-caching-is-everything","t":"Lessons from building Claude Code: Prompt caching is everything","v":"Anthropic","s":"claude.dev 开发者博客","d":"2026-04-30","k":"article","star":0,"sum":"","brief":"","ana":"**这篇解决什么问题**：长时程 agent 在成本和延迟上之所以可行，靠的是 prompt 缓存。Claude Code **整个 harness 是围绕缓存设计的**：团队对缓存命中率设了告警，过低就按事故（SEV）处理。这篇讲他们踩出来的几条不直观的规则。\n\n**根本约束：缓存是前缀匹配**。API 缓存从请求开头到每个 `cache_control` 断点的内容，前缀里任何一处变了，后面全部失效。所以顺序决定一切：\n\n1. 静态系统提示和工具（全局缓存）\n\n2. CLAUDE.md（项目内缓存）\n\n3. 会话上下文（会话内缓存）\n\n4. 对话消息\n\n这个顺序很脆。他们自己弄坏过：在静态系统提示里放了精确时间戳；工具定义的顺序不确定；改了某个工具的参数（比如 Agent 工具能调用哪些 agent）。\n\n**四条规则**：\n\n- **要更新信息，用消息，不改 prompt**。时间变了、用户改了文件，都放进下一条用户消息或工具结果里的 `<system-reminder>` 标签，不动系统提示。\n\n- **会话中途不换模型**。缓存按模型区分。和 Opus 聊了 10 万 token 后想问个简单问题，切到 Haiku 反而更贵，因为要给 Haiku 重建缓存。真要换，用子 agent：让 Opus 写一条交接消息给另一个模型（Explore 子 agent 用 Haiku 就是这么做的）。\n\n- **会话中途不增删工具**。工具在缓存前缀里，增删一个就让整段对话的缓存失效。\n\n- **Plan Mode 的设计**：直觉做法是进入计划模式就把工具集换成只读的，但那会破坏缓存。实际做法是**所有工具始终都在**，EnterPlanMode 和 ExitPlanMode 本身是工具；进入计划模式时用一条系统消息告诉模型规则。附带的好处是模型遇到难题可以自己进入计划模式。\n\n- **工具搜索**：几十个 MCP 工具全量放进每个请求太贵，中途移除又破坏缓存。解法是 `defer_loading`：只发轻量存根（只有工具名），模型需要时通过工具搜索\"发现\"完整 schema。存根始终以同样的顺序存在，前缀稳定。\n\n- **压缩（compaction）也要对缓存安全**。最简单的做法是另起一个 API 调用，用\"总结一下\"的系统提示、不带工具。这正是成本陷阱：前缀从第一个 token 就不同，整段对话都按未缓存价格计费，而对话越长越需要压缩。Claude Code 的做法是**\"缓存安全的分叉\"**：压缩请求使用和父对话**完全相同**的系统提示、用户上下文和工具定义，把父对话消息放在前面，最后追加一条压缩指令。API 看到的请求和父对话的上一个请求几乎一样，前缀命中缓存，新增的只有压缩指令本身。代价是要预留一段\"压缩缓冲区\"放压缩指令和摘要输出。\n\n**对 AI 应用工程师的启示**：这是讲\"缓存如何反过来决定 harness 架构\"最清楚的一篇，结论可以背下来：**状态变化用工具和消息来表达，不用改系统提示或工具集来表达**；任何旁路计算（压缩、摘要、skill 执行）都要共享父请求的前缀；缓存命中率要像可用性一样监控。上期的《What a task costs on Opus 5.5》给了缓存命中率对账单的影响（0% 时 $11.20，90% 时 $1.62），这篇给的是怎么把命中率做上去。","hf":null,"topic":"Harness 与长时程 Agent","first":"2026-10-02","di":null,"wi":"2026-10-02","tier":"","tk":"这是讲\"缓存如何反过来决定 harness 架构\"最清楚的一篇，结论可以背下来：**状态变化用工具和消息来表达，不用改系统提示或工具集来表达**；任何旁路计算（压缩、摘要、skill 执行）都要共享父请求的前缀；缓存命中率要像可用性一样监控。上期的《What a task costs on Opus 5.5》给了缓存命中率对账单的影响（0% 时 $11.20，90% 时 $1.62），这篇给的是怎么把命中率做上去。","col":"harness"},{"u":"https://claude.dev/blog/seeing-like-an-agent","t":"Seeing like an agent: how we design tools in Claude Code","v":"Anthropic","s":"claude.dev 开发者博客","d":"2026-04-10","k":"article","star":0,"sum":"","brief":"","ana":"**这篇解决什么问题**：给 agent 设计工具，是给一个通用工具（bash），还是给五十个专用工具？作者的框架是：工具要**贴合模型自身的能力**，而能力是什么只能靠读它的输出、做实验来了解。全文用 Claude Code 里三个工具的演变来说明，包括做错的版本。\n\n**案例一：AskUserQuestion（让模型更好地提问）**\n\n- 第一版：给 ExitPlanTool 加一个\"问题数组\"参数。失败，因为同时要计划和关于计划的问题，模型困惑：答案和计划冲突怎么办？\n\n- 第二版：改输出格式，让模型按一种特殊 markdown 输出问题和选项，再解析成界面。失败，模型通常能做到但不可靠，会多写句子、漏选项、放弃格式。\n\n- 第三版：做成一个随时可调用的独立工具，触发时弹出模态框并阻塞 agent 循环直到用户回答。成功。文中的判断标准很实在：**模型\"喜欢\"调用它，调用出来的结果也好**。设计得再好的工具，模型不会调就没用。\n\n**案例二：TodoWrite → Task（工具要随模型能力更新）**\n\n早期模型需要 todo 列表防止跑偏，后来还每 5 轮插一次系统提醒。模型变强后，todo 反而成了束缚：提醒让它以为必须照着列表做，不敢改计划。再加上子 agent 能力上来后需要协调，于是 TodoWrite 被 Task 工具取代：**todo 是为了让模型不跑偏，task 是为了让多个 agent 互相沟通**（带依赖、能跨子 agent 共享更新、可改可删）。结论：模型曾经需要的工具，后来可能在限制它，要不断回头审视；这也是只支持少数几个能力相近的模型的理由。\n\n**案例三：搜索接口（从给上下文到让模型自己找）**\n\n最早内部版本用 RAG：向量库预索引代码库，harness 检索片段塞给模型。问题是要建索引、跨环境脆弱，更重要的是上下文是**被给的**而不是模型自己找的。换成 Grep 工具后模型自己搜、自己建上下文。之后 Agent Skills 把\"渐进式披露\"正式化：模型读 skill 文件，文件再指向别的文件，递归下去。一年里模型从基本不会自己建上下文，变成能跨多层文件做嵌套搜索。\n\n**渐进式披露的另一种用法：不加工具就加能力**。Claude Code 大约有 20 个工具，**加新工具的门槛很高，因为每多一个都是模型要多考虑的一个选项**。例子：模型不了解 Claude Code 自己（怎么加 MCP、某个 slash 命令做什么）。把这些全写进系统提示会造成上下文腐烂；给一个文档链接让它自己查，它会把大段文档拉进上下文。最后的解法是 **Claude Code Guide 子 agent**：在自己的上下文里查文档，只把答案交回来。\n\n**对 AI 应用工程师的启示**：面试里\"工具该怎么设计\"这道题的一手答案。四个要点：①结构化输出需求优先做成工具，别靠输出格式约定；②一个工具只做一件事，别在已有工具上叠参数；③工具集要随模型代际做减法；④想加能力先考虑渐进式披露或子 agent，最后才是加工具。这篇和上面的缓存一文是配套的：ExitPlanTool 为什么存在，答案在缓存那篇。","hf":null,"topic":"Skill、上下文工程与工具","first":"2026-10-02","di":null,"wi":"2026-10-02","tier":"","tk":"面试里\"工具该怎么设计\"这道题的一手答案。四个要点：①结构化输出需求优先做成工具，别靠输出格式约定；②一个工具只做一件事，别在已有工具上叠参数；③工具集要随模型代际做减法；④想加能力先考虑渐进式披露或子 agent，最后才是加工具。这篇和上面的缓存一文是配套的：ExitPlanTool 为什么存在，答案在缓存那篇。","col":"skill"},{"u":"https://claude.dev/blog/a-harness-for-every-task-dynamic-workflows-in-claude-code","t":"A harness for every task: dynamic workflows in Claude Code","v":"Anthropic","s":"claude.dev 开发者博客","d":"2026-06-02","k":"article","star":0,"sum":"","brief":"","ana":"**这篇解决什么问题**：默认的 Claude Code harness 要在**同一个上下文窗口里既规划又执行**。对多数编码任务够用，但对长时间、大规模并行、高度结构化或需要对抗的任务会失效。dynamic workflows 让 Claude **为眼前的任务现写一个 harness**：一个 JavaScript 脚本，用 `agent()` 起一个子 agent，用 `parallel()` 和 `pipeline()` 组合多个，还能决定每个子 agent 用哪个模型、是否放进独立 worktree。\n\n**单上下文长任务的三种失败模式**（这是全文最值得记的定义）：\n\n- **agent 式偷懒（agentic laziness）**：复杂多部分任务没做完就宣布完成，比如安全审查 50 项只处理了 35 项。\n\n- **自我偏好（self-preferential bias）**：让它按 rubric 验证或评判时，偏向自己的结果。\n\n- **目标漂移（goal drift）**：多轮之后对原始目标的保真度逐渐下降，尤其在压缩之后；每次摘要都有损，边界要求和\"不要做 X\"这类约束容易丢。\n\nworkflow 的对策是让多个子 agent 各有独立上下文和聚焦的目标。\n\n**为什么是\"动态\"**：以前用 Agent SDK 或 `claude -p` 写的静态 workflow 要覆盖所有边界情况，所以通常很通用。现在模型足够聪明，可以为具体任务量身写一个。\n\n**六种可组合的模式**：\n\n模式｜做法\n\n分类后行动｜用分类 agent 判断任务类型再路由\n\n扇出后综合｜拆成许多小步，每步一个 agent，各自干净的上下文；综合步骤等全部完成后合并结构化输出\n\n对抗式验证｜每个 agent 的产出由另一个 agent 按 rubric 对抗核查\n\n生成后过滤｜生成一批想法，再按 rubric 或验证过滤、去重\n\n锦标赛｜多个 agent 用不同方法做同一件事，由评判 agent 两两比较\n\n循环直到完成｜工作量未知时循环起 agent，直到满足停止条件（没有新发现、日志里没有错误）\n\n**几个用例里的工程细节**：\n\n- **排序**：一千多行的定性排序放进一个 prompt 会掉质量也放不下。改用锦标赛或成对比较，文中给的理由是**比较式判断比绝对打分更可靠**；每次比较是一个新 agent，确定性的循环拿着对阵表。\n\n- **规则遵守**：某些规则写进 CLAUDE.md 模型还是会漏，就为每条规则起一个验证 agent，再加一个\"怀疑者\"过滤误报。反方向也成立：从最近的会话和代码审查评论里挖出反复做的纠正，聚类、对抗验证（这条规则真能防止一次真实的错误吗），存活的写回 CLAUDE.md。\n\n- **分诊的隔离模式（quarantine）**：读不可信公开内容的 agent 没有任何高权限动作；负责行动的 agent 只看到它们的摘要。\n\n- **根因分析**：让不同 agent 从互不重叠的证据（日志、文件、数据）各自生成假设，每个假设再面对一组验证者和反驳者，从结构上避开自我偏好。\n\n**什么时候不用**：workflow 明显更费 token。常规编码任务先问一句\"它真的需要更多算力吗\"，多数传统编码任务不需要五个评审。可以用\"用 10k token\"这样的提示设预算上限。\n\n**对 AI 应用工程师的启示**：三种失败模式加六种编排模式，基本就是\"什么时候该上多 agent、怎么上\"的答题框架。尤其要记住它给出的理由不是\"多 agent 更强\"，而是**独立上下文能从结构上消除自我偏好和目标漂移**。隔离模式是处理提示注入的一个实用结构，和 dots 的\"后台任务只读\"是同一思路。","hf":null,"topic":"Harness 与长时程 Agent","first":"2026-10-02","di":null,"wi":"2026-10-02","tier":"","tk":"三种失败模式加六种编排模式，基本就是\"什么时候该上多 agent、怎么上\"的答题框架。尤其要记住它给出的理由不是\"多 agent 更强\"，而是**独立上下文能从结构上消除自我偏好和目标漂移**。隔离模式是处理提示注入的一个实用结构，和 dots 的\"后台任务只读\"是同一思路。","col":"harness"},{"u":"https://claude.dev/blog/lessons-from-building-claude-code-how-we-use-skills","t":"Lessons from building Claude Code: How we use skills","v":"Anthropic","s":"claude.dev 开发者博客","d":"2026-06-03","k":"article","star":0,"sum":"","brief":"","ana":"**这篇解决什么问题**：Anthropic 内部有几百个 skill 在用。这篇回答三个问题：什么样的 skill 值得做、怎么写、怎么分发。\n\n**先纠正一个误解**：skill 不是\"一个 markdown 文件\"，而是一个**文件夹**，可以装脚本、资产、数据，在 Claude Code 里还能注册动态 hook。\n\n**九类 skill**（内部盘点后的聚类；好的 skill 干净地落在一类里，想做太多的会跨几类并让 agent 困惑）：\n\n类别｜内容｜例子\n\n库与 API 参考｜内部或易错的库怎么用，带代码片段和坑点｜内部计费库的边界情况\n\n**产品验证**｜怎么测试代码真的能用，常配 playwright、tmux｜无头浏览器跑完注册流程并在每步断言状态\n\n数据获取与分析｜连数据和监控栈，带仪表盘 ID、常用查询｜哪张表有权威的 user_id\n\n业务流程自动化｜把重复流程变成一条命令｜汇总工单和 GitHub 活动生成站会更新\n\n代码脚手架与模板｜按团队约定生成样板｜新迁移文件模板和常见坑\n\n代码质量与审查｜强制代码规范、辅助审查｜起一个全新视角的子 agent 批评，改到只剩吹毛求疵为止\n\nCI/CD 与部署｜拉取、推送、部署｜盯 PR、重试 flaky CI、解决冲突、开自动合并\n\nRunbook｜从症状出发，跨工具排查，产出结构化报告｜按请求 ID 拉出所有相关系统的日志\n\n基础设施运维｜例行维护，带破坏性操作的护栏｜找孤儿资源 → 发 Slack → 等待期 → 用户确认 → 清理\n\n文中特别指出：**验证类 skill 对输出质量的可测影响最大**，值得让一个工程师花一周把它做好。技巧包括让 Claude 录下操作视频、在每一步强制程序化断言。\n\n**写 skill 的八条建议**：\n\n1. **不要说显而易见的事**。模型本来就会写代码、会读代码库；重复它默认会做的事只是占上下文。要写的是把它**推离默认思路**的信息。\n\n2. **建一个 Gotchas 小节**。这是 skill 里信号最强的内容，从模型实际踩过的坑积累而来。例：\"`subscriptions` 表是只追加的，要的是 version 最高的那行，不是 `created_at` 最新的。\"\n\n3. **用文件系统做渐进式披露**。SKILL.md 指向别的文件（`references/api.md`、`assets/` 里的模板），告诉模型有哪些文件，它会在合适的时候去读。\n\n4. **别把模型绑死**。skill 复用度高，指令太具体会在别的情境里出错。写目标和约束，不写每一步。\n\n5. **想清楚初始化**。需要用户信息的 skill（比如发到哪个 Slack 频道）把配置存进 skill 目录下的 config.json，没配置就问用户。\n\n6. **description 字段是写给模型看的触发条件，不是摘要**。会话开始时模型扫一遍所有 skill 的 description 来判断\"有没有 skill 适合这个请求\"。\n\n7. **让 skill 有记忆**。在 skill 里存数据（追加日志、JSON、甚至 SQLite）。例：站会 skill 保留每次发过的内容，下次只报变化。用 `${CLAUDE_PLUGIN_DATA}` 拿稳定目录。\n\n8. **给脚本和库**。让模型把轮次花在组合上，而不是重写样板。另外可以带**按需 hook**：只在 skill 被调用时激活，例如 `/careful` 拦住 `rm -rf`、`DROP TABLE`、force-push，`/freeze` 拦住指定目录之外的编辑。\n\n**分发与度量**：小团队把 skill 签入仓库（`.claude/skills`）；规模大了用内部插件市场，因为每个签入的 skill 都会占一点上下文。Anthropic 没有中心团队审批：先放沙箱目录、在 Slack 里推荐，有了使用量再提 PR 进市场。用 PreToolUse hook 记录 skill 使用情况，找出受欢迎的和**触发率低于预期**的。\n\n**对 AI 应用工程师的启示**：这篇和 9 月中补录的《Equipping agents for the real world with Agent Skills》配套，那篇讲 skill 是什么，这篇讲生产里怎么用。最值得带走的三点：**Gotchas 是 skill 的核心资产**；**description 决定触发**（本期 hillclimb 一文正好说 skill 触发率是最容易爬的指标之一）；**优先投资验证类 skill**。还有一点和自演进主线相关：文末说\"多数好 skill 一开始只有几行和一个 gotcha，是人们在模型遇到新边界情况时不断往里加才变好的\"。这是人工版的 skill 演化，而下面精读的论文正是在问：如果让 agent 自己这样加，会发生什么。","hf":null,"topic":"Skill、上下文工程与工具","first":"2026-10-02","di":null,"wi":"2026-10-02","tier":"","tk":"这篇和 9 月中补录的《Equipping agents for the real world with Agent Skills》配套，那篇讲 skill 是什么，这篇讲生产里怎么用。最值得带走的三点：**Gotchas 是 skill 的核心资产**；**description 决定触发**（本期 hillclimb 一文正好说 skill 触发率是最容易爬的指标之一）；**优先投资验证类 skill**。还有一点和自演进主线相关：文末说\"多数好 skill 一开始只有几行和一个 gotcha，是人们在模型遇到新边界情况时不断往里加才变好的\"。这是人工版的 skill 演化，而下面精读的论文正是在问：如果让 agent 自己这样加，会发生什么。","col":"skill"},{"u":"https://developer.nvidia.com/blog/build-applications-on-nvidia-bluefield-faster-with-nvidia-doca-agent-skills","t":"Build Applications on NVIDIA BlueField Faster with NVIDIA DOCA Agent Skills","v":"NVIDIA","s":"NVIDIA 开发者博客 · Agentic AI / Agent Skill","d":"2026-10-01","k":"article","star":0,"sum":"**整体概括**：NVIDIA 为 DPU 软件平台 DOCA 发布一组 agent skill（SKILL.md 格式，已上 GitHub），每个 skill 对应一个组件或工作流，包含真实函数签名、正确的 pkg-config 模块名、构建容器约束、常见失败及对策。评测：65 条真实开发者提示，按每题必答检查清单逐项判通过与否。不带 skill 时的错误分布：误用 API 和 flag 59/65、未核实硬件能力 46/65、工具选错 39/65、跳过冒烟测试 34/65、猜版本号 30/65，只满足 19% 的检查项；带 skill 后 65 条全部满足。差距最大的是对在线硬件写固件级参数的场景（预检、带外通道、维护窗口、回滚方案、冷启动才生效），带 skill 全部满足，不带一项都没满足。并排演示里带 skill 的 agent 手写代码少 73%（189 行对 695 行），硬件命令 20 条对 37 条","brief":"","ana":"","hf":null,"topic":"评测工程","first":"2026-10-02","di":"2026-10-02","wi":null,"tier":"note","tk":"评估一个 skill 的价值，用真实提示加必答清单做有无对照，并把无 skill 时的错误按类型计数。","col":"eval"},{"u":"https://arxiv.org/abs/2609.39148","t":"Do Self-Evolving Skills Generalize to Held-Out Tasks?","v":"大阪大学 SANKEN","s":"Xihao Piao 等 3 人","d":"2026-09-30","k":"paper","star":0,"sum":"同一模型、同一 agent、同一 train / test 划分下比较五种自演进 skill 方法和一次性 skill，覆盖六个基准。21 个在训练任务上变好的 skill 里，5 个在测试任务上保住全部提升，13 个保住一部分，3 个完全没保住。泛化差的 skill 常把本该随任务变化的细节（列名、输出文件）写死，或把一次失败的修复写成通用规则。LLM 评审给成品 skill 排序与测试结果在 86% 的配对上一致，但预测单次编辑的效果很差。作者的 GSO 只保留「写 skill 的指南」、每个任务现写 skill，六个基准全部最高","brief":"","ana":"**问题**：自演进 skill 方法让 agent 在训练任务上练习，每轮根据反馈改写 skill，然后把 skill 用到同类的新任务上。**训练任务上的提升，能带到新任务上吗？** 此前各方法各报各的，模型、agent、数据划分都不同，没法比。\n\n**实验设计**：五种自演进方法（SkillGen、Trace2Skill、SkillOpt、EvoSkill、GEPA）加一个\"模型一次写成、不再改\"的 One-shot skill 和一个不用 skill 的基线，在六个基准上用**同一个模型（Qwen3-Coder-480B，温度 0）、同一个 agent、同一个 train / validation / test 划分**，每个方法最多 20 轮。测试任务在所有方法选定最终 skill 之前一直锁着。\n\n**主要发现**：\n\n- 现有方法的 36 个最终 skill（6 种方法 × 6 个基准）里，21 个在训练任务上有提升。这 21 个当中，**5 个在测试上保住全部提升，13 个保住一部分，3 个一点没保住**（其中 2 个有害）。\n\n- **36 个测试分里有 10 个低于不用 skill**。六个基准里有五个，至少有一种方法不如不用 skill。\n\n- 没有哪个现有方法处处最好：SkillOpt 在 SpreadsheetBench 和 SWE-bench 上最好，SkillGen 在 SciVisAgentBench 上最好，EvoSkill 在 HealthBench 上最好；RBioBench Omics 上没有任何现有方法赢过不用 skill。\n\n- 同一个方法在不同基准上表现差别很大：留存量从 +3.4 分（EvoSkill 在 RBioBench Clinical）到 −15.0 分（EvoSkill 在 SpreadsheetBench）。\n\n**过拟合的 skill 里写了什么**：读最终 skill 会看到一个共同模式：**把某一个训练任务的修法写成了所有任务的规则**。有的把列名和输出文件写死，好像每个任务都有；有的把一张检查表套到所有任务上，不说适用条件；有的把\"需要时创建摘要文件\"改成\"总是创建\"。论文追踪了 SkillOpt 同一次运行里的两处编辑：都让训练分略升，第 2 轮那处（加通用检查）让测试 +10 分，第 9 轮那处（把条件规则改成全局规则）让测试 −5 分。原因在机制上：每轮都是为了通过刚失败的训练任务而改，改完的 skill 却用于所有未来任务，**每次编辑的表述都比它的证据更宽**。\n\n**能不能靠读 skill 内容来预判？** 作者让一个 LLM judge 只读 skill，按五个维度打分（可泛化性 30%、适用条件 20%、可执行性 20%、鲁棒性 20%、清晰度 10%）：\n\n- 对**成品 skill**：同基准内两两比较共 126 对，judge 分高的测试分也高的有 108 对（85.7%）。\n\n- 对**单次编辑**：45 处编辑上，judge 的预测与真实测试变化的 Spearman 相关在 SpreadsheetBench 是 0.39，在 RBioBench 约为 0。前面那两处编辑，judge 都判为有害。\n\n结论：成品 skill 的内容能说明不少问题；**单次编辑有没有用，只能跑了才知道**。\n\n**作者的方案 GSO**：换学习目标。不学\"一个用于所有任务的 skill\"，而学一个**元 skill**（怎么写 skill 的指南，六部分：怎么读任务、怎么选工具和来源、怎么写步骤、怎么检查结果、怎么找出哪里错了、怎么在一次重试里修好）。每个任务由元 skill 现写一个 skill，用完即弃，所以贴合某个任务的细节没法泄漏到别的任务。元 skill 从不出现具体文件名、列名、输出路径。更新规则两条：**一次只改六部分中的一部分**；只有在验证集上修好的任务数超过弄坏的任务数的两倍才保留（更新分 = 修好数 − 2 × 弄坏数，系数 2 在任何实验之前定死）。GSO 在六个基准上测试分全部最高，比最好的现有方法高 4.3 分（HealthBench）到 22.5 分（SWE-bench）。\n\n**需要注意的地方**：作者自己说明，GSO 在测试时每个任务多一次写 skill 的模型调用，还可以自检并重试一次，其他方法没有，所以这是\"整套方法之间\"的比较，说明不了具体哪一部分带来了收益；GSO 在 HealthBench 上也没保住全部提升（留存 −5.2）。全部实验只用了一个模型。\n\n**对 AI 应用工程师的启示**：\n\n1. **评估自演进系统必须报留出集和留存量**，训练曲线会高估。这和上期 SkillEvoReg（跑完全程比中途最好版本低 7.75 分）是同一个结论的两种测法。\n\n2. **每次 skill 编辑都要跑过才合并**，别指望 LLM 审一眼就能判断；但可以用 judge 给成品 skill 排序，便宜且大体可靠。\n\n3. **回归的代价要算得比修复高**。GSO 的\"修好数 − 2 × 弄坏数\"和本期 SAGE 的\"逐题配对 + 不对称惩罚回归\"是同一思想。\n\n4. 写 skill 时警惕\"条件规则被改成全局规则\"。上面 Anthropic 的 skill 一文说\"别把模型绑死\"\"写目标和约束，不写每一步\"，这篇给了它数据上的理由。","hf":null,"topic":"自学习 / 自演进","first":"2026-10-02","di":"2026-10-02","wi":"2026-10-02","tier":"","tk":"skill 里出现具体列名、文件名或单例修复时当作过拟合信号；单次编辑必须实跑验证。","col":"evo"},{"u":"https://arxiv.org/abs/2609.38349","t":"MILO: Automated Harness Discovery via Orchestrated Multi-Agent Evolution","v":"HF 组织 Amazon","s":"","d":"2026-09-29","k":"paper","star":0,"sum":"把 harness 搜索做成岛屿式进化：每个岛有自己的 mutator agent 重写完整 harness，层级谱系记忆把被拒绝的变异当负面证据，上层 orchestrator 做谱系嫁接、重新分配 mutator、修订课程，搜索策略本身也在演化。配 Opus 4.8，相对初始 harness 在 Terminal-Bench 2.1 / PaperBench / DeepSWE 上 +12.0% / +28.3% / +10.3%（此前最好的搜索方法为 +4.5% / +18.3% / 0%）；Terminal-Bench 2.1 达 86.1±2.0%，高于官方榜首 83.8±2.3%，token 比初始 harness 少 26%","brief":"","ana":"**问题**：harness 对 agent 表现的影响不亚于模型（文中举例：GPT-5 在 Terminal-Bench 上配 Terminus 2 是 35.2%，配 Codex 是 49.6%，token 还少 35%），但 harness 工程仍是手工活，而且**每换一个模型都要重调**。自动 harness 发现通常做成 LLM 驱动的进化搜索：mutator 提出新 harness，评测打分，结果指导下一轮。现有方法有两个问题：要么只改 prompt 或 skill（GEPA、A-Evolve），大部分搜索空间没碰；要么搜索策略固定，而 LLM mutator 天生**重利用、轻探索**，反复做同一类编辑，种群很快塌缩成少数几种设计的变体。\n\n**做法**：MILO 让 harness 和**搜索策略本身**一起演化，分内外两层循环，三个组件：\n\n1. **分层谱系记忆**。记忆是一片\"岛屿森林\"：每个岛独立演化自己的谱系树，岛之间不竞争。节点记录每个 harness 的准确率、成本、失败证据和**是否被接纳**；边记录产生它的那次编辑（源码补丁）以及带来的准确率和成本变化。**被拒绝的变异也留在树里**，作为负面证据。\n\n2. **证据驱动的 mutator agent**。每个岛配一个 coding agent 当 mutator（实验里有 Claude Code、Codex、DeepAgents 配不同模型）。它拿到三样输入：父 harness 的源码、父 harness 的失败证据、整个岛的谱系快照（渲染成类似目录树的缩进列表，每行一个 harness 及其来路和成绩）。前两样只给磁盘路径，让 agent 按诊断需要自己打开。prompt 规定**先诊断再改**，而且重写的是**整个 harness**。\n\n3. **元演化编排 agent**。只有它能看到所有岛。某个岛停滞时它先诊断瓶颈出在哪（mutator、谱系等四种来源之一），再干预：把一个岛的谱系**嫁接**到另一个岛、分出新物种、**给岛换一个 mutator**、修改评测任务的课程。\n\n接纳标准是多目标 Pareto：准确率高出一个容差，或准确率在容差内而各项成本全都更低。\n\n**结果**（所有搜索方法从同样三个专家设计的 DeepAgents 种子出发，各给 72 小时）：\n\n基准（Opus 4.8）｜MILO 相对最好种子的提升｜此前最好的搜索方法\n\nTerminal-Bench 2.1｜+12.0%｜+4.5%（GEPA）\n\nPaperBench｜+28.3%｜+18.3%（Meta-Harness）\n\nDeepSWE｜+10.3%｜0（无提升）\n\n- Terminal-Bench 2.1 上达到 **86.1±2.0%**，高于官方榜首的 83.8±2.3%，**token 是最好种子的 0.74 倍**。\n\n- 换成开源权重的 gpt-oss-120b 也有效：三个基准上 +11.8%、+8.6%、+14.8%。\n\n- **它改了什么**：ShinkaEvolve 和 EvoX 搜出的最好 harness 和种子相比只改了 prompt 和 rubric，最多 +3.6%。MILO 的最好 harness **重写了控制流**：先产出一个最小可用解，临近时限时对工作做分诊，只有通过独立验证才停。\n\n- **停滞与恢复**：在 gpt-oss-120b 上，所有方法都是早期涨一点然后停。MILO 的三个岛在第 6–14 轮也全部停滞，是第 15 和 21 轮的跨岛嫁接和 mutator 更换让它恢复；**最弱的种子（39.2%）最后产出了全场最好的 harness（59.9%）**，说明保留多样性有用。\n\n- **迁移**：Terminal-Bench 2.1 上演化出的 harness 不改直接跑更难的 Frontier-Bench，比最好种子高 3.8%。\n\n**三个顺带的观察**（比较 8 个现成 harness 时得到的，独立于 MILO 也很有用）：\n\n- harness 在某些任务分布上会**帮倒忙**：配 Opus 4.8 时，8 个 SoTA harness 里有 7 个在 PaperBench 上不如只有 read / write / bash 的极简 harness。\n\n- harness 的收益**不一定跨模型迁移**：Terminal-Bench 2.1 上 8 个 harness 配 Opus 4.8 都好于极简 harness，换成 gpt-oss-120b 有 4 个不如它。\n\n- **用的 token 多不等于更准**：Mini-SWE-Agent 的 token 接近 Goose 的两倍，分数相当（73.9% 对 74.5%）。\n\n**对 AI 应用工程师的启示**：①自动优化 harness 时，**把被拒绝的候选和拒绝原因留给下一轮看**，这是防止 LLM mutator 原地打转最便宜的办法（上期 Amazon AutoResearch 里 agent 把同一个失败配置重试了 6 次，正是缺这个）。②大的收益来自**结构性改动**（控制流、验证时机），不来自 prompt 措辞。③\"先出最小可用解、临期分诊、独立验证后才停\"这个被搜出来的控制流，本身就值得手工抄进有时限的 agent。④那三个观察和本期速览里的《How Much of a Harness Does a Strong Agent Need?》《Finding the Right Fit》互相印证：**harness 没有通用最优，要按模型、按任务分布测**。","hf":13,"topic":"自学习 / 自演进","first":"2026-10-02","di":"2026-10-02","wi":"2026-10-02","tier":"","tk":"把被否决的改动及其原因存进搜索记忆，避免优化器反复提同类无效改动。","col":"evo"},{"u":"https://arxiv.org/abs/2609.39982","t":"Mid-Harness: Scaling Actions Between Model and Harness for Terminal Agents","v":"NVIDIA","s":"HF 组织 NVIDIA","d":"2026-09-30","k":"paper","star":0,"sum":"在模型与 harness 之间加一层：先采样多个候选动作并验证，再放行一个去执行，生成器和 harness 都不改。验证器弱时多采样几乎没用；用 GPT-5.6 Sol 当验证器、采样 8 个动作，TMAX-9B 在 TerminalBench-Lite 的 Pass@1 从 50.00% 升到 68.03%；同模型自验证时成对比较效果最好","brief":"","ana":"**问题**：终端 agent 每一步的动作是随机采样出来的。模型**能**生成一个好动作，不代表这一次采样到的就是它。而终端里一条坏命令（比如装错了包）会改变环境，妨碍后面的进展。常见的测试时加算力方式是多跑几条完整轨迹再选（Best-of-T），但那需要多次全新的环境运行，在基准之外往往做不到，因为环境状态不容易序列化。\n\n**做法**：在模型和 harness 之间加一层，**模型和 harness 都不改**。原来的模型调用包装函数是\"生成一个响应并返回\"，现在改成\"用同样的历史采样 N 个候选动作，交给验证器选一个，只把这一个返回给 harness 执行\"，其余丢弃。只需要一个环境实例。验证器看得到任务、已观察的历史和候选动作，**看不到生成这些候选时的推理**。\n\n比较了三种验证方式：**列表式**（一次看所有候选选一个，一次调用）、**逐点式**（每个候选单独打分）、**成对式**（两两比较）。\n\n**发现**（TerminalBench-Lite，生成器固定为 TMAX-9B，一个在 Qwen3.5-9B 上用 RL 训练的终端模型；基线 Pass@1 是 50.00%）：\n\n1. **候选里确实有更好的动作，但要有够强的验证器才挑得出来**。用 GPT-5.6 Sol 当验证器，N=4 时 64.63%，N=8 时 **68.03%**。\n\n2. **验证器弱的时候，多采样没用**。同样是列表式，让 TMAX-9B 自己当验证器，N 从 4 加到 8，Pass@1 只从 49.32% 变到 51.02%。\n\n3. **成对式是自验证里最好的**：N=8 时 54.76%（Pass@3 71.43%）。\n\n4. **验证能力可以蒸馏**。用强验证器在 244 个难任务、732 条轨迹上的 11.7 万条成对判断，给 TMAX-9B 训一个只在验证时启用的 LoRA，N=8 的 Pass@1 从 54.76% 升到 57.14%，Pass@3 从 71.43% 升到 75.51%。生成器不变。\n\n5. **成本**：成对式贵。N=8 时零样本成对验证的验证器总输出约 12.57 万 token，列表式只有约 600。\n\n6. **和轨迹级方法叠加**：Best-of-3 单独是 55.10%；用 Mid-Harness 来生成这三条轨迹，零样本升到 61.22%，蒸馏版升到 66.33%，**环境运行次数不变**。和\"顺序改进\"（SR）叠加也有效：55.10% → 60.20%。\n\n**对 AI 应用工程师的启示**：①**瓶颈常在\"选\"不在\"生成\"**。给便宜模型配一个强验证器来选动作（这里是 9B 生成 + 前沿模型验证，50% → 68%），是一种和\"小模型执行、大模型规划\"不同的混合方式，适合那些动作有副作用、环境没法回滚的场景。②想让模型自己验证自己，**两两比较比打分或一次看全部更可靠**，这和上面 dynamic workflows 一文说的\"比较式判断比绝对打分可靠\"是一致的。③它只动了模型调用的包装函数，现有 harness 里很容易加。④本期速览里的《Can Terminal Agents Trust Their Own Verification?》给了自验证的基线数字：错误的候选解只有 61.43% 被发现，可以对着看。","hf":98,"topic":"Harness 与长时程 Agent","first":"2026-10-02","di":"2026-10-02","wi":"2026-10-02","tier":"","tk":"终端 agent 的难撤销动作先出多个候选再验证。","col":"harness"},{"u":"https://arxiv.org/abs/2609.39284","t":"EngramBench: A Capability-Grounded Benchmark for Skill-Evolution Harnesses","v":"arXiv","s":"Zhixuan Tan 等 7 人","d":"2026-09-30","k":"paper","star":0,"sum":"现有 skill 演化评测把真正的能力抽象与答案泄漏（抄相似的历史代码）混在一起。EngramBench 按「能力重叠、解法不重叠」构造 30 个学习任务和 13 个未见迁移任务，由 LLM 模拟用户驱动多小时开发，共 48 条轨迹并经人工专家验证。结论：静态 skill 库跨不过具体代码实现这最后一步（仍受基座模型推理上限限制），但能让 agent 避开高 token 的试错，整体编码时间减少 55% 以上","brief":"现有 skill 演化评测把真正的能力抽象与答案泄漏（抄相似的历史代码）混在一起。EngramBench 按「能力重叠、解法不重叠」构造 30 个学习任务和 13 个未见迁移任务，由 LLM 模拟用户驱动多小时开发，共 48 条轨迹并经人工专家验证。结论：静态 skill 库跨不过具体代码实现这最后一步（仍受基座模型推理上限限制），但能让 agent 避开高 token 的试错，整体编码时间减少 55% 以上","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-02","di":"2026-10-02","wi":"2026-10-02","tier":"","tk":"评 skill 演化时确保迁移任务与学习任务的解法不重叠。","col":"evo"},{"u":"https://arxiv.org/abs/2609.39102","t":"False Frontiers: Diagnosing and Mitigating Co-Cheating in Self-Evolving Search Agents","v":"HF 组织 Rutgers University","s":"","d":"2026-09-30","k":"paper","star":0,"sum":"proposer 出题、solver 答题的自演进搜索 agent 会出现 co-cheating：两者在共同的错误上越来越一致，内部奖励上升而外部正确率不升，且逐轮加重。多次采样验证只把错误一致占比从 6.1% / 8.8% 降到 5.7% / 7.2%（Qwen3.5-4B / 9B），每个候选还要多花六次生成；CrossFit 把来源文档分成 A、B 两组，A 出的题由只在 B 上训练的辅助 solver 打分，降到 3.0% / 3.7%，七个下游搜索基准平均比标准耦合自演进高 8.8 和 8.4 分","brief":"proposer 出题、solver 答题的自演进搜索 agent 会出现 co-cheating：两者在共同的错误上越来越一致，内部奖励上升而外部正确率不升，且逐轮加重。多次采样验证只把错误一致占比从 6.1% / 8.8% 降到 5.7% / 7.2%（Qwen3.5-4B / 9B），每个候选还要多花六次生成；CrossFit 把来源文档分成 A、B 两组，A 出的题由只在 B 上训练的辅助 solver 打分，降到 3.0% / 3.7%，七个下游搜索基准平均比标准耦合自演进高 8.8 和 8.4 分","ana":"","hf":187,"topic":"自学习 / 自演进","first":"2026-10-02","di":"2026-10-02","wi":"2026-10-02","tier":"","tk":"自产训练信号时，打分方不能与出题方共享同一份来源数据。","col":"evo"},{"u":"https://arxiv.org/abs/2609.39306","t":"ReSAIL: Mitigating Collapse in Iterative Agent Self-Distillation","v":"arXiv","s":"Shengjie Jin 等 5 人","d":"2026-09-30","k":"paper","star":0,"sum":"迭代自蒸馏（agent 从历次部署轨迹学习，学生成为下一轮教师）被视为通向 RSI 的一条路，但实验显示现有方法跨轮次部署性能崩塌。ReSAIL 作为插件式增强：挑选特权信息最能改变教师预测的交互步骤做蒸馏并平衡各轨迹损失，同时把学生在特权信息条件下的输出分布正则到冻结教师。ALFWorld 与 TextCraft 上，三轮后最终成功率平均绝对提升 22.5%","brief":"迭代自蒸馏（agent 从历次部署轨迹学习，学生成为下一轮教师）被视为通向 RSI 的一条路，但实验显示现有方法跨轮次部署性能崩塌。ReSAIL 作为插件式增强：挑选特权信息最能改变教师预测的交互步骤做蒸馏并平衡各轨迹损失，同时把学生在特权信息条件下的输出分布正则到冻结教师。ALFWorld 与 TextCraft 上，三轮后最终成功率平均绝对提升 22.5%","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-02","di":"2026-10-02","wi":"2026-10-02","tier":"","tk":"多轮自蒸馏要逐轮监控成绩，防止「学生当教师」后监督信号退化。","col":"evo"},{"u":"https://arxiv.org/abs/2609.38372","t":"Self-Evolving Harness on Multiple Tasks with the Agent as Its Own Optimizer","v":"arXiv","s":"Qiankai Xu","d":"2026-09-29","k":"paper","star":0,"sum":"同一个冻结模型在同一版 harness 上先当 solver 解题，再当 proposer 读完整运行记录并直接改这份 harness。每批任务取自五个不同领域的基准，训练与留出严格分开，另用五个从未参与演化的分布外基准评测。从 49 行种子 harness 出发，第一阶段后分布内平均 +4.48 分、分布外 +12.64 分，前者超过 Codex、后者持平；继续在 Claw-Eval 上演化从 66.17 升到 68.06。演化中自发出现输出截断、历史压缩、独立评审等机制","brief":"同一个冻结模型在同一版 harness 上先当 solver 解题，再当 proposer 读完整运行记录并直接改这份 harness。每批任务取自五个不同领域的基准，训练与留出严格分开，另用五个从未参与演化的分布外基准评测。从 49 行种子 harness 出发，第一阶段后分布内平均 +4.48 分、分布外 +12.64 分，前者超过 Codex、后者持平；继续在 Claw-Eval 上演化从 66.17 升到 68.06。演化中自发出现输出截断、历史压缩、独立评审等机制","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-02","di":"2026-10-02","wi":"2026-10-02","tier":"","tk":"演化批次混合多个领域的任务，并保留一组从不参与演化的基准做泛化验收。","col":"evo"},{"u":"https://arxiv.org/abs/2609.40169","t":"Learning from Research: Toward Lifelong Agent Harness Evolution","v":"arXiv","s":"Jingbo Yang 等 6 人","d":"2026-09-30","k":"paper","star":0,"sum":"harness 演化只靠元 agent 的已有知识和失败记录，容易变成被动修补。ScholarEvolve 自动从研究文献里取方法：把演化方向按功能模块组织，用主题建模为每个模块找出不同的改进策略，实现后评估组合，并可随新论文持续纳入。Qwen3.5-27B 在 AppWorld Challenge 的任务目标完成率 49.6% → 63.6%，GPT-5.4-mini 在 Tau2-Bench Telecom 的 pass@1 72.7% → 81.9%","brief":"harness 演化只靠元 agent 的已有知识和失败记录，容易变成被动修补。ScholarEvolve 自动从研究文献里取方法：把演化方向按功能模块组织，用主题建模为每个模块找出不同的改进策略，实现后评估组合，并可随新论文持续纳入。Qwen3.5-27B 在 AppWorld Challenge 的任务目标完成率 49.6% → 63.6%，GPT-5.4-mini 在 Tau2-Bench Telecom 的 pass@1 72.7% → 81.9%","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-02","di":"2026-10-02","wi":"2026-10-02","tier":"","tk":"给 harness 优化器接一个按模块整理的论文策略库作为提案来源，而不只喂失败轨迹。","col":"evo"},{"u":"https://arxiv.org/abs/2609.39304","t":"Scale and Selection: What Makes Automatic Harness Evolution Work for Visual-Interface Robot Agents","v":"arXiv","s":"Zhijie Wei 等 3 人","d":"2026-09-30","k":"paper","star":0,"sum":"让一个 coding agent 自动修改另一个 agent 的 harness（后者被直接当作机器人策略，通过截图和少量工具操作浏览器里的 3D 界面）。两条发现：每轮看到的 rollout 数决定晋升决策的信噪比，轮数固定、训练集从 5 条加到 100 条，留出成功率 47% → 67%，小训练集训练 70% 而留出只有 54%；改动无条件接受时十轮内性能下滑，加上 Champion-Challenger（在同一固定评测集上严格胜过现任才晋升）后 30 轮留出成功率 51% → 67%","brief":"让一个 coding agent 自动修改另一个 agent 的 harness（后者被直接当作机器人策略，通过截图和少量工具操作浏览器里的 3D 界面）。两条发现：每轮看到的 rollout 数决定晋升决策的信噪比，轮数固定、训练集从 5 条加到 100 条，留出成功率 47% → 67%，小训练集训练 70% 而留出只有 54%；改动无条件接受时十轮内性能下滑，加上 Champion-Challenger（在同一固定评测集上严格胜过现任才晋升）后 30 轮留出成功率 51% → 67%","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-02","di":"2026-10-02","wi":"2026-10-02","tier":"","tk":"自动改 harness 至少配两样——每次决策有足够多的 rollout、严格胜出才替换。","col":"evo"},{"u":"https://arxiv.org/abs/2609.38516","t":"From Solo to Social Learning: Characterizing Recursive Social Improvement in LLMs","v":"arXiv","s":"Kunal Jha 等 3 人","d":"2026-09-29","k":"paper","star":0,"sum":"每个 agent 追求各自奖励、修改自己的 skill 文件，并可选择是否、何时、向谁抄，独立搜索、向同伴学习和行动共用一份 token 预算。受控环境里经典社会学习算法能从同伴获益，三个 LLM 却不能：每 token 奖励低于单独学习者，探索过窄或没行动就耗尽预算。让模型自写 skill 后，观察同伴让一个模型更早找到有用 skill、另一个减少私有搜索，但同成本下都没超过独立学习者，且种群集中到更少的独立发现上","brief":"每个 agent 追求各自奖励、修改自己的 skill 文件，并可选择是否、何时、向谁抄，独立搜索、向同伴学习和行动共用一份 token 预算。受控环境里经典社会学习算法能从同伴获益，三个 LLM 却不能：每 token 奖励低于单独学习者，探索过窄或没行动就耗尽预算。让模型自写 skill 后，观察同伴让一个模型更早找到有用 skill、另一个减少私有搜索，但
