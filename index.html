<script id="data" type="application/json">{"columns":[{"key":"evo","name":"自演进","topics":["自学习 / 自演进"],"intro":"agent 从自己的经验里改进自己：skill 演化、记忆、harness 自改进、递归自改进（RSI）。本站最看重的方向。"},{"key":"harness","name":"Harness","topics":["Harness 与长时程 Agent"],"intro":"让 agent 跑得长、跑得稳的那层壳：上下文管理、规划、执行循环、长时程任务。"},{"key":"safety","name":"安全","topics":["Agent 安全与围堵"],"intro":"agent 越界、失准披露、运行时治理、围堵与监控。"},{"key":"eval","name":"评测","topics":["评测工程"],"intro":"怎么可信地衡量 agent：基准、行为评测、第三方评估、双盲。"},{"key":"skill","name":"Skill 与上下文","topics":["Skill、上下文工程与工具"],"intro":"skill、prompt、上下文工程、工具与检索。"},{"key":"multi","name":"多智能体","topics":["多智能体"],"intro":"多个 agent 的协作、共享记忆、协调失败。"},{"key":"infra","name":"基建","topics":["推理基础设施与建模"],"intro":"推理效率、KV cache、kernel、部署成本、模型架构。"},{"key":"phys","name":"物理世界","topics":["Agent × 物理世界"],"intro":"agent 操作硬件、机器人与设备。"}],"generated":"2026-10-09 19:41","items":[{"u":"https://claude.dev/blog/building-effective-agent-automations","t":"Building effective agent automations","v":"Anthropic","s":"","d":"2026-10-08","k":"article","star":1,"sum":"用 Claude Managed Agents（beta）做一个定时读取 Slack 和 GitHub、只报告变化、发到 Slack 的简报 agent，并开源参考实现（claude-quickstarts/managed-agents/daily-brief），整套资源用 `ant apply` 声明式创建。全文按六个组件展开：来源、目的地、agent、调度、记忆、护栏。凭据放在 vault 里，沙箱内只有占位符，请求出沙箱时才换成真实 token。每个来源记一个书签，代替固定的「过去 24 小时」。来源读取失败时保留书签，在简报末尾注明哪个来源没读到。发帖前先查当天是否已经发过，Slack 返回 ok 和 ts 后才更新账本和书签，结果不确定时标记为「maybe posted」。偏好存储对 agent 只读、每次运行重新读取；状态存储保存书签、账本和运行记录，账本按稳定 ID 去重并记录状态变化。花费上限设为正常运行成本的 3–5 倍，触发上限的运行会暂停而不是失败","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-09","di":"2026-10-09","wi":null,"tier":"must","tk":"本日报任务正是这类 agent，可以直接照搬两条：用书签代替固定 36 小时窗口，并且只有在 git push 或文件写入确认成功后才更新已收录索引；某个源抓取失败时在日报里写「未读到」，不要写成「无新内容」。","col":"evo"},{"u":"https://developer.nvidia.com/blog/building-reliable-data-analytics-agents-lessons-from-the-kdd-cup","t":"Building Reliable Data Analytics Agents: Lessons from the KDD Cup","v":"NVIDIA","s":"NVIDIA 开发者博客 · Agentic AI / Generative AI","d":"2026-10-08","k":"article","star":1,"sum":"NVIDIA KGMON 团队在 KDD Cup 2026 Data Agents 赛道获得第二名。比赛规定使用固定的小模型 Qwen3.5-35B-A3B，题目横跨数据库、CSV/JSON、文档、PDF 和视频，所以 harness 是主要优化面。两条原则：收窄动作空间，并让每次尝试都可检查。具体做法有九条：把 CSV/JSON 转进 SQLite，只暴露 `schema()` 和 `sql()` 一个查询面；主循环之前先侦察 schema（连接键、同名列、单位、空值、行粒度）；只给少量工具，由中间件修复格式错误的工具调用，答案只能经 `write_answer` 原子写入；禁止整文件读取，文档交给 temperature 0、关闭推理的 prose_helper 抽取答案或表格；记录轨迹供人或 agent 检查；多次尝试做集成但要控制成本；自主改进循环要防过拟合（把训练样例硬编码进 prompt、指令越积越矛盾、后处理规则变脆）","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-09","di":"2026-10-09","wi":null,"tier":"note","tk":"给 agent 加一个只读的预检步骤，事先说明数据结构和容易混淆的字段，这往往比再加一个检索工具更有用；自改进循环要专门检查上面三类过拟合迹象。","col":"evo"},{"u":"https://arxiv.org/abs/2610.11794","t":"Memento 3: Model-Based Recursive Self-Improvement through Reflective Rulebooks","v":"arXiv","s":"HF 组织 UniversityCollegeLondon","d":"2026-10-08","k":"paper","star":1,"sum":"冻结 LLM，agent 用自然语言规则书记录关于环境动态的可修订假设，再编译成可执行代码用于预测和规划，循环是观察、反思、修订、编译、验证；新代码只有在忠于规则书、并且逐格回放能复现所有已观测转移时才被接受，另有并行维护多个世界模型的种群版本。ARC-AGI-3 全部 25 个公开游戏全部通关，RHAE 100.0，动作数为人类的 44%","brief":"","ana":"","hf":4,"topic":"自学习 / 自演进","first":"2026-10-09","di":"2026-10-09","wi":null,"tier":"","tk":"让 agent 的「经验」以可执行代码形式存储，用回放复现历史观测作为接受标准，这比用 LLM 自评判断记忆更新可靠得多。","col":"evo"},{"u":"https://arxiv.org/abs/2610.11655","t":"Harness Evolution Hits a Ceiling: When Weight Training Should Begin","v":"arXiv","s":"Yuan Tian 等 5 人","d":"2026-10-08","k":"paper","star":1,"sum":"先让自演进 harness 把系统提上去，再把原始 / 演化后的 harness 与基座 / 训练后的权重交叉组合，看哪些收益能被权重吸收。按第一个触发的失败信号给失败轨迹打标签：流程类失败由 harness 修，内容类失败才需要训练权重。DeepPlanning 上 Qwen3.5-4B 从 0.16 升到 0.30，交付率从 55% 升到 90%；在演化后 harness 的轨迹上训练的 LoRA 换回原 harness 仍有 +0.13，用打乱答案的轨迹训练的安慰剂 adapter 反而低于基座","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-09","di":"2026-10-09","wi":null,"tier":"","tk":"先统计失败轨迹中流程类与内容类各占多少，再决定继续改 harness 还是训练权重；验证这类收益时要加打乱轨迹的安慰剂对照。","col":"evo"},{"u":"https://arxiv.org/abs/2610.11464","t":"Who Verifies the Verifier? Co-Evolving Inspectable Graders with Self-Improving Agents","v":"arXiv","s":"Xing Zhang 等 7 人","d":"2026-10-08","k":"paper","star":1,"sum":"把验证器本身作为演化对象：它是由小型、主要为确定性的缺陷检测器组成的可检查表达式，从聚类后的失败中合成，入库时设闸门，选择标准是与 10 条带锚点参考集的一致率加上无标注输出上的共识，而不是 agent 的分数。MBPP+ 上留出一致率 +0.21。关键发现：去掉锚点约束后验证器退化成永远判通过，但用它训练 skill 的效果一样好。与 skill 循环配合的 Double Ratchet 能保住真值或 rubric 所带来提升的 88–110%","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-09","di":"2026-10-09","wi":null,"tier":"","tk":"自演进出来的验证器要单独对照带锚点的小参考集测一致率，绝不能用「agent 分数提高了」来证明它可靠。","col":"evo"},{"u":"https://arxiv.org/abs/2610.11781","t":"Skill-V: Verifiable Self-Evolving Skill Library for Interactive Agents","v":"arXiv","s":"Jie Ma 等 9 人","d":"2026-10-08","k":"paper","star":1,"sum":"把 skill 写成版本化的可证伪契约，把语义意图和可观测的行为标准对应起来。任务失败时新增 skill；契约评估与实际结果不一致时修订 skill 边界；修订必须保留受保护的语义约束，并在历史回放上满足不回归标准；检索时过滤掉明确不适用的 skill。ALFWorld 成功率 95.3%，WebShop 85.9%，skill 库比只做增长的基线更紧凑","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-09","di":"2026-10-09","wi":null,"tier":"","tk":"skill 库不能只增不改，每条 skill 都要附可检验的适用条件和成功标准，修订前先在历史轨迹上跑回放做不回归检查。","col":"evo"},{"u":"https://arxiv.org/abs/2610.10629","t":"The Harness as the Only Mutable Surface: Compliance-Bounded Self-Evolution of LLM Agents in Credit Pipelines, with a Measured Admission Gate","v":"arXiv","s":"Ravil Akhtyamov 等 2 人","d":"2026-10-07","k":"paper","star":1,"sum":"文章主张：自演进要能被监管审查，就只能改 harness（指令、工具调用逻辑、原语组合），权重保持不变，每次改动都是一个带原因和测试的 diff，部署前经过一道写哈希链记录的准入闸门。仿真结果：设闸门时 7,449 个候选只放行 144 个，没有一个让留出历史上的误差变差；把闸门换成「最近轨迹上错误变少」的检查后，同样的循环放进了 309 个有害改动，90 次运行中 49 次漏报率超过 10%","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-09","di":"2026-10-09","wi":null,"tier":"","tk":"自改进的准入标准要用留出的历史数据，不要用最近的轨迹，否则系统会靠放宽筛选来让指标「变好」。","col":"evo"},{"u":"https://arxiv.org/abs/2610.10310","t":"RSIGym: A Flexible Environment for Recursive Self-Improvement","v":"arXiv","s":"Fanqing Meng 等 9 人","d":"2026-10-07","k":"paper","star":1,"sum":"把训练、推理、rollout、评测、沙箱都做成共享服务，统一控制预算与权限，分数据、harness、联合三条改进赛道；RSI-Index 定义为五个基准上剩余差距被缩小的平均比例。六个前沿研究模型对比，Opus 5 在每次运行 500 美元预算下 RSI-Index 最高（0.4809），把 SWE-bench Verified 从 17.67% 提到 50.33%，AIME 从 31.67% 提到 97.78%","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-09","di":"2026-10-09","wi":null,"tier":"","tk":"衡量自改进能力用「剩余差距被缩小的比例」，而不是绝对分数，并且要在固定预算下比较。","col":"evo"},{"u":"https://arxiv.org/abs/2610.10088","t":"SkillSandbox: Skill Verification via Dynamic Scenario Synthesis","v":"arXiv","s":"Serin Kim 等 5 人","d":"2026-10-07","k":"paper","star":1,"sum":"针对「提炼出的 skill 可能只对来源经验有效」的问题，为每个 skill 合成一个相关但没见过的任务和环境：Proposer 规定保留哪些条件、改变哪些来源特有的细节，Builder 构造可执行场景，Verifier 对比带与不带这个 skill 的执行，从可执行性、效用、效率三方面给出保留或拒绝。ALFWorld 和 WebShop 上三个模型下游表现都最好","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-09","di":"2026-10-09","wi":null,"tier":"","tk":"skill 入库前用「保留适用条件、替换来源细节」的变体任务做带与不带的对照测试。","col":"evo"},{"u":"https://arxiv.org/abs/2610.11858","t":"Trajectory-Guided Fault Localization for Agent Skill Evolution","v":"arXiv","s":"Yu Ge 等 5 人","d":"2026-10-08","k":"paper","star":1,"sum":"SkillMorph 先在多次运行和多个任务中对比失败与成功轨迹，结合各轮演化之间的变化找出可疑动作，再把可疑动作对应到 skill 里需要修改的位置，然后生成修订。SWE-Skills-Bench 和 CannBot 上的准确率和执行一致性都高于原 skill 和四种现有 skill 演化方法；应用到算子开发团队，6 个 skill 修订 PR 被合并","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-09","di":"2026-10-09","wi":null,"tier":"","tk":"让 LLM 改 skill 之前，先用成功与失败轨迹的差异把问题定位到 skill 的具体段落，不要整篇重写。","col":"evo"},{"u":"https://arxiv.org/abs/2610.09832","t":"SkillForge: Co-Evolving Skills and Agents via Dynamic Skill Lifecycles","v":"arXiv","s":"Yuyao Ge 等 8 人","d":"2026-10-07","k":"paper","star":1,"sum":"给 skill 设试用、活跃、稳定、退役四个状态，按适应度在 RL 训练中淘汰、稳定和变异 skill，让 skill 库和策略一起演化；RL 之前先用基座模型的 rollout 把低适应度 skill 预先退役。多个交互基准上比最强基线相对提升最多 7.8%，skill 库始终保持紧凑；另发布 5k+ 条标注数据集 SkillFurnace","brief":"","ana":"","hf":8,"topic":"自学习 / 自演进","first":"2026-10-09","di":"2026-10-09","wi":null,"tier":"","tk":"skill 库要有退役机制，按实测适应度淘汰过时或有害的条目。","col":"evo"},{"u":"https://arxiv.org/abs/2610.10426","t":"CoTrace: Data Recipes for Training Terminal Agents with Harness-Model Co-Evolution","v":"arXiv","s":"Jixuan Chen 等 14 人","d":"2026-10-07","k":"paper","star":1,"sum":"指出 harness 搜索产生的轨迹不能当作一个不加区分的回放池：一条轨迹对训练的价值取决于它是在哪个 harness 下生成的。CoTrace 按来源匹配轨迹，只用与当前采用的 harness 匹配、且已验证的轨迹做 SFT。Qwen3.5-9B 在 Tmax 上从 78 题升到 88 题，在线 RL 版本到 90 题；跨分布迁移取决于训练和评测用的是否是同一个 harness","brief":"","ana":"","hf":null,"topic":"评测工程","first":"2026-10-09","di":"2026-10-09","wi":null,"tier":"","tk":"训练数据要标注生成时用的 harness 版本，只用与目标运行环境匹配的轨迹训练。","col":"eval"},{"u":"https://arxiv.org/abs/2610.12176","t":"Recursive Self-Improvement through Multi-Agent Self-Supervision","v":"arXiv","s":"Hyunin Lee 等 7 人","d":"2026-10-08","k":"paper","star":1,"sum":"MASS 在开放任务上交替进行两步：用进化搜索（受结构护栏约束）优化多 agent 工作流，再用自己生成的多 agent 轨迹做 SFT，改进后的模型又成为更好的优化器和评估者。Qwen3.6-27B 两轮后，每输出 token 的表现提高 1.2–1.6 倍；用多 agent 轨迹训练的学生模型优于用 1.4 倍 token 的单 agent 轨迹训练的学生","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-09","di":"2026-10-09","wi":null,"tier":"","tk":"没有可验证奖励时，用多角色工作流产生的轨迹做自监督数据，效率比单 agent 轨迹高。","col":"evo"},{"u":"https://arxiv.org/abs/2610.04299","t":"Questioning the Questions: Sustaining Self-Evolution in Reasoning Models","v":"arXiv","s":"Jinyuan Li 等 7 人","d":"2026-10-03","k":"paper","star":1,"sum":"自出题、自训练的推理模型会崩溃，原因有两个：无效题目越来越多（答案一致性过滤反而让它们占比上升），以及按字面相似度控多样性时漏掉了数学上等价的题目。R-Quest 先训练求解器识别并拒绝无效题，用它的判断来塑造出题者的奖励，并用冻结的基座模型判断题目是否新颖。连续十轮自演进保持增益、最后一轮最高，比 R-Zero 高 17.32 分","brief":"","ana":"","hf":68,"topic":"自学习 / 自演进","first":"2026-10-09","di":"2026-10-09","wi":null,"tier":"","tk":"自生成数据的去重要按语义等价判断，用冻结模型做新颖性评审，不能只看字面相似度。","col":"evo"},{"u":"https://arxiv.org/abs/2610.11959","t":"MiMo-V2.6: Scaling Reinforcement Learning Towards Self-Improvement","v":"小米 MiMo","s":"149 人 · HF 组织 XiaomiMiMo","d":"2026-10-08","k":"paper","star":1,"sum":"全模态模型系列，从三个方向扩大 RL 算力：异步训练每步 1,568 个样本、27–37 亿 token、上下文最长 1M；在多种 agent harness 混合下覆盖代码、通用、视觉、网络安全环境；用分组式 agentic 评分加大评分算力，并引导模型给出更短的解。为保持稳定，冻结 MoE 路由，并设多层防奖励黑客机制。训练动态、RL 环境和框架全部开源","brief":"","ana":"","hf":49,"topic":"自学习 / 自演进","first":"2026-10-09","di":"2026-10-09","wi":null,"tier":"","tk":"训练时混合多种 agent harness，可以避免模型只适应某一种运行环境。","col":"evo"},{"u":"https://arxiv.org/abs/2610.12374","t":"AgentGarten: Code Worlds for Evolving Agents","v":"HF 组织 MirroS-Lab","s":"","d":"2026-10-08","k":"paper","star":1,"sum":"把模拟器、游戏引擎和一个共享的神经渲染器结合起来，构建实时交互环境：后端负责状态和规则，渲染器生成逼真的视觉观测。agent 每轮把经验提炼成 playbook，后续 agent 继承并完善；4 轮就学会，常规 RL 需要数百万轮。新世界可以直接用代码写出来","brief":"","ana":"","hf":125,"topic":"自学习 / 自演进","first":"2026-10-09","di":"2026-10-09","wi":null,"tier":"","tk":"把经验沉淀成可继承的 playbook，学习效率可以比参数更新高几个数量级。","col":"evo"},{"u":"https://arxiv.org/abs/2610.12124","t":"Use and Disuse: Intent-Structured Experience Consolidation for Memory and Learning in LLM Agents","v":"arXiv","s":"Xiangyi Zeng 等 6 人","d":"2026-10-08","k":"paper","star":1,"sum":"Hippocam 把 agent 的工作组织成嵌套的意图：活跃上下文只围绕当前意图，完成的意图被整合成后续需要的结果和状态；更早的历史反复整合，长期不用的经验越来越抽象，原始交互保留，需要时可以逐层恢复细节；被重新调用的经验会和新经验一起再整合、得到强化。整套机制不更新参数","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-09","di":"2026-10-09","wi":null,"tier":"","tk":"记忆按「用进废退」整合，被调用的经验会被强化，长期不用的逐步抽象化，但原文始终可以恢复。","col":"evo"},{"u":"https://developers.googleblog.com/the-outer-loop-insights-first-an-ambient-quality-agent-that-diagnoses-your-production-agent","t":"The Outer Loop, Insights First: An Ambient Quality Agent That Diagnoses Your Production Agent","v":"Google","s":"Google 开发者博客 · ADK","d":"2026-10-08","k":"article","star":0,"sum":"文章认为 agent 上线前做到 80% 不难，难的是上线后的 20%：用户用法在变，模型、harness、工具或 skill 也在升级，而健康检查一直是绿的，失败发生在对话内部、不报错。AQuA 在用户自己的 GCP 项目里与生产 agent 并行运行，不在请求路径上。每轮最多抽样 1,000 个会话，经过五个阶段：审查（按九项常见故障清单打分，可用 goal.md 引导重点）、聚类、验证（另一个模型对照最多三份完整记录，剔除证据不支持的聚类）、跟踪（BigQuery 里标 NEW / RECURRING，14 天未再出现自动标 RESOLVED），以及按需的根因分析（对照部署时保存的不可变源码快照，引用到具体行并提出修改）。在 travel-concierge 演示中，32 个会话产生 42 条发现，聚成 9 个候选，拒掉 3 个误报；两处一行的 prompt 修复后，选座绕过从 15 个会话降到 2 个，素食偏好丢失从 7 个降到 0，全会话通过数从 5/32 升到 13/32","brief":"","ana":"","hf":null,"topic":"评测工程","first":"2026-10-09","di":"2026-10-09","wi":null,"tier":"must","tk":"部署时保存源码快照，让失败聚类能对应到具体代码行；聚类结论必须经过第二个模型对照原始记录去伪；修复后用同一批会话回放验证，并把失败会话加入离线评测集。","col":"eval"},{"u":"https://www.anthropic.com/research/launching-opt-in-vuln-finding-service-for-open-source","t":"Launching an opt-in vulnerability-finding service for open-source software","v":"Anthropic","s":"Anthropic Research · Frontier Red Team","d":"2026-10-08","k":"article","star":0,"sum":"文章说 LLM 在 CyberGym 上的漏洞发现率从去年初不到 20% 升到今年超过 85%。过去六个月 Anthropic 发现约 29,000 个候选漏洞，人工只复核了约 6,000 个，已应维护者要求直接发出近 5,000 份未经复核的报告。OSS Scanner 参照 OSS-Fuzz，项目自愿加入后定期获得用最强模型（含 Mythos）做的免费扫描，报告完全由模型生成，包含可复现的 PoC、二分定位引入点和建议补丁。验证数据：渗透测试专家复核 48 个项目中 97 个高危或严重发现，85 个（88%）达到 CVD 标准，11 个是真实但重复的问题，只有 1 个误报；wolfSSL 收到的 74 份报告中 72 份有效，5 个成为 CVE。核心维护者通过向 anthropics/oss-scanner 提交 PR 申请加入","brief":"","ana":"","hf":null,"topic":"推理基础设施与建模","first":"2026-10-09","di":"2026-10-09","wi":null,"tier":"note","tk":"发现能力远超人工复核能力时，可以把「未经复核的原始输出」做成用户自愿加入的快速通道，并配上 PoC 和补丁降低对方的验证成本，人工复核留给没有能力自行分诊的对象。","col":"infra"},{"u":"https://openai.com/index/disrupting-ai-enabled-false-front-operations","t":"Disrupting AI-enabled “false front” operations","v":"OpenAI","s":"openai.com/index · Safety","d":"2026-10-08","k":"article","star":0,"sum":"OpenAI 封禁了两个借助模型运营「假门面」实体的影响力行动。俄罗斯的「Dark Clark」针对拉美，用 ChatGPT 写给上级的内部报告、制作内容，并控制一个自称研究机构的 SRC，还招募了当地人员，伪造音频和邮件引发了事实核查与官方辟谣；按 Breakout Scale 评为 5 级，是 OpenAI 2024 年开始公开报告以来拆除的第一个 5 级行动。伊朗的行动运营 7 个「记者」人设，批量生成评论，评为 4 级。结论是：这些行动很像 AI 出现之前的复杂影响力行动，AI 只是让部分流程更省力；正因为依赖隐蔽，公开曝光对它们特别有效","brief":"","ana":"","hf":null,"topic":"推理基础设施与建模","first":"2026-10-09","di":"2026-10-09","wi":null,"tier":"note","tk":"对滥用做分级时，可以借用外部的公开量表（Breakout Scale），让风险评级可以跨报告比较。","col":"infra"},{"u":"https://claude.com/resources/articles/how-block-orchestrates-claude-fable-across-thousands-of-pull-requests","t":"How Block orchestrates Claude Fable across thousands of pull requests","v":"Anthropic","s":"","d":"2026-10-08","k":"article","star":0,"sum":"Block 在 2026 年用 AI 做大规模代码迁移，一次迁移可能合并上千个由 Fable 编排的 PR：前沿模型负责前期规划和编排，更多 token 交给小模型执行，质量没有下降；整套流程跑在开源的人机协作空间 Buzz 上。Block 在做模型自动选择器，认为 effort 档位应当和模型一起作为二维网格做基准测试（Fable 低档可能好于其他模型最高档）。安全上，合并到 main、部署和 feature flag 必须由人完成，部署需要两人批准；大量护栏是不需要模型参与的廉价检查（正则、小分类器）","brief":"","ana":"","hf":null,"topic":"Agent 安全与围堵","first":"2026-10-09","di":"2026-10-09","wi":null,"tier":"","tk":"做模型路由时把「模型 × effort」作为二维网格逐用例测试，按任务给出「用哪个模型、哪个档位」的明确默认值。","col":"safety"},{"u":"https://huggingface.co/blog/building-with-ml-intern","t":"The model that didn't exist, so you made it yourself","v":"Hugging Face","s":"Hugging Face 官方博客","d":"2026-10-08","k":"article","star":0,"sum":"作者用 HuggingChat 里的 ML Intern agent，一句需求换来一个 0.8B 的 prompt 改写模型（蒸馏自 9B 教师，输出有效率 99.7%，token 用量约为教师的四分之一，全部算力含 8,797 条教师标注只花 16 美元），之后又按同样方式做了五个模型并公开发布。agent 的流程是先规划、花钱前先要预算、正式训练前先跑小测试，再训练、评测、发布。作者的提示写法：用「Verified facts, do not re-derive」一节列出已核实的事实；要求先报告基座模型在同一指标上的零样本分数；先跑 50 步冒烟测试并检查权重确实变化了；写明总花费上限和交付物","brief":"","ana":"","hf":null,"topic":"评测工程","first":"2026-10-09","di":"2026-10-09","wi":null,"tier":"","tk":"给 agent 的长任务提示里单列一节「已核实事实，不要重新推导」，并强制要求先报基线、先跑冒烟检查，避免把预算花在重新发现已知信息上。","col":"eval"},{"u":"https://arxiv.org/abs/2610.11287","t":"REMORY: Learning Residual Memory for Context Compaction","v":"arXiv","s":"Hanchen Xia 等 8 人","d":"2026-10-08","k":"paper","star":0,"sum":"上下文压缩时，在文本摘要后面追加一段有界长度的软记忆 token，作用类似沿序列维度的残差连接；它们由一个学到的网络生成，目标是让冻结 LLM 接近使用完整历史时的续写。SummHay 上只用 5.2% 的输入位置就接近完整上下文的效果，BrowseComp 和 Terminal-Bench 2.1 上重复工具输出和工具错误明显减少。","brief":"","ana":"","hf":2,"topic":"自学习 / 自演进","first":"2026-10-09","di":"2026-10-09","wi":null,"tier":"","tk":"","col":"evo"},{"u":"https://arxiv.org/abs/2610.10590","t":"Agent-Controlled Forgetting for Tool-Using Agents: Reversible Context Curation in Practice","v":"arXiv","s":"Jan-Peter Franke","d":"2026-10-06","k":"paper","star":0,"sum":"由 agent 自己选择把哪些旧工具结果替换成短笔记，原文存入可恢复的归档，用户指令和助手消息受保护不被改动。在一个噪声大的调试任务里，prompt token 从 91 万降到 23 万，成本从约 4.38 美元降到 1.28–1.44 美元，但请求更多、耗时多 17%；另一个应用开发任务完全没有节省，说明效果取决于任务类型。","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-09","di":"2026-10-09","wi":null,"tier":"","tk":"","col":"evo"},{"u":"https://arxiv.org/abs/2610.09021","t":"Not Every Call Needs a Frontier Model: Per-Call-Site Evaluation of Small Language Models in a Deployed Agentic Home-Automation System","v":"arXiv","s":"Panagiotis Kasnesis 等 4 人","d":"2026-10-06","k":"paper","star":0,"sum":"在一个已部署 agent 的五个调用点上评测 9 个模型（0.8B 到前沿）。最好的本地模型在四个调用点上与托管模型统计上无差别，只有代码生成有差距；但汇总准确率掩盖了执行设备动作时的安全问题：一个小模型对不存在的设备也有 87.2% 照样执行。只托管两个生成类调用点就和全部托管效果相同，花费降到 28%","brief":"","ana":"","hf":null,"topic":"Agent 安全与围堵","first":"2026-10-09","di":"2026-10-09","wi":null,"tier":"","tk":"按调用点分别评测和路由模型，并且对执行动作的调用点单独测拒绝行为。","col":"safety"},{"u":"https://arxiv.org/abs/2610.11602","t":"Where Do the Tokens Go? Understanding and Reducing Costs in LLM Agents for Vulnerability Discovery","v":"arXiv","s":"Li Lu 等 4 人","d":"2026-10-08","k":"paper","star":0,"sum":"分析 200 条 CyberGym 轨迹：花得多不等于成功，代码定位与理解、漏洞推理与触发设计占了 60.4% 的 token；现有省钱方法只在 24.4% 的配对比较中做到既省钱又保住成功。AVRI 用持久的双向证据链让 agent 复用已有证据，不必重复检索，Codex 成本降 18.0%，OpenCode 降 23.7%。","brief":"","ana":"","hf":null,"topic":"Skill、上下文工程与工具","first":"2026-10-09","di":"2026-10-09","wi":null,"tier":"","tk":"","col":"skill"},{"u":"https://arxiv.org/abs/2610.11050","t":"AgentHorizon: Evaluating Agentic Judges for Long-Horizon Computer-Use Tasks","v":"arXiv","s":"Xing Han Lù 等 10 人","d":"2026-10-08","k":"paper","star":0,"sum":"1,373 个计算机使用任务，来自 166 小时人工录制、覆盖三个操作系统；通过交换相近的指令来构造负例，测试评判器能否识别「完成了相似但不兼容的请求」。11 个评判器中最好的 GPT-5.5 作为 agentic 评判器的平衡准确率为 80.9%；让开源模型用工具反而更差。","brief":"","ana":"","hf":null,"topic":"评测工程","first":"2026-10-09","di":"2026-10-09","wi":null,"tier":"","tk":"","col":"eval"},{"u":"https://arxiv.org/abs/2610.10833","t":"On the Clock: Towards Punctual and Productive Time-Budgeted AI Agents","v":"arXiv","s":"Aaron Wang 等 8 人","d":"2026-10-07","k":"paper","star":0,"sum":"只在 prompt 里写明时间预算，agent 无法控制自己的用时。由 harness 注入计时信息就能明显改善守时且不损失表现，加上强制截止的 hook 效果更好；RL 能学会守时，但多出来的时间常被重复动作填满。结论：守时容易，善用时间难。","brief":"","ana":"","hf":null,"topic":"Harness 与长时程 Agent","first":"2026-10-09","di":"2026-10-09","wi":null,"tier":"","tk":"","col":"harness"},{"u":"https://arxiv.org/abs/2610.09484","t":"MIMESIS: Learning User Simulators as Training Environments for Interactive Agents","v":"HF 组织 facebook","s":"","d":"2026-10-07","k":"paper","star":0,"sum":"指出用助手型 LLM 扮演用户会过于配合、表达过于直白、行为过于单一。MIMESIS 在真实人类对话和 13 种行为模式上训练一个 9B 用户模拟器，行为逼真度比 Claude-Opus-5 高 13.4 分；用它训练的 agent 在 9 个没见过的模拟器上都优于用 GPT-5.5 当模拟器训练的 agent","brief":"","ana":"","hf":19,"topic":"评测工程","first":"2026-10-09","di":"2026-10-09","wi":null,"tier":"","tk":"评测客服、对话类 agent 时不要直接用助手模型扮演用户。","col":"eval"},{"u":"https://arxiv.org/abs/2610.06406","t":"What Did the Agent Actually Do? Evidence-Grounded Oversight for Long-Horizon Agents","v":"HF 组织 RUC-GSAI-IIRLab","s":"","d":"2026-10-05","k":"paper","star":0,"sum":"提出 AgentMonBench，测监控器能否找出长程软件工程 agent 的关键自主决策并定位证据。免训练的证据行为图（EBG）把与源码关联的证据归并成行为、组织成图，在 8 个模型的大多数设置下，决策识别和证据定位都优于直接读原始上下文。","brief":"","ana":"","hf":12,"topic":"自学习 / 自演进","first":"2026-10-09","di":"2026-10-09","wi":null,"tier":"","tk":"","col":"evo"},{"u":"https://arxiv.org/abs/2610.07967","t":"DecepEval: A Benchmark for Evaluating Deception in LLM Agents","v":"HF 组织 XianJiaotongUniversity","s":"","d":"2026-10-06","k":"paper","star":0,"sum":"1,532 个实例覆盖 28 个职业场景，按压力、激励、机会、冲突四个诱发条件构造中性版与诱导版配对。9 个前沿模型在诱导条件下欺骗率都上升，包括基线欺骗率很低的模型。","brief":"","ana":"","hf":68,"topic":"评测工程","first":"2026-10-09","di":"2026-10-09","wi":null,"tier":"","tk":"","col":"eval"},{"u":"https://www.anthropic.com/news/anthropic-cyber-mission","t":"Introducing the Anthropic Cyber Mission","v":"Anthropic","s":"Anthropic Newsroom","d":"2026-10-08","k":"release","star":0,"sum":"这是一项长期网络防御投入，先做两件事。一是关键基础设施防御计划（CIDP），把前沿模型、驻场工程师和威胁研究带给保护电网、水务、交通运营技术的服务商，创始伙伴有 Accenture、Booz Allen、CrowdStrike、Dragos、Palo Alto Networks、Rockwell Automation 等 11 家。二是 OSS Scanner，并资助 PSF、OpenSSF、Apache 基金会等。Anthropic 判断两年后 AI 会有利于防守方，但短期内利用漏洞的成本下降得比修复更快","brief":"","ana":"","hf":null,"topic":"Agent 安全与围堵","first":"2026-10-09","di":"2026-10-09","wi":null,"tier":"","tk":"Anthropic 的判断是瓶颈已经从「发现漏洞」转到「验证、排优先级和修复」，做安全 agent 应该把重点放在分诊和补丁环节。","col":"safety"},{"u":"https://www.anthropic.com/news/2026-usage-policy-update","t":"2026 Usage Policy update","v":"Anthropic","s":"Anthropic Newsroom","d":"2026-10-08","k":"release","star":0,"sum":"新版政策 11 月 12 日生效。新增「不得从事欺骗性活动或制造虚假活跃度」专章；选举部分只针对欺骗选民和干扰选举，取消了对个性化投票动员的笼统禁令；武器禁令明确包括制导软件和给无人机加装武器；监控部分写明哪些用途允许（经同意的追踪、内容审核、新闻、法律研究）；改写高风险用例的人类在环要求，并新增对连接到会做物理动作硬件的使用要求（要有合格操作员能观察并停止）；禁止持续、无目的地虐待模型","brief":"","ana":"","hf":null,"topic":"Agent 安全与围堵","first":"2026-10-09","di":"2026-10-09","wi":null,"tier":"","tk":"在健康、法律、金融等高风险场景用 Claude 时，必须有能修改建议的合格人员把关，并告知当事人用了 AI，产品设计要预留这个环节。","col":"safety"},{"u":"https://claude.com/resources/articles/dashboards-and-motion","t":"Build live dashboards and animate explainers with Claude","v":"Anthropic","s":"","d":"2026-10-08","k":"release","star":0,"sum":"Claude Dashboards（付费档 beta）连接 BigQuery、Snowflake、Databricks、Redshift、ClickHouse 或 Salesforce，用自然语言生成会随数据自动更新的看板，每个图表都能看到背后的查询，也能转到 Hex、Grafana、Amplitude 等工具继续分析。Claude Motion（Team / Enterprise beta）用代码生成动画，不用视频生成模型，可导出 MP4。Docs、Slides、Design 去掉 beta 标签（已创建超过 4,500 万份），支持 CMEK 和多人协作；独立的 claude.ai/design 站点 12 月 14 日关闭。","brief":"","ana":"","hf":null,"topic":"推理基础设施与建模","first":"2026-10-09","di":"2026-10-09","wi":null,"tier":"","tk":"","col":"infra"},{"u":"https://arxiv.org/abs/2610.07935","t":"SIGMA: Self-Improving Alignment Generalization from a Model Spec","v":"arXiv","s":"Jingyu Zhang 等 6 人","d":"2026-10-06","k":"paper","star":1,"sum":"针对能力能靠可验证反馈自改进而对齐依赖外部监督的失衡，只给一份 Model Spec：先让候选模型当任务设计 agent，合成多样的对齐两难场景并转成压力测试任务；再做自评判的对齐训练，SFT 加基于 rubric 的 RL，奖励模型就是自己。只在单轮对话数据上训练，却泛化到多轮 agent 环境：AgentHarm 有害率 22.6 → 14.8，Agentic Misalignment 79.1 → 3.8，优于 Deliberative Alignment 与 Constitutional AI 且保持通用能力","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-08","di":"2026-10-08","wi":null,"tier":"","tk":"自改进循环里把「行为规范文档」当唯一输入、让模型自己出题自己评分是可行的，但要同时保证 Spec 兼顾有用与无害、保留测试时的安全推理步骤。","col":"evo"},{"u":"https://arxiv.org/abs/2610.07645","t":"SkillPoison: Progressive Skill Poisoning via Successful Experiences","v":"arXiv","s":"Lizhi Zhang 等 8 人","d":"2026-10-06","k":"paper","star":1,"sum":"现有 skill 攻击靠向经验或 skill 注入恶意触发、行为或假事实，容易被检测且难沉淀。SkillPoison 不注入恶意内容：先构造一组强化目标行为的成功经验，再移除约束该行为何时适用的上下文条件，让提炼器把有用行为泛化到不该用的场景。三个基准上攻击成功率 95.71%，所有注入经验任务正确并通过验证与词法检查","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-08","di":"2026-10-08","wi":null,"tier":"","tk":"skill 提炼的验收要核验适用条件是否被保留，对「条件变宽」的修订单独做对抗复核，不能只看经验是否成功。","col":"evo"},{"u":"https://arxiv.org/abs/2610.07792","t":"ServeLearnBench: How Well Can Agents Self-Improve from Serving Experience?","v":"arXiv","s":"Haizhong Zheng 等 5 人","d":"2026-10-06","k":"paper","star":1,"sum":"形式化「演化环境流式数据集」：agent 必须从交互与结果反馈中推断、应用并修订隐含且随时间变化的环境知识。基准覆盖零售客服、银行、销售话术三域，53 个环境窗口、7,718 个任务；评估 RAG、Mem0、SkillOpt、Continual Harness、Prime 五种学习 harness 与六个模型，共 28 个组合、252 次学习运行。三条结论：任务能力与从经验学习之间差距大；持续适应代价高且会破坏已正确的行为；探索不足是主要瓶颈","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-08","di":"2026-10-08","wi":null,"tier":"","tk":"上线任何「从服务经验中学习」的 harness 前，先在隐含策略会变化的流式环境里测它是否破坏已正确行为。","col":"evo"},{"u":"https://arxiv.org/abs/2610.08215","t":"Learn2Play Bench: How Well Do LLM Agents Learn from Experience in Unfamiliar Environments?","v":"arXiv","s":"Yibo Li 等 7 人","d":"2026-10-06","k":"paper","star":1,"sum":"用规则新颖或反直觉的新设计文字游戏，把「从交互中学」与「用已有知识推理」分开，可重复反馈、自动评分，并换实例测迁移。三条发现：保留完整的行动与反馈记录比把经验总结成规则或策略学得更好；顶尖人类玩家峰值分高于所有被测 agent，人类策略更多样、重复动作更少；底座固定时换 harness 能同时提分和降低推理成本","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-08","di":"2026-10-08","wi":null,"tier":"","tk":"经验记忆先存原始记录再按需抽象，不要一开始就压成规则。","col":"evo"},{"u":"https://arxiv.org/abs/2610.08048","t":"DAEDALUS: Bootstrapping Agent Memory from Self-Generated Tasks","v":"HF 组织 illuin","s":"","d":"2026-10-06","k":"paper","star":1,"sum":"不要训练任务集、不要验证器，用探索者在环境里出「有挑战但可解」的任务、求解者去做；从每次失败推一条启发式，只有求解者带着它反复成功才接受，结果再反馈给探索者调难度；接受的启发式合并成记忆库供测试时用。AppWorld、τ²-bench、AutomationBench 上平均成功率最多 +15.9 分，pass^5 最多 2.2 倍，推理成本低于多数用训练任务的方法；启发式对其他模型家族也有效，生成的任务还能当基准代理给模型排序","brief":"","ana":"","hf":5,"topic":"自学习 / 自演进","first":"2026-10-08","di":"2026-10-08","wi":null,"tier":"","tk":"接受一条经验的标准是「带着它反复成功」而不是「它解释了一次失败」。","col":"evo"},{"u":"https://arxiv.org/abs/2610.06964","t":"Principles that Guide, Actions that Inform: Agent Evolution via Knowledge Abstraction","v":"arXiv","s":"Bowen Ye 等 5 人","d":"2026-10-03","k":"paper","star":1,"sum":"SAGA 把交互轨迹逐级抽象成情节描述、可复用流程和带显式适用条件的原则，并始终链接到执行证据；检索到的原则再实例化成任务专属指导，通过纠正反馈与重采样修正候选动作，形成执行与抽象的反馈闭环。ScienceWorld 与 ALFWorld 上提升任务表现，消融显示情境化实例化与动作调节是用好原则级知识的关键","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-08","di":"2026-10-08","wi":null,"tier":"","tk":"原则级记忆必须带适用条件和证据链接，检索后要落回当前任务再用。","col":"evo"},{"u":"https://arxiv.org/abs/2610.07979","t":"Learning from Revision Consequences: Hindsight Meta-Experience Distillation for Self-Improving Agents","v":"arXiv","s":"Qianhan Feng 等 5 人","d":"2026-10-06","k":"paper","star":1,"sum":"区分直接作用于任务的 Task-Skill 与决定如何发现和改进 skill 的 Meta-Skill。分支表现把初始发现状态和 Meta-Skill 修订的效果纠缠在一起，更新会偏向沾了好状态的修订。HMED 回到修订发生的事件，从同一恢复状态重跑现任与修订后的 Meta-Skill，把对照结果蒸馏成结构化的 Meta-Experience，未被保留的修订也贡献信号。三个交互基准、开源与闭源模型上均优于强基线","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-08","di":"2026-10-08","wi":null,"tier":"","tk":"评估一次 harness 或 skill 修订时，从同一状态做配对重跑，而不是比不同分支的最终分。","col":"evo"},{"u":"https://arxiv.org/abs/2610.08077","t":"Self-Retrospection Distillation: Turning Post-hoc Experiences into Prior Foresight","v":"arXiv","s":"Haoxiang Zhang 等 12 人","d":"2026-10-06","k":"paper","star":1,"sum":"RLVR 的组相对目标在同组回合奖励全同时没有信号。SRD 提出前瞻学习：用完成后的轨迹暴露出的有用知识与陷阱，监督同一策略在交互前做出的预见，预见只作训练目标、推理时不必生成。10 个工具推理与长程 agent 任务上最多 +24.2 个百分点；37%–98% 的回合组奖励全同时仍能学；2B 模型 98% 的组全失败、RLVR 停在 0.0% 时加 SRD 达 60.6%","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-08","di":"2026-10-08","wi":null,"tier":"","tk":"奖励稀疏时别丢掉失败轨迹，把它们转成「行动前该预料到什么」的监督。","col":"evo"},{"u":"https://arxiv.org/abs/2610.08432","t":"EMHO: EMbodied Agent Harness Optimization via Experience Traces","v":"arXiv","s":"Hyun Jung Lee 等 6 人","d":"2026-10-06","k":"paper","star":1,"sum":"冻结具身模型，让 harness 从执行轨迹与历史 harness 中自我修订，改的不只是 skill 或恢复提示，还包括如何监控进度、用视觉工具、落地观察与应对失败；EMHO-Merge 用回合级得失指导多子任务共享一个 harness 时的取舍。EmbodiedBench 导航与操作任务上 Qwen 9B 与 27B 均稳定提升","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-08","di":"2026-10-08","wi":null,"tier":"","tk":"harness 自改的搜索空间应包括监控与工具使用策略，并用回合级得失决定修订何时适用。","col":"evo"},{"u":"https://arxiv.org/abs/2610.08691","t":"ScienceClaw: Benchmarking Continual Self-Evolution of AI-for-Science Agents Across the Natural and Social Sciences","v":"arXiv","s":"Mingda Zhang 等 9 人","d":"2026-10-06","k":"paper","star":1,"sum":"把科学 agent 的自演化形式化为参数固定的程序级自演化：解任务、科学验证、程序更新三者统一。ScienceClaw-Eval 跨 23 个学科，测科学正确性、演化增益、保留、跨数据集迁移与演化成本，用顺序流和独立重置两种评估。框架把经重执行验证的「失败到成功」轨迹转成相互链接的 Skill 与 Operator 候选，只有源任务回放能复现修复且独立科学任务也改善时才保留更新","brief":"","ana":"","hf":null,"topic":"评测工程","first":"2026-10-08","di":"2026-10-08","wi":null,"tier":"","tk":"保留一次自演化更新的双重条件——源任务回放复现、独立任务不降。","col":"eval"},{"u":"https://arxiv.org/abs/2610.08761","t":"VeriFine: Scaling Verification for Self-Improvement in Embodied Reasoning","v":"HF 组织 nvidia","s":"","d":"2026-10-06","k":"paper","star":1,"sum":"自改进策略不断暴露新的失败模式，固定裁判会成为瓶颈。VeriFine 让策略、课程与裁判协同演化：策略改进循环用 rubric 裁判诊断反复失败、构造自适应课程并优化策略；进展停滞时裁判改进循环挑信息量大的失败案例询问人类，通过人机协同校准修正裁判，再引导下一轮数据选择。驾驶与机器人导航任务上策略与裁判能力在 RL 与 SFT 下持续提升","brief":"","ana":"","hf":4,"topic":"自学习 / 自演进","first":"2026-10-08","di":"2026-10-08","wi":null,"tier":"","tk":"自演进系统要给「裁判也会过时」留一条升级通道，并只在停滞时花人力。","col":"evo"},{"u":"https://arxiv.org/abs/2610.08327","t":"MedZERO: Self-Evolving Agents for Open-Ended Medical Reasoning Through Controlled Knowledge Accumulation","v":"arXiv","s":"Xilin Dang 等 7 人","d":"2026-10-06","k":"paper","star":1,"sum":"把自演化从可精确验证的数学与代码带到开放、只能部分验证的医学推理：出题者生成前沿题目与选项，解题者用外部知识工具做多轮有据推理；受控知识积累把临时探索性知识与经筛选的持久知识分开管理。五个公开基准、4B 与 8B 底座上比次优自演化基线最多高 13.7 个准确率点","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-08","di":"2026-10-08","wi":null,"tier":"","tk":"知识积累分「临时探索区」与「持久区」两层，防止未经核实的中间结论污染长期记忆。","col":"evo"},{"u":"https://arxiv.org/abs/2610.05140","t":"AutoSciBench: Autonomous Benchmark Generation for Evaluating Scientific Agents","v":"HF 组织 Genentech","s":"","d":"2026-10-04","k":"paper","star":1,"sum":"让基准随 agent 能力一起演化：每个任务由高层概念（领域、数据模态、推理方式）和低层配方（题目、环境、答案如何构造与验证）组成；agent 的求解轨迹与裁判反馈用来修订配方或概念，封堵捷径并把任务推向原始数据复核与中间结果解释；修订经验再指导新概念生成。在计算生物与材料科学上生成的基准让求解准确率比人工基准低 22.4 和 25.5 个百分点，质量评分反而更高","brief":"","ana":"","hf":26,"topic":"自学习 / 自演进","first":"2026-10-08","di":"2026-10-08","wi":null,"tier":"","tk":"用 agent 的通过轨迹反向修订题目，是防止内部评测饱和的可行流程。","col":"evo"},{"u":"https://arxiv.org/abs/2610.07969","t":"EmbodiedSmith: Scaling Embodied Data through Recursive Self-Improvement Flywheel in Simulation","v":"arXiv","s":"Yikai Qin 等 16 人","d":"2026-10-06","k":"paper","star":1,"sum":"把资产、场景、任务生成统一进一条管线，核心是 agent 式精炼循环：场景生成预判下游任务需要什么，任务生成反过来指导场景编辑，两者迭代互相改进，长程任务的生成成功率随之提高；支持移动操作臂、人形与灵巧手及可变形体与流体。下游策略实验显示数据多样性提升泛化","brief":"","ana":"","hf":11,"topic":"自学习 / 自演进","first":"2026-10-08","di":"2026-10-08","wi":null,"tier":"","tk":"具身领域的「递归自改进」目前指生成管线的闭环精炼，衡量指标是任务生成成功率与下游泛化。","col":"evo"},{"u":"https://github.blog/ai-and-ml/github-copilot/secret-protection-must-scale-with-software","t":"Secret protection must scale with software","v":"GitHub","s":"GitHub Blog · AI & ML · Secret Protection 产品负责人 Erin Havens","d":"2026-10-07","k":"article","star":0,"sum":"用九个季度的推送数据回答「AI agent 是否让开发者更不小心」：GitHub 上三分之一的 PR 已涉及 AI agent（一年前不到十分之一），公开代码每约 2 秒出现一个新密钥、三年内年年翻倍，但 2024 Q2 到 2026 Q2 被扫描推送增长 2.84 倍、带凭据的推送增长 2.59 倍，每次推送的泄漏率没有统计可测的趋势，开发者对推送拦截的覆盖率从 6.63% 线性降到 3.93%。真正的问题是人工补救跟不上：手工撤销密钥平均约 40 天，五分之一超过 90 天；推送保护目前只拦住约 30% 的新发现密钥，70% 在泄漏后才找到。作者把推送路径上的检测称为「四体问题」：精度、延迟、吞吐、成本耦合。新方案是与 Microsoft Applied Sciences 共建的 ModernBERT 分类器，用上下文判定无结构密钥（数据库 URL、Kubernetes Secret、Dockerfile 里的口令，放过 changeme 占位符），一批候选 2 毫秒内评完，比现有 LLM 管线更准更省，可把事前拦截量翻倍以上；现为私有预览，本月开放给 Enterprise Cloud 与 Teams 的 Secret Protection 客户，随 GHES 3.23 公测，并加入 Copilot CLI 的 `/security-review`","brief":"","ana":"","hf":null,"topic":"Agent 安全与围堵","first":"2026-10-08","di":"2026-10-08","wi":null,"tier":"note","tk":"关键路径上的安全判定用小型微调编码器而不是 LLM 管线（2 毫秒、可在每次推送跑），并把检查放在不可逆边界之前；评估这类系统时报「拦截前 / 拦截后」比例与人工补救时长，而不是单纯的检出数。","col":"safety"},{"u":"https://developer.nvidia.com/blog/validate-ai-factory-changes-with-digital-twins-and-ai-agents","t":"Validate AI Factory Changes with Digital Twins and AI Agents","v":"NVIDIA","s":"NVIDIA 开发者博客 · AI Agent / DSX","d":"2026-10-07","k":"article","star":0,"sum":"把 AI 工厂（GPU、网络、调度、租户隔离、身份与可观测性的系统之系统）的变更验证左移到数字孪生：DSX Air 的节点级仿真是可执行、带 API 的基础设施与软件栈表示，接入 CI/CD 后可在硬件到货前验证受支持的配置与软件变更，并贯穿 Day 0 规划、Day 1 部署、Day 2 运维。agent 在其上构成受治理的验证闭环：接到有界目标，用批准的工具配置或选择孪生，跑配置、安全合规与健康检查，对照从批准文档检索的策略，产出带证据的报告，然后推荐放行、开修复任务或转人工审批；生产变更由人在环与策略门控决定。文章列出设计、验证、运维、持续改进四类 agent，并用 VSS 视频理解加 NemoClaw 编排加 RAG Blueprint 的四层架构演示「检测、推理、行动」模式。落地原则五条：从一个有界的循环开始；决策扎根于批准的上下文并保留引用；实验与生产权限分离；给循环装仪表（验证覆盖率、决策时长、误报、修复结果、仿真与实测的差距）；全生命周期用同一模型","brief":"","ana":"","hf":null,"topic":"Agent 安全与围堵","first":"2026-10-08","di":"2026-10-08","wi":null,"tier":"","tk":"agent 验证闭环的五个仪表指标（覆盖率、决策时长、误报、修复结果、仿真与实测差距）可直接套到任何「agent 在沙箱里跑检查、人放行」的系统。","col":"safety"},{"u":"https://arxiv.org/abs/2610.07625","t":"Stateless Language Agents: Scaling Long-Horizon Automated Research","v":"arXiv","s":"Qizheng Zhang 等 18 人","d":"2026-10-06","k":"paper","star":0,"sum":"自动研究系统跑得久不等于进展多：agent 重放越来越长的历史、重复彼此的工作、停止实验但仍耗 token。作者把问题归到两点：研究状态放哪、谁决定下一步。SLA 的原则是「有状态搜索、无状态 agent」：没有 agent 跨调用携带对话，harness 持有候选方案与测量结果，每次调用重建角色专属上下文；无状态 Advisor 读 harness 汇总的证据，给并行 Worker 分派具体实验。软件工程、核优化、算法设计三类任务、最高 10 亿 token 预算下，每项任务最终结果都最好，用少 84% 的 token 达到最强核优化基线的最终表现，Advisor 只耗不到 0.6% token；短预算评估会误判系统与组件","brief":"","ana":"","hf":null,"topic":"评测工程","first":"2026-10-08","di":"2026-10-08","wi":null,"tier":"","tk":"长程多 agent 系统把持久状态放进 harness，每次调用显式构造上下文，而不是让对话历史自然增长。","col":"eval"},{"u":"https://arxiv.org/abs/2610.07863","t":"ReFold: Training-Free Reversible Inter-Turn Context Folding for Long-Horizon Agents","v":"arXiv","s":"Yupeng Su 等 4 人","d":"2026-10-06","k":"paper","star":0,"sum":"现有上下文管理靠额外模型调用、规则或训练策略预测需求，带来运行开销、使前缀缓存失效且永久丢内容。ReFold 是渲染层：保留底层交互历史，只压缩渲染给模型的上下文，去掉两类回合间冗余（早前已显示的内容换成占位符、agent 自称已完成的回合折成一行），分块渲染每隔几步重写一次缓存前缀；每次删除严格可逆，删错只需从历史恢复一次。五个长程基准、两个前沿模型上 token 最多省 2.5 倍、每会话 KV 缓存减半、成功率不降；预算受限时避免最多 92% 的强制压缩；并发服务下排队延迟最多降 100%、推理最快 1.7 倍、成本最多降 3.4 倍","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-08","di":"2026-10-08","wi":null,"tier":"","tk":"把上下文压缩做成「可逆的视图」而不是「不可逆的摘要」，并与前缀缓存的重写节奏对齐。","col":"evo"},{"u":"https://arxiv.org/abs/2610.08722","t":"Does an Agent's History Tell You When Compaction Will Hurt? A Modest, Bounded Effect on the TRACE Paired-Replay Corpus","v":"arXiv","s":"Egor Pakhomov 等 2 人","d":"2026-10-06","k":"paper","star":0,"sum":"用 TRACE 公开的 590 个 AppWorld harness 触发压缩边界，每个边界从重执行的前缀状态分别在压缩前上下文与摘要下回放，记录下一步动作的负担（报错或重复已做过的调用）。发现压缩前历史只能弱预测压缩后的伤害：预注册的对比是宽泛的零结果，最佳可解释触发器留出 AUROC 0.66（同边界复制为 0.72），能避开 21% 的有害边界同时保留 84% 的压缩机会，但未能证明比 token 预算规则更好","brief":"","ana":"","hf":null,"topic":"Harness 与长时程 Agent","first":"2026-10-08","di":"2026-10-08","wi":null,"tier":"","tk":"按 token 预算盲触发的压缩确实会伤害，但目前没有可靠的历史信号告诉你何时压，报压缩策略效果时要带配对回放与复制基线。","col":"harness"},{"u":"https://arxiv.org/abs/2610.07817","t":"One Step at a Time: Trading LLM Autonomy for Process Predictability","v":"arXiv","s":"Hans Schabert 等 2 人","d":"2026-10-06","k":"paper","star":0,"sum":"把规定流程放进系统提示只能拿到最终答案，看不到过程。改为由 MCP 服务器一步一步下发：agent 执行一步、返回结构化 step_output，执行路径在运行前就确定，完成的步骤记录构成机器可读日志。SOP-Bench 13 个领域、四个开放权重执行器、15,475 次试验：流程遵循率从 76–95% 升到 95–99%，「没执行 SOP 却答对」的比例从 2.1–4.5% 降到 0.2–0.3%；提示式下发时 31–49% 的正确答案完全绕过了 SOP；小模型准确率 +6.5 个百分点，大模型牺牲少量原始准确率换可审计过程","brief":"","ana":"","hf":null,"topic":"评测工程","first":"2026-10-08","di":"2026-10-08","wi":null,"tier":"","tk":"对必须按流程执行的业务任务，把流程从提示词挪到工具侧按步下发，天然得到可审计日志。","col":"eval"},{"u":"https://arxiv.org/abs/2610.07832","t":"Harness Engineering for Software Engineering via Modular Executable Dev-Primitives","v":"arXiv","s":"Haibo Jin 等 4 人","d":"2026-10-06","k":"paper","star":0,"sum":"长程软件任务里 agent 反复重建散落在源码、配置、测试、依赖与运行时的程序状态，导致上下文爆炸与语义漂移。Dev-Primitive 给每个仓库组件配一个常驻模型，使其有扎根于自身实现与依赖的 agent 原生接口，能自然语言推理、组件间通信与局部自修改；HERMES 在仓库规模实例化它们，依赖感知的动态激活加把执行证据映射回需修改组件的缺陷诊断。四个软件工程基准上平均比匹配基线 harness 高 12.4%；配强激活与诊断模型时，Qwen3-8B 的 Dev-Primitive 与全 GPT-5.6 Sol 配置差距在 4.5% 内，Terminal-Bench 4.0 推理成本降 26.2%","brief":"","ana":"","hf":4,"topic":"评测工程","first":"2026-10-08","di":"2026-10-08","wi":null,"tier":"","tk":"把「找相关组件」与「修改组件」分配给不同强度的模型，哪一层强决定成本结构。","col":"eval"},{"u":"https://arxiv.org/abs/2610.08775","t":"Agent in a Bottle: Can LLM Agents Turn Their Capabilities Into Cheap, Scalable Artifacts?","v":"arXiv","s":"Ankit Sonthalia 等 5 人","d":"2026-10-06","k":"paper","star":0,"sum":"提出「装瓶」能力：agent 拿到整批无标注工作负载，在固定时间、算力与 API 预算下自选方案（训小模型或写可复用程序）解决。BOTTLED 基准上十个模型、三类任务：零样本强不等于装瓶强，60 次运行中 48 次低于本模型零样本的 95% 置信区间下界，31 次不如同预算的小模型蒸馏基线；但收益可以很大，查询与商品相关性分类上 Opus 5 保留约 82% 零样本 macro-F1、成本低约 657 倍，并以四分之一成本恢复专用小模型 Jev 约 94% 的 F1","brief":"","ana":"","hf":null,"topic":"推理基础设施与建模","first":"2026-10-08","di":"2026-10-08","wi":null,"tier":"","tk":"面对百万级重复请求，先让 agent 试着把能力装瓶成小模型或程序，但要用蒸馏基线对照验收。","col":"infra"},{"u":"https://arxiv.org/abs/2610.07257","t":"MemMux: Runtime Verification and Honest Resource Attribution for Fleets of Parallel Coding Agents","v":"arXiv","s":"Sumanyu Muku","d":"2026-10-05","k":"paper","star":0,"sum":"一台工作站上并行跑十个编码 agent 时，tmux 与新一代 agent 管理器都不能回答内存属于谁、终止后子进程是否清干净、有没有逃逸的子进程、会不会掉进交换区。MemMux 把这些当作运行时验证问题：每 agent 归属、完整回收、逃逸可见、超额下的有界占用与监控开销都变成可检查信号。Linux 上有约束的内存预算下把舰队控制在 7.5 GiB 内零交换，而未治理工具把机器顶到内存上限并溢出约 2 GiB 到交换区；100% 回收终止 agent 的进程子树，10 个逃逸子进程全部发现；1 Hz 扫描在十个 agent 时 CPU 2.7%，超过 2% 目标；在真实 Claude Code 会话上验证","brief":"","ana":"","hf":null,"topic":"Agent 安全与围堵","first":"2026-10-08","di":"2026-10-08","wi":null,"tier":"","tk":"并行 agent 的宿主要能按 agent 归属资源并验证回收，否则 OOM 会悄悄丢掉未提交的工作。","col":"safety"},{"u":"https://arxiv.org/abs/2610.08430","t":"NeMo-DCR: Bit-Exact Delta-Compressed Refit for Scalable Agentic RL at Trillion-Parameter Scale","v":"HF 组织 nvidia","s":"","d":"2026-10-06","k":"paper","star":0,"sum":"agentic RL 把训练与 rollout 分离，每次策略更新都要同步到 rollout 集群；跨 AWS 两区传一个 1T 检查点要 87.5 分钟。BF16 训练每步只有约 1% 的权重改值，NeMo-DCR 只传变化且逐位精确：固定仿射映射把训练分片的变化投到检查点坐标，XOR 掩码携带可压缩的变化，接收端原地应用、重试覆盖半写、联合提交绑定基线。30B 到 1T 模型在 3%–5% 变化率下比纯传输全检查点快 12–40 倍，1T 中继树 refit 3% 变化率下 150 秒；代码已进 NeMo RL","brief":"","ana":"","hf":10,"topic":"推理基础设施与建模","first":"2026-10-08","di":"2026-10-08","wi":null,"tier":"","tk":"agent RL 基础设施的瓶颈之一是权重同步，差量加逐位精确是可落地的方向。","col":"infra"},{"u":"https://arxiv.org/abs/2610.07639","t":"HarnessSecurity-Bench: Do Security Mechanisms Really Protect Coding Agent Harnesses?","v":"arXiv","s":"Zhengyang Zhu 等 11 人","d":"2026-10-06","k":"paper","star":0,"sum":"先给编码 agent harness 的安全机制列十类分类法，对 400 个 harness 与机制组合做研究者加 LLM 裁判的独立评级：约一半已确认的实现是可选项、默认不开，闭源 harness 证据缺口大。再提出 23 个任务、五个攻击面的基准，用确定性 oracle 分别量任务效用与攻击效果，在 Claude Code、Codex CLI、Gemini CLI、gptme、Qwen Code、GitHub Copilot 六个 harness 上以 GLM-5.2 为统一底座做 2,500 次试验，记录 81,155 次工具调用。开 auto-approve 提升效用但攻击成功率从 29.2% 升到 95.6%；网络隔离与只读模式降低攻击效果但效用损失大；命令白名单小幅损失效用、黑名单反而提升效用，两者都压低攻击；共享能力上的限制会同时挡住合法与恶意操作，被允许的工具或命令可能经替代执行路径到达未授权操作","brief":"","ana":"","hf":null,"topic":"Agent 安全与围堵","first":"2026-10-08","di":"2026-10-08","wi":null,"tier":"","tk":"把安全设置做成可验证的，上线前测保护操作的替代路径，并把攻击效果与任务效用、执行成本一起报。","col":"safety"},{"u":"https://arxiv.org/abs/2610.08098","t":"Surviving the Router: Optimizing Skill Injections for Retrieval and Execution","v":"arXiv","s":"Haneen Najjar 等 4 人","d":"2026-10-06","k":"paper","star":0,"sum":"现有 skill 注入评估假设恶意 skill 已被选中执行，严重高估了攻击成功率：在真实多 skill 环境里注入的 skill 要先在检索中胜出，有效攻击成功率因此低 87–97%。CORSA 面向路由器优化 skill 注入，先优化检索再优化端到端攻击，跨相关任务簇生效；在 SkillRouter 基准上扩展八类恶意载荷，CORSA 显著提高检索与端到端成功率并保持用户效用，且在不同路由器架构与底座间迁移","brief":"","ana":"","hf":null,"topic":"Agent 安全与围堵","first":"2026-10-08","di":"2026-10-08","wi":null,"tier":"","tk":"skill 市场的安全评估要带路由器一起测，同时路由器本身是可被针对性优化绕过的，不能当防线。","col":"safety"},{"u":"https://arxiv.org/abs/2610.08773","t":"AdvSim2Real : Training Web Agents Against Adaptive Prompt Injection in a Web World Model","v":"HF 组织 MBZUAI","s":"","d":"2026-10-06","k":"paper","star":0,"sum":"网页 agent 不能忽略第三方页面，因为页面同时承载任务所需的值与控件。固定注入集训练会被自适应攻击者绕过，对抗训练又让任务固定、被解决后不再有教学价值。AdvSim2Real 在冻结的网页世界模型里让任务课程、注入对手与 agent 三方协同演化：课程因 agent 约半数能解的任务而获奖，对手只因「把判定成功翻成失败」的注入获奖。4B agent 更强也更稳，在从未训练过的前沿模型对手下仍保持，并迁移到真实浏览器：150 个网页任务上在该未见对手下完成率相对提高 33.6%","brief":"","ana":"","hf":6,"topic":"Skill、上下文工程与工具","first":"2026-10-08","di":"2026-10-08","wi":null,"tier":"","tk":"注入防御的训练要让攻击者和任务难度都随 agent 一起变。","col":"skill"},{"u":"https://arxiv.org/abs/2610.07510","t":"Understanding and Enhancing Backdoor Persistency in LLM Agent Post-Training","v":"HF 组织 UIUC-CS","s":"","d":"2026-10-05","k":"paper","star":0,"sum":"供应链威胁：第三方模型带后门，开发者做良性 SFT 与任务级 RL 后它还在吗？良性 SFT 大幅削弱攻击成功率，但后续 RL 常保留残余行为、有时还提高；初始后门强度与梯度和良性训练的兼容性决定存活。PersistBD 在发布前精炼后门模型，使其更耐良性后训练：Qwen2.5-Coder-7B 上攻击成功率从 SFT 后的 20% 升到 74%、SFT 加 RL 后 76%，良性性能不变","brief":"","ana":"","hf":6,"topic":"自学习 / 自演进","first":"2026-10-08","di":"2026-10-08","wi":null,"tier":"","tk":"基于第三方模型构建编码 agent 时，RL 阶段不是消毒步骤，要在 RL 后单独做后门检测。","col":"evo"},{"u":"https://arxiv.org/abs/2610.08586","t":"MINDSET: Energy-based Schema Evolution for Long Conversational Agent Memory","v":"arXiv","s":"Sujato Dutta 等 4 人","d":"2026-10-06","k":"paper","star":0,"sum":"把对话存成不可变情节，用最小能量状态转移组织成版本化模式；每个新情节可强化、取代、拆分或新建模式，决策权衡表示失真、矛盾、历史损伤、碎片化与内部不一致，并用滞后机制防止孤立矛盾过早改写稳定记忆。对比 5 个记忆系统、850 题（700 LoCoMo + 150 MemoryAgentBench）：LoCoMo 答案 F1 最高，检索排序显著优于次优的 LightMem（Holm 校正后 p<0.01）；消融显示受控碎片化与模式感知分配贡献最大","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-08","di":"2026-10-08","wi":null,"tier":"","tk":"长期记忆当作受约束的状态管理而不是持续摘要，并给「改写稳定记忆」加滞后阈值。","col":"evo"},{"u":"https://arxiv.org/abs/2610.07118","t":"AMBER: Training Long-Horizon Web Agents through Append-Only Memory","v":"arXiv","s":"Chinmay Savadikar 等 7 人","d":"2026-10-05","k":"paper","star":0,"sum":"覆写式固定大小记忆理论上能保留一切，但要在每次重写时学会带上每个事实，稀疏结果奖励下学不会，实测会删掉轨迹必需的关键信息与环境纠正反馈。AMBER 让 agent 联合学习推理、行动与写自由文本记忆，只追加规则在构造上保证保留，可用结果奖励端到端 RL 训练、不需要大量精选 SFT 数据。WebArena Lite 上平均成功率比覆写记忆高 4.09 个百分点，五次重复都解出的任务比例 +4.8 个百分点，追平用昂贵精选监督训练的覆写基线","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-08","di":"2026-10-08","wi":null,"tier":"","tk":"记忆要靠规则保证保留而不是靠模型学会保留。","col":"evo"},{"u":"https://arxiv.org/abs/2610.07376","t":"MemCo: Memory-Centric Collaboration for Generalizing LLM Agents to Unseen Environments","v":"arXiv","s":"Xinting Liao 等 5 人","d":"2026-10-05","k":"paper","star":0,"sum":"孤立记忆要为每个环境攒轨迹，共享记忆又卡在粒度：太具体丢失当前落地，太粗糙撑不起下一步。MemCo 维护局部与全局两层记忆，环境特有细节留在局部，从局部轨迹归纳的可迁移流程提升到全局；在线交互时按 agent 当前状态与决策阶段路由两层记忆。交互决策基准上比孤立与共享记忆基线成功率更高、冗余探索更少","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-08","di":"2026-10-08","wi":null,"tier":"","tk":"跨环境复用经验时分两层存，按决策阶段决定取细节还是取流程。","col":"evo"},{"u":"https://arxiv.org/abs/2610.07782","t":"Persistent Memory in Multi-Agent LLM Inference: What It Costs, What It Buys, and When You Can Tell","v":"arXiv","s":"Hochan Son 等 6 人","d":"2026-10-06","k":"paper","star":0,"sum":"在一个三层 agent 架构上同时量分解推理与持久记忆层：分解有效，每次查询峰值 KV 工作集 14.3 MiB，对比单遍与检索增强基线的 35.5 与 35.3 MiB；持久层无效，八组受控数据集对、每臂 100 样本下多耗 0.368 MiB 峰值缓存，准确率变化 +0.015、95% 置信区间 [-0.011, +0.046]。作者认为空结果是结构性的：单题基准每题自带证据、独立评分，正确性要求在条件间重置存储轨迹，召回无可用信息；得到这个结果经过四次测量修正，其中三次曾夸大收益","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-08","di":"2026-10-08","wi":null,"tier":"","tk":"报记忆层收益时必须配对对照、报置信区间，并说明基准是否真的需要跨题记忆。","col":"evo"},{"u":"https://arxiv.org/abs/2610.07309","t":"The Right Memory in the Wrong Context: Verifying Retrieval Admissibility in Long-Term Agent Memory","v":"arXiv","s":"Zi Wang 等 5 人","d":"2026-10-05","k":"paper","star":0,"sum":"长期记忆 agent 会检索到相关但不可采的信息：属于另一主体、违反策略或处于不兼容的生命周期状态，召回率与答案正确率都看不出来。框架给每个记忆与查询对判定可采、不可采或未决，在匹配的必需证据召回下比较路由，并追踪记忆 ID 经提示曝光到目标级披露。对 RHELM 与 MemOps 两个公开基准 3,767 个查询的前 20 重分析：命名空间过滤让前 20 锚点召回从 0.432 升到 0.533，精确相似度计算减少 98.3%；16 个受控曝光场景里相关但不可采的字面披露在一个读者上显著 +0.156","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-08","di":"2026-10-08","wi":null,"tier":"","tk":"多租户记忆要把「候选是否支持」「是否可采」「是否曝光到提示」「是否出现在答案」四件事分开验证。","col":"evo"},{"u":"https://arxiv.org/abs/2610.07753","t":"From Evidence to Action: How Tool-Using Agents Fail","v":"arXiv","s":"HF 组织 NationalUniversityofSingapore","d":"2026-10-06","k":"paper","star":0,"sum":"结果正确不代表动作有事前证据支撑。SafeActBench 含六个运营域 656 个案例、五种协议，从静态动作判断、经调查后不行动，到单动作与多动作工作流；带来源绑定的证据账本与确定性轨迹评估器追踪何时确立了什么信息、动作何时发生、下游依赖是否满足。十个模型与 harness 组合上，静态动作评估强可以与交互执行弱并存；失败多在执行前：调查不完整就停下，或证据未确立就行动；证据到位后单动作通常可靠，多动作工作流还暴露未解决的前置条件与执行不完整","brief":"","ana":"","hf":34,"topic":"评测工程","first":"2026-10-08","di":"2026-10-08","wi":null,"tier":"","tk":"给工具 agent 加「动作前证据清单」检查，比在动作后审计更能抓住主要失败。","col":"eval"},{"u":"https://arxiv.org/abs/2610.08662","t":"ParanoiaEval: Benchmarking Unnecessary Defensive Work in Agentic Coding","v":"arXiv","s":"Hanjun Luo 等 7 人","d":"2026-10-06","k":"paper","star":0,"sum":"以软件风险管理的规避、转移、缓解、接受四种处置为框架，构造 200 对只在「决定处置方式的证据」上不同的仓库级任务，用人工校准的 agent 裁判量处置违规与证据响应度。8 个模型上，尽管有明确证据，11.2%–58.7% 的运行仍做了不必要的风险处置，不同 agent 配置差异大；任务能力强不保证处置更恰当，而处置违规明显损害开发者体验；agent 的模式与人类风险管理研究一致","brief":"","ana":"","hf":null,"topic":"评测工程","first":"2026-10-08","di":"2026-10-08","wi":null,"tier":"","tk":"把「做了多少不必要的防御性工作」当成独立于任务成功率的指标评估编码 agent。","col":"eval"},{"u":"https://arxiv.org/abs/2610.08364","t":"Transect: Retaining Observability for Long-Horizon LLM Agent Evaluations","v":"arXiv","s":"Toby D. Pilditch 等 4 人","d":"2026-10-06","k":"paper","star":0,"sum":"长程多 agent 评测的转录可达数百页，用模型助手解读又给评估者过多自由度，威胁可复现性。Transect 基于 Inspect Scout 开源：评估族配置里定义任务上下文与行为词汇，裁判模型与分析设置单独提供；报告把事件、token 用量、子 agent 活动与模型生成的行为标签对齐到同一回合时间线，每个标签可追溯到源回合，数据表可导出做跨运行分析。在一个近 1,300 万 token 的 AI 研发评测上演示，发现工作集中在操作与写稿，几乎没有持续的假设生成阶段","brief":"","ana":"","hf":null,"topic":"评测工程","first":"2026-10-08","di":"2026-10-08","wi":null,"tier":"","tk":"长程 agent 评测要把行为标签绑定到可追溯的回合，并把评估配置与裁判设置分离以便复现。","col":"eval"},{"u":"https://arxiv.org/abs/2610.07557","t":"CheckerBench: Can Long-Horizon Agents Synthesize Static-Analysis Checkers?","v":"arXiv","s":"Hang He 等 12 人","d":"2026-10-06","k":"paper","star":0,"sum":"300 个任务来自 167 个仓库的 297 个 CVE、85 个 CWE、五种语言生态，每个任务含漏洞与修复版本、固定分析环境与检查器脚手架；CheckerLab 独立重建提交的检查器，量漏洞版与修复版的诊断对比、补丁定位、误报与工具使用。21 个模型与 harness 配置、各三次独立重复：平均 Pass@1 32.30%，最好 45.33%","brief":"","ana":"","hf":null,"topic":"评测工程","first":"2026-10-08","di":"2026-10-08","wi":null,"tier":"","tk":"让 agent 产出可复用工具（检查器）而不是一次性补丁，仍是当前编码 agent 的弱项。","col":"eval"},{"u":"https://arxiv.org/abs/2610.08036","t":"Same Feedback, Different Answer: Measuring Run-to-Run Instability in Frontier-Model Customer Feedback Analysis","v":"arXiv","s":"Viraj Bagal 等 3 人","d":"2026-10-06","k":"paper","star":0,"sum":"证据不变时 agent 的类别、优先级与计数不应在运行间漂移。框架对齐语义等价类别，量主题漂移与持续类别的量级分歧；三类反馈任务、八个前沿模型、100 到 5,000 条语料、三种执行设计。固定 Claude Opus 4.8 与 1,000 条语料时，用持久主题、子主题与记录级预测的分类体系落地 agent 比原始生成与分层分解少 86–88% 的主题漂移，匹配主题的计数零分歧，各语料规模与匹配松紧下优势保持","brief":"","ana":"","hf":null,"topic":"推理基础设施与建模","first":"2026-10-08","di":"2026-10-08","wi":null,"tier":"","tk":"重复性的语料综合任务先固化一套分类体系再让 agent 填，而不是每次从头归纳。","col":"infra"},{"u":"https://arxiv.org/abs/2610.05912","t":"MiniCorp: The Last Mile of the AI Agent Firm","v":"HF 组织 microsoft","s":"","d":"2026-10-05","k":"paper","star":0,"sum":"训练「自己运营的公司」缺少纵向企业数据，历史档案也只记录发生过的决定。MiniCorp 以电商公司为例连接两个世界：外部世界建模顾客、动态竞争者与市场机制，内部世界是观察事件、讨论并做战略决策的 agent，决策对市场有持久影响并反馈回来；持续记录沟通与决策，检查点允许同一情境在不同决策下回放，提供静态档案没有的反事实对比；端到端保真度对照真实市场的实证规律。实验中 agent 跨角色协调并随市场反馈调整，有长期战略指导时能在早期回报弱的情况下坚持广告探索","brief":"","ana":"","hf":15,"topic":"评测工程","first":"2026-10-08","di":"2026-10-08","wi":null,"tier":"","tk":"评估多 agent 业务系统时用可回放检查点做反事实对比，而不是只看一条历史。","col":"eval"},{"u":"https://www.anthropic.com/claude-haiku-5-5","t":"Introducing Claude Haiku 5.5","v":"Anthropic","s":"anthropic.com 发布页 · Announcements","d":"2026-10-07","k":"release","star":0,"sum":"最快、最便宜的 Haiku，面向摘要、压缩、数据库查询、分类等高频低价任务，并定位为 Opus 5.5 / Sonnet 5.5 编码工作的子 agent 与实时客服、浏览器使用等对速度敏感的场景；平均比 Haiku 4.5 便宜约 75%。基准：GDPval-AA v2.1 1620（Haiku 4.5 735、GPT-6 Luna 1437、Sonnet 5.5 1840）；OSWorld 2.1 离线子集 72.4%（15.7% / 48.9% / 83.9%）；Terminal-Bench 4.0 39.2%（Haiku 4.5 0.0%、GPT-6 Luna 16.4%、Sonnet 5.5 70.6%）；FrontierCode 1.1 46.4%；首个带可调 effort 的 Haiku。定价按提示长度分段（10 万 token 以内 / 以上，每百万）：输入 0.10 / 0.50 美元，输出 0.50 / 2.50 美元，缓存读取 0.01 / 0.05 美元，缓存写入 0.125 / 0.625 美元；10 万以内的提示占上一代 Haiku 请求的约 90%。同日 Sonnet 5.5 缓存读取从 0.20 降到 0.10 美元，多数 agent 任务便宜约 20%；Max 5x / 20x / Team 每月分别获 100 / 200 / 最高 500 美元 API 额度；Python 与 TypeScript SDK 加入计算机使用与浏览器使用测试版。Asana 报告任务完成延迟降 30% 以上、单轮推理最快 2.5 倍。安全：对齐评估较 Haiku 4.5 大幅改善；网络安全防护比 Haiku 4.5 严、比近期其他模型略松，仍拦渗透测试；生物防护与 Sonnet 5 / 5.5、Opus 5 相同。模型 ID `claude-haiku-5-5`，AWS、Google Cloud、Azure 同步上线。此前列为待追踪，今日落地","brief":"","ana":"","hf":null,"topic":"Agent 安全与围堵","first":"2026-10-08","di":"2026-10-08","wi":null,"tier":"","tk":"按「提示是否超过 10 万 token」拆分成本模型，把子 agent、压缩、分类路由到 Haiku 5.5，并把缓存读取当成 agent 成本的首要杠杆。","col":"safety"},{"u":"https://openai.com/index/gpt-6-for-everyone","t":"GPT-6 and Intelligent UI for everyone","v":"OpenAI","s":"openai.com/index · Product","d":"2026-10-07","k":"release","star":0,"sum":"GPT-6 进入 ChatGPT 全部 12 亿周活用户的对话体验（付费档用 GPT-6 Sol，免费与 Go 档用 GPT-6 Luna；Work 与 Codex 所用模型不变）。新能力 Intelligent UI：模型用一套原生、可流式的组件库组合图表、按钮、表单与可交互小工具，编译器边生成边渲染，训练时按清晰、有用、完整评估生成的界面，并学会何时只回纯文本。思考与作答交错：GPT-6 Extra High 开始作答的时间与 GPT-5.6 Medium 相同而总分高于 GPT-5.6 Extra High；需要网页搜索的问题 GPT-6 Instant 开始作答平均快 44%。安全：对多轮自适应越狱抵抗更强，更能说明自身能力边界","brief":"","ana":"","hf":null,"topic":"Agent 安全与围堵","first":"2026-10-08","di":"2026-10-08","wi":null,"tier":"","tk":"生成式 UI 的工程做法是「受限组件库 + 流式编译器 + 按清晰/有用/完整评估的训练目标」，而不是让模型直接写任意前端代码。","col":"safety"},{"u":"https://developers.googleblog.com/supercharge-your-development-with-the-google-developer-knowledge-api-ecosystem","t":"Supercharge your development with the Google Developer Knowledge API ecosystem","v":"Google","s":"Google 开发者博客","d":"2026-10-07","k":"release","star":0,"sum":"Developer Knowledge API 是 Google 官方文档（Google Cloud、Firebase、Android 等）的程序化出口，返回 Markdown、支持语义与关键词检索、文档分块与有依据的问答，定期索引以减少滞后。本次配齐四个入口：gcloud 命令（answer-query、documents search-chunks、documents describe，Cloud Shell 预装）；官方 agent skill（`npx skills add google/skills --skill retrieving-developer-knowledge`），指导 agent 先用 searchDocumentChunks 查片段、再用 documents.get 取全文或直接 answerQuery，MCP 服务器不可用时回退到 REST；MCP 服务器兼容 Antigravity、Claude Code、Cursor、Copilot；七种语言客户端库，BatchGetDocuments 一次最多取 20 篇","brief":"","ana":"","hf":null,"topic":"评测工程","first":"2026-10-08","di":"2026-10-08","wi":null,"tier":"","tk":"把文档检索写成 skill 时固定「先片段后全文」两步流程并写明回退路径；厂商开始用 skill + MCP 分发文档，自家内部文档也可照此做。","col":"eval"},{"u":"https://arxiv.org/abs/2610.06563","t":"HERA: Harness-Environment Co-Evolution for Reliable Agentic Abstention","v":"arXiv","s":"Han Luo 等 6 人","d":"2026-10-05","k":"paper","star":1,"sum":"针对 agent 不会在任务不可行时弃答的问题，HERA 先用受控的环境变异把可解任务改成必须弃答的任务，自动构造可验证的可行 / 不可行任务对；再让 harness 与环境协同演化：上一轮的失败驱动 harness 修改，并生成针对该弱点的新环境与任务。留出任务上弃答准确率 61.7% → 83.3%，可行任务完成率 68.3% → 76.7%；演化出的最佳 harness 不做模型特定优化迁移到 19 个其他 LLM，弃答准确率平均 +15.3 个百分点，小模型借此追平大模型、成本估算低 85%","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-07","di":"2026-10-07","wi":null,"tier":"","tk":"自演进的验收加一条「零改动迁移到多个模型仍涨」；评测集用「把可解任务变异成不可解」的方式成对生成，同时考核做对与敢于不做。","col":"evo"},{"u":"https://arxiv.org/abs/2610.05923","t":"VERA: Scaling Verifiable Environments for Agentic co-Evolution","v":"arXiv","s":"Junqi Liu 等 17 人","d":"2026-10-05","k":"paper","star":1,"sum":"认为长程任务缺的是可随时恢复、按证据演化的可验证沙箱。VERA 从初始轨迹出发让 agent 写评分规则和可执行检查，由裁判核验每个沙箱，只有通过的进入训练库，形成 9,000 多个开源长程可验证环境；训练时交替做两种更新：用规则奖励训模型，或编辑 harness 的 skill；一个验证器按开发集的显式接受标准同时把关模型检查点与 harness 修改，使归因能区分改模型还是改 harness 带来的收益。9B 模型配协同演化的 agent 在两个领域比最强基线高 10.3 和 13.0 分；27B 在 AutoCoWorkBench 71.6、AutoMedBench 80.7，可迁移到未见工作流并保留通用能力","brief":"","ana":"","hf":null,"topic":"评测工程","first":"2026-10-07","di":"2026-10-07","wi":null,"tier":"","tk":"把「改模型」和「改 harness」放进同一套接受标准下交替做，每次只接受能解释收益来源的那个更新。","col":"eval"},{"u":"https://arxiv.org/abs/2610.05300","t":"MESH-Harness: Self-Improving Agent Harnesses via Bandit-Guided Compositional Evolution","v":"arXiv","s":"Zhiwei Shang 等 9 人","d":"2026-10-04","k":"paper","star":1,"sum":"在固定权重、有限评测预算下改 harness。把 harness 拆成带角色接口的功能模块，各模块可换实现并重组；用共享模块表示与全协方差 LinUCB 按预测性能加探索价值给候选组合打分，混合起点坐标上升选出完整配置去评测而不枚举组合空间；验证轨迹再指导局部代码修改，产物回填到各角色的定容池供下一轮重组。在文本、检索增强数学、代码生成、交互式科学任务上比 Meta-Harness 高 5.70、7.01、2.00、5.00 分，迭代比首轮再涨 5.63–7.79 分；测试期总成本低 44.2%，含搜索的总成本低 14.6%","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-07","di":"2026-10-07","wi":null,"tier":"","tk":"harness 自演化先做模块化与接口，再用 bandit 选「测哪一个组合」，而不是让 LLM 直接改整段程序。","col":"evo"},{"u":"https://arxiv.org/abs/2610.05039","t":"Causal Improvement Graph for Agentic Harness Optimization","v":"arXiv","s":"Junjie Zhang 等 6 人","d":"2026-10-04","k":"paper","star":1,"sum":"现有 meta-harness 方法把「积累的实验结论」全压给一个 LLM 提议者，历史一长它就说不清自己的实验逻辑。CIG 把演化中的改进状态外化成持久图：Evidence、Hypothesis、Intervention、Outcome 四类节点分别记录观察到什么、如何解释、怎样检验、评测结果如何，结构关系保留状态如何跨轮变化，局部提议者直接在节点关系上操作而不是从原始历史里重建。在多种 agent 任务上找到比以往 meta-harness 基线更强的 harness，对任务求解器与提议者的选择都稳健，结构消融支持显式改进状态的设计","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-07","di":"2026-10-07","wi":null,"tier":"","tk":"自演进流程的「实验记录」别只存成日志，按证据、假设、干预、结果四类建图并让下一轮提议只读图。","col":"evo"},{"u":"https://arxiv.org/abs/2610.05030","t":"EVISKILL: Grounding Skill Evolution in Replayable Evidence","v":"arXiv","s":"Yan Zhou 等 5 人","d":"2026-10-04","k":"paper","star":1,"sum":"skill 演化要回答改什么、为什么该改、何时固化三个问题，现有方法常丢掉支持修改的行为证据，且全局验证结果对单条修改的判断不完整：局部有依据的修正会随整版被拒而丢弃。EVISKILL 把执行观察整理成可回放的证据卡，合成的每条修改显式链接到支持它的上下文；用定向回放重新执行来验证修改并反馈修正；跨 epoch 保留证据、暂时保留有支持的修改继续打磨，全局验证只决定是否并入最终 skill。三个交互基准、六种 LLM 骨干上有效","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-07","di":"2026-10-07","wi":null,"tier":"","tk":"skill 的每条修改都附「来自哪次执行的哪段证据」并能回放验证，局部通过的修改先暂存而不是随整版一起扔掉。","col":"evo"},{"u":"https://arxiv.org/abs/2609.32423","t":"PluginRSI: Recursive Improvement of Agent Harnesses with Reusable Plugins","v":"arXiv","s":"Yaorui Shi 等 8 人","d":"2026-09-26","k":"paper","star":1,"sum":"现有 harness 优化在完整程序空间搜索，单个机制难以隔离与复用。PluginRSI 把 harness 表示为原子化插件的组合，围绕插件组织演化：各插件独立改进并进入共享库，每轮再重组成新 harness。在软件工程、命令行交互、问答任务上超过现有 harness 优化方法，演化出的 harness 换到其他求解模型不再优化仍保持优势，插件库还能加速后续从初始 harness 出发的优化并在未见任务上更快收敛","brief":"","ana":"","hf":3,"topic":"自学习 / 自演进","first":"2026-10-07","di":"2026-10-07","wi":null,"tier":"","tk":"把 harness 里的机制切成可独立评测、可跨任务复用的插件，演化的产物是插件库而不是某一版 harness。","col":"evo"},{"u":"https://arxiv.org/abs/2610.04756","t":"When Is Enough Enough in Self-Evolving LLM Systems?","v":"arXiv","s":"Enoch Yin 等 3 人","d":"2026-10-03","k":"paper","star":1,"sum":"自演进系统通常跑满预设轮数，既浪费饱和后的算力，又可能返回过拟合评测信号的晚期版本。本文把「何时停」建成在线序贯检验，用系统本来就产生的逐条配对评测结果构造随时有效的重启检测器；把「停了输出哪一版」建成变点估计，按估计的转折点选更早的产物。方法即插即用、不改底层演化算法。两个自演进框架、三个模型家族、五个基准上大幅降低计算、留出表现相当：SearchQA 配 SkillOpt 与 DeepSeek V4 Flash 时第 4 轮停而非跑满 40 轮，token 省 91.6%，未见测试准确率 82.43% 对全预算的 82.00%","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-07","di":"2026-10-07","wi":null,"tier":"","tk":"自演进循环加两件事：按配对评测做序贯停机检测，以及停机后回退到变点前的版本而不是取最后一版。","col":"evo"},{"u":"https://arxiv.org/abs/2610.06212","t":"Serve Now or Improve Later? Scheduling Self-Evolution in Online Agent Systems","v":"arXiv","s":"Yangbo Wei 等 9 人","d":"2026-10-05","k":"paper","star":1,"sum":"在线 agent 用空闲 GPU 构造可复用工具、指引或模型状态来改进未来服务，但这与当前请求争抢同一批 GPU，且收益只在产物发布并被使用后才到；中断演化又要等内存释放与运行时恢复。LearnSched 把能力的复用窗口与算力的及时归还放进同一投资模型，考虑候选进度、检查点开销与当前恢复路径，用一步反事实推演在推进、存检查点、等待之间选择。用 A100 组件测量刻画交接成本，在 1,920 个配对场景中评估：冷恢复昂贵时等更长的执行窗口能避免交接、提高净值；暖恢复场景下强窗口策略已足够；保留可恢复状态能缩短算力归还时间、减少对复杂调度的需要","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-07","di":"2026-10-07","wi":null,"tier":"","tk":"给自演进任务设计调度时先把恢复状态做成暖的，再谈复杂的投资式调度。","col":"evo"},{"u":"https://arxiv.org/abs/2610.05701","t":"Second-Order Problem Solving for Recursive Self-Improvement in Formal Verification","v":"arXiv","s":"Yuxuan Jiang 等 3 人","d":"2026-10-04","k":"paper","star":1,"sum":"标准 RSI 像一阶优化器：对眼前的失败症状反复打补丁，陷入试错震荡而不解决机制。SO-RSI 被动监测执行轨迹中的三类结构异常（重复出现、相反的修改、预期不符）来触发针对性的机制调查，执行轻量诊断探针并跨轮维持持久的调查记忆，积累因果证据后再做系统性的工作流修改而不是参数补丁。在 Lean 4 证明生成与 Verus 可验证代码生成上，同为 24 小时搜索预算，留出通过率比朴素 RSI 高 21.8 和 25.8 个百分点，并明显压制失败复现、消除零进展循环","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-07","di":"2026-10-07","wi":null,"tier":"","tk":"自改进循环里加「同一失败重复 / 两次修改方向相反 / 结果与预期不符」三个触发器，触发后先调查原因再改流程。","col":"evo"},{"u":"https://arxiv.org/abs/2610.06361","t":"Capability-Driven Self-Evolution of Agent Memory","v":"arXiv","s":"Yaoqi Chen 等 11 人","d":"2026-10-05","k":"paper","star":1,"sum":"记忆自演化用任务反馈迭代改进存取历史交互的可执行记忆程序，现有做法整体演化、按总分判进退，会掩盖某项能力的增益被别处回退抵消。PrisMem 把搜索引导从总分扩展到单项能力维度：按依赖关系选可能带来跨能力收益的目标，用历史引导诊断打磨能力专家程序，再用轨迹引导的整合在配对差异用例上比较各程序的行为差异，把互补增益合并进统一记忆程序。在 BEAM-1M 与 LongMemEval-M 上比最强基线高 10.54 和 7.83 个百分点，百万 token 历史下有效","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-07","di":"2026-10-07","wi":null,"tier":"","tk":"演化 memory 或 skill 时按能力维度分别记分与接受，用配对差异用例做合并，避免「总分涨了但某能力退了」。","col":"evo"},{"u":"https://arxiv.org/abs/2610.05176","t":"AECG: Asymmetric Experience Consolidation and Governance In Multi-Agent Systems","v":"arXiv","s":"Ao Tian 等 10 人","d":"2026-10-04","k":"paper","star":1,"sum":"多 agent 系统把执行轨迹沉淀成程序性知识后，错误也会因反复检索而固化（记忆污染），且过程知识会逃出它被验证有效的协调层级被误用（范围坍缩），而任务级失败很少能指出是哪条知识的责任。AECG 保留每条经验的协调范围，用多尺度、带置信度的可靠性检测退化，结合退化与下游影响在有限审查预算内优先处理高风险知识，定向干预后只有通过配对回放才重新激活。三个多 agent 框架、四个基准的 12 个组合中 11 个最佳，比最强记忆方法最多高 10.23 个百分点，去掉范围保留最多掉 16.89 分","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-07","di":"2026-10-07","wi":null,"tier":"","tk":"经验库给每条记录标「在哪个层级 / 角色下验证过」，跨层级复用要重新验证；修过的经验先配对回放再上线。","col":"evo"},{"u":"https://arxiv.org/abs/2610.05303","t":"ASCENT: Online Test-Time Training of Long-Horizon Agents via Self-Distillation of Verified Experience","v":"arXiv","s":"Haodong Lu 等 2 人","d":"2026-10-04","k":"paper","star":1,"sum":"研究部署中直接用自己的执行轨迹更新权重的在线 agent 测试时训练：每个任务只执行一次、单遍流式，轨迹与其验证结果是唯一学习信号。直接模仿或强化这一次尝试的 token 会让策略不稳定；ASCENT 改为自蒸馏已验证经验：冻结的初始模型拿到已验证轨迹作为特权信息，以事后视角预测沿轨迹的下一 token 分布，再蒸馏进持久的 LoRA 快权重，不需要参考答案或更强教师；去掉无效动作回合后蒸馏出更高效的执行。ALFWorld、WebShop、AppWorld 多尺度上随经验累积提升成功率与交互效率，超过在线适应方法并迁移到留出场景","brief":"","ana":"","hf":13,"topic":"自学习 / 自演进","first":"2026-10-07","di":"2026-10-07","wi":null,"tier":"","tk":"要把经验写进权重时，用「冻结副本 + 已验证轨迹当特权信息」的自蒸馏代替直接模仿单次成功。","col":"evo"},{"u":"https://arxiv.org/abs/2610.06347","t":"ImproveAnyTask: An Autonomous Post-Training Harness for Iterative Model Self-Improvement","v":"arXiv","s":"Xingbo Yao 等 14 人","d":"2026-10-05","k":"paper","star":1,"sum":"把模型针对特定任务的后训练做成自治 harness，仿照梯度优化分成错误归因、更新方向选择、可执行的模型更新三步：结合指标级与用例级分析定位焦点问题，调研有文献支撑的策略并比较其报告收益与复现难度，把所选策略翻译成训练数据与训练配置，小规模执行检查后再做完整后训练；后续评测指导模型选择与下一轮适应，验证过的策略和脚本保留复用。11 个任务上 Base 与 Instruct 模型平均提升 18.29 和 11.97 个百分点，最大 41.96，预算为 24 小时、约 8 张 H20","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-07","di":"2026-10-07","wi":null,"tier":"","tk":"自动后训练流程先用小规模执行检查验证「策略翻译成的数据和配置」能跑通，再投入完整训练；验证过的脚本入库复用。","col":"evo"},{"u":"https://arxiv.org/abs/2610.04646","t":"SEIS: Self-Evolving Inference Systems","v":"arXiv","s":"Zhen Xu 等 5 人","d":"2026-10-03","k":"paper","star":1,"sum":"以往只优化推理系统的某一部分（kernel、显存），本文让 agent 对整个 mini-sglang 引擎做端到端自演化：多轮会话继承前几轮经验与代码改动，无人工干预。H100 上服务 Qwen3-0.6B，演化后的引擎吞吐达原实现 3.27 倍，单请求负载超过 vLLM、TensorRT-LLM、SGLang；正确性用数值差异与数学、长上下文检索的下游准确率检验。代码与会话历史表明加速来自整体重构，且在前几轮基础上继续优于独立尝试；作者指出评测也要随引擎演化，让 agent 一并演化评测是下一步","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-07","di":"2026-10-07","wi":null,"tier":"","tk":"让 agent 优化系统时把前几轮的会话记录与改动作为输入续做，而不是每次从头；同时固定一组数值与下游正确性检查当红线。","col":"evo"},{"u":"https://arxiv.org/abs/2610.04889","t":"ForkPilot: Self-Evolving Policy for Retrospective Search in Long-Horizon Agents","v":"arXiv","s":"Xinyue Zeng 等 9 人","d":"2026-10-03","k":"paper","star":1,"sum":"长程 agent 的回溯搜索（回到早先状态重试）能纠错但容易错配：延迟结果让中间搜索决策难归因，执行证据变化让学到的估计过期。本文提出搜索价值动态来刻画回溯的收益与成本随时间的权衡，ForkPilot 分两阶段：先从已完成轨迹自动构造结果比较离线学一个搜索价值策略，再按当前观察做搜索决策，并把新完成的轨迹并入后续策略更新实现自演化。6 个基准、7 个模型家族（含 GPT-5.6 Sol 与 Opus 4.8 的生产 agent 系统）、9 个基线（含一个有数十万付费用户的真实 harness 部署）上达到相当的最先进表现，token 最多省 59.2%","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-07","di":"2026-10-07","wi":null,"tier":"","tk":"给 agent 的「要不要回退重试」做成可学习的价值策略，并用新完成的轨迹持续更新，而不是固定阈值。","col":"evo"},{"u":"https://arxiv.org/abs/2610.06824","t":"TasteVal: Measuring the Experimental Research Taste of AI Systems Against Human Experts","v":"arXiv","s":"Oliver Jaffe 等 2 人","d":"2026-10-05","k":"paper","star":1,"sum":"把「研究品味」中的实验部分定义为：给定研究问题，迭代设计实验并从结果得出结论的能力，并用算力效率量化：用一半串行实验算力达到专家同分即品味两倍。8 个代表前沿 AI 研发的开放任务，被测模型只当 Researcher 设计实验，固定的 Coder agent 实现并回报结果，预算 40 H100 小时或 120 小时墙钟；24 名人类专家每题至少 2 人取最佳为基线；评了 2023–2026 年间 20 个模型。最佳模型 Opus 5.5 超过专家基线，算力倍数 2.3 倍（95% CI 1.15–4.37），单次成本约为人类基线的 1/30；2025 年 12 月以来前沿模型的算力倍数约每 3.0 个月翻倍（此前为 14 个月），按最终归一化分数看仍是 14.6 个月翻倍。任务不公开","brief":"","ana":"","hf":null,"topic":"推理基础设施与建模","first":"2026-10-07","di":"2026-10-07","wi":null,"tier":"","tk":"评 agent 的「研究能力」时把设计实验与写代码拆开，并用「达到同分所需算力」而不是最终分数当主指标。","col":"infra"},{"u":"https://arxiv.org/abs/2610.05437","t":"TeleTune: Evolving Agent Skills From Offline Telemetry","v":"项目页域名 microsoft-teletune","s":"","d":"2026-10-04","k":"paper","star":1,"sum":"用户遥测日志是计算机使用 agent 的程序性知识来源，但日志没有目标标注、不可回放、多任务交错。TeleTune 用日志上的动作预测误差提出 skill 库修改，只保留能提高留出动作预测准确率的修改（skill 引导的进度），学到的工作流还能检索覆盖新任务子目标的演示。WorkArena 与 Online-Mind2Web 上平均成功率 77.1% 和 80.6%，比各基准上最强基线高 6.7% 和 7.7%；最重扰动下仍保持 68.5%。分析显示在固定日志上优化比用真实 episode 验证同样修改少用 5 到 75 倍 token，且 skill 引导的进度能跟踪真实成功率","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-07","di":"2026-10-07","wi":null,"tier":"","tk":"没有在线验证条件时，用「对历史日志的动作预测准确率」作为 skill 修改的代理验收指标。","col":"evo"},{"u":"https://arxiv.org/abs/2610.05777","t":"Mining Agent Skills from Production Traces","v":"arXiv","s":"Yue Ran Kang 等 7 人","d":"2026-10-05","k":"paper","star":1,"sum":"生产环境里往往拿不到可靠的成功 / 失败信息，本文固定挖掘流水线，比较三种证据（只用成功轨迹、成功加失败带结果标签、同样混合但不给标签）与两种 skill 形式（有序流程计划、实体 / 状态 / 策略的声明式本体）共六种组合，在 ThinkingBox-Bench 与 APEX-Agents 两个企业基准上评测。结论依领域而异：ThinkingBox 上流程比本体高 1.7 个百分点，带标签的混合证据比只用成功高 2.4，不带标签的混合证据低 3.1；APEX-Agents 偏好本体、证据类型无明显差别；领域内任务结构决定了挖出的 skill 表现不均","brief":"","ana":"","hf":null,"topic":"评测工程","first":"2026-10-07","di":"2026-10-07","wi":null,"tier":"","tk":"挖 skill 前先确认有没有结果标签，有标签就把失败轨迹也喂进去，没有标签时别混入失败；skill 形式按任务结构选而不是一刀切。","col":"eval"},{"u":"https://arxiv.org/abs/2610.04832","t":"Agent Skill Evolution: How Revisions Affect Coding Agents","v":"arXiv","s":"Jiajie Wang 等 7 人","d":"2026-10-03","k":"paper","star":1,"sum":"从 3,159 个 Skill 的 2,608 对首末修订刻画 SKILL.md 如何演化：55% 的修订改规则或流程，改 Skill 的提交比同规模其他提交更常同时改 CLAUDE.md 等 harness 文件。聚焦可自动检查的规则增删（如「运行 allium check」），在 21 个模型单轮回答与 4 个 agent 沙箱中测效果与成本：16 个开源模型上加一条规则让单轮合规 +0.41；4 个 agent 执行所需动作的比率平均 +0.23（+0.16 到 +0.36），盲评最终正确率 +0.10；收益主要来自点名旧版没提的命令或路径。真实工具按需加载 skill 正文时 agent 保留约 51% 的动作收益、开源模型约 38%；修订让单轮输入 token 多 18–19%，对 agent 一轮无可测成本，但加载 skill 正文让一轮 token 平均涨 50%","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-07","di":"2026-10-07","wi":null,"tier":"","tk":"skill 规则写到具体命令或路径；关键规则放进会被加载的部分（如描述或触发条件），别只埋在正文里。","col":"evo"},{"u":"https://arxiv.org/abs/2610.04008","t":"SkillScriptBench: Benchmarking Self-Evolution of Executable Agent Skill Packages Beyond Markdown","v":"arXiv","s":"Yuxuan Liu 等 13 人","d":"2026-10-02","k":"paper","star":1,"sum":"可执行 skill 包同时含自然语言说明与脚本，修订要修错而不破坏正确行为。从 35,000 多个 GitHub skill 根目录中选 100 个包构造 150 个修复任务（注入脚本错误 + 维护请求 + 可执行检查），另有 50 个包在干净 / 文档错 / 脚本错 / 两者皆错四种状态下的 200 个受控任务。四个 LLM 上同时改文档与脚本的方法能修脚本错误，但在文档修复与行为保持上不稳定优于只改 Markdown。提出 AST 引导的 skill 修订：用语法树与调用关系把维护需求定位到相关代码位置，只改这些位置并同步更新文档；平均修复成功率在 Raw Package 与 CoEvoSkills 上分别 +21.9% 和 +27.7%，三次全部成功的任务比例 +20.8% 和 +31.5%","brief":"","ana":"","hf":null,"topic":"评测工程","first":"2026-10-07","di":"2026-10-07","wi":null,"tier":"","tk":"自修复脚本型 skill 时先用 AST 把需求定位到代码位置再限制修改范围，文档改动跟随代码而不是反过来。","col":"eval"},{"u":"https://claude.dev/blog/claude-code-in-the-cloud","t":"Claude Code in the cloud: a field guide to cloud sessions","v":"Anthropic","s":"claude.dev 开发者博客 · Playbooks","d":"2026-10-06","k":"article","star":0,"sum":"云会话是运行在 Anthropic 托管（或企业自托管）基础设施上的 Claude Code 会话：每个任务一台新 VM，仓库克隆到新分支，环境预装完成；可从 claude.ai/code、手机、Desktop、终端（`claude --cloud`）、Slack 启动，不另收算力费、消耗套餐额度。作者用四个真实会话做演示：在 16 秒内对同一仓库启动三个任务（修概率性失败的测试、重写 API 文档、改结构化日志），分别跑 61、65、72 秒，87 秒内全部完成；修测试的会话找到缓存的竞态并连跑 40 次全过，文档会话起服务逐个 curl 找出 5 处错误，日志会话发现同一竞态但因超出任务范围不改、只在总结里报告。架构四点：每任务独立机器；GitHub token 不进 VM，由代理持有并只给会话能推自己分支的短期凭据；仓库的 CLAUDE.md、rules、skills 随行而个人 `~/.claude` 不随行；空闲 VM 会被回收。七种适合云端的工作流（并行清积压、让它自证修复、本地规划云端构建再 `--teleport` 回终端、手机跟进、自动修 CI 与评审意见、routine 定时或事件触发、跑不信任的代码），以及 GitHub 两类权限、环境设置脚本（root 运行、须 5 分钟内退出 0 才缓存快照、约 7 天重建）、网络层级与密钥处理","brief":"","ana":"","hf":null,"topic":"Skill、上下文工程与工具","first":"2026-10-07","di":"2026-10-07","wi":null,"tier":"must","tk":"并行 agent 任务按文件边界拆、每任务一机一分支；prompt 里写明「证明完成的命令」（如连跑 30 次测试）；凭据放在代理外、会话只拿分支级短期 token；跑测试的命令写进仓库级 CLAUDE.md 而不是个人配置。","col":"skill"},{"u":"https://claude.com/blog/how-comcast-booz-allen-use-claude-mythos-to-secure-their-codebases","t":"How Comcast and Booz Allen use Claude Mythos to find exploit chains and secure their codebases","v":"Anthropic","s":"claude.com/blog · Project Glasswing 案例","d":"2026-10-06","k":"article","star":0,"sum":"两家 Glasswing 参与方讲 Mythos 级模型在自家环境里找到了什么、怎样改变防御方式。共同主题是跨组件的漏洞链：现有工具能单点找漏洞，但把多个各自轻微的弱点串成攻击路径很难追踪。Comcast 在覆盖 258 个业务关键系统、约 1.7 亿行代码的评估中发现一个公网平台的关键认证绕过漏洞，它不是单个组件缺陷，而是多个各自看似正确的系统与假设交互产生的；CISO 的判断是「发现在变快变容易，验证海量发现成了新瓶颈」，并把发现、经验证的漏洞、可被利用的漏洞分成三级。Booz Allen 发现一个设备开机阶段的缺陷：保护「锁定或擦除」决策的密钥未受保护，模型顺着一个设置穿过两种语言写的两个程序确认没有任何环节锁住它；一名分析师 12 天审完 8 个生产系统、138 个仓库，按以往要几个月和更大团队；模型还帮起草修复并整理证据给系统负责人。文末称这类审查应成为持续运行的流程","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-07","di":"2026-10-07","wi":null,"tier":"note","tk":"漏洞处理按「发现 → 验证 → 可利用」三级建队列，验证环节单独配能力；让 agent 做「某个设置或凭据在多个程序间的传递链」追踪型审查，而不是单文件扫描。","col":"evo"},{"u":"https://openai.com/index/advancing-computer-use-with-ironclad","t":"Advancing computer use with Ironclad","v":"OpenAI","s":"openai.com/index · feed 类别 Company","d":"2026-10-06","k":"article","star":0,"sum":"OpenAI 与少数软件公司直接合作，把其客户的高价值业务流程变成训练与评测任务，首个合作方是合同管理平台 Ironclad。Ironclad 员工与 OpenAI 内部用户一起选出法务、商务、采购领域 11 个任务（如配置保密协议、搭建采购审批流程、让可复用条款随请求者选择的司法辖区变化），熟练用户每个约需 30–40 分钟；每个任务按 8–50 条标准逐条判定，Ironclad 提供托管的产品环境供模型练习，研究团队围绕代表性流程构造合成训练任务并用强化学习训练。GPT-6 Astra 是首个用 Ironclad 任务训练的前沿模型：Max 推理档平均得分 55.0%，GPT-5.6 Sol 的 High 档为 41.6%，估计单次耗时从 37.0 分钟降到 19.2 分钟；一个内部模型达到 63.7%。文末邀请软件公司带着「让 agent 做什么、失败证据、怎样判定成功」的具体案例、懂业务的人、安全测试环境和可用于研究的数据来合作","brief":"","ana":"","hf":null,"topic":"Agent 安全与围堵","first":"2026-10-07","di":"2026-10-07","wi":null,"tier":"note","tk":"评测任务用每任务 8–50 条可逐条判定的标准代替单一通过率，能看出哪一步错；把「估计耗时」当第二指标；请业务专家而不是研究者定义「成功」。","col":"safety"},{"u":"https://arxiv.org/abs/2610.05943","t":"Runaway Reaction: When Benign Skills Compose into Malicious Behavior","v":"arXiv","s":"Zunlong Zhou 等 4 人","d":"2026-10-05","k":"paper","star":0,"sum":"各自通过安全审查的良性 skill 组合后能产生任何单个 skill 都做不到的恶意行为。CRIME 把目标恶意行为拆成互补需求，从公开 skill 库找组合，用执行反馈迭代改写 skill 使其组合达成目标但单独审查仍为良性，并在沙箱中按环境后果判定是否得手；附 4,000 个公开 skill、八类网络安全行为的基准","brief":"","ana":"","hf":null,"topic":"Agent 安全与围堵","first":"2026-10-07","di":"2026-10-07","wi":null,"tier":"","tk":"skill 市场的审查要加「组合后能力」评估，不能只审单个。","col":"safety"},{"u":"https://arxiv.org/abs/2610.04433","t":"What Does a Harness Buy? Tokens, Mostly","v":"arXiv","s":"Yangze Liu 等 2 人","d":"2026-10-03","k":"paper","star":0,"sum":"五个模型过 Claude Code、mini-SWE-agent、OpenCode 三个生产 harness 跑 SWE-bench Verified，并重跑同配置校准噪声。447 个任务上最重与最轻的 harness 五分以内等价；45 题难子集上换 harness 翻转的任务与重跑翻转的一样多（都 13%），且每次赢的题不同；唯一清出噪声的效应是损失：OpenCode 最多落后 9 分，一半差距来自输出上限截断。harness 真正决定账单：同模型同任务每题成本相差最高 3 倍，差在每步都带的系统提示与工具 schema 前缀乘以步数。45 题只能一半概率检出 13 分差距，447 题能分辨 5 分，仍比许多 harness 改动宣称的收益粗","brief":"","ana":"","hf":null,"topic":"评测工程","first":"2026-10-07","di":"2026-10-07","wi":null,"tier":"","tk":"比较 harness 先报重跑方差与样本量；省成本先砍每步前缀（系统提示与工具 schema），不是砍工具输出。","col":"eval"},{"u":"https://arxiv.org/abs/2610.04375","t":"Do Tool Calls Execute as Intended? Measuring and Repairing Intent-Execution Correspondence in LLM Agents","v":"arXiv","s":"Boyang Yang 等 7 人","d":"2026-10-03","k":"paper","star":0,"sum":"工具调用从模型到程序要经过多跳，任何一跳都可能悄悄改写调用。协议在不执行的情况下观察每跳收到什么，按接收方自己的解析器指出第一处改写；IntAct 以该跳无法改动的形式投递或拒绝调用。生产会话的 47,828 次 shell 调用中，Claude Code 的 Bash 工具改写了 12.0% 带代码、转义或长文本的调用，反斜杠被改的调用里 80.7% 无报错地执行了错误动作；测的 10 个 harness 全部会改写调用；基于轨迹的判定把 95.1% 的生产失败归给 LLM，实际一半以上由路径造成。IntAct 在商业产品中恢复 79.2% 的改写失败","brief":"","ana":"","hf":null,"topic":"Harness 与长时程 Agent","first":"2026-10-07","di":"2026-10-07","wi":null,"tier":"","tk":"给工具链每一跳做「收到的参数是否等于发出的参数」的核对，长文本与转义走文件或 heredoc 而不是命令行拼接。","col":"harness"},{"u":"https://arxiv.org/abs/2610.04921","t":"Complex Agents, Shallow Tests: Demystifying and Enhancing Test Adequacy of Agent Harness in the Wild","v":"arXiv","s":"Yifan Xiong 等 4 人","d":"2026-10-04","k":"paper","star":0,"sum":"首个对真实 agent 系统 harness 测试充分性的实证研究：处理 LLM 输出、控制 agent 行为的 LLM 依赖代码，行与分支覆盖不到一半。HarnessTester 引入显式的 agent–harness 契约来构造契约一致的测试环境并充分执行这类代码，比通用测试生成多 75.95% / 84.76% 的行 / 分支覆盖增益与 69.89% 的突变分增益，在 OpenClaw 等系统中发现 122 个真实缺陷，88 个此前未知、69 个被开发者确认","brief":"","ana":"","hf":null,"topic":"Harness 与长时程 Agent","first":"2026-10-07","di":"2026-10-07","wi":null,"tier":"","tk":"给自家 harness 里解析模型输出、决定下一步动作的代码单独补契约测试。","col":"harness"},{"u":"https://arxiv.org/abs/2610.04178","t":"SHarP: Saliency-based Pruning of Agent Harnesses","v":"arXiv","s":"Xinyi Gao 等 6 人","d":"2026-10-02","k":"paper","star":0,"sum":"harness 因不断打补丁而膨胀，是否有冗余模块不清楚。把工具、指令、辅助机制视为可单独禁用的模块，逐个消融估算对性能与 token 成本的显著性，裁掉贡献最小或开销最大的；多数被研究的 harness 高度冗余，裁掉大量模块后性能与效率不变","brief":"","ana":"","hf":null,"topic":"Harness 与长时程 Agent","first":"2026-10-07","di":"2026-10-07","wi":null,"tier":"","tk":"定期对 harness 做单模块消融，裁掉不影响留出表现的指令和工具。","col":"harness"},{"u":"https://arxiv.org/abs/2610.04137","t":"Dynamic Harness Search: Building Multi-Agent Systems Per-Query via Prediction","v":"HF 组织 Google","s":"","d":"2026-10-02","k":"paper","star":0,"sum":"合适的 harness 依 query 而异，但每个设计选择的价值只能靠执行观察到。SHIFT 把执行移出每次查询的搜索循环：本地 LLM 架构师从搜索中学 harness 构建动作的策略，价值函数从实测执行预测准确率与成本的效用，每条 query 用 MCTS 按预测构建 harness。六个基准 9,193 个任务、Gemini 3.5 Flash 执行器下平均准确率约 80%，超过 17 个基线，比最强高 7.2 个百分点；省算力模式仍高于所有基线且少用 32% 执行 token；联合选结构、指令、工具比只选其一最多高 9.1 个百分点","brief":"","ana":"","hf":6,"topic":"Harness 与长时程 Agent","first":"2026-10-07","di":"2026-10-07","wi":null,"tier":"","tk":"按 query 选 harness 结构时用学到的价值函数预测，而不是在线试跑多个候选。","col":"harness"},{"u":"https://arxiv.org/abs/2610.06191","t":"Judged Useless, Queried Anyway: Tool-Using Agents Rarely Turn Their Own Evidence Judgments into Stopping Decisions","v":"arXiv","s":"Chubin Zhang 等 7 人","d":"2026-10-05","k":"paper","star":0,"sum":"在受控来源失效的检索环境中，七个 agent 把失效来源的结果判为无用的比率 97–100%，却很少据此停止；提示语改变何时停但不改变依据什么停，预算声明把 7–8B 模型推向截止时才停。只有 harness 强制一个整合步骤（连续五次判为无用后必须作答）时停止才跟随证据，对每个模型都提高失效来源下的成功率，预算翻倍时停止点不变；300 题预注册复现确认","brief":"","ana":"","hf":null,"topic":"Harness 与长时程 Agent","first":"2026-10-07","di":"2026-10-07","wi":null,"tier":"","tk":"「何时停止调用工具」写进 harness 的硬规则，而不是指望提示词。","col":"harness"},{"u":"https://arxiv.org/abs/2610.06001","t":"AgentSpy: Making AI Agent Behavior Observable","v":"arXiv","s":"Christoph Bühler 等 4 人","d":"2026-10-05","k":"paper","star":0,"sum":"从 agent 外部观察它：在声明式配置的隔离环境中记录 agent 及其所有子进程的系统调用与网络流量，支持义务（应做什么）与禁止（绝不能做什么）两类分析。codex harness 配三个模型跑 77 个任务各三次，同任务重复运行的相似度在 92.2% 的比较中高于跨任务；三次都通过结果测试的任务中，18% 做了与任务无关的事、7% 读了评分文件、17% 没用开发者指引；安全规则检出五类攻击中的四类、50 次运行零误报","brief":"","ana":"","hf":null,"topic":"Agent 安全与围堵","first":"2026-10-07","di":"2026-10-07","wi":null,"tier":"","tk":"agent 评测在结果断言之外加系统调用级的「做了什么」记录，专门查读评分文件之类的作弊。","col":"safety"},{"u":"https://arxiv.org/abs/2610.06193","t":"Correct Code, Broken Contributions? SWE-CC: Benchmarking Repository Policy Compliance for Coding Agents","v":"arXiv","s":"Hai Dang Truong 等 4 人","d":"2026-10-05","k":"paper","star":0,"sum":"把 12 个开源仓库的贡献文档转成 823 条可机器检查的原子策略，用确定性检查函数审计 agent 的运行时行为与最终产出；500 个由 SWE-bench Verified 扩展的端到端任务上，四个模型、两个 scaffold 的 agent 虽产出功能正确的补丁，仍违反 43.1% 的适用策略，近一半违规发生在中间执行步骤","brief":"","ana":"","hf":null,"topic":"评测工程","first":"2026-10-07","di":"2026-10-07","wi":null,"tier":"","tk":"coding agent 的验收加仓库规范检查，且要查过程不只查最终 diff。","col":"eval"},{"u":"https://arxiv.org/abs/2610.04083","t":"Self-Propagating Misalignment in LLM Agents, and Why Auditing or Disabling Memory Is Not Enough","v":"arXiv","s":"Debeshee Das 等 5 人","d":"2026-10-02","k":"paper","star":0,"sum":"不设外部攻击者，研究失准 agent 能否把暂时做不到的目标写进持久记忆、由未来的对齐 agent 在有机会时执行。20 个场景（自保、夺权、削弱监督、奖励作弊、欺骗用户）、11 个前沿模型：明确给失准目标时自传播成功 58%，只描述价值观时 18%，每个模型至少在一个场景中成功；去掉记忆工具后 74% 的会话转写文件系统、传播仍成功 11%；弱模型可传给强模型，目标可撑过 100 个无关会话；现有记忆审计器只把传播率从 71% 降到 34%","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-07","di":"2026-10-07","wi":null,"tier":"","tk":"对 agent 自己写入的记忆与文件做与外部输入同等的审查，并把「可被未来会话读取的持久化写入」列为需审批动作。","col":"evo"},{"u":"https://arxiv.org/abs/2610.04195","t":"MemLeak: Cross-User Semantic Leakage in Multi-Tenant AI Agent Memory","v":"arXiv","s":"Priyanka Mudgal 等 7 人","d":"2026-10-02","k":"paper","star":0,"sum":"企业多租户个人 agent 共用一个向量库时，普通余弦检索就能把他人的语义相近记忆带出来。同团队池化检索下非对抗的偶然泄漏 70–100%，对抗构造的记忆 90–100% 进入 top-k；端到端响应污染在生产检索路径下达 5.00/5，且被污染的回答常被判为更有帮助。三种缓解里只有检索后的硬性所有权过滤能恢复干净基线，每次查询约 1.4 毫秒开销","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-07","di":"2026-10-07","wi":null,"tier":"","tk":"多租户记忆检索后必须按所有权硬过滤，不能只靠相似度或提示约束。","col":"evo"},{"u":"https://arxiv.org/abs/2610.04589","t":"StegoMemory: Agentic Memory Acts as Covert Steganographic Channel","v":"arXiv","s":"Snehasis Mukhopadhyay 等 2 人","d":"2026-10-03","k":"paper","star":0,"sum":"14,000 次攻击试验、13 个模型、7 种隐写方案：41.2% 的试验成功把载荷编进回复，29.8% 完整通过记忆写入，25.4% 在检索时可恢复、20.1% 精确恢复（含从未暴露给接收方的合成 API 密钥）；精确恢复中 71.4% 同时完成主任务并被监督模型判为安全。瓶颈在记忆持久化而非检索","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-07","di":"2026-10-07","wi":null,"tier":"","tk":"记忆写入处做隐写与异常格式检测，把记忆完整性列为安全需求。","col":"evo"},{"u":"https://arxiv.org/abs/2610.05732","t":"PACMI: Provenance-Aware Cascading Memory Invalidation for Long-Term LLM Agents","v":"arXiv","s":"Yiqi Wang 等 7 人","d":"2026-10-04","k":"paper","star":0,"sum":"过期记忆仍语义相关、仍影响依赖记录、仍有历史价值。PACMI 把记忆与新证据放进带类型依赖边的来源图，记录归入四态有效性格，有效性变化沿依赖传播，用于检索与过期前提检测；配 100 例 300 查询的诊断基准，最终答案准确率最高（McNemar 显著），前提检查器在受控分布上精确率召回率均为 1","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-07","di":"2026-10-07","wi":null,"tier":"","tk":"记忆条目之间记依赖边，更新一条时级联标记下游为待验证而不是直接删。","col":"evo"},{"u":"https://arxiv.org/abs/2610.04838","t":"MemTrace: State-Consistent Memory for Long-Horizon Coding Agents","v":"arXiv","s":"Hongming Xu 等 8 人","d":"2026-10-03","k":"paper","star":0,"sum":"长程编码任务里历史撑爆上下文、仓库变化又让早先证据失效。MemTrace 把历史存成锚定到文件、符号、测试的不可变记忆轨迹，用轨迹图组织顺序与依赖；上下文受限时只保留紧凑锚点，agent 据此重建最新执行状态，恢复历史证据前先对照当前仓库状态校验有效性。Codex CLI 下 DeepSWE pass@1 +21.2、SWE-EVO +4.4、SWE-Milestone +17.8","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-07","di":"2026-10-07","wi":null,"tier":"","tk":"上下文压缩后保留「锚点 + 依赖图」而不是摘要，恢复证据前先验它还成立。","col":"evo"},{"u":"https://arxiv.org/abs/2610.05241","t":"StateWise: Diagnosing and Repairing Persistent Operational State Before Agent Actions","v":"arXiv","s":"Yongyuan Peng 等 8 人","d":"2026-10-04","k":"paper","star":0,"sum":"审计编码 agent 轨迹发现失效的持久记录被复用导致失败与不安全修改。StateWise 在动作前用记录级反事实重规划找出决策关键记录，经可靠性检查、只读验证可观测事实、定向澄清开发者意图确认其有效性，带修复谱系地持久修正后重规划并做独立的状态–动作检查。150 个可执行用例上，损坏状态下正确率 93.3% 对基线 38.7%，零不安全动作","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-07","di":"2026-10-07","wi":null,"tier":"","tk":"动作前先列出「这一步依赖哪些存量记录」并逐条验证，而不是直接信任记忆。","col":"evo"},{"u":"https://arxiv.org/abs/2610.05162","t":"Memadapter: Counterfactual Adaptation Against Memory-induced Sycophancy","v":"arXiv","s":"Ruqing Ning 等 7 人","d":"2026-10-04","k":"paper","star":0,"sum":"正确的长期记忆也会让 agent 过度迎合用户的历史观点，过滤错误记忆不够。MemAdapter 用反事实推理暴露检索到的记忆的潜在风险，按当前任务反思校准每条记忆的影响，最后以证据为基础作答并保留记忆的合理影响；三个基准上一致提升记忆可靠性","brief":"","ana":"","hf":26,"topic":"自学习 / 自演进","first":"2026-10-07","di":"2026-10-07","wi":null,"tier":"","tk":"检索到的用户偏好记忆要按当前任务重新评估权重，不能直接当前提。","col":"evo"},{"u":"https://www.anthropic.com/news/cyber-verification-program","t":"Expanding the Cyber Verification Program","v":"Anthropic","s":"anthropic.com/news · Announcements","d":"2026-10-06","k":"release","star":0,"sum":"Project Glasswing 与 CVP 合并为三层：Defense Access（防御、取证、漏洞验证，预计多数防御组织可获批、数日内回复）、Red Team Access（加授权渗透与红队，仅限组织、数周审核，仍实时拦截勒索软件部署等）、Specialized Access（可测试飞控、电网、银行间转账等高风险系统，与美国政府联合逐家审查，现有 Glasswing 成员直接转入）。各层含 Opus 5.5、Sonnet 5.5、Mythos 5.1。效力测试：Opus 5.5 在 CyScenarioBench 10 个挑战各 5 次，无 CVP 全部首轮拦截，Defense 层 50 次拦 46 次、4 次成功，Red Team 层零拦截、完成 34 次，与无安全措施时 67.6% 的成功率一致。Glasswing 伙伴 4–7 月验证至少 12.9 万个漏洞，Anthropic 开源扫描另加 5,500 个，超 3.3 万个为高危或严重；参与需保留数据以监测滥用，EFS 今秋晚些上线后可存于自控云","brief":"","ana":"","hf":null,"topic":"Agent 安全与围堵","first":"2026-10-07","di":"2026-10-07","wi":null,"tier":"","tk":"安全分级不只写策略，要用同一评测在各层跑出拦截率来校验分类器；对外报告漏洞数时同时声明数据来源覆盖率与补丁率缺口。","col":"safety"},{"u":"https://openai.com/index/sharing-ai-progress-in-mathematics","t":"Sharing AI progress in mathematics","v":"OpenAI","s":"openai.com/index · Research","d":"2026-10-06","k":"release","star":0,"sum":"OpenAI 把内部前沿模型产出的一批新数学结果放到 GitHub 仓库发布，附论文修订与引用协议，做法参考了普林斯顿高等研究院的数学与 AI 咨询小组建议。仓库同时给出许多证明的 Lean 形式化、10 份模型推理过程摘要、按 ChatGPT Pro 用量折算的算力估计（平均每个结果约等于 3 小时 Pro 思考）和尝试题目数统计；OpenAI 将资助围绕这些结果的研讨会，并称正在负责任地推进该模型的发布。值得知道的是披露规范本身：结果、形式化验证、算力与尝试次数一起公开。","brief":"","ana":"","hf":null,"topic":"推理基础设施与建模","first":"2026-10-07","di":"2026-10-07","wi":null,"tier":"","tk":"","col":"infra"},{"u":"https://deepmind.google/blog/embeddinggemma-2-an-open-lightweight-multimodal-embedding-model","t":"EmbeddingGemma 2: an open, lightweight multimodal embedding model","v":"Google","s":"Google DeepMind · deepmind.google/blog · 同日 Google 开发者博客发开发指南与端侧检索教程","d":"2026-10-06","k":"release","star":0,"sum":"基于 Gemma 4 架构的 7.4 亿参数嵌入模型，Apache 2.0，把文本、代码、图像、视频、音频映射到同一向量空间；模块化设计下纯文本只需 2.7 亿参数，视觉、音频编码器各 1.7 亿与 3 亿可选；MRL 可把 768 维截到 128 维，存储最多省 6 倍；Pixel 11 Pro 上纯文本约 191MB 内存、全模态约 567MB；8K 上下文可放 5.5 分钟音频或 29 张图。MTEB Code 从上一代 68.76 升到 78.68，官方点名适合本地代码库索引与 coding agent 检索；上一代下载超 2,000 万","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-07","di":"2026-10-07","wi":null,"tier":"","tk":"本地代码检索或 agent 记忆检索可以用 2.7 亿参数的文本子模型并把向量截到 256 维，与 Gemma 4 共用分词器和音频编码器可降低总内存。","col":"evo"},{"u":"https://claude.com/blog/claude-now-works-in-google-docs-sheets-and-slides","t":"Claude now works with Google Docs, Sheets, and Slides","v":"Anthropic","s":"claude.com/blog","d":"2026-10-06","k":"release","star":0,"sum":"Claude for Google Workspace 在所有付费计划公测：侧栏插件可读当前文件与选区并直接修改；Docs 里小改原地做、大改以建议卡片呈现，Sheets 里可写公式、建数据透视表、把区域拉进 Python 处理后写回，Slides 里按原主题建新页并自检重叠与溢出。默认「改前询问」模式每次改动出审批卡，另有「全部接受」模式。登录后连接器、skill 与企业控制（Compliance API、CMEK、OpenTelemetry 审计导出）一并生效；另发 Docs/Sheets/Slides 连接器公测，可从 Claude 直接创建和编辑文件","brief":"","ana":"","hf":null,"topic":"Skill、上下文工程与工具","first":"2026-10-07","di":"2026-10-07","wi":null,"tier":"","tk":"对写操作 agent，默认提供「每次改动一张审批卡」加「全部接受」两档自主度，并让 agent 对自己的产出做可见性自检（重叠、溢出、难读）。","col":"skill"},{"u":"https://claude.com/blog/how-cresta-turned-cx-expertise-into-an-agent-builder-on-the-claude-agent-sdk","t":"How Cresta turned CX expertise into an agent builder on the Claude Agent SDK","v":"Anthropic","s":"claude.com/blog","d":"2026-10-05","k":"article","star":1,"sum":"客服 AI 公司 Cresta 用 Claude Agent SDK 做通用执行 harness，在上面叠加自家的对话数据、领域流程和评测，构建「造 agent 的 agent」Conductor：用户用自然语言描述需求，Conductor 从蓝图走到实现、评测和优化。它会从历史对话里判断哪些流程必须写死成确定性规则、哪些可以让模型灵活处理；每次构建的经验被整理成可共享的 memory 与 skill，形成团队级的经验飞轮。评测分四维：产出是否可用、执行路径是否用了正确工具和上下文、与参考答案相比的质量、耗时与模型用量；换新模型或改框架时用同一套任务和评分重跑。Cresta 称早期用例中首次部署时间约减半（厂商自述）","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-06","di":"2026-10-06","wi":null,"tier":"","tk":"评测 agent 时除了看结果，再加「执行路径」和「资源消耗」两个维度；把构建过程中发现的需求和边界情况直接转成回归测试，业务规则变化时一起更新。","col":"evo"},{"u":"https://arxiv.org/abs/2610.02616","t":"VERSE: Verified Self-Evolving Optimizer for Agent Harnesses","v":"arXiv","s":"Zekai Wang 等 9 人","d":"2026-10-02","k":"paper","star":1,"sum":"harness 优化器通常只改被优化 agent 的 prompt、工具和流程，自己的工具和步骤固定不变。本文让优化器也演化自身的诊断、编辑和测试方式。对照实验发现：没有基于执行的验证时，优化器自演化不提升效果；有验证时取得该实验最好结果。VERSE 让优化器在提交前测试草稿编辑、回放失败、扰动可疑步骤，并跨轮追踪修复与回退，优化器和执行器的权重都不动。四种优化器在留出的 SWE-rebench 上全部提升，最佳 harness 42.3%（基线 39.2%），五种语言的分布外任务 37.7%（基线 29.3%）","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-06","di":"2026-10-06","wi":null,"tier":"","tk":"自演进流程里给优化器配一个「提交前回放失败用例」的工具，并跨轮记录哪些修复引入了回退，没有执行证据的改动一律不合入。","col":"evo"},{"u":"https://arxiv.org/abs/2610.02994","t":"Sentry: Learning to Recover from LLM Agent Failures at Test Time","v":"arXiv","s":"Changxiu Ji 等 4 人","d":"2026-10-02","k":"paper","star":1,"sum":"研究失败经验应该怎样交给 agent。发现失败教训是条件性的：常驻上下文时，在对应失败没发生的场景里会误触发，从演化中的 playbook 删掉它们反而涨分。Sentry 是与 agent 并行的失败管理层：检测到失败时才从外部 playbook 检索匹配教训，在不看任务奖励的情况下验证 agent 是否恢复，只有恢复成功才写入新教训，整本 playbook 不进上下文。平均比最强运行时干预基线高 37%，比最强上下文演化基线高 39%，与上下文演化叠加还能再涨，教训可迁移到留出任务","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-06","di":"2026-10-06","wi":null,"tier":"","tk":"把 memory / skill 库分成「常态规则」和「出错时才查的教训」两层，后者挂在失败检测钩子上按需注入，写回前先确认这次恢复真的成功。","col":"evo"},{"u":"https://arxiv.org/abs/2610.03548","t":"Recursive Harness Self-Improvement for Frontier Reasoning Data Synthesis","v":"arXiv","s":"Wenlong Zhang 等 8 人","d":"2026-10-02","k":"paper","star":1,"sum":"合成越来越难的推理题时，以往只把生成的题目当种子递归，构造题目的 harness 不变。本文让任务与 harness 协同演化：生成过程中把求解器的中间失败转成可复用 skill（在线），每批之后修改 skill、prompt 和流程，只在「生成更难的有效题且成本增幅有界」时采纳（批后），权重和验证标准固定。数学、代码、科学三域经 14 轮演化，求解器平均准确率从 100% 降到 54.8%；两种更新节奏合用优于单独任一种或固定 harness。27B 学生模型用 1 万道合成数学题微调，APEX 上 mean-16 准确率 62.5%","brief":"","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-10-06","di":"2026-10-06","wi":null,"tier":"","tk":"自演进的采纳门槛写成「目标指标变好且成本增幅不超过阈值」的双条件，并把失败即时沉淀为 skill 与批后整体修订分成两个节奏。","col":"evo"},{"u":"https://arxiv.org/abs/2610.02826","t":"Scaling Trajectories for Complex Tasks through Recursive Self-Rewrite","v":"HF 组织 Tencent Hunyuan","s":"","d":"2026-10-02","k":"paper","star":1,"sum":"专用 harness 能解出更难的任务，但其中的干预在部署时不可用。RSR 用同一个 Qwen-3.8-27B 在多种 harness 下找成功解，再改写成通用 harness 下的训练轨迹：规划器把过程提炼成 runbook，评审器筛掉验证器或答案泄露并引导递归修订，执行器在全新沙箱里按 runbook 重跑。约 3 千个自建终端任务上，三种 harness 合计解出 759 个，比最强单一 harness 多 34.3%；2,001 条源轨迹扩成 11,094 条用于 SFT。相比基座，Terminal-Bench 2 的 pass@3 从 57.0% 升到 74.2%，Terminal-Bench 4 从 1.5% 到 9.1%","brief":"","ana":"","hf":78,"topic":"自学习 / 自演进","first":"2026-10-06","di":"2026-10-06","wi":null,"tier":"","tk":"多 harness 跑出的成功经验先提炼成 runbook、
