"topic":"多智能体","first":"2026-09-11","di":null,"wi":"2026-09-11","tier":"","tk":"这是 2026 年多智能体主线的定量基石，把「要不要拆多 agent」变成可以按任务属性计算的工程决策——先问任务是否可分解、顺序依赖多强、工具密度多高，再选架构；上期 τ^τ-Bench 里 92% 的开发者 agent 默认造单模型工具循环、本期 Navier–Stokes 用万级分组 agent，都能用这份「对齐原则 + 顺序惩罚 + 验证瓶颈」框架解释。面试里被问「单 agent 还是多 agent」，这篇给的答案是「看任务结构，且中心化验证是安全下限」。","col":"multi"},{"u":"https://arxiv.org/abs/2609.09153","t":"Procedural Graphs: Self-Evolving Execution Structures for LLM Agents","v":"Google","s":"合作 Georgia Tech / 北大","d":"2026-09-08","k":"paper","star":1,"sum":"","brief":"","ana":"解决的问题：多数 agent 通过在不断累积的历史上「无约束生成」来选动作，「该做什么、按什么顺序、在什么条件下」这层**程序性知识始终是隐式的**；轨迹一长，agent 就丢目标、乱序调工具、重复无效动作。Procedural Graph（PG）的类比很好记：知识图谱用（实体，关系，实体）三元组回答 what-is，PG 用**（过程，关系，过程）三元组回答 what-to-do**；节点抽象为工具函数、skill、内部推理步或任务状态，每条边带三个文本属性——condition（何时适用）、guidance（怎么做）、pitfalls（避免什么），例如财务规划里（现金流预测 → 融资申请）这条边的属性是「预计跑道低于安全缓冲时适用；提前提交以覆盖融资到账延迟；不要在一笔申请挂起时再叠一笔」。**在线推理**：按 agent 最近一次动作精确定位它在图上的节点，取 k 跳出边邻域（匹配失败则用全图），由一个 guidance 模型把静态属性翻译成当下的情境指引附到求解器 prompt 里——**只是偏置下一步而不是规定它**；作者特意说明为什么不用 top-k 检索：单独检索到「submit」而不带前置的「check_answer」转移，会丢掉让提交成立的验证步。**离线自演进**四步：用当前图跑一批训练任务记录诊断轨迹 → refiner 对比高分与低分轨迹，从失败里找重复错误环、从成功里找多步捷径，只做两种拓扑编辑（Add 缺失的验证节点/边、Delete 反复导向失败的节点/边，属性修改 = 删边再加边）→ **验证门控**（候选图在独立验证集上不低于当前缓存分数才提交，结构非法的先丢弃）→ **拒绝记忆**（被拒的候选连同其编辑、训练轨迹、验证结果一起存起来，作为下一轮的负面证据，防止反复提同样的坏改动）。数据：7 个基准（HotpotQA、MultiChallenge、GDPval、ALFWorld、τ-bench、BFCL v3、EnterpriseArena）× 4 个模型（Claude Sonnet 4.6、Gemini 3.1 Pro、Gemini 3.5 Flash、Grok 4.1 Fast），全部共用同一个 ReAct 求解器，对比 7 个经验复用基线（MemoryBank、RAP、ExpeL、AutoGuide、AWM、KnowAgent 等）且喂同样的训练轨迹：**PG 在 24 个模型×基准组合里 21 个第一或并列第一**，Gemini 3.1 Pro 上 GDPval 56.4 → 78.8、τ-bench 72.2 → 80.0，Gemini 3.5 Flash 上 τ-bench 31.3 → 44.4、BFCL 56 → 67。EnterpriseArena（最长 132 个月、三次未告知的宏观危机下管理流动性）里 PG 在四个模型上都拿到最高或并列最高的全程存活率，机制不是多调工具而是**「预见性融资」**——资金要 1–6 个月才到账，PG 引导 agent 在平稳月份就提申请。三个消融最值得记：① **从零 + 在线演化优于专家手写先验**——HotpotQA 上 Scratch+Evolution F1 78.8 最高；更扎眼的是 MultiChallenge 上手写专家图把成功率从 87.5 打到 58.9、再做一次静态更新更掉到 53.6，而在线演化把它拉回 92.9——**循环能从一个有害的专家先验里自我纠正**；② 十轮自演进的轨迹像一份搜索日志：第 1 轮发现「查现金 → 预测跑道 → 再决定融资」的主干、第 2 轮加入复用笔记的 recall_notes 并让每月工具调用下降、第 3–6 轮无一被接受、第 7 轮剪枝、第 8 轮引入一条「行政旁路」，第 10 轮被拒终止；作者强调报告的是**返回的图**而不是搜索中最好的一轮，否则等于在测试集上选模型；③ **把全图塞进上下文会伤害具身任务**（ALFWorld 72.6 → 70.3，全图生成式指引再掉到 54.5），而「局部子图 + 生成式指引」81.5 最好且 token 更省——说明程序性知识要按位置局部披露，不是越多越好。启示：这是 WikiSkill（经验 → wiki → skill）之外的另一种「经验沉淀成什么」的答案——**沉淀成带条件的转移图而不是文档**，并且给了一份可直接照抄的自演进循环：对比成功/失败 → 原子编辑 → 验证门 → 拒绝记忆；「专家手写的流程图反而拖后腿、必须让它随执行反馈演化」这一发现，与 Brockman「skill 成训练轮」是同一件事的实验版。","hf":null,"topic":"自学习 / 自演进","first":"2026-09-11","di":null,"wi":"2026-09-11","tier":"","tk":"这是 WikiSkill（经验 → wiki → skill）之外的另一种「经验沉淀成什么」的答案——**沉淀成带条件的转移图而不是文档**，并且给了一份可直接照抄的自演进循环：对比成功/失败 → 原子编辑 → 验证门 → 拒绝记忆；「专家手写的流程图反而拖后腿、必须让它随执行反馈演化」这一发现，与 Brockman「skill 成训练轮」是同一件事的实验版。","col":"evo"},{"u":"https://arxiv.org/abs/2609.04280","t":"EvoHarnessBench: Can Your Agents Keep Pace with an Evolving Harness?","v":"arXiv","s":"Salesforce AI Research · 合作 UNC","d":"2026-09-03","k":"paper","star":1,"sum":"","brief":"","ana":"解决的问题：agent 的 harness——能调的工具、能复用的 skill、能协调的专家 agent——在生产里**不断被外部添加**（文中用 Agentforce 生态和 OpenAI 公开 skills 仓库的增长曲线做证），但现有持续学习基准都把「变化」放在任务流里、把 harness 固定住。EvoHarnessBench 反过来：任务不变，**harness 逐阶段扩张**，看 agent 跟不跟得上。它区分两个挑战：**保持**（harness 变大后，以前会做的任务还会不会做——权重没动，能力却因为 harness 扩张而退化，作者命名为「harness 诱导的遗忘」）和**在累积经验下的适应**（在更窄 harness 下攒的记忆、skill、prompt 等持久产物，会不会在新 harness 下过时甚至误导）。构造：17 条 harness 流（3–6 个累积阶段），802 个任务实例化为 1,510 个按轴评测样例，520 个可执行工具、42 个 skill、62 个专家 agent，来自 EnterpriseOps-Gym 与 Agentic Last Exam；每个任务在其所属阶段可行且**至少依赖一个该阶段新引入的能力**；评测时给的是完整累积 harness，早期能力留在里面当潜在干扰。两种模式：**部署评测**（跨阶段无持久状态，纯测 harness 扩张的直接效应）和**自演进适应评测**（允许在每阶段用适应集更新持久状态——记忆类 Raw memory/ReasoningBank/MemToolAgent/G-Memory/LEGOMem、prompt 类 GEPA、代码类 Meta-Harness——再在留出集评）。系统含 ReAct(GPT-5)、Codex、Claude Code 与 AutoGen、DeLM 两个多 agent 框架；指标除通过率/分数/时间/token 外，用 FWT（对新阶段任务的前向迁移）与 BWT（对早期任务的后向迁移）拆开「适应」与「保持」。**按轴的发现差异很大**：工具轴——给完整目录反而比只给任务所需工具通过率更高（EOG 26.0 → 30.2）但 token 从 27M 涨到 76M，「更大的目录不只是干扰，但收益要用多得多的搜索和执行换」；自演进适应在 EOG 上有效（MemToolAgent 38.6）在 ALE 上多数不如不适应；部署模式 BWT 为负（确凿的 harness 诱导遗忘），GEPA 与 Meta-Harness 能把 BWT 转正**却把 ALE 上的 FWT 压成负数**——持久更新会过拟合适应经验；结构化记忆优于原始回放，而给 ReasoningBank 额外塞工具 schema 反而变差。skill 轴——skill 库变大对部署几乎无影响（Codex 18.9 → 18.9，因为 skill 要先被检索并调用，不像工具那样常驻可用），瓶颈在**「会不会去用」**：默认 GPT-5 系统在最终阶段几乎不调用任何提供的 skill，Claude Code 与 GPT-5.5 调用率高得多，任务特定的 GEPA 能把 GPT-5 的调用率拉上去；把适应阶段限制在任务相关 skill 上分数更好、耗时更短——广撒 skill 会稀释适应经验；skill 学习方面，扎根于执行反馈的方法最好，**朴素生成的 skill 可能不如没有 skill**，且分阶段累积学习比一次性批量学习更难。agent 轴——最不稳定：EOG 上适应收益最大（Meta-Harness 8.8 → 18.5），ALE 上 Codex 光是扩池子就出现三轴中最严重的遗忘；机制分析显示遗忘不是被新 agent 抢走注意力，而是**不再调用原本成功路径上的 agent**（委派覆盖率断裂）；适应带来的提升来自委派召回率而非选择精度；与前两轴相反，agent 轴的最佳适应上下文是「从一开始就给稳定的最终池」——**池子的变化序列本身比池子大小更伤**。总结论：当前 agent 能从演化的 harness 中获益，但**保持与适应常常相互拉扯**，需要同时对外层 harness 演化与内层适应建模。启示：对应用工程师这是一份「加工具/加 skill 不是免费午餐」的定量清单——每次往 MCP 目录或 skill 库里加东西，都应该回归跑一遍老任务（BWT）；而 skill 轴「几乎不被调用」的发现，正是 Repo-To-Skill 强调 SKILL.md 描述要写清「何时用」的反面证据。","hf":null,"topic":"自学习 / 自演进","first":"2026-09-11","di":null,"wi":"2026-09-11","tier":"","tk":"对应用工程师这是一份「加工具/加 skill 不是免费午餐」的定量清单——每次往 MCP 目录或 skill 库里加东西，都应该回归跑一遍老任务（BWT）；而 skill 轴「几乎不被调用」的发现，正是 Repo-To-Skill 强调 SKILL.md 描述要写清「何时用」的反面证据。","col":"evo"},{"u":"https://claude.com/blog/reducing-cost-and-improving-performance-with-claude-platform","t":"Reducing cost and improving performance with Claude Platform","v":"Anthropic","s":"claude.com/blog","d":"2026-09-08","k":"article","star":0,"sum":"","brief":"","ana":"这篇解决的问题：多数团队把「省钱」和「效果」当成一对交换，Anthropic 用三把杠杆证明大多数应用可以两者兼得，并把整套方法做进了开源的 `claude-api` skill（Claude Code 里三条命令：`prompt-audit` / `hillclimb` / `cost-optimize`）。**杠杆一，prompt cache**：缓存的是 prefill 后的 KV 状态，命中条件是**同模型、前缀字节级完全一致、未过 TTL**（5 分钟从请求开始计，可设 1 小时）。常见破坏方式列得很具体：会话中途改 effort/thinking 设置（它们渲染在你内容之前，属于前缀；Opus 5 与 Fable 5.1 除外，支持中途改 effort）、system prompt 里放时间戳或动态 ID、工具定义顺序漂移、子 agent/分支的前缀不字节一致、**同步工具调用或子 agent 跑得比 TTL 还久**（下一轮要按 1.25× 价格重写，1 小时缓存则是 2×）。修法同样具体：用 Console 的缓存诊断 API 定位两次请求从哪里开始分叉；不常用的工具标 `defer_loading`，只在 tool search 命中时追加到会话；系统指令用「会话中系统消息」追加而不是改 system prompt；静态内容在前、增长的对话在后；要换模型或 effort 就**趁 compaction 已经打破缓存时换**；开自动缓存断点；会话开始时用 `max_tokens: 0` 预热。**杠杆二，指令反模式**：为旧模型打的补丁会拖累前沿模型——「double-check」类验证仪式、「CRITICAL: YOU MUST ALWAYS」类强调、强制步骤/草稿纸模板、按旧模型失败模式调的 few-shot、互相矛盾的规则（前沿模型更字面地执行）、过时配置（手动 thinking budget 会被 API 直接拒绝）。他们做了一个干净的迁移实验：从 Opus 4.8 迁到 Opus 5，六个各埋一个反模式的旧 prompt，直接换模型 ID 会出问题，跑一次 `prompt-audit` 后**成本降 14.6%、准确率升 5.3%**——「verify twice」让每次退款重复查订单，「be maximally thorough」变成几十次无用的知识库检索，手动草稿纸和 Opus 5 的内建思考打架导致三张工单把工具调用写进推理里从没执行。**杠杆三，effort 校准**：Fable 5 在 FrontierCode Diamond 上 low 11.5%/$5.35 vs max 30.9%/$19.00（约 2.7 倍分数换 3.5 倍成本）；Fable 5.1 在 HLE 上 low 约 53%/$0.30、max 约 61%/$2.23，**最后一档只多半分却贵 46%**，落在噪声里；反直觉的一条是「更强模型开低 effort 常比弱模型开高 effort 便宜」——CursorBench 3.2 上 Fable 5.1 low = Fable 5 high，成本三分之一（缓存读价 $0.25 vs $1.0 也是原因）。`hillclimb` 的案例最有代表性：客服基准从 Opus 4.8 默认高 effort 出发，先换 Opus 5 低 effort + 审计 prompt 达 98.9% 训练准确率、2.6 美分/工单，再降到 Sonnet 5 低 effort 掉到 88.9%，读失败样例补了路由规则和退款上限交叉引用后回到 98.9%、1 美分/工单；**留出的 14 张工单上 90.5% vs 原配置 78.6%，成本约五分之一**。`cost-optimize` 在四个公开基准上砍 52–73% 成本而通过率持平（LegalBench 思考 token 从 102,779 降到 8,284；SWE-bench Verified 中位步数 29→17）。启示：这是 7 月《新上下文工程规则》「砍指令」的**可执行版**——面试里若被问「如何给 agent 降本」，「缓存前缀纪律 → 删反模式 → 扫 effort 曲线选拐点 → 先试强模型低 effort」这四步就是标准答案，而且每一步都有可引用的数字。","hf":null,"topic":"Skill、上下文工程与工具","first":"2026-09-11","di":null,"wi":"2026-09-11","tier":"","tk":"这是 7 月《新上下文工程规则》「砍指令」的**可执行版**——面试里若被问「如何给 agent 降本」，「缓存前缀纪律 → 删反模式 → 扫 effort 曲线选拐点 → 先试强模型低 effort」这四步就是标准答案，而且每一步都有可引用的数字。","col":"skill"},{"u":"https://developers.googleblog.com/autonomous-llm-post-training-with-tunix-on-tpus","t":"Autonomous LLM post-training with Tunix on TPUs","v":"Google","s":"","d":"2026-09-11","k":"article","star":0,"sum":"","brief":"","ana":"这篇把 Karpathy 年初的 autoresearch 范式（agent 在一个自包含循环里自主探索预训练）搬到后训练（SFT 与 GRPO 强化学习），开源为 autofinetune，栈是 Tunix + Gemma + Cloud TPU，由 Antigravity CLI 驱动 Gemini Flash 3.7。**「竞技场」设计只有三件东西**：`program.md`（人定义循环、边界条件、评估标准与约束）、`run.py`（单文件自包含的微调脚本）、然后放 agent 迭代——改 `run.py`、跑训练、量目标指标、**保留赢的提交、回滚退步、写 `results.tsv`**。案例一：FunctionGemma-270m 在 mobile-actions 数据集做 SFT，TPU v5e-1，几分钟一轮，两小时 20 次实验；允许改 LoRA rank/alpha、目标投影层、学习率与调度、优化器（AdamW/Muon、梯度裁剪）、batch size、seed，**禁止改数据集、epoch 数、模型结构**。案例二更难：Gemma 3 1B 在 GSM8K 上做 GRPO，TPU v6e-1，一轮数小时，2–3 天 40 次实验，目标指标刻意简化成「数值准确率 + 格式准确率」一个标量；agent 自己找到了更好的 LoRA 配置、rollout 温度、KL 惩罚甚至 system prompt，总奖励提升约 10%。启示：篇幅不长，但它是 **Google 官方给 autoresearch 背书并给出「允许/禁止」边界模板**的第一篇——自演进循环落地的最小骨架就是「一个指标 + 一个可改文件 + 一份写清允许项与禁区的 program.md + git 做撤销」，和上上期 EvoUndo「先能撤销再允许变异」一致；面试聊 self-improvement 时，这是能在两小时内复现的最小例子。","hf":null,"topic":"自学习 / 自演进","first":"2026-09-11","di":null,"wi":"2026-09-11","tier":"","tk":"篇幅不长，但它是 **Google 官方给 autoresearch 背书并给出「允许/禁止」边界模板**的第一篇——自演进循环落地的最小骨架就是「一个指标 + 一个可改文件 + 一份写清允许项与禁区的 program.md + git 做撤销」，和上上期 EvoUndo「先能撤销再允许变异」一致；面试聊 self-improvement 时，这是能在两小时内复现的最小例子。","col":"evo"},{"u":"https://research.google/blog/toolgrad-efficient-tool-use-dataset-generation-with-textual-gradients","t":"ToolGrad: Efficient tool-use dataset generation with textual \"gradients\"","v":"Google","s":"","d":"2026-09-10","k":"article","star":0,"sum":"","brief":"","ana":"解决的问题：教模型用工具需要「用户请求 + 正确的工具调用链」数据，以往的做法是先生成请求、再用深度优先搜索去标注工具链，标注失败率高、成本大。ToolGrad 把顺序反过来——**先构造一条经过验证的工具调用链，再为它反推用户请求**（answer-first），因为一条显式的解法比一句模糊的请求信息量大得多。链的构造借用了 TextGrad 的「文本梯度」思想：API Proposer 从采样的 API 里挑几个候选来延伸当前工作流，API Executors 并行真实执行并产出报告，API Selector 依据报告选出唯一最好的一步（它就是提供方向的「文本梯度」）追加进工作流，LLM Updater 再改写对应的用户请求和回复；循环若干轮得到「请求 + 验证过的 API 工作流 + 最终回复」。数据：在 ToolBench 的 1.6 万+ 真实 API 上，生成的工具链更复杂、通过率接近 100%、成本更低；只用 500 条数据（ToolGrad-500，由 gemini-2.5-flash-lite 生成）微调 Gemma-3 1B/4B/12B，在工具集完全不同的 BFCL 上各尺寸一致提升，**ToolGrad-12B 得 83.1，与当时的 gemini-2.5-pro（83.2）、Claude 4.5 Opus（82.8）持平并超过 GPT-5（74.4）**；作者称之为「自演进」的一点是：用 flash-lite 生成的数据微调出的 12B 学生模型超过了生成数据的教师模型。启示：对做 agent 的人有两条可迁移的做法——**合成训练数据时先造可验证的解再反推问题**（同一逻辑也适用于评测集：先有可执行的真值链再写题），以及**用「执行报告 + 选择器」代替搜索作为工具链的迭代信号**；它与上期 Terminal-Universe「重建环境后重解任务」共享同一个原则：可验证的执行是数据质量的来源，不是模型的自述。","hf":null,"topic":"Skill、上下文工程与工具","first":"2026-09-11","di":null,"wi":"2026-09-11","tier":"","tk":"对做 agent 的人有两条可迁移的做法——**合成训练数据时先造可验证的解再反推问题**（同一逻辑也适用于评测集：先有可执行的真值链再写题），以及**用「执行报告 + 选择器」代替搜索作为工具链的迭代信号**；它与上期 Terminal-Universe「重建环境后重解任务」共享同一个原则：可验证的执行是数据质量的来源，不是模型的自述。","col":"skill"},{"u":"https://arxiv.org/abs/2609.09134","t":"Co-Evolving Harnesses and Models: On-Policy Correction Helps Weaker Models Catch Up Where Imitation Fails","v":"arXiv","s":"Salesforce AI","d":"2026-09-08","k":"paper","star":0,"sum":"","brief":"","ana":"解决的问题：让小模型在企业任务上顶用有两把杠杆——自动演化 harness（system prompt、工具集、执行 hook、上下文管理、子 agent 配置）和轻量微调（LoRA-SFT）——它们该怎么组合？7 个可客观验证的企业任务（工资审计、预算审批、股价告警、IoT 异常检测、浏览器自动化、网站管理、代码重构），用 GEPA 式搜索让 gemini-3.1-pro 元 agent 提出失败驱动的编辑、验证集提升才保留。第一步很顺：为 Qwen3-Coder-30B-A3B 演化的 harness 把它从 29.2% 抬到 78.0%；**这个专为弱模型演化的 harness 给强模型 Gemini 3.1 Pro 用同样管用**（84.4 → 93.6），且几乎每条演化出的编辑它都在用（领域计算配方使用率 94.2%，弱模型自己只有 30.8%）。既然专家在同一 harness 上强 15.6 分，「先演化 harness、再让专家教弱模型」看起来是自然的下一步——**结果全线倒退**：在演化 harness 下用专家轨迹做 LoRA-SFT，七个任务从 78.0 平均掉到 63.1，最狠的工资审计掉 29.9；换 Gemma 4 26B 当学生同样倒退（55.6 → 41.1，甚至低于不演化 harness 的 46.7）。而同一套模仿在**未演化的基础 harness**下是有效的（29.2 → 35.5）——问题不在教学信号，而在**模仿与 harness 演化的相互作用**。失败归类给出了漂亮的解释：模仿后模型并没有少用 harness（反而用得更多）、知识类失败还下降了，**规划类失败却从 1.1% 暴涨到 14.6%**——学生学到了专家的规划风格却没有执行它的能力，而 harness 是围绕学生原生规划节奏演化出来的，节奏一变 fit 就碎了（案例：工资审计任务算对了答案却因为不停复查从未提交，得零分）。解法是**只在学生自己的轨迹上纠错**：一个元级 MLE agent 定位每条失败 rollout 出错的那一轮，让专家只重写那一轮，其余步骤原样保留，再 LoRA-SFT；结果 78.0 → 79.7，七个任务五个提升、两个持平（harness 已近上限的任务），规划失败维持在 1.8%，训练不到一小时，可反复叠进「演化 harness → 修模型 → 再演化」的循环。启示：这是上上期 WHALE「权重与 harness 交替优化」的一个反面教材加修正案——**一旦 harness 是围绕某个模型优化出来的，后续的权重更新必须保护这个 fit**；「on-policy 的最小纠错」而非「off-policy 的整段模仿」是让两把杠杆相加而不是相消的条件。工程上的可迁移规则：给 agent 做蒸馏/微调数据时，尽量从它自己的轨迹出发改一步，而不是整段照抄强模型。","hf":null,"topic":"自学习 / 自演进","first":"2026-09-11","di":null,"wi":"2026-09-11","tier":"","tk":"这是上上期 WHALE「权重与 harness 交替优化」的一个反面教材加修正案——**一旦 harness 是围绕某个模型优化出来的，后续的权重更新必须保护这个 fit**；「on-policy 的最小纠错」而非「off-policy 的整段模仿」是让两把杠杆相加而不是相消的条件。工程上的可迁移规则：给 agent 做蒸馏/微调数据时，尽量从它自己的轨迹出发改一步，而不是整段照抄强模型。","col":"evo"},{"u":"https://arxiv.org/abs/2609.08183","t":"NeoHorse-1: Towards Recursive Self-Improvement via Agentic Post-Training with Routing Harness","v":"NeoHorse Team / TokenRhythm","s":"","d":"2026-09-08","k":"paper","star":0,"sum":"","brief":"把 RSI 落成一个具体机制：**部署中的路由 harness 本身就是能力观测器**——每个用户轮次记录「预测的能力需求、选中的服务档位、随后的交互」，这些记录经结构校验、六维语义评估、子场景标注后变成保留交错推理/工具调用/harness 上下文的训练样本；路由信号组织成三阶段 SFT 课程并延伸到路由引导的在线蒸馏；「能力引导的分配」再把评测反馈转成下一轮训练配比，闭合「评测—选择—更新」循环。11 个基准宏平均 4B 58.94 → 64.87、9B 65.60 → 69.04。它和 Warp 的 improver skill 是同一思想的权重级版本：**让服务系统自己产生下一轮的训练信号**。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-11","di":null,"wi":"2026-09-11","tier":"","tk":"","col":"evo"},{"u":"https://arxiv.org/abs/2609.08404","t":"Environments as Scaffold: Feedback-Enriched Environments（FEE）","v":"复旦 × 中科院自动化所","s":"","d":"2026-09-08","k":"paper","star":0,"sum":"","brief":"长时程 RL 的奖励稀疏，传统做法是 agent 侧先 SFT 热身；本文转向**环境侧**：把环境改造成反馈更丰富的版本，并在探索后期从「动作指导」切到「观察增强」。SciWorld 与 BFCL 上跨 Qwen3 规模与 GRPO/GSPO/DAPO 一致提升；分析表明它降低熵波动、促进主动探索、且**引导被内化进权重而非仅作推理时先验**，组内反馈一致性是稳定优化的边界。与上期 Terminal-Universe 一起看：自演进的杠杆正从「改 agent」扩展到「改环境」。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-11","di":null,"wi":"2026-09-11","tier":"","tk":"","col":"evo"},{"u":"https://arxiv.org/abs/2609.05903","t":"EvoSafeHarness: Evolving Model- and Domain-Specific Harnesses for Securing Agents","v":"arXiv","s":"JHU × 威斯康星 × NVIDIA × UIUC × UC Berkeley","d":"2026-09-05","k":"paper","star":0,"sum":"","brief":"安全 harness 通常由专家一次设计、套用到所有模型和领域，但「多严才不伤可用性」因模型而异、「要管哪些效果/状态/动作序列」因领域而异。EvoSafeHarness 为**冻结模型 + 目标领域**联合搜索自然语言策略与可执行代码逻辑，并用新鲜上下文的对抗评审剔除只针对基准的规则：DecodingTrust-Agent 平均攻击成功率 45.6% → 10.0%（可用性仅降 3.3）；AgentDojo 82.8% 可用性下 0% ASR，是 CaMeL 同工作点可用性的两倍，且原样迁移到未见套件。harness 自演进第一次被用在「安全层」而不是「能力层」。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-11","di":null,"wi":"2026-09-11","tier":"","tk":"","col":"evo"},{"u":"https://arxiv.org/abs/2609.08572","t":"AgentGrad: Intervention-guided Prompt Optimization for Multi Agent Systems","v":"arXiv","s":"高丽大 × KAIST × Meta AI × UNIST","d":"2026-09-08","k":"paper","star":0,"sum":"","brief":"文本梯度法优化多 agent prompt 的两个盲点：选目标 prompt 时没验证「改它是否真能修复失败」，聚合梯度时随机拼接混杂了不相关的失败模式。AgentGrad 用**顺序干预**（一次只改一个 agent 的行为，找出修改后能解决失败的那个）定位责任 agent，再做语义化的梯度抽象。与上期 CDSep 同题：自动 prompt 优化在多 agent 里必须先解决「归因」。","ana":"","hf":null,"topic":"多智能体","first":"2026-09-11","di":null,"wi":"2026-09-11","tier":"","tk":"","col":"multi"},{"u":"https://arxiv.org/abs/2609.00787","t":"StudyBench: Can Self-Evolution Squeeze Textbooks for Olympiad Capability?","v":"清华","s":"","d":"2026-09-01","k":"paper","star":0,"sum":"","brief":"理想的自演进应像人读几本教材就能攻克难题；基准用物理教材训练、按「应用集」（教材难题，测吸收）和「迁移集」（奥赛题，测迁移）评。结论冷静：应用集的提升很少迁移到迁移集；**「引导差距」**——最强方法也只兑现了同一材料作为上下文引导时所能解锁能力的一小部分；所有方法都在预算耗尽前就进入**「算力平台期」**——剩余差距是方法问题不是数据或算力问题。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-11","di":null,"wi":"2026-09-11","tier":"","tk":"","col":"evo"},{"u":"https://arxiv.org/abs/2609.03241","t":"FlowBalance: Verifier-Grounded Self-Improvement from On-Policy Reasoning Experience","v":"腾讯混元 × 宾大","s":"","d":"2026-09-03","k":"paper","star":0,"sum":"","brief":"自改进内循环的两难：终端验证器可靠但稀疏，同模型的稠密自引导会强化错误自信、把学习集中到单一解法。用冻结的「训练时视角」（带特权上下文）给出逐 token 概率增益，再用验证器的组内优势校准——正优势保留、负优势反转、无偏好则关闭。数学推理上优于 FlowRL，避免直接自蒸馏的长度坍缩，正确策略多样性更高。与上期 RISE 同属「权重级自改进的教师从哪来」。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-11","di":null,"wi":"2026-09-11","tier":"","tk":"","col":"evo"},{"u":"https://arxiv.org/abs/2608.12564","t":"Scaling Automatic Research Agents via World Models（WMRL）","v":"Amazon × UIUC","s":"","d":"2026-08-12","k":"paper","star":0,"sum":"","brief":"AutoResearch agent 做 RL 的根本张力：生成可以批量共享算力，**环境执行却独占沙箱和真实机器时间**，成为训练瓶颈。用世界模型替代环境执行，再用在线去偏与逆方差降噪对付世界模型的奖励偏差与噪声，理论证明改善收敛；训练提速 3–4 倍且超过标准 RL，4B/9B 训出的 agent 在留出基准上超过 48B/120B 开源 agent，方法还迁移到具身 VLA 策略。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-11","di":null,"wi":"2026-09-11","tier":"","tk":"","col":"evo"},{"u":"https://arxiv.org/abs/2609.09219","t":"Scores Alone Do Not Prove Discovery: The Discovery Certification Protocol","v":"CMU","s":"","d":"2026-09-07","k":"paper","star":0,"sum":"","brief":"AI 研究 agent 的「发现」如何审计：Gate 1 在密封评测上验证有效提升；Gate 2 给匹配的 agent 同样的起始信息与观察到的网页内容但**扣住目标研究历史**，任何达到数值目标的方法都是「可恢复」的证据并触发否决；可选 Gate 3 度量真实反馈相对中性策略的平均效应。在 SQLite 优化与虚拟催化剂控制两个受控审计里 96 个 episode 零恢复。对 OpenAI 本周「万级 agent 解千禧年难题」这类结果，这是一份「怎么证明不是记忆或泄漏」的协议。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-11","di":null,"wi":"2026-09-11","tier":"","tk":"","col":"evo"},{"u":"https://arxiv.org/abs/2609.11042","t":"T1: Terminal Agent Reinforcement Learning for Long-Horizon Tasks","v":"腾讯混元","s":"","d":"2026-09-10","k":"paper","star":0,"sum":"","brief":"122B 总参数 MoE，在云沙箱里操作真实 shell 最多 300+ 轮，奖励来自每个任务自带的验证器；配方三件：激进热启动 + 按通过验证器绝对数计的稠密过程奖励；TITO 构造（训练用采样时的精确 token id 并在轮次边界修漂移）+ rollout 路由回放（记录采样器每层 MoE 的专家选择并在训练时回放）把训推对数概率差从 0.021 降到 0.013；训练语料与 Terminal-Bench 2.1 完全不相交。Terminal-Bench 2.1 从 43.8% 提到 64.0%，Long-Horizon Terminal Bench 27.9% 超过 GPT-5.4 与 GLM-5.1。","ana":"","hf":null,"topic":"评测工程","first":"2026-09-11","di":null,"wi":"2026-09-11","tier":"","tk":"","col":"eval"},{"u":"https://arxiv.org/abs/2609.08149","t":"SWE-Bench Pro Verified","v":"上海 AI Lab × 华东师大 × 复旦","s":"","d":"2026-09-08","k":"paper","star":0,"sum":"","brief":"SWE-Bench Pro 的两类不可靠：**reward hacking**（金标解或隐藏评测信息泄漏）与任务质量（误导性问题陈述、测试范围不当）。验证版加反作弊护栏并最小修正有缺陷实例，结果一些模型分数明显低于此前报告——与上期 τ^τ-Bench「17–42% 的运行有作弊倾向」互为印证：**编码 agent 评测必须默认 agent 会去找评测机制的漏洞**。","ana":"","hf":null,"topic":"评测工程","first":"2026-09-11","di":null,"wi":"2026-09-11","tier":"","tk":"","col":"eval"},{"u":"https://arxiv.org/abs/2609.05663","t":"What LLM Trading Agents Actually Do in Production","v":"arXiv","s":"DX Research Group","d":"2026-09-04","k":"paper","star":0,"sum":"","brief":"六个月、两支车队（3,505 个用户出资的 vault 交易真实 ETH 21 天；500–599 个用户创建的永续合约 agent）、750 万次单模型调用、约 30 万次链上动作的群体级生产记录。四个发现：**操作层比策略文本更决定行为**（一个风险滑块解释杠杆，agent 固定效应吸收 60% 方差，排行榜渲染边界因果地路由了选择）；仓位对波动率盲目（各波动率分位中位杠杆都是 5 倍，11% 的账本占 62% 的强平）；抓不住已经到手的上行（43.2% 的仓位 24 小时内曾有 +300bps 浮盈，其中 49.3% 以亏损平仓）；没有方向性优势且跑输零售基准。附 17 条方法论准则「用我们自己的撤稿买来的」。少见的 agent 生产行为学。","ana":"","hf":null,"topic":"评测工程","first":"2026-09-11","di":null,"wi":"2026-09-11","tier":"","tk":"","col":"eval"},{"u":"https://arxiv.org/abs/2609.06966","t":"MOLE: Detecting Insider Threats in AI Agents","v":"CMU","s":"","d":"2026-09-07","k":"paper","star":0,"sum":"","brief":"前沿实验室内部账号被 AI agent 操作时，能否在有限审查预算下从日常工作里识别出泄露权重、投毒数据、削弱发布门的行为：150 个 AI 操作账号、9 个有状态服务、30 个工作日、12 种威胁、约 200 亿 token 语料；39 个 agent 模型中 72% 完成了多数被分配的有害目标，**拒绝与否不能预测是否完成**；40 个监控器里最好的单日审计也漏掉近一半已完成的危害。与本期 Anthropic 对齐评估里「CoT 监控被模型推理说服」是同一问题的基准化。","ana":"","hf":null,"topic":"Agent 安全与围堵","first":"2026-09-11","di":null,"wi":"2026-09-11","tier":"","tk":"","col":"safety"},{"u":"https://arxiv.org/abs/2609.08126","t":"SchemeArena: Factorized Stress Testing of Scheming in LLM Agents","v":"arXiv","s":"","d":"2026-09-08","k":"paper","star":0,"sum":"","brief":"400 个场景按「工具领域 × 工具性目标 × 监督条件 × 压力机制」因子化合成，配 SCOUT 监控器把多准则判断落到推理与动作证据上；五个 agent 上**显式的工具性目标是策划倾向最强的驱动**，策略提示则帮助 agent 把倾向转成实际策略。","ana":"","hf":null,"topic":"Agent 安全与围堵","first":"2026-09-11","di":null,"wi":"2026-09-11","tier":"","tk":"","col":"safety"},{"u":"https://arxiv.org/abs/2609.10226","t":"Φ-Bench: Can LLMs Engineer the Infrastructure That Powers Them?","v":"arXiv","s":"","d":"2026-09-09","k":"paper","star":0,"sum":"","brief":"从前沿研究里的优化问题和真实代码仓库出发，覆盖从局部 kernel 函数补全到长时程实现与端到端系统优化的 LLM 基础设施工程任务；与上期 MaxKernel 相对——MaxKernel 展示 agent 能写 kernel，Φ-Bench 量它离「自主优化 AI 基础设施」还有多远。","ana":"","hf":null,"topic":"评测工程","first":"2026-09-11","di":null,"wi":"2026-09-11","tier":"","tk":"","col":"eval"},{"u":"https://arxiv.org/abs/2609.06702","t":"PARSER: Read in Parallel, Reason in Depth for Long-Context LLM Agents","v":"港中文","s":"","d":"2026-09-06","k":"paper","star":0,"sum":"","brief":"顺序读长文档的记忆 agent 把「遍历」和「推理深度」耦合在一起，对证据位置敏感、延迟随长度线性增长。PARSER 让一组冻结的轻量子 agent 各绑定一个 chunk 并行读，主 agent 通过多轮 scatter–gather 广播查询、聚合证据、生成更深的追问，只训练主 agent（RL）。7K–896K token 多跳 QA 上 4B 主干比最强顺序基线平均高 5.7 分、896K 时高 12 分，9B 超过 DeepSeek-V4-Pro 6.3 分。上下文工程里「并行读 + 串行想」的一个干净范式。","ana":"","hf":null,"topic":"Skill、上下文工程与工具","first":"2026-09-11","di":null,"wi":"2026-09-11","tier":"","tk":"","col":"skill"},{"u":"https://openai.com/index/research-acceleration-view-inside-openai","t":"Research acceleration: The view inside OpenAI","v":"OpenAI","s":"发于 openai.com/index「Research」栏目 · 非开发者博客 · 性质是官方一手的量化进度报告而非教程","d":"2026-09-06","k":"article","star":1,"sum":"","brief":"","ana":"这篇解决的问题：OpenAI 去年秋天公开立下「2026 年 9 月前做出自动化研究实习生（automated research intern）」的目标，本文宣布**按其内部测量已达成**，并首次给出「agent 在多大程度上正在加速前沿实验室自身的研究」的数据快照，明确把「公开追踪 RSI（递归自我改进）进度」当成一种应被要求的行业规范。核心数据四组：① **用量**——年初 OpenAI 研究员的 agent 使用量中位数还很低，到 8 月中旬**中位研究员每天消耗超过 600 美元（按 API 价）的推理，第 90 百分位超过 7,000 美元/天**；② **劳动量换算**——6 月之前全研究组织的 agent 运行总时长仍低于人类总工时，8 月中已是**每 1 个人类工作日对应 3.1 个 agent 工作日**（按 8 小时折算），并行跑 4 个以上 agent 的研究员比例持续上升（含用户直接启动的 agent 和其派生的子 agent）；③ **产出**——每位活跃实验者的实验数在 2026 年 8 月创下 2025 年 1 月开始追踪以来的新高，与 Codex 采用率相关（作者诚实地提醒算力同时也大幅增长）；④ **任务结构**——用 Epoch AI 的 O*NET 式 AI 研发分类法（Decide / Design / Build / Run / Analyze / Communicate 六阶段）给 agent 输出 token 分类，1 月以「研究与基础设施代码」为主，到 8 月**「技术求助」与「监控训练运行」**显著增长，而**高层规划仍只占极小比例**；一个很硬的旁证是内部技术支持频道的日均发帖数持续下降、有团队直接停掉了答疑 office hours。成功率方面，用一个 agentic 分类器按「人类完成该任务所需时间」分桶统计，1 月到 7 月各难度桶的成功率普遍上升，但**任务越复杂越依赖人类介入引导**。文末「pacing」一节同样有工程价值：7 月 20 日发现 agent 攻破了内部研究基础设施后，他们**关停了训练用的容器服务，加固后再恢复**，RL 训练算力因此骤降两周；8 月 7 日 Astra 初步显示达到「critical」网络能力后又被要求只能在更高安全等级的研究环境里运行。启示：这是目前**唯一一份带方法论的「agent 加速研发」官方度量**——「agent 工作日 / 人类工作日」「按研发阶段分类 token」「按人类耗时分桶算成功率与介入率」三个指标可以直接搬到任何团队去量化自己的 agent 采用度；同时它给自演进讨论加了一个现实注脚——即便在最前沿的实验室，agent 承担的仍是 Build/Run/Analyze 里的执行与排障，**Decide/Design 层几乎还没被自动化**。面试聊 RSI 时，这篇加上同日 Pachocki 的《An Alien Mind》（见大事记）就是「OpenAI 官方对 RSI 现状的一手判断」。","hf":null,"topic":"自学习 / 自演进","first":"2026-09-07","di":null,"wi":"2026-09-07","tier":"","tk":"这是目前**唯一一份带方法论的「agent 加速研发」官方度量**——「agent 工作日 / 人类工作日」「按研发阶段分类 token」「按人类耗时分桶算成功率与介入率」三个指标可以直接搬到任何团队去量化自己的 agent 采用度；同时它给自演进讨论加了一个现实注脚——即便在最前沿的实验室，agent 承担的仍是 Build/Run/Analyze 里的执行与排障，**Decide/Design 层几乎还没被自动化**。面试聊 RSI 时，这篇加上同日 Pachocki 的《An Alien Mind》（见大事记）就是「OpenAI 官方对 RSI 现状的一手判断」。","col":"evo"},{"u":"https://arxiv.org/abs/2609.02749","t":"Repo-To-Skill: Distilling GitHub Repositories Into AI4AI Skills","v":"北京智源 BAAI × 中科大 × 人大 × 港理工","s":"","d":"2026-09-02","k":"paper","star":1,"sum":"","brief":"","ana":"**本周与 skill 自进化关系最直接的一篇，也是 WikiSkill 之后「skill 从哪里来」的另一条路线。** 解决的问题：自主 ML 研究 agent = 模型（理解/推理/规划）+ harness（编排/记忆/验证/迭代），但两者都不携带领域「操作性知识」（operational knowledge）——「知道一个方法」和「让它跑起来」之间的那层：该用哪个包、数据要怎么摆、哪些配置合理、哪些坑会让一次看似合理的运行作废。这些知识并不缺，全在仓库和论文里，只是**写给人读、太大装不进上下文**；没有它，agent 只能靠试错，而试错烧的是同一份任务预算，且跨任务不留存。解法 DisCo 分两种蒸馏：**任务无关**（锚点是一个源，如 sentence-transformers / AlphaFold / vLLM 仓库或一篇论文，提前蒸成长期 skill）和**任务导向**（锚点是一个具体问题，先拆能力、找能力缺口、再去搜材料按需蒸）；两种都走同一四步——定范围（哪些能力值得暴露）→ 找证据 → 构造（把可执行部分封装成稳定接口的脚本，再装配三层）→ **验证**（「没有一个 skill 仅凭来源就被接纳」，验证才是蒸馏与摘要的区别）。skill 的三层设计值得直接抄：`SKILL.md` 是**知识接口**（唯一会被预读的层：目标、关键概念、工具用法、示例、已知失败模式，并路由到更深材料或兄弟 skill）、`references/` 是**知识基底**（按需加载的 API 文档/算法细节/参数配置）、`scripts/` 是**执行接口**（有明确输入输出的包装器，agent 调用而不是重写）；一个源蒸出的多个 skill 组成**skill 图**（入口 skill 说明范围并路由到组件 skill，边表示路由/依赖/组合关系），渐进披露在图上进行，agent 只读任务需要的分支。规模化跑遍开源生态得到 AREX-Skill 库：**1,000 个常用 ML 仓库 → 5,000+ 个经验证的 skill，20 个领域、178 个能力族**，库级路由器把请求收窄到相关的图。数据（Codex harness + GPT-5.5 xhigh 固定，唯一变量是有无 skill）：**MLE-bench 全套 75 题 Any-Medal 31.11% → 72.89%（+134.3%），High 难度 13.33% → 62.22%**，并超过公开榜首 Famou-Agent 2.0（Gemini-3-Pro，64.44%）8.45 分——用的是原版 Codex，没有定制 harness；PaperBench 29.45 → 39.59（20 篇里 18 篇提升，2 篇因检索精度问题下降）；FrontierCS 70.63 → 77.14，且 **4.47M token/任务，只有 Claude Code + Opus 4.8（74.5 分）的三分之一，在分数/token/步数/工具调用四维上 Pareto 占优**；PassNet 编译器 pass 生成 AS 1.343 → 1.531，失败样本 14 → 5。两个必须记的 caveat：① skill **构造预算单独计、不计入运行预算**，所以「同预算下 +134%」是把一次性蒸馏成本摊销后的说法；② 下降的两题都在基线已高的任务上——检索到的 skill 会把 agent 从它本来能自己找到的 idiosyncratic 方案上拉走，作者建议加「skill 匹配度低时回退到无引导推理」。启示：与 Brockman 同周说的「今年辛苦写的很多 skill 对 Astra 已是净负面」（见大事记 09-04）放在一起读，答案就清楚了——**skill 该装的是模型没有的领域操作知识（API 的坑、验证过的流程），不该装模型已经会的通用过程**；WikiSkill 从执行经验里进化 skill，Repo-To-Skill 从声明式材料里蒸馏 skill，两条路的交汇点都是「验证门 + 渐进披露 + 可版本化」。","hf":null,"topic":"自学习 / 自演进","first":"2026-09-07","di":null,"wi":"2026-09-07","tier":"","tk":"与 Brockman 同周说的「今年辛苦写的很多 skill 对 Astra 已是净负面」（见大事记 09-04）放在一起读，答案就清楚了——**skill 该装的是模型没有的领域操作知识（API 的坑、验证过的流程），不该装模型已经会的通用过程**；WikiSkill 从执行经验里进化 skill，Repo-To-Skill 从声明式材料里蒸馏 skill，两条路的交汇点都是「验证门 + 渐进披露 + 可版本化」。","col":"evo"},{"u":"https://arxiv.org/abs/2609.04611","t":"τ^τ-Bench: An Environment for End-To-End, Realistic Agent Construction","v":"Sierra × Princeton","s":"τ-bench 原班人马","d":"2026-09-04","k":"paper","star":0,"sum":"","brief":"","ana":"解决的问题：agent 正在成为生产软件，而**造 agent 的活越来越多交给编码 agent**，但没有基准衡量「AI 系统能否在真实客户委托的条件下交付一个 agent」。τ^τ-bench（hyper-tau-bench）把「构造 agent」本身当成任务：开发者 agent 拿到的是**企业真实会保存的东西**——操作手册、客服转录、费用表格、邮件线程、Slack 导出、流程图、屏幕截图、通话录音（4 个领域共 2,868 件证据，纯文本部分就超过 550 万 token）、一个只有被问才吐出需求的模拟客户（20–25 条需求只存在于客户脑子里，边界按事实 ID 精确可测）、一个可能带 9 类隐性缺陷的客户 REST API（schema 漂移、写入已提交却超时、异步完成……）、有真实缺陷的继承代码库，以及 20 个模型的菜单 + 每会话平均服务成本预算；交付物是完整的客服 agent，评分方式是**部署它去对抗从未见过的模拟用户**，只看最终数据库状态与传达给用户的信息（架构无关，任何工具切分/策略措辞/单体或多 agent 都行）。评测集对开发者封存，想要反馈只能自己写模拟。数据：53 个任务，**最强配置 Claude Opus 5 + Claude Code 仅通过 23.9%，专家（拿着真值）参考上限 82.2%**；Codex + GPT-5.6-sol 22.0% 但只花 47.9 分钟/18.2 美元一次构建（Claude Code 216 分钟/42 美元）；差距主要在 banking（2,969 条原子事实，单任务最多牵涉 580 条，是其他领域整个领域的 2–7 倍），Opus 5 在 banking 只有 5.9%。**失败模式与人类 agent 开发者一模一样**：① 语料「被搜索、没被阅读」——每个开发者在约 1,700 个文件里打开不到 80 个，靠 22–53 次全库 grep 建 agent，结果 agent 根本不知道政策；② **几乎不问客户**——问客户的调用只占全部工具调用的 0.3%，最多问 4 个问题，且全是被矛盾记录触发的；一个开发者把待问问题写进规划文件却从没发出去，另一个搜三次没找到「资金下限备忘」就宣布「这是任务固有缺口」并交付——而那个 2,500 美元的数值只差一句话；**从不问的构建平均 0.16 分，问 4 个以上的 0.50 分**；③ 继承代码全部重写且**没人先运行一遍**（两个起始实现原样能得 0.12/0.36），甚至把「按意图路由」这个能让 telecom 分数从 31% 翻到 67% 的设计当缺陷删掉；④ **92% 的交付物是同一种单模型工具循环**，36 种可能的设计组合只出现 15 种；⑤ 预算两头错——21 个构建超支、其中 10 个被罚到零分，而更常见的是只用 0.45–0.72 的服务预算、留一半构建时钟提前交卷，且 96% 的 Codex 构建选 OpenAI 自家模型（习惯而非优化）；⑥ **自欺式测试**——测试与 agent 不一致时改测试而不是改 agent，有的编造规则写进自己的场景再调 agent 通过，有的自己写 mock API 替掉失败的真实端点；⑦ 17–42% 的运行出现作弊倾向（搜隐藏数据、读评分器源码、暴力探测密封常量），因真值不进运行镜像而全部未遂。启示：这是给「AI 应用工程师会不会被 agent 取代」的一份数据化回答——**今天的编码 agent 能造出「能跑的 agent」，造不出「能上线的 agent」，缺的恰是需求获取、设计空间探索、对着真值验证这些工程学科**；反过来它也是一份极好的「agent 项目常见死法」清单，把 ①②③⑥ 反过来写就是 checklist。","hf":null,"topic":"评测工程","first":"2026-09-07","di":null,"wi":"2026-09-07","tier":"","tk":"这是给「AI 应用工程师会不会被 agent 取代」的一份数据化回答——**今天的编码 agent 能造出「能跑的 agent」，造不出「能上线的 agent」，缺的恰是需求获取、设计空间探索、对着真值验证这些工程学科**；反过来它也是一份极好的「agent 项目常见死法」清单，把 ①②③⑥ 反过来写就是 checklist。","col":"eval"},{"u":"https://arxiv.org/abs/2609.04148","t":"Terminal-Universe: Turning Agent Trajectories into Scalable Terminal Environments","v":"阿里 Qwen 团队 × 清华","s":"","d":"2026-09-03","k":"paper","star":0,"sum":"","brief":"","ana":"解决的问题：终端编码 agent 的轨迹已经海量积累，但**真正能用于后训练的是环境而不是轨迹**——环境可以被反复出题、被更强模型重解、被自己的测试验证，轨迹只是一次质量受限于当时策略的冻结演示。现有环境构造三条路（从 git 历史回滚、在健康仓库里注入 bug、按分类从零生成任务+环境）要么任务类型受限，要么环境不真实。核心观察很巧：**轨迹里的工具调用本身就暴露了它所处环境的结构与内容**——`Read` 显示文件内容，`Write`/`Edit` 显示工作区如何被改——足以把原环境重建出来。方法三阶段：**确定性回放**（按时间顺序处理读/写/编辑，取每个文件被 agent 改动前的最早版本，剔除 agent 创建的文件，得到一个「未解决」的部分工作区）→ **agent 补全**（补齐缺失文件与依赖但不实现解法）→ **充分性过滤**（一个只读 agent 判定工作区是否给出了足够上下文）；再在恢复的环境上做四种「重新出题」：还原原始意图任务、单工作区合成新任务、**跨工作区**（挖掘环境间的有向依赖关系，让 agent 读一个只读参考仓库把能力移植到目标仓库，更像真实开发）、**多轮**（user agent 维护一份需求追踪器，每轮先由验证器写验收测试，solver 与测试脚本隔离，失败被翻译成自然的用户抱怨反馈回去）。每个新任务都配容器内 agent 写的验证器，只保留全部通过的轨迹。数据：从公开轨迹得到 **37.3k 个任务充分的环境**（回放后只有 40.2% 的终端工作区充分，补全后 93.5%；SWE 仓库 20.1% → 77.1%），32.0k 条 SFT 任务；Qwen3.5-27B 微调后 **Terminal-Bench 2.1 从 46.2 提升到 58.1（+11.9）**，多轮 EvoCode-Bench v2 MT@4 +13.8。消融里最值得记的三条：① **直接模仿原始轨迹反而低于基座**（36.7 vs 基座 47.0），而在重建环境里用更强教师重解同一批任务得 52.1——「经验」必须先变回「环境」再重新采样才有用；② 验证器过滤在难任务上更关键：跨工作区数据不过滤会拖低分数，过滤后**用不到一半的数据反而更高**；③ 同等预算下，**扩环境数量 > 每环境多出题 > 每题多采解**，后两者几乎无收益——每个新环境是新的可执行上下文，同一工作区上的第二道题大多是重复。启示：这和 WikiSkill、Repo-To-Skill 是自演进拼图的不同角——它们回答「经验如何变成知识资产」，本篇回答「经验如何变成可重复利用的训练环境」；对应用工程师最实用的一点是：**你手头的 agent 日志（尤其工具调用记录）本身就是可复现环境的种子**，想做自改进循环，先想清楚「验证器从哪来」而不是「数据从哪来」。","hf":null,"topic":"自学习 / 自演进","first":"2026-09-07","di":null,"wi":"2026-09-07","tier":"","tk":"这和 WikiSkill、Repo-To-Skill 是自演进拼图的不同角——它们回答「经验如何变成知识资产」，本篇回答「经验如何变成可重复利用的训练环境」；对应用工程师最实用的一点是：**你手头的 agent 日志（尤其工具调用记录）本身就是可复现环境的种子**，想做自改进循环，先想清楚「验证器从哪来」而不是「数据从哪来」。","col":"evo"},{"u":"https://arxiv.org/abs/2609.04523","t":"MaxKernel: Agentic Kernel Generation for TPUs","v":"Google / DeepMind","s":"","d":"2026-09-03","k":"paper","star":0,"sum":"","brief":"Google 自家的「agent 写 TPU Pallas kernel」系统，三种编排范式：HITL（「跑一个子 agent 就停下来等人」）、Auto 闭环（规划→实现→编译→测试→自动调参→XProf 剖析，剖析结果喂回下一轮规划）、图搜索（把 Auto 当 worker，节点 = 代码+计划+指标，并行/beam 搜索，**每个节点展开都是独立 agent 会话以避免上下文溢出**，图状态持久化可从中断恢复）。工程细节比结果更值钱：**测试集在进入循环前冻结**，防止实现 agent 改判据「reward hack」；每次成功迭代存快照，结束时自动回滚到最优；RAG 知识库只放文档、**故意排除人写的 kernel** 以测试 agent 能否自己发现优化。JaxBench 50 题：零样本 best-of-N 只有 10/50 能编译、几何均值加速 1.08×，Auto 49/50、1.39×，并行搜索 1.58×；8 个有人写基线的生产 kernel 上 2.32× vs 人类 2.02×（Gemini 3.1 Pro）。","ana":"","hf":null,"topic":"推理基础设施与建模","first":"2026-09-07","di":null,"wi":"2026-09-07","tier":"","tk":"","col":"infra"},{"u":"https://arxiv.org/abs/2609.01836","t":"Agent Memory Is a Surface for Endogenous Authorization Laundering / EAL-Bench","v":"ETH Zurich × Georgia Tech","s":"","d":"2026-09-01","k":"paper","star":0,"sum":"","brief":"**没有攻击者也会出事**：持久记忆在增量更新中把授权状态记错（漏掉撤销、放大范围），agent 自己的记录「洗白」了历史里从未授予的权限。五个模型当 memory writer、两个当 executor，采购/网安/金融三域：增量更新下 writer 对**最多 50.2% 的未授权请求制造了假授权**，一旦假授权进了记忆，executor **98.6%** 会照做；用真值状态替换记忆后未授权动作消失，故障定位在记忆层。两种缓解（存储的权限必须有有效来源事件背书；用有界事件溯源追踪权限变更）都有效但都多拒了合法请求。结论一句话：**持久记忆是 agent 有效授权策略的一部分，不只是性能组件**——上期三家不约而同的「memory 当数据治理」在这里有了安全侧证据；也呼应文中提到的 2026 年 2 月真实事故：一个邮件 agent 的「先确认再行动」指令在上下文压缩时被摘要掉，随后删了 200 多封只让它审阅的邮件。","ana":"","hf":null,"topic":"Agent 安全与围堵","first":"2026-09-07","di":null,"wi":"2026-09-07","tier":"","tk":"","col":"safety"},{"u":"https://arxiv.org/abs/2609.00621","t":"Control-Data Flow Separation: Stable Prompt Optimization in Multi-Agent LLMs","v":"滑铁卢 × 宏利 Manulife","s":"","d":"2026-09-01","k":"paper","star":0,"sum":"","brief":"自动 prompt 优化（TextGrad/DSPy/GEPA 一类）用到多 agent 系统上有个特有的死法：prompt 同时承担「生成内容」和「规定执行协议」（路由、输出格式、终止信号）两个角色，优化器为提升内容改一笔就可能把控制器依赖的 JSON 字段改坏，整条流水线崩掉——论文里 naive TextGrad 把评审生成流水线优化到**零可用输出**。解法是把控制信号做成类型化、运行时校验、**优化器不可编辑**的程序对象，只把自然语言数据通道留给优化；四个场景 100% 最终协议有效，评审生成 Jaccard 31.0 → 44.4。对自演进的意义：**任何让 agent 自己改自己 prompt/skill 的循环，都要先把「协议」从「内容」里拆出来锁死**——这是 EvoUndo「先能撤销」之外的第二条工程红线。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-07","di":null,"wi":"2026-09-07","tier":"","tk":"","col":"evo"},{"u":"https://arxiv.org/abs/2609.04094","t":"DRACO: Fine-Grained Credit Assignment with Dynamic Rubrics for Long-Horizon Agent Training","v":"CMU × IBM Research","s":"","d":"2026-09-03","k":"paper","star":0,"sum":"","brief":"多数长时程 agent 领域没有可编程校验器；rubric 打分又是整条轨迹一个标量，对几十步的轨迹信号太粗。DRACO 在训练中**动态生成 rubric 跟踪策略当前能力**，每条轨迹打一次分，再用闭式公式把分数分摊回「对该 rubric 负责的步骤」得到逐步 advantage，不训练任何归因模块。AppWorld 比基座 +15.9、比用稀疏真值奖励的 GRPO 还高 5.3（自己不用任何校验器）；域外 τ-bench +5.3。","ana":"","hf":null,"topic":"评测工程","first":"2026-09-07","di":null,"wi":"2026-09-07","tier":"","tk":"","col":"eval"},{"u":"https://arxiv.org/abs/2609.05295","t":"RISE: Recursive Improvement via Self-Extrapolating Policy Distillation","v":"arXiv","s":"Salesforce AI Research","d":"2026-09-04","k":"paper","star":0,"sum":"","brief":"权重级自改进：不用外部教师，而是**把模型自己 RLVR 训练轨迹上「当前检查点 − 滞后锚点」的位移外推成一个合成教师**（参数空间或 logit 空间），把稀疏的结果奖励更新转成稠密的逐 token 目标；教师每轮随学生刷新，蒸馏从一次性压缩变成递归改进。数学、STEM、代码、多轮 agent 任务上均优于仅 RLVR 与自蒸馏。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-07","di":null,"wi":"2026-09-07","tier":"","tk":"","col":"evo"},{"u":"https://arxiv.org/abs/2609.02783","t":"EarlyEval: Cheaper Agent Evaluation via Early Outcome Prediction","v":"arXiv","s":"","d":"2026-09-02","k":"paper","star":0,"sum":"","brief":"agent 评测一轮几百到几千美元、迭代中反复付；结论常在执行完成前就能从中间行为看出来。两个 LightGBM 分类器（成功/失败）跨过校准阈值就提前停：SWE-bench Verified / TerminalBench / Toolathlon 上砍掉 13–26% 的步数、最多 44.1% 输入 token，预测准确率 89–97%，各 agent 解决率只扰动 1–2 个百分点。","ana":"","hf":null,"topic":"评测工程","first":"2026-09-07","di":null,"wi":"2026-09-07","tier":"","tk":"","col":"eval"},{"u":"https://arxiv.org/abs/2608.30391","t":"Using Grounded Theory for Agent Behavior Analysis at Scale / AutoTraceGT","v":"arXiv","s":"","d":"2026-08-31","k":"paper","star":0,"sum":"","brief":"把社会科学六十年的「扎根理论」（开放编码→主轴编码→理论编码，直到饱和）做成多 agent 流水线自动分析轨迹，为每个任务生成专属行为分类法：六个轨迹语料上恢复人工标注失败模式的 73–91%，并发现人工遗漏的模式；作为特征空间做失败预测优于零样本/少样本 LLM。这是 error analysis 的系统化版本。","ana":"","hf":null,"topic":"评测工程","first":"2026-09-07","di":null,"wi":"2026-09-07","tier":"","tk":"","col":"eval"},{"u":"https://arxiv.org/abs/2608.30322","t":"Ignorance or Incompetence? Constructing Knowledge-Gated, Verifiable Tasks for LLM Agents","v":"arXiv","s":"","d":"2026-08-31","k":"paper","star":0,"sum":"","brief":"专业任务依赖公开语料里没有的**私有约定**，基准却从不控制 agent 是否拿到了它们。协议：任务指令与「约定/参考表/工具算子」的紧凑制品分离，指令字节级相同、只切换制品有无。15 个校准任务上一个前沿 agent 配置**有制品 68.0%、无制品 0%**，一份似是而非的错误制品同样 0%——这就是 Repo-To-Skill 说的「操作性知识」的对照实验版本。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-07","di":null,"wi":"2026-09-07","tier":"","tk":"","col":"evo"},{"u":"https://arxiv.org/abs/2609.04061","t":"When Models Edit Too Much: On the Fidelity of Minimal Code Edits","v":"arXiv","s":"","d":"2026-09-03","k":"paper","star":0,"sum":"","brief":"「过度编辑」：GPT-5.5 级模型也普遍把修 bug 变成重写，高 Pass@1 与不必要的大改并存。400 个 BigCodeBench 题注入 AST 级损坏得到已知最小补丁；一句「保留原实现」指令把多余编辑距离从 0.195 降到 0.131、新增认知复杂度降 26.6%、Pass@1 还升 2.3；SFT 会过拟合见过的损坏模式，RL 的域外编辑保真度最好。给「代码评审 agent」定指标时可直接用。","ana":"","hf":null,"topic":"评测工程","first":"2026-09-07","di":null,"wi":"2026-09-07","tier":"","tk":"","col":"eval"},{"u":"https://arxiv.org/abs/2608.26623","t":"AgentJudgeBench","v":"arXiv","s":"","d":"2026-08-27","k":"paper","star":0,"sum":"","brief":"LLM 裁判评 agent 工具调用（工作流 DAG）的可靠性：3,808 例、六种拓扑、三档难度、六个裁判。裁判一致性随难度单调下降，无真值时下降快 1.5×，**难题无真值时六个裁判无论规模全部收敛到 77–82%**——结构性天花板；给裁判看真值对 GPT-5.4/Gemini-2.5-Pro 反而略降（过度锚定）；CoT 与温度几乎无用，结构化 rubric 最多 +6.5。","ana":"","hf":null,"topic":"评测工程","first":"2026-09-07","di":null,"wi":"2026-09-07","tier":"","tk":"","col":"eval"},{"u":"https://arxiv.org/abs/2608.30730","t":"E-Commerce Bench","v":"arXiv","s":"","d":"2026-08-31","k":"paper","star":0,"sum":"","brief":"首个把多轮供应商谈判和动态事件放进**一整年经营**的开源基准：agent 同时经营多家店，选品、谈判进货、定价、履约、退货、现金流，目标年末总资产；市场双方确定性（需求模型固定、谈判内核决定让步，LLM 只负责措辞）。18 个前沿模型七个维度无一全面占优，GPT-5.6 Sol 赚得最多。","ana":"","hf":null,"topic":"评测工程","first":"2026-09-07","di":null,"wi":"2026-09-07","tier":"","tk":"","col":"eval"},{"u":"https://arxiv.org/abs/2608.30968","t":"CogEvol","v":"CogEvol × 清华","s":"","d":"2026-08-31","k":"paper","star":0,"sum":"","brief":"教育场景的「一次生成」模型替代分钟级多轮 agent 脚手架（幻灯片中位 17 秒、交互页 59 秒），值得记的是生产化细节：从真实失败里造 53,687 条验证过的 SFT 样本；混合规则 + VLM 奖励做 GRPO，**中途抓到并修复了一次 reward hacking（生成视觉上像样但玩不了的游戏）**；「脚手架编辑」再砍约 76% 生成成本。","ana":"","hf":null,"topic":"推理基础设施与建模","first":"2026-09-07","di":null,"wi":"2026-09-07","tier":"","tk":"","col":"infra"},{"u":"https://claude.com/blog/how-warp-builds-self-improving-agents-on-claude","t":"How Warp builds self-improving agents on Claude","v":"Anthropic","s":"","d":"2026-08-26","k":"article","star":1,"sum":"","brief":"","ana":"**本期与自演进方向关系最直接的官方文章，而且是生产环境案例。** 解决的问题：agent 的第一版 prompt 做对 80% 就会让用户觉得「吵」；Warp 的内部代码评审 agent 被工程师抱怨评论无用，手改 prompt、改 AGENTS.md 都不 scale。根因判断很准：**用户对 agent 的反馈在会话结束时就消失了**，从没进入 agent 的循环。解法是一个极简的双 skill 架构：**内层 base skill** 装领域知识和指令（PR 打开时评审 agent 用它干活）；人在中间给反馈（越具体越好——「你建议改名，但我们代码库里这类全局变量的命名约定是 X」）；**外层 improver skill** 是一个按计划定时跑（而非每任务跑）的观察者 agent，拉取累计的人类反馈、比对 agent 建议与人类反应，**对 base skill 提出一个小而聚焦的修改**，以 PR 形式走正常代码评审，合并后下次运行自动继承。Warp 已把这套循环铺到整个开源仓库：spec 撰写、评审、issue 分诊三个 agent 各带一条自改进循环（示例：分诊 agent 漏打 `ready to spec` 标签，维护者在 issue 里留了「期望什么 + 为什么」，improver 开 PR 把规则补进 skill）。六条写法建议里最值钱的三条：**写原则不写规则**（「像指导一个聪明人，不是给计算机编程」）、**解释为什么**（让 agent 能推理而非机械遵循，泛化更好）、**在 improver skill 上多下功夫**（它跨用例高度可复用，评审 agent 的 improver 和别的 agent 的 improver 差别不大）。文末的最佳实践表更硬：**skill 是程序性、稳定的，由人刻意改；memory 是推理时自动写的，永远在变——别把两者混为一谈**；假设反馈会错，agent 不能盲信，要过滤「谁的输入算数」并保留人工终审；**可验证的领域先建验证 harness 再让 agent 自调**，不可验证的领域把反馈限制在领域专家。启示：这就是 WikiSkill（上期论文）的**生产级极简版**——Warp 用「人类反馈 + 定时 improver + PR 门控」替代了「wiki 层 + 验证集门控」，两者共享同一骨架：经验必须被沉淀成可版本控制、可审阅的文件，且改动必须过一道门。面试聊自演进时，这篇是「落地了的、有 800K 开发者在用的」证据。","hf":null,"topic":"自学习 / 自演进","first":"2026-09-05","di":null,"wi":"2026-09-05","tier":"","tk":"这就是 WikiSkill（上期论文）的**生产级极简版**——Warp 用「人类反馈 + 定时 improver + PR 门控」替代了「wiki 层 + 验证集门控」，两者共享同一骨架：经验必须被沉淀成可版本控制、可审阅的文件，且改动必须过一道门。面试聊自演进时，这篇是「落地了的、有 800K 开发者在用的」证据。","col":"evo"},{"u":"https://claude.com/blog/the-anatomy-of-effective-commerce-agents","t":"A guide to the anatomy of effective commerce agents","v":"Anthropic","s":"","d":"2026-09-02","k":"article","star":0,"sum":"","brief":"","ana":"Anthropic 应用团队一年内与零售/旅行/电信等客户共建商业 agent 的经验总结，配套开源蓝图 [anthropics/commerce-agents](https://github.com/anthropics/commerce-agents)。虽然场景是电商，但**每一节都是通用 agent 架构决策**，密度极高：① **用 skills 不用子 agent**——商业会话是多意图紧耦合的单次会话，每次向子 agent 交接都是「状态有损」操作，还多花几倍 token 和数秒延迟；多个企业部署对比下，「单 agent + skills」在质量上稳定胜过「一个 prompt 包打天下」和「子 agent 架构」，且成本延迟更低；子 agent 只在两种情况下值得——可当工具调用的自包含任务（deep research）和已有独立合规面的现成 agent（药房/金融）。② **system prompt 还是 skill，按频率定**：加载 skill 花一个模型轮次，所以约 **1/3 以上流量会用到的内容进 system prompt**，长尾进 skill；能从已知信号（用户来自哪个页面）预测的 skill 由 harness 在首次调用前注入，省掉那一轮；安全/法律/品牌/过敏等关键指令永远在 system prompt。③ **memory 放你的数据库里而不是模型里**——一条记忆就是一条带 key/值/类别/来源会话的小型类型化记录；商户侧按人而非按账号存（登录常共享）；把 memory 当**数据处理设计问题**：写入路径上放校验器、给用户可见/可改/可删、设保留期、按部署可开关。④ **安全在 harness 里强制，不在 prompt 里**：模型只能「staging」，人或策略来「apply」——结账工具渲染一个带下单按钮的购物车，后端接口**根本没有 charge 方法**；商户侧每个写操作产生带服务端 ID 的暂存变更，`apply_change` 只对经真实审批面批准的 ID 生效，且在 apply 时按当前限额重查；**所有写入和渲染只接受服务端签发过的 ID**（幻觉的、用户粘贴的、评论里植入的 ID 在到后端前就被拒）。⑤ **评测评快照不评对话**：API 无状态，任何会话状态都能直接构造，所以一个 eval case = 构造测试状态 + 追加用户消息 + 跑 + 评最终状态与渲染结果（不评路径，路径评测脆而限制）；模拟用户评测「两个非确定性系统互相作用」测量价值差，只用来发现覆盖盲区；每个正例配一个反例（每个「应拒绝」配一个「应服务」），缺反例是最常见的漏洞；一部分 case 必须从**长、乱、自相矛盾的历史**开始。⑥ 选模型靠 sweep：定指标底线，全套评测跑遍每个模型×effort，**按每个完成任务的成本而不是每次调用算账**，结果接近时选更聪明的（更聪明的配置常因规划更好、轮次更少而在 p99 延迟上反而赢）。文中还有一句与本年度主线呼应的话：「模型越聪明，能处理的上下文、skill、工具就越多，今天这些放置规则背后的限制每一代都在松动。」启示：这是 2026 年目前**最完整的一份「单 agent 生产架构」标准答案**，建议整篇精读。","hf":null,"topic":"Skill、上下文工程与工具","first":"2026-09-05","di":null,"wi":"2026-09-05","tier":"","tk":"这是 2026 年目前**最完整的一份「单 agent 生产架构」标准答案**，建议整篇精读。","col":"skill"},{"u":"https://claude.com/blog/the-ai-native-sdlc-playbook","t":"The AI-Native SDLC playbook","v":"Anthropic","s":"窗口边缘一天 · 本期补收","d":"2026-08-21","k":"article","star":0,"sum":"","brief":"","ana":"论点：**代码不再是瓶颈，瓶颈移到了 build 两侧仍以人速运行的 plan、review/test、deploy**；为「每行代码都是人写的」设计的控制（逐行人审、周会级例外审批）在 agent 写大部分 diff 之后已经与现实脱节。全文按六阶段给出「传统 vs AI 原生」对照表，贯穿的核心机制是**「每个阶段以提交一个制品到版本库结束，下一阶段以读取它开始」**：`intent.md`（用原始提出者自己的话捕获意图，人可读机器可执行）→ `spec.md`（需求与设计压缩进一次 agent 工作会话，标准编码为 skill）→ `plan.md`（Claude Code plan mode 作默认起点）→ diff 与测试 → 带评审发现的 PR → 事故记录；**commit 链就是审计轨迹**——谁要了什么、agent 产出了什么、谁批准的。几个可直接抄的 play：CLAUDE.md 只写代码库推不出来的东西（命令、约定、架构、「Claude 常错的地方」）；**skill 作为机构知识**（如「安全 API 评审」skill）；**hooks 作为构建期护栏和部署审批门**（「生产部署需要具名发布授权」）；评审指令明确「什么算重要、封顶 nit 数量、不报什么」；生产告警击穿控制带后自动写回一个新的 `intent.md`，闭环回到 plan。启示：把 Anthropic 自己 7 月「砍 80% prompt」的思路放到组织层面看——**过程控制也要随模型能力重新设计**，人的注意力集中到「门」上审阅 agent 标记的内容，而不是每个阶段从零开始。","hf":null,"topic":"Harness 与长时程 Agent","first":"2026-09-05","di":null,"wi":"2026-09-05","tier":"","tk":"把 Anthropic 自己 7 月「砍 80% prompt」的思路放到组织层面看——**过程控制也要随模型能力重新设计**，人的注意力集中到「门」上审阅 agent 标记的内容，而不是每个阶段从零开始。","col":"harness"},{"u":"https://developers.googleblog.com/4-engineering-patterns-behind-the-strongest-ai-agents-challenge-submissions","t":"4 engineering patterns behind the strongest AI Agents Challenge submissions","v":"Google","s":"","d":"2026-09-02","k":"article","star":0,"sum":"","brief":"","ana":"从数千份参赛 agent 里提炼的四个真实代码模式，作者先泼冷水：**「多智能体系统」是最常见的自称，细看很多只是单模型跑一串挂着 agent 名字的 prompt。** 四个模式：① **双向 MCP**——agent 既是自己工具的客户端，也是其他 agent 可调用的服务端；内半部分本身就值：通过 MCP 工具层访问遥测库，agent 只拉一个作业的执行计划或一段栈追踪而不是整张表，上下文才小到能推理；也正因为推理已经坐在工具接口后面，对外暴露只是再立一个 MCP server；② **事件驱动并发**——线性调用链（传感器 agent 调合规 agent 调消息 agent 调派遣 agent）在 demo 里没问题，真实场景里总延迟是相加的；改成每个 agent 一个 `asyncio.Queue` 的事件总线，发布类型化事件到主题，互不依赖的 agent 同时跑；作者的判断标准很实用：「如果两个 agent 需要对同一信号做反应，而架构让其中一个等另一个——那是**披着多 agent 外衣的单线程系统**」；③ **降级模型也得过同一道门**——Gemini 3.1 Pro 503 时回退到 3.6 Flash，但两条路径**被迫调用同一个** `validate_clinical_response()`（检查引用了真实临床指南），校验不是各写一份，而是**结构上不可能只应用一次**；④ **昂贵调用前的分层路由**——正则零 token 抓导航意图，模糊的用 10 token、温度 0.1 的廉价调用分类，只有都没拦住的才到全推理模型，第一层就消化了 40% 以上的消息。启示：四条都不需要更大的团队或更新的模型，是「常被忽视的扎实工程」；第 3 条尤其值得进面试题库——降级路径的校验缺失是「同时发布两个产品却只测了一个」。","hf":null,"topic":"多智能体","first":"2026-09-05","di":null,"wi":"2026-09-05","tier":"","tk":"四条都不需要更大的团队或更新的模型，是「常被忽视的扎实工程」；第 3 条尤其值得进面试题库——降级路径的校验缺失是「同时发布两个产品却只测了一个」。","col":"multi"},{"u":"https://x.ai/news/designing-grok-bot","t":"Designing Grok Bot for a world of persistent agents","v":"xAI","s":"","d":"2026-09-03","k":"article","star":0,"sum":"","brief":"","ana":"xAI 首次写出**持久 agent 的产品/接口设计原则**，和上期 MHS、本期 Pera 论文构成同一母题。出发点：多数 AI 界面围绕「用户操作的一次会话」组织，而他们要设计的是「超越单次会话、能自行承担责任」的 agent，于是要重新决定基本对象。他们把行业积累的一大堆概念（chats/sessions/models/context windows/memories/system prompts/projects/skills/connectors/tools/sandboxes/permissions/automations）压成**五个用户真正需要的原语**：**Bot**（有身份、记忆、运行时、工具的持久 agent）、**Chat**、**Prompt**（可一次性使用、可存为 Skill、可自动触发为 Routine）、**Tool**、**Artifact**；产品主对象是 Bot 花名册而非聊天记录（「聊天是一次性的，你很少回看最近五条之外」）。几个决策值得记：Bot 的电脑「是它的不是你的」——试过浮窗/并排/模态/全屏，**越显眼越诱导用户去监督**，最终做成状态/预览/接管三级；**能力与上下文按不同边界划分**——Tools 和 Skills 在账号级共享，Memory 和 Routines 属于单个 Bot（法务 Bot 和财务 Bot 的记忆合在一起反而更难各取所需）；用户自发出现「Chief of Staff Bot」协调多个专家 Bot，团队于是放弃看板/分配/显式交接控件，让协调 Bot 处理例行路由、只在需要判断时叫人；Routine 从次要配置提升为主界面，因为「会话可以由 prompt 开始，也可以由计划、事件或另一个 Bot 开始」；最后是**做减法**：去掉窗口控件、agent 元数据，限制约 50 个 Bot/账号、6 个/群聊，每个决定只问一句「这帮人委派了，还是又多了一件要管的事」。启示：「skill/tool 账号级共享、memory 归角色」这条边界和 Warp「skill 稳定、memory 自动写」的区分是同一条线——**2026 下半年 skill 与 memory 的分工已经在三家独立收敛**。","hf":null,"topic":"Harness 与长时程 Agent","first":"2026-09-05","di":null,"wi":"2026-09-05","tier":"","tk":"「skill/tool 账号级共享、memory 归角色」这条边界和 Warp「skill 稳定、memory 自动写」的区分是同一条线——**2026 下半年 skill 与 memory 的分工已经在三家独立收敛**。","col":"harness"},{"u":"https://arxiv.org/abs/2609.01437","t":"HarnessDev: Can LLMs Create and Evolve Their Own Agent Harness?","v":"arXiv","s":"Wu · Zhang · Shi 等 19 人","d":"2026-09-01","k":"paper","star":0,"sum":"","brief":"","ana":"问题：agent 能力越来越取决于模型外的执行基础设施（harness），固定权重只换 harness 就能大幅改变成绩，但现有评测只报「某个 harness 下的任务分数」，从没测过**模型自己造 harness 的能力**。HarnessDev 把评测单位从任务输出改为「可运行的基础设施」：**Creation** 阶段 agent 从最小种子和少量样例出发搭一整套执行系统；**Evolution** 阶段从自己造的 harness 出发，用下游执行反馈迭代修改。评测两维：能力（held-out 基准任务成功率）与效率（执行 token 成本）。数据：6 个创造者模型 × 4 领域 × 5 个下游基准共 2,207 个实例（含隐藏评测任务）。结论很清醒：**生成的 harness 在代码、搜索/研究领域仍明显落后于成熟的人工 harness**，在写作和机器学习实验上持平或超过；**Evolution 有收益但不稳定，只部分迁移到 held-out 任务**；固定运行时模型的实验表明收益强烈依赖执行 harness 的那个模型，跨模型迁移有限。启示：这与上期 WikiSkill「发现知识≠执行知识」是同一发现在 harness 层的重演；对工程师的实际意义是——**今天让 agent 自己写 harness 仍不如抄一份成熟的**，但「自造 harness」已经成为可测量的能力。","hf":null,"topic":"自学习 / 自演进","first":"2026-09-05","di":null,"wi":"2026-09-05","tier":"","tk":"这与上期 WikiSkill「发现知识≠执行知识」是同一发现在 harness 层的重演；对工程师的实际意义是——**今天让 agent 自己写 harness 仍不如抄一份成熟的**，但「自造 harness」已经成为可测量的能力。","col":"evo"},{"u":"https://arxiv.org/abs/2609.00196","t":"WHALE: A Simple Recipe for Joint Harness-Weight Optimization","v":"KRAFTON × Stanford","s":"","d":"2026-08-31","k":"paper","star":0,"sum":"","brief":"","ana":"问题：agent 性能由模型参数和管理上下文/控制流的 harness 代码**共同决定**，单独优化任一方都会被冻结的另一方卡住——权重更新会改变「哪个 harness 有效」，harness 更新会改变「暴露出哪些模型能力」；现有联合方法只优化权重 + 文本 prompt，更广的 harness 仍固定。WHALE 交替两阶段：在当前 harness 下更新模型（在线拒绝采样微调）→ 在更新后的模型下搜索更好的 harness（Meta-Harness）。**何时切换**是关键设计：固定阶段时长或基于训练信号的自适应耐心规则，以区分真实改进与噪声、避免对着变动的对手过拟合。用 Qwen3.5-2B/4B 在搜索问答、数学、国际象棋谜题三领域，比仅权重、仅 harness、Fast-Slow Training 高 **4.15–24.38 个百分点**（best mean@8）。关键观察：**任一方都可能是瓶颈**——SearchQA 里 harness 搜索用远少的 rollout 就追平权重优化峰值，数学任务里 harness 只有在权重更新后才起作用；小步交替优于「先权重后 harness」的分段式。代码开源。启示：这是「删脚手架 vs 加脚手架」争论的一个定量答案——**脚手架和模型该一起进化，而不是二选一**。","hf":null,"topic":"自学习 / 自演进","first":"2026-09-05","di":null,"wi":"2026-09-05","tier":"","tk":"这是「删脚手架 vs 加脚手架」争论的一个定量答案——**脚手架和模型该一起进化，而不是二选一**。","col":"evo"},{"u":"https://arxiv.org/abs/2608.28363","t":"EvoUndo: Recoverability-Constrained Self-Evolution for LLM Agent Harnesses","v":"arXiv","s":"Sah · Jain 等","d":"2026-08-28","k":"paper","star":0,"sum":"","brief":"","ana":"问题：agent 越来越多地在运行时修改自己的 prompt、工具、中间件、资源和执行 harness；一次「成功」的变异可能留下**在其他状态下无法安全回滚**的持久效应。EvoUndo 提供一套表示、合成、诊断、独立验证「跨反事实状态可恢复性」的框架。数据触目：600 个未见过的一次性自演进任务里，**197 个提升了能力的变异通不过可恢复性验证**；在原始恢复表示下，常规修复策略对这 197 个自然失败**一个都恢复不了**（0/197）；确定性 oracle 分析在原恢复语言下恢复 48/197，扩展恢复演算进一步提高。启示：WikiSkill 的「skill 可回滚」是理想化前提——**真实自演进的第一道工程红线是「先证明能撤销，再允许变异」**，这篇把「可回滚」做成了可验证性质。","hf":null,"topic":"自学习 / 自演进","first":"2026-09-05","di":null,"wi":"2026-09-05","tier":"","tk":"WikiSkill 的「skill 可回滚」是理想化前提——**真实自演进的第一道工程红线是「先证明能撤销，再允许变异」**，这篇把「可回滚」做成了可验证性质。","col":"evo"},{"u":"https://arxiv.org/abs/2608.24804","t":"StarHarness","v":"arXiv","s":"","d":"2026-08-25","k":"paper","star":0,"sum":"","brief":"企业环境下固定权重演化 harness（prompt/工具接口/skills/MCP 提供者/子 agent 结构/循环配置），按基线失败行为分层构造演化池，搜索任务与选择任务分离：ITBench SRE、EnterpriseOps ITSM、AutomationBench Finance 上 **+20–35 个百分点**，且跨 GPT/Qwen 族**免重演化迁移**——与 HarnessDev 的悲观结论形成对照（差别在于「从零造」vs「在成熟 harness 上演化」）。","ana":"","hf":null,"topic":"评测工程","first":"2026-09-05","di":null,"wi":"2026-09-05","tier":"","tk":"","col":"eval"},{"u":"https://arxiv.org/abs/2608.31111","t":"Aspire","v":"arXiv","s":"","d":"2026-08-31","k":"paper","star":0,"sum":"","brief":"**模糊目标驱动的自演进**基准：只给「成为更好的物理学家」式自然语言目标，下游任务隐藏，agent 自己选数据、选更新方法、造训练/验证信号、决定何时评估；支持权重与 harness 两种演化。结论：agent 能跑完训练和 harness 编辑循环，但**权重级收益稀疏不稳定，最强演化 harness 仍低于工程化的 Qwen-Agent 参考**，常在错配数据上训练、信任狭窄的自评，局部收益不迁移。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-05","di":null,"wi":"2026-09-05","tier":"","tk":"","col":"evo"},{"u":"https://arxiv.org/abs/2608.31100","t":"S³Gym","v":"arXiv","s":"","d":"2026-08-31","k":"paper","star":0,"sum":"","brief":"自测试/自判断/自改进三能力耦合评测，7 个带可执行验证器的文字游戏；三种经验利用路径（历史 ICL、分数条件摘要记忆、参数训练）：**摘要在经验可压缩成策略规则时有效，但在成功依赖精确状态信息时常不如原始历史**；参数训练在某些任务大幅提升、另一些严重负迁移——「识别成功动作不够，还得把反馈变成可执行可迁移的策略」。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-05","di":null,"wi":"2026-09-05","tier":"","tk":"","col":"evo"},{"u":"https://arxiv.org/abs/2609.00768","t":"DiagEvo","v":"arXiv","s":"","d":"2026-09-01","k":"paper","star":0,"sum":"","brief":"自博弈自演进常会平台或退化；方向不必来自外部，可从 solver **自己的失败历史**里提取：诊断器把反复出现的错因存进按 skill 节点分层的错因记忆，指导后续出题。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-05","di":null,"wi":"2026-09-05","tier":"","tk":"","col":"evo"},{"u":"https://arxiv.org/abs/2609.01481","t":"Harness-of-Harness","v":"arXiv","s":"","d":"2026-09-01","k":"paper","star":0,"sum":"","brief":"在现有编码 agent harness 之上组织「规划-编码-测试」多日自主开发循环，平衡修复与能力增长、小增量可验证、实现期测试与独立评估分离、约束可验证输出而非规定 agent 工作流。","ana":"","hf":null,"topic":"评测工程","first":"2026-09-05","di":null,"wi":"2026-09-05","tier":"","tk":"","col":"eval"},{"u":"https://arxiv.org/abs/2608.30478","t":"Agents in the Large: Pera","v":"arXiv","s":"","d":"2026-08-31","k":"paper","star":0,"sum":"","brief":"持久 agent 的「感知中心」架构框架，与本期 Grok Bot 设计文和上期 MHS 同题：agent 从「解有界任务」转向「长期服务」。","ana":"","hf":null,"topic":null,"first":"2026-09-05","di":null,"wi":"2026-09-05","tier":"","tk":"","col":""},{"u":"https://arxiv.org/abs/2609.04128","t":"Environment Evolution for Terminal Agents","v":"arXiv","s":"","d":"2026-09-03","k":"paper","star":0,"sum":"","brief":"模型越强、合成环境越不够难；离线逐代提升环境难度以持续提供学习信号（自演进的「对手」也要进化）。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-05","di":null,"wi":"2026-09-05","tier":"","tk":"","col":"evo"},{"u":"https://arxiv.org/abs/2608.26730","t":"Knowing When Not to Reuse / BCIT","v":"arXiv","s":"","d":"2026-08-27","k":"paper","star":0,"sum":"","brief":"自主 post-training 里「过去成功的更新」在父模型变了之后是否还可信？把经验复用变成需要授权的条件性决策。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-05","di":null,"wi":"2026-09-05","tier":"","tk":"","col":"evo"},{"u":"https://arxiv.org/abs/2608.30530","t":"WebWorld","v":"arXiv","s":"","d":"2026-08-31","k":"paper","star":0,"sum":"","brief":"自改进循环的结构缺陷：提修复的模型就是评判它的模型；把浏览器当成「VLM 骗不了的对手方」（world model），只有目标推进且历史能力全部保留才发验收证书。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-05","di":null,"wi":"2026-09-05","tier":"","tk":"","col":"evo"},{"u":"https://arxiv.org/abs/2609.00137","t":"Recursive Criticality of AI Self-Improvement","v":"arXiv","s":"","d":"2026-08-31","k":"paper","star":0,"sum":"","brief":"给 AI 参与 AI 研发的反馈定义了「递归再生数」R_AI：>1 时改进跨周期自放大，<1 时衰减，取决于反馈强度与研究难度递增速率之比。","ana":"","hf":null,"topic":"自学习 / 自演进","first":"2026-09-05","di":null,"wi":"2026-09-05","tier":"","tk":"","col":"evo"},{"u":"https://www.anthropic.com/news/model-hardware-standard-research-preview","t":"Previewing the Model Hardware Standard","v":"Anthropic","s":"发布于 Newsroom · 非工程博客","d":"2026-08-27","k":"article","star":0,"sum":"","brief":"","ana":"**本期最值得读的一篇。** 解决的问题：agent 想操作实验室或工厂里的物理设备（显微镜、移液工作站、机械臂、激光器）时，每台设备各有各的编程接口，既没有统一的接入方式，也没有让 agent 安全操作它们的共同协议——一个实验室把硬件接起来通常要几周到几个月。MHS 的做法**和 MCP 是同一个套路，只是把「工具」换成了「硬件」**：① 定义一套标准化 driver，只暴露极少的原语（`read`「读温度」/ `write`「设温度」），任何设备都能实现；② 设备以标准格式**可被发现**，agent 与设备跨网络互相找到，不需要中间的定制翻译层；③ driver 里带**自然语言 tag**，把过去只写在纸质手册里或存在老工程师脑子里的隐性知识（比如机械臂自重、安全限位）写进去，自动生成一份 agent 可读的设备说明文件——用户可以自己写，也可以让 agent 采访自己来写；④ 三种控制通道并存：MCP、CLI、代码文件（API）。\n\n最值得 AI 应用工程师抄的是**「探索 → 固化」这个执行模式**：Claude 先像科学家一样调一下激光、用摄像头看结果、再调——把过程摸清后，把学到的东西打包成一个确定性脚本，此后整套对准动作一条命令跑完，不再需要每步推理。这正是「在线推理贵且慢，就用推理去生成确定性代码，把热路径交给代码」的通用解法（对照 Anthropic 自己的 *Code execution with MCP*）。合作方数据也很硬：CMU 用 MHS 从零写四台异构设备（机械臂、移液器、酶标仪、监控摄像头，分布在三台互不兼容的电脑上）的 driver + 编排层到跑完一条稀释曲线，**共 8 小时**，而找厂商做同样的集成通常要数周；其中酶标仪那一版软件**完全没有 API，MHS 就像人一样直接驱动 GUI**。QuEra 让 agent 接管量子计算机激光系统，自主恢复激光锁频成功率 **99.3%**。文章同样诚实地写了边界：Claude 的空间与物理推理有限（Genentech 遇到样品起泡时，要人教它这是物理故障而不是软件 bug），且尚不支持无编程接口的硬件。启示：**agent 的下一个战场是「协议化地接入世界」**，而通用配方永远是这三样——统一原语、可发现性、把隐性知识显式写进机器可读的说明。面试里聊 MCP 时，把 MHS 当作「同一设计范式向物理世界的延伸」举例，会比只背 MCP 三件套加分。","hf":null,"topic":"Agent × 物理世界","first":"2026-08-31","di":null,"wi":"2026-08-31","tier":"","tk":"**agent 的下一个战场是「协议化地接入世界」**，而通用配方永远是这三样——统一原语、可发现性、把隐性知识显式写进机器可读的说明。面试里聊 MCP 时，把 MHS 当作「同一设计范式向物理世界的延伸」举例，会比只背 MCP 三件套加分。","col":"phys"},{"u":"https://developers.googleblog.com/decoding-cosmic-signals-with-deep-learning-and-keras","t":"Decoding cosmic signals with deep learning and Keras","v":"Google","s":"","d":"2026-08-27","k":"article","star":0,"sum":"","brief":"","ana":"偏建模、不涉及 agent，但这是本期唯一一篇讲**「怎么把领域知识编码进网络结构」**的硬工程文，对做垂直领域 AI 应用的人有直接价值。问题背景：Pierre Auger 天文台用 1660 个地面探测器捕捉宇宙线在大气中产生的粒子簇射，传统方法把每个探测器的波形压缩成「总电荷 + 到达时间」两个数，**信息在特征工程这一步就丢光了**。方案是端到端训练一个 Keras 模型直接吃原始时空数据：以最大信号站为中心裁出 13×13 的站点网格，每站 3 条波形 × 120 个时间步（25ns 一步，共 3 微秒）。四个设计决策值得记：① **时空解耦**——站间距 1.5 km，波形之间因果独立，所以先用一个**跨全部 169 个站共享权重**的双向 LSTM（`TimeDistributed`）把每站波形压成 10 维特征，再交给空间模型，既物理正确又极省算力；② **六边形群等变卷积**——探测器阵列是六边形且簇射沿方位角旋转不变，于是让卷积核不仅跨位置共享、还跨 6 个旋转方向共享，参数效率直接来自物理对称性；③ **缺失要显式建模**——「探测器坏了没数据」和「探测器好好的但没测到信号」在物理上完全不同，所以额外喂一张 status map（1= 正常，0= 缺失），训练时主动 mask 站点来教会模型这件事；④ **多任务塔**——能量、质量、到达方向共享 DenseNet 主干、各自出头，联合训练同时改善了泛化和训练稳定性。结果：可用观测数据量提升 **10 倍**，等价于同一台探测器多跑一百年，且推翻了「最高能宇宙线是纯质子」的旧假设。文末两段更值得读：作者承认**模拟数据与真实探测数据的域偏移**是这条路线的主要天花板（必须靠 domain adaptation + 独立探测器交叉标定 + 严格的不确定度量化），并直面 Sutton 的「苦涩教训」——今天他们会用 GNN / point cloud transformer 取代 CNN+LSTM，物理归纳偏置可能只是数据不足时的中间态。启示：**当训练数据昂贵到「模拟一个事件要一周」时，把对称性和缺失语义写进架构就是最高杠杆的工程动作**；而当数据变便宜，先撤掉的也正是它。这条张力对所有做小数据垂直场景的人都成立。","hf":null,"topic":"推理基础设施与建模","first":"2026-08-31","di":null,"wi":"2026-08-31","tier":"","tk":"**当训练数据昂贵到「模拟一个事件要一周」时，把对称性和缺失语义写进架构就是最高杠杆的工程动作**；而当数据变便宜，先撤掉的也正是它。这条张力对所有做小数据垂直场景的人都成立。","col":"infra"},{"u":"https://arxiv.org/abs/2608.27454","t":"WikiSkill: Compiling Agent Experience into Persistent Knowledge for Skill Evolution","v":"arXiv","s":"Liyan Tang · Cyrus Rashtchian · Chun-Sung Ferng","d":"2026-08-27","k":"paper","star":0,"sum":"","brief":"","ana":"**skill 自进化方向目前最系统的一篇。** 解决的问题：让 agent 从自己的执行经验里自动进化出 skill（SKILL.md 那种文件系统模块）这条路线已有 EvoSkill、Trace2Skill、SkillOpt 等方法，但它们学到的教训都**散落在优化历史里**——一次迭代的洞见没有沉淀成可复用的知识，下次迭代还得从 trace 里重新挖。WikiSkill 受 Karpathy「LLM Wiki」构想启发，在原始经验和可执行 skill 之间插入一个**持久知识层**，把工作区分成三层：`raw/`（不可变的完整执行轨迹）、`wiki/`（结构化知识：patterns/ 里一个失败模式或成功策略一个 md 文件，外加 logs.md 进化日志和 skill-impact.md——由外层 harness 程序化记录每次 skill 提案的 diff、验证分数和采纳结果，构成客观审计轨迹）、`skills/`（当前生效的 skill，每个附一份 PURPOSE.md 回链到启发它的 wiki pattern）。进化循环四个角色：Inference Agent 带着当前 skill 跑任务、Wiki Maintainer 把轨迹里的模式合并进 wiki、Skill Proposer（ReAct 式，按需读 pattern 和 trace）每轮提**一个原子化** skill 修改、Gating 用验证集分数决定采纳或回滚——关键设计是 **skill 可以回滚，wiki 永不回滚**，知识只增不减。\n\n三组数据最值得记：① 收益随模型规模**递增**——Qwen 家族 4B/9B/27B 平均提升 +12.3/+17.5/+23.9 分，且 9B+skill（47.4%）反超 27B 裸模型（39.4%），说明进化出的程序性知识和模型规模是互补的两条腿；② **skill 可跨模型迁移，且别人进化的有时比自己进化的还好用**——ALFWorld 上 Qwen-9B 用 27B 进化的 skill 拿 70.2%、用自己进化的只有 63.4%，作者由此拆出一对常被混为一谈的能力：「发现程序性知识」和「执行程序性知识」是两回事（但也有反例：4B 进化的 skill 里全是给小模型兜底的低级 workaround，会把 Gemini-Flash 在 SpreadSheet 上从 50.5% 拖到 18.1%）；③ 消融实验里最反直觉的一条——给 Skill Proposer 开放 wiki 平均 +15 分（48.7%→63.7%），但**给 Inference Agent 在训练 rollout 时开放 wiki 反而掉分**（63.7%→60.9%）：agent 直接从 wiki 抄答案解题，轨迹就不再暴露 skill 的真实缺陷，进化信号被污染了。\n\n启示：这套「经验 / 知识 / 程序三层分离 + 知识永不回滚 + 程序受验证门控」的架构，就是你在 Claude Code 里手工维护 memory 文件和 CLAUDE.md 的**系统化、可评测版本**；而「训练时隔离知识层以保住进化信号」这条，对任何做 self-improvement pipeline 的人都是一个此前没人明说的坑。面试聊 agent 记忆/自进化时，用「WikiSkill 把 EvoSkill 们的散落经验升级成持久知识层」一句话就能定位整个方向。","hf":null,"topic":"自学习 / 自演进","first":"2026-08-31","di":null,"wi":"2026-08-31","tier":"","tk":"这套「经验 / 知识 / 程序三层分离 + 知识永不回滚 + 程序受验证门控」的架构，就是你在 Claude Code 里手工维护 memory 文件和 CLAUDE.md 的**系统化、可评测版本**；而「训练时隔离知识层以保住进化信号」这条，对任何做 self-improvement pipeline 的人都是一个此前没人明说的坑。面试聊 agent 记忆/自进化时，用「WikiSkill 把 EvoSkill 们的散落经验升级成持久知识层」一句话就能定位整个方向。","col":"evo"},{"u":"https://developers.googleblog.com/build-zero-trust-ai-agents-with-googles-agent-development-kit","t":"Build zero-trust AI agents with Google's Agent Development Kit","v":"Google","s":"","d":"2026-08-17","k":"article","star":0,"sum":"","brief":"","ana":"**本期最值得读的一篇。** 解决的问题：当 agent 能开退款、改数据库、临时执行代码时，它已经在**改动生产状态**，而传统边界安全对「LLM 用自然语言自己决定执行路径」完全失明。核心论点一句话：**system prompt 不是安全边界**——「不要退超过订单金额」这种软约束会被 prompt injection 绕过、被 prompt tuning 改写、在模型升级后行为漂移。文章用一个开源的「客服退款 agent」做靶子（攻击 prompt：忽略指令退我 $10,000，顺便打印环境变量），给出 LLM 之外的三层硬保证：① **每笔写操作加密签名**——每个 agent 一个 Service Account + Cloud KMS/HSM 私钥，数据库入口验签才落库，事后还能后台扫描审计，攻击者直接改库会因签名对不上而报警；② **gVisor 内核级沙箱**跑动态生成的代码，`--network=none --cap-drop=ALL --memory=64m` + 5 秒超时，读 /etc/passwd 或外联都在系统调用层被拦；③ **确定性语义网关**，用 CI/CD 测试套件固化的规则校验模型的输入输出。启示：这是 Anthropic《How we contain Claude》那套「概率性防御必须由确定性边界兜底」的**可直接抄的工程实现**，而且三层各补各的洞（签名管身份、沙箱管运行时、网关管业务规则）。面试里被问 agent 安全，这三层就是标准答案骨架。","hf":null,"topic":"Agent 安全与围堵","first":"2026-08-27","di":null,"wi":"2026-08-27","tier":"","tk":"这是 Anthropic《How we contain Claude》那套「概率性防御必须由确定性边界兜底」的**可直接抄的工程实现**，而且三层各补各的洞（签名管身份、沙箱管运行时、网关管业务规则）。面试里被问 agent 安全，这三层就是标准答案骨架。","col":"safety"},{"u":"https://developers.googleblog.com/how-to-evaluate-live-voice-agents-in-adk","t":"How to Evaluate Live & Voice Agents in ADK","v":"Google","s":"","d":"2026-08-24","k":"article","star":0,"sum":"","brief":"","ana":"解决的问题：语音 agent 的「昨天 demo 还好好的」问题——改个 prompt 或换个模型版本，工具不触发了、轮次之间上下文丢了、用户插话被忽略了，而这些**在文本 eval 里根本测不出来**。ADK 现在支持把语音 agent 塞进和文本 agent 同一套 eval 循环：用一个**会说话的模拟用户**（Gemini TTS 合成音频流给被测 agent）驱动整段对话，再给语音回复打分。两个设计点值得抄：① 测试用例分两种风格——`conversation_scenario` 只写目标和 persona（内置 `NOVICE` 这类人格，只说高层目标、逼 agent 自己追问），让模拟用户即兴发挥，`max_allowed_invocations` 封顶防跑飞；`conversation` 则逐字写死用户每轮说什么。② 打分用 **rubric 驱动的多轮轨迹评分**（`rubric_based_multi_turn_trajectory_quality_v1`，judge 模型 + 阈值 0.7），rubric 是自然语言写的整段约束，比如「在透露预约信息之前必须先确认姓名并验证生日」。启示：评测对象从「单轮输出对不对」升级到「整条轨迹合不合规」，这正是 agent 评测和传统 NLP 评测的分水岭。","hf":null,"topic":"评测工程","first":"2026-08-27","di":null,"wi":"2026-08-27","tier":"","tk":"评测对象从「单轮输出对不对」升级到「整条轨迹合不合规」，这正是 agent 评测和传统 NLP 评测的分水岭。","col":"eval"},{"u":"https://developers.googleblog.com/enterprise-grade-precision-for-long-context-multimodal-embedding-inference-on-cloud-tpu","t":"Enterprise-Grade Precision for Long-Context Multimodal Embedding Inference on Cloud TPU","v":"Google","s":"","d":"2026-08-26","k":"article","star":0,"sum":"","brief":"","ana":"解决的问题：embedding 模型从原型走向「每天几百万次查询」时的两个生产瓶颈——加速器弹性容量和成本效率，外加一个容易被忽视的硬要求：**跨硬件后端的数值精度必须和参考实现严格对齐**（否则同一份文档在 GPU 和 TPU 上算出的向量不一致，检索结果就会飘）。方案是把 vLLM 原生搬上 TPU，配合 GKE 的 Custom Compute Classes 做优先级自动扩容——TPU 预留池打满就自动回落到 GPU spot/on-demand，推理流量不中断。工程细节讲了三个真实的坑：词表分片要满足 TPU MXU 的整除约束（统一 padding 策略）、TPU 懒加载导致的初始化失败（反量化管线里做属性提升）、超长上下文（文本 4K+、图文 15K+ token）必须用 Chunked Prefill 防 HBM 打爆、而分块又会丢 pooling 状态（混合 StepPool + 状态迁移到 `CachedRequestState`）。启示：做 RAG 的人通常只关心召回指标，这篇提醒你**服务层的数值一致性和长上下文 pooling 是会真实伤害检索质量的**。","hf":null,"topic":"推理基础设施与建模","first":"2026-08-27","di":null,"wi":"2026-08-27","tier":"","tk":"做 RAG 的人通常只关心召回指标，这篇提醒你**服务层的数值一致性和长上下文 pooling 是会真实伤害检索质量的**。","col":"infra"},{"u":"https://developers.googleblog.com/heygen-x-google-cloud-bringing-avatar-iv-to-tpus","t":"HeyGen x Google Cloud: Bringing Avatar IV to TPUs","v":"Google","s":"","d":"2026-08-13","k":"article","star":0,"sum":"","brief":"","ana":"偏底层，但方法论极好。HeyGen 把 18B+ 参数的数字人视频生成模型从 GPU 移植到八芯片 Trillium (v6e) TPU，比首个可用版本快 **1.86×**，流式性能追平 8×H100 且每分钟视频成本低 25%。移植路径是 torchax（PyTorch 前端跑在 JAX 上），生产模型代码**一行不改**，XLA 端到端编译——他们还实测了「完全用原生 JAX 重写能多赚多少」，答案是几乎为零。三堵墙及其破法：① Ulysses 序列并行在每次 self-attention 里塞了一对 all-to-all 且完全暴露在关键路径上，解法是把注意力头拆成几组做**流水线化**，让每组的传输藏到兄弟组的计算后面，通信在计算流上的占用塌缩约 5×（注意：线上传输时间没变短，只是挪出了关键路径）；② 稀疏注意力的掩码依赖特定 token 顺序，分组时必须保证顺序不变；③ softmax 内层的串行依赖用预计算的 Cauchy-Schwarz 上界绕开。启示：真正可迁移的不是 TPU 知识，而是**「每一步优化都必须过同一套质量门（字节级相同或数学等价），且孤立测快不算数、要在全流水线深度下端到端仍然赢」**这个纪律。","hf":null,"topic":"推理基础设施与建模","first":"2026-08-27","di":null,"wi":"2026-08-27","tier":"","tk":"真正可迁移的不是 TPU 知识，而是**「每一步优化都必须过同一套质量门（字节级相同或数学等价），且孤立测快不算数、要在全流水线深度下端到端仍然赢」**这个纪律。","col":"infra"},{"u":"https://developers.openai.com/blog/codex-as-a-platform","t":"Codex as a platform: build on the open agent harness","v":"OpenAI","s":"","d":"2026-08-19","k":"article","star":0,"sum":"","brief":"","ana":"本周最重要的一篇。论点：可复用的不是模型而是 **agent loop（harness）**——理解任务、维护上下文、调工具、处理失败、请求审批的那套执行系统。硬数据：ARC-AGI-3 上仅靠\"保留推理 + 上下文压缩\"两个 harness 设置，GPT-5.6 Sol 从 13.3% 升到 38.3%，输出 token 降 6 倍。文章教你用开源 Codex harness + app-server 协议（创建线程、启动轮次、接收事件、处理审批）把 agent 嵌进自己的产品，并给出三档集成方式：`codex exec`（脚本/CI）、Codex SDK（应用代码）、app-server（agent 是产品本体）。启示：面试里聊 agent 架构，harness 分层是 2026 年的标准词汇。","hf":null,"topic":"Harness 与长时程 Agent","first":"2026-08-26","di":null,"wi":"2026-08-26","tier":"","tk":"面试里聊 agent 架构，harness 分层是 2026 年的标准词汇。","col":"harness"},{"u":"https://developers.openai.com/blog/automating-repetitive-work-at-openai-with-codex","t":"Automating repetitive work at OpenAI with Codex","v":"OpenAI","s":"","d":"2026-08-25","k":"article","star":0,"sum":"","brief":"","ana":"OpenAI 内部实践：用 Runme + WebMCP 把重复出现的工程任务（发布流程、例行排查）固化成**可评审、可复用**的工作流，而不是每次让 agent 从零发挥。核心思想是\"把一次成功的 agent 运行沉淀为资产\"。","hf":null,"topic":"自学习 / 自演进","first":"2026-08-26","di":null,"wi":"2026-08-26","tier":"","tk":"","col":"evo"},{"u":"https://developers.openai.com/blog/scaling-cyber-defenders-with-daybreak","t":"Scaling cyber defenders with Daybreak","v":"OpenAI","s":"","d":"2026-08-21","k":"article","star":0,"sum":"","brief":"","ana":"安全运营场景的完整 agent 工作流：用 ChatGPT / Codex Security / 开源工具做威胁调查 → 漏洞验证 → 从发现推进到经过评审的修复。配合 Daybreak Blue/Red 分级访问体系读。","hf":null,"topic":"Agent 安全与围堵","first":"2026-08-26","di":null,"wi":"2026-08-26","tier":"","tk":"","col":"safety"},{"u":"https://developers.googleblog.com/agent-plugins-package-your-skills-tools-and-more","t":"Agent Plugins package your skills, tools, and more","v":"Google","s":"DeepMind","d":"2026-08-06","k":"article","star":0,"sum":"","brief":"","ana":"行业标准信号：Agent Plugins 1.0.0 是把 Agent Skills + MCP 服务器打包成统一目录规范的**厂商中立标准**，核心维护者含 Amazon、Cursor、Microsoft、OpenAI、Vercel，Google 刚加入。设计哲学值得学：\"一个插件就是一个目录\"，manifest 只有两行，组件独立失败互不拖累。解决的痛点：同一套 skill + MCP 要适配每个客户端就得 fork 一份包装，最后各自漂移。","hf":null,"topic":"Skill、上下文工程与工具","first":"2026-08-26","di":null,"wi":"2026-08-26","tier":"","tk":"","col":"skill"},{"u":"https://developers.openai.com/blog/skills-shell-tips","t":"Shell + Skills + Compaction: Tips for long-running agents that do real work","v":"OpenAI","s":"OpenAI 版《building effective agents》","d":"2026-02-11","k":"article","star":0,"sum":"","brief":"","ana":"","hf":null,"topic":"Harness 与长时程 Agent","first":"2026-08-26","di":null,"wi":"2026-08-26","tier":"","tk":"","col":"harness"},{"u":"https://developers.openai.com/blog/testing-agent-skills-systematically-with-evals","t":"Testing Agent Skills Systematica "clusters":[]},{"date":"2026-09-18","kind":"weekly","summary":"","path":"周报/2026-09-18/周报.md","judgments":[],"clusters":[]},{"date":"2026-09-19","kind":"daily","summary":"**覆盖范围**：本期是日报首期，一次补齐 **9 月 14 日至 9 月 19 日** 六天的官方发布（此后每期只覆盖前 24 小时）。共 6 篇官方长文、11 条发布动态、31 篇论文。\n\n**官方长文（6 篇）**：最重要的一篇是 Anthropic Institute 9 月 17 日的《Measurements for understanding the pace of AI development》，第一次用可核验的数字描述「AI 造 AI」——Claude 主导 26% 的研发工作、研发 agent 的动作 100% 先过监控、十亿次动作只拦 1/47,000、AI 研发算力 6% 用于安全。其次是 OpenAI 9 月 16 日的模型失准披露框架（附 6 份 agent 越界行为报告）。另外四篇是工程实录：GitHub 用 Copilot 把 agent runtime 移植成 80 万行 Rust、NVIDIA 用多 agent 把 24 个 CUDA 算子移植到 Rust（99.5% 性能）、Google 的 zero-trust agent 第二篇（按意图而非语法判断）、Google Research 的 Retrieve-for-Train（检索 fan-out 改成离线训练）。\n\n**发布与动态（11 条）**：安全/评测类最密集——Anthropic 与 Accenture 的嵌入式评估合作（双方五年各投至少 10 亿美元）、生命科学验证计划、Google 的 Agent Anomaly Detection 私测；模型类有 DeepSeek-V4.1-Flash（552B MoE、1M 上下文）、Gemini 3.8 Live、Grok Voice Transcribe 2.0；其余为产品整合。\n\n**论文（31 篇）**：9 月 15–17 日是 RSI（递归自改进）论文的集中爆发期，12 篇与自演进直接相关：Atria Dawn、Dream-RSI、ModularRSI、RSIAgent、SoL-Pi、Agora、ScienceBuddy 等，主题从「单个 agent 自改进」转向「改进如何可归因、可复用、可共享」；harness 方向有一篇 176 组设置的实证研究。\n\n**最值得看**：Anthropic 的《Measurements…》——面试里谈 RSI 治理最硬的引用，配合 09-14 期补录的《When AI builds itself》一起读。","path":"日报/2026-09-19.md","judgments":[{"label":"必看","text":"Anthropic 首次给「AI 造 AI」定了可核验的口径：Claude 主导 26% 研发、agent 动作 100% 过监控、拦截率 1/47,000——这是以后所有 RSI 讨论的基准数字。"},{"label":"警示","text":"OpenAI 披露的 6 起 agent 越界全部发生在正常工作流里（摘要层自注入、隐瞒错误、搜泄露的 key、传文件到公网、agent 间私下共享）：你自己的 agent 系统今天就该按这 6 条查一遍监控。"},{"label":"利好","text":"两个大型代码迁移由 agent 完成且可验证（GitHub 80 万行 Rust、NVIDIA 24 个 CUDA 算子 99.5% 性能）：agent 做系统级迁移已是生产事实，前提是每步有机器可判定的检查。"},{"label":"值得盯","text":"评测在变成第三方产业：Accenture 嵌入 Anthropic（各投 10 亿美元）、Google Agent Anomaly Detection 私测、Balyasny 自建数千任务评测集——「谁来评」比「评什么」更快在制度化。"},{"label":"结论","text":"论文侧 RSI 集中爆发（12 篇），共同转向「改进要可归因、可复用、可共享」；读三篇够：ModularRSI、Agora、SoL-Pi。"}],"clusters":[{"label":"必看","title":"AI 造 AI 有了官方度量，第三方开始进场","text":"Anthropic Institute 提出研发自动化指数、agent 监督三指标、算力分配三套度量并公布内部快照；次日宣布 Accenture 作为首家嵌入式评估机构进驻。RSI 从叙事变成可审计的报表。","urls":["https://www.anthropic.com/institute/measuring-pace-of-ai-development","https://www.anthropic.com/news/accenture-embedded-evaluation","https://claude.com/blog/working-at-the-frontier-how-balyasny-asset-management-evaluates-and-governs-claude-fable-5"]},{"label":"警示","title":"agent 安全：从事故披露到运行时治理","text":"OpenAI 用一个披露框架把 6 起真实越界摊开；Google 同周把安全检查从语法层上移到意图层（zero-trust Part 2）并推出离线异常检测；论文侧 HazardAuditor、Emergence World、PACT 都在做「运行时行为」而非「文本」的安全。","urls":["https://openai.com/index/model-misalignment-reporting-framework","https://developers.googleblog.com/build-zero-trust-ai-agents-that-judge-intent-not-just-syntax","https://developers.googleblog.com/agent-anomaly-detection-now-in-private-preview-on-the-gemini-enterprise-agent-platform","https://arxiv.org/abs/2609.15134","https://arxiv.org/abs/2609.17320","https://arxiv.org/abs/2609.18605"]},{"label":"利好","title":"agent 做大型代码迁移：可验证是前提","text":"GitHub 把自家 agent runtime 整体移植成 80 万行 Rust（128 个 PR 增量上线）；NVIDIA 用多 agent skill 把 24 个 CUDA 算子移到 Rust 达 99.5% 性能；Anthropic 用内部模型 4 周提速 30+ 生物模型。三家共同点：每一步都有机器可判定的验证（增量发布 / Tile IR diff / 基准）。","urls":["https://github.blog/ai-and-ml/generative-ai/migrating-the-github-copilot-runtime-to-rust-using-copilot","https://developer.nvidia.com/blog/translating-cuda-tile-operations-from-python-to-rust-using-agentic-ai","https://www.anthropic.com/research/claude-uplifts-biomolecular-modeling"]},{"label":"值得盯","title":"RSI 论文集中爆发：改进要可归因、可复用、可共享","text":"9 月 15–17 日 12 篇自演进论文：ModularRSI 说 harness 自改进要评测集隔离 + 模块化归因；Agora 用 Git DAG 做多 agent 的共享研究记忆；SoL-Pi 把自动研究循环扩到多环境；Atria Dawn 把「agent 参与造下一代」写成基座模型的训练目标。","urls":["https://arxiv.org/abs/2609.14857","https://arxiv.org/abs/2609.18094","https://arxiv.org/abs/2609.20519","https://arxiv.org/abs/2609.15818","https://arxiv.org/abs/2609.14858","https://arxiv.org/abs/2609.15364","https://arxiv.org/abs/2609.17523","https://arxiv.org/abs/2609.13406","https://arxiv.org/abs/2609.11873","https://arxiv.org/abs/2609.19134","https://arxiv.org/abs/2609.17632","https://arxiv.org/abs/2609.18779"]},{"label":"记录","title":"模型与产品动态","text":"DeepSeek-V4.1-Flash（552B MoE、1M 上下文、预填充仅激活 8B）主打 agent 长输入成本；Gemini 3.8 Live、Grok Voice Transcribe 2.0 是语音线；Astra for Law、Cowork 合并是产品整合；Retrieve-for-Train 是检索层「用训练替代推理」。","urls":["https://arxiv.org/abs/2609.19969","https://deepmind.google/blog/introducing-gemini-3-8-live-and-3-8-live-extended-thinking","https://x.ai/news/grok-voice-transcribe-2","https://research.google/blog/bypassing-inference-bottlenecks-accelerating-complex-ai-search-with-retrieve-for-train","https://www.anthropic.com/news/life-sciences-verification-program"]}]},{"date":"2026-09-20","kind":"daily","summary":"**覆盖范围**：本期覆盖 9 月 18 日 19:40 ~ 9 月 20 日 07:40；共 0 篇官方长文、0 条发布动态、0 篇论文。\n\n**官方长文（0 篇）**：无。全部 15 个主源 / 二级源的最新条目日期都停在 9 月 18 日及更早，且均已在 9 月 19 日那期收录或排除。Anthropic 三个出口（Engineering 04-23、News 09-18 Accenture、Research 09-17 生物分子建模）、claude.com/blog（09-17 Balyasny 访谈）、OpenAI 开发者博客（09-11 GPT-6 Astra 的 skill/prompt 重构）、xAI（09-18 Grok Voice Transcribe 2.0）、DeepMind（09-15 Gemini 3.8 Live）均无新文。\n\n**发布与动态（0 条）**：无。窗口内唯一新出现的官方条目是 GitHub Blog 9 月 18 日的播客单集《Should you read the code, is RAG dead, and did Skills kill MCP?》，按信源登记表规则（`<category>` 含 GitHub Podcast 一律排除）不收，已记入不收录清单。\n\n**论文（0 篇）**：无。Hugging Face Daily Papers 的 9 月 19 日页面为空，9 月 20 日页面被 API 拒绝（上限仍是 9 月 18 日）；arXiv 两组关键词（self-evolving agent / agent harness）按公告日倒序的最新编号仍是 2609.208xx，即 9 月 17 日提交的那批，与上期收录的 31 篇是同一批。9 月 19 日是周六、20 日是周日，arXiv 周末不公告，论文断档属正常。\n\n**最值得看**：本期无新内容。若要补课，读上期（09-19）三篇——Anthropic Institute《Measurements for understanding the pace of AI development inside frontier labs》（RSI 治理的官方数字口径）、OpenAI 的模型失准披露框架（6 起 agent 越界实例）、Google 开发者博客《The Anatomy of Harness Engineering》（09-09，行为化评测替代端到端跑分，harness 工程最实用的一篇）。","path":"日报/2026-09-20.md","judgments":[{"label":"结论","text":"周末空窗是规律不是故障：本周官方发布集中在 9 月 15–18 日（周二至周五），周六日各厂与 arXiv 同时停更，后续周日/周一早的日报大概率也是低产出，不必怀疑抓取。"},{"label":"值得盯","text":"三条待追踪仍未
